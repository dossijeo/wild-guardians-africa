name: Wild Engine route-slot experiment

on:
  pull_request:
    paths:
      - '.github/workflows/wild-engine-route-slots.yml'
      - 'src/world/hierarchical-wasm/spatial-intent-state.cpp'
      - 'tools/experiments/benchmark-wild-engine-route-slots.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build baseline and free-list variants from the same checkout
        run: |
          mkdir -p .cache/wild-engine-route-slots
          cp src/world/hierarchical-wasm/spatial-intent-state.cpp .cache/wild-engine-route-slots/candidate.cpp
          git show HEAD^:src/world/hierarchical-wasm/spatial-intent-state.cpp > src/world/hierarchical-wasm/spatial-intent-state.cpp
          docker run --rm -v "$PWD:/src" -w /src \
            -e SPATIAL_WASM_OUTPUT=.cache/wild-engine-route-slots/baseline.wasm \
            emscripten/emsdk@sha256:77638e6c215a65f25a704c0c831d5c2463a8c0468a58c6cb82489dbe621dfa05 \
            bash tools/build-spatial-savanna-wasm.sh
          cp .cache/wild-engine-route-slots/candidate.cpp src/world/hierarchical-wasm/spatial-intent-state.cpp
          docker run --rm -v "$PWD:/src" -w /src \
            -e SPATIAL_WASM_OUTPUT=.cache/wild-engine-route-slots/candidate.wasm \
            emscripten/emsdk@sha256:77638e6c215a65f25a704c0c831d5c2463a8c0468a58c6cb82489dbe621dfa05 \
            bash tools/build-spatial-savanna-wasm.sh
      - name: Compare deterministic route-slot churn in ABBA order
        run: |
          for variant in baseline candidate candidate baseline; do
            index=$(find .cache/wild-engine-route-slots -maxdepth 1 -name "${variant}-run-*.json" | wc -l)
            node tools/experiments/benchmark-wild-engine-route-slots.mjs \
              ".cache/wild-engine-route-slots/${variant}.wasm" \
              ".cache/wild-engine-route-slots/${variant}-run-${index}.json" >/dev/null
          done
          sha256sum .cache/wild-engine-route-slots/*.wasm
      - name: Verify native intent regressions on candidate
        env:
          WILD_ENGINE_NATIVE_ROUTE_WASM: .cache/wild-engine-route-slots/candidate.wasm
        run: |
          node --test tests/spatial-native-animal-intent.test.js
          node --test tests/spatial-native-intent-bridge.test.js
          node --test tests/raid-native-intent-lifecycle.test.js
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wild-engine-route-slot-experiment
          path: .cache/wild-engine-route-slots/
          if-no-files-found: error
          retention-days: 14

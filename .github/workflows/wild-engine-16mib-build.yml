name: Wild Engine initial memory

on:
  pull_request:
    paths:
      - '.github/workflows/wild-engine-16mib-build.yml'
      - 'tools/build-spatial-savanna-wasm.sh'
      - 'src/world/wild-engine/spatial-savanna.wasm'
      - 'tests/spatial-savanna-prototype.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        initial_mib: [4, 16]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Compile the main-branch source with pinned Emscripten
        run: |
          memory_bytes=$(( ${{ matrix.initial_mib }} * 1024 * 1024 ))
          docker run --rm -v "$PWD:/src" -w /src \
            -e SPATIAL_INITIAL_MEMORY="$memory_bytes" \
            emscripten/emsdk@sha256:77638e6c215a65f25a704c0c831d5c2463a8c0468a58c6cb82489dbe621dfa05 \
            bash tools/build-spatial-savanna-wasm.sh
          sha256sum src/world/wild-engine/spatial-savanna.wasm
          echo "Expected initial bytes: $memory_bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Check initial capacity and spatial contracts
        env:
          EXPECTED_MEMORY_BYTES: ${{ matrix.initial_mib == 4 && '4194304' || '16777216' }}
        run: |
          node -e "const fs=require('node:fs');const m=new WebAssembly.Module(fs.readFileSync('src/world/wild-engine/spatial-savanna.wasm'));const e=new WebAssembly.Instance(m,{env:{emscripten_notify_memory_growth(){}}}).exports;if(e.memory.buffer.byteLength!==Number(process.env.EXPECTED_MEMORY_BYTES))process.exit(1)"
          node --test tests/spatial-savanna-prototype.test.js
      - name: Check playable contracts with the 16 MiB binary
        if: matrix.initial_mib == 16
        run: npm run test:playable
      - uses: actions/upload-artifact@v4
        with:
          name: wild-engine-main-${{ matrix.initial_mib }}mib
          path: src/world/wild-engine/spatial-savanna.wasm
          retention-days: 7

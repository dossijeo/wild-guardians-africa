name: Validate game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify:assets
      - run: npm run verify:web-assets
      - run: npm run verify:plan
      - run: npm test
      - run: npm run build
      - run: npm run test:web-package
      - run: python tools/package_itch.py
      - uses: actions/upload-artifact@v4
        with:
          name: wild-guardians-build
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: wild-guardians-itch
          path: test-results/wild-guardians-itch.zip
          retention-days: 7

name: Wild Engine BFS stamping experiment

# Historical A/B experiment for PR #56. Later branches can add native API
# exports to lazy-sectors.cpp, so mixing their linker inputs with origin/main
# is not a valid automatic comparison.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Check whether the BFS-only comparison is applicable
        id: scope
        run: |
          # This experiment swaps only lazy-sectors.cpp. A change to another
          # native translation unit or the build contract makes the baseline
          # incompatible and the comparison meaningless.
          if git diff --quiet origin/main...HEAD -- \
            src/world/wild-engine/spatial-savanna.cpp \
            src/world/wild-engine/spatial-route-planner.cpp \
            src/world/wild-engine/spatial-action-planner.cpp \
            src/world/wild-engine/spatial-intent-state.cpp \
            tools/build-spatial-savanna-wasm.sh; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'BFS-only comparison skipped: other native sources or exports changed.'
          fi
      - run: npm ci
        if: steps.scope.outputs.run == 'true'
      - name: Build baseline and candidate from identical sources
        if: steps.scope.outputs.run == 'true'
        run: |
          cp src/world/wild-engine/lazy-sectors.cpp /tmp/lazy-sectors-candidate.cpp
          git show origin/main:src/world/wild-engine/lazy-sectors.cpp > src/world/wild-engine/lazy-sectors.cpp
          docker run --rm -v "$PWD:/src" -w /src \
            -e SPATIAL_WASM_OUTPUT=/src/bfs-baseline.wasm \
            emscripten/emsdk@sha256:77638e6c215a65f25a704c0c831d5c2463a8c0468a58c6cb82489dbe621dfa05 \
            bash tools/build-spatial-savanna-wasm.sh
          cp /tmp/lazy-sectors-candidate.cpp src/world/wild-engine/lazy-sectors.cpp
          docker run --rm -v "$PWD:/src" -w /src \
            -e SPATIAL_WASM_OUTPUT=/src/bfs-candidate.wasm \
            emscripten/emsdk@sha256:77638e6c215a65f25a704c0c831d5c2463a8c0468a58c6cb82489dbe621dfa05 \
            bash tools/build-spatial-savanna-wasm.sh
          sha256sum bfs-baseline.wasm bfs-candidate.wasm
      - name: Check candidate contracts
        if: steps.scope.outputs.run == 'true'
        run: |
          cp bfs-candidate.wasm src/world/wild-engine/spatial-savanna.wasm
          node --test tests/spatial-savanna-prototype.test.js
          npm run test:playable
      - name: Alternate direct-graph benchmark order
        if: steps.scope.outputs.run == 'true'
        run: |
          mkdir -p bfs-reports
          for biome in sabana manglares desierto gran-canon gran-rio volcanes; do
            for variant in baseline candidate candidate baseline; do
              n=$(find bfs-reports -name "$biome-$variant-*.json" | wc -l)
              node tools/experiments/benchmark-wild-engine-bfs.mjs \
                "bfs-$variant.wasm" "bfs-reports/$biome-$variant-$n.json" "$biome" animal > /dev/null
            done
          done
          node tools/experiments/compare-wild-engine-bfs.mjs bfs-reports
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.run == 'true'
        with:
          name: wild-engine-bfs-stamping-comparison
          path: |
            bfs-baseline.wasm
            bfs-candidate.wasm
            bfs-reports
          retention-days: 14

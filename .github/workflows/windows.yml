name: Build Windows desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      shared_ground:
        description: Smoke-only shared Basic ground color candidate with same-EXE OFF control
        type: boolean
        default: false
      pause_menu:
        description: Smoke-only pause native menu rendering at definitive start/load
        type: boolean
        default: false
      animal_prefetch:
        description: Smoke-only animal prefetch with same-EXE fixture712 OFF control (requires shared_ground and pause_menu)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let the active native build/smoke publish its artifacts while newer commits wait.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SMOKE_SHARED_GROUND: ${{ inputs.shared_ground }}
      SMOKE_PAUSE_MENU: ${{ inputs.pause_menu }}
      SMOKE_ANIMAL_PREFETCH: ${{ inputs.animal_prefetch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate isolated animal prefetch comparison
        if: inputs.animal_prefetch
        shell: pwsh
        run: |
          if ($env:SMOKE_SHARED_GROUND -ne 'true' -or $env:SMOKE_PAUSE_MENU -ne 'true') { throw 'Animal prefetch comparison requires shared_ground=true and pause_menu=true in both arms' }
      - run: npm ci
      - id: desktop-build
        run: npm run desktop:build
      - name: Check Windows executable and installer
        shell: pwsh
        run: |
          $binary = Get-Item -LiteralPath src-tauri/target/release/wild-guardians-africa.exe
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          if ($binary.Length -lt 1MB -or $installer.Count -ne 1) { throw 'Missing Windows deliverables' }
          "Windows executable: $($binary.Length) bytes" >> $env:GITHUB_STEP_SUMMARY
          "NSIS installer: $($installer.Length) bytes" >> $env:GITHUB_STEP_SUMMARY
      - name: Diagnostic same-EXE ground control OFF
        if: inputs.shared_ground && !inputs.animal_prefetch
        continue-on-error: true
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'desktop-ground-control.json'
          $binary = (Resolve-Path src-tauri/target/release/wild-guardians-africa.exe).Path
          $controlArgs = @('--smoke-report', $report)
          if ($env:SMOKE_PAUSE_MENU -eq 'true') { $controlArgs += '--smoke-pause-menu' }
          $process = Start-Process -FilePath $binary -ArgumentList $controlArgs -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(240000)) { Stop-Process -Id $process.Id; throw 'Diagnostic control process timed out' }
          if (-not (Test-Path -LiteralPath $report)) { throw 'No diagnostic control report' }
          $result = Get-Content -Raw -LiteralPath $report | ConvertFrom-Json
          $result.PSObject.Properties.Remove('worldPng')
          $result | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $report
          $controlErrors = ($result.errors -join '; ') -replace '[\r\n]', ' '
          "Diagnostic ground OFF raw ok=$($result.ok); errors=$controlErrors. Step conclusion may be normalized by continue-on-error and is not smoke approval." >> $env:GITHUB_STEP_SUMMARY
          if ($process.ExitCode -ne 0 -or -not $result.ok) {
            Write-Output "::warning::Diagnostic ground OFF raw failure preserved; normalized step success is not a smoke PASS."
            throw 'Diagnostic control smoke failed; preserved separately'
          }
      - name: Diagnostic same-EXE fixture712 animal prefetch OFF
        if: inputs.animal_prefetch
        continue-on-error: true
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'desktop-visibility-fixture.json'
          node tools/create_desktop_visibility_fixture.mjs $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Native visibility control fixture failed' }
          "Fixture712 snapshot file SHA256: $((Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash)" >> $env:GITHUB_STEP_SUMMARY
          $report = Join-Path $env:RUNNER_TEMP 'desktop-animal-control.json'
          $binary = (Resolve-Path src-tauri/target/release/wild-guardians-africa.exe).Path
          $controlArgs = @('--smoke-report', $report, '--smoke-fixture', $fixture, '--smoke-shared-ground', '--smoke-pause-menu')
          $process = Start-Process -FilePath $binary -ArgumentList $controlArgs -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(900000)) { Stop-Process -Id $process.Id; throw 'Diagnostic fixture712 control process timed out' }
          if (-not (Test-Path -LiteralPath $report)) { throw 'No diagnostic animal control report' }
          $result = Get-Content -Raw -LiteralPath $report | ConvertFrom-Json
          $result.PSObject.Properties.Remove('worldPng')
          $result | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $report
          $controlErrors = ($result.errors -join '; ') -replace '[\r\n]', ' '
          "Diagnostic fixture712 animal prefetch OFF raw ok=$($result.ok); errors=$controlErrors. Step conclusion may be normalized by continue-on-error and is not smoke approval." >> $env:GITHUB_STEP_SUMMARY
          if ($process.ExitCode -ne 0 -or -not $result.ok -or -not $result.checks.visibility.passed) {
            Write-Output "::warning::Diagnostic animal prefetch OFF raw failure preserved; normalized step success is not a smoke PASS."
            throw 'Diagnostic fixture712 control smoke failed; preserved separately'
          }
      - name: Smoke test the packaged game in WebView2
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'desktop-smoke.json'
          $binary = (Resolve-Path src-tauri/target/release/wild-guardians-africa.exe).Path
          $smokeArgs = @('--smoke-report', $report)
          if ($env:SMOKE_SHARED_GROUND -eq 'true') { $smokeArgs += '--smoke-shared-ground' }
          if ($env:SMOKE_PAUSE_MENU -eq 'true') { $smokeArgs += '--smoke-pause-menu' }
          if ($env:SMOKE_ANIMAL_PREFETCH -eq 'true') { $smokeArgs += '--smoke-animal-prefetch' }
          $process = Start-Process -FilePath $binary -ArgumentList $smokeArgs -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(240000)) { Stop-Process -Id $process.Id; throw 'WebView2 smoke timed out' }
          if (-not (Test-Path -LiteralPath $report)) { throw 'No WebView2 smoke report' }
          $result = Get-Content -Raw -LiteralPath $report | ConvertFrom-Json
          if ($result.worldPng) {
            [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'windows-canyon.png'), [Convert]::FromBase64String($result.worldPng.Split(',')[1]))
            $result.PSObject.Properties.Remove('worldPng')
            $result | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $report
          }
          Get-Content -LiteralPath $report >> $env:GITHUB_STEP_SUMMARY
          if ($process.ExitCode -ne 0 -or -not $result.ok) { throw 'WebView2 smoke failed' }
      - name: Check genuine native minimization and restoration
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'desktop-visibility-fixture.json'
          if ($env:SMOKE_ANIMAL_PREFETCH -ne 'true') {
            node tools/create_desktop_visibility_fixture.mjs $fixture
            if ($LASTEXITCODE -ne 0) { throw 'Native visibility fixture failed' }
          }
          if (-not (Test-Path -LiteralPath $fixture)) { throw 'Missing exact fixture712 control snapshot' }
          $report = Join-Path $env:RUNNER_TEMP 'desktop-visibility.json'
          $binary = (Resolve-Path src-tauri/target/release/wild-guardians-africa.exe).Path
          $smokeArgs = @('--smoke-report', $report, '--smoke-fixture', $fixture)
          if ($env:SMOKE_SHARED_GROUND -eq 'true') { $smokeArgs += '--smoke-shared-ground' }
          if ($env:SMOKE_PAUSE_MENU -eq 'true') { $smokeArgs += '--smoke-pause-menu' }
          if ($env:SMOKE_ANIMAL_PREFETCH -eq 'true') { $smokeArgs += '--smoke-animal-prefetch' }
          $process = Start-Process -FilePath $binary -ArgumentList $smokeArgs -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(900000)) { Stop-Process -Id $process.Id; throw 'Native visibility timed out' }
          if (-not (Test-Path -LiteralPath $report)) { throw 'No native visibility report' }
          $result = Get-Content -Raw -LiteralPath $report | ConvertFrom-Json
          $result.PSObject.Properties.Remove('worldPng')
          $result | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $report
          if ($process.ExitCode -ne 0 -or -not $result.ok -or -not $result.checks.visibility.passed) { throw 'Native visibility failed' }
          "Native visibility hidden interval: $($result.checks.visibility.hiddenMs) ms" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ runner.temp }}/desktop-visibility.json
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ runner.temp }}/windows-canyon.png
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ runner.temp }}/desktop-smoke.json
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always() && steps.desktop-build.outcome == 'success'
        with:
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always() && steps.desktop-build.outcome == 'success'
        with:
          path: src-tauri/target/release/wild-guardians-africa.exe
          archive: false
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cargo-lock
          path: src-tauri/Cargo.lock
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always() && inputs.shared_ground && !inputs.animal_prefetch
        with:
          path: ${{ runner.temp }}/desktop-ground-control.json
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always() && inputs.animal_prefetch
        with:
          path: ${{ runner.temp }}/desktop-animal-control.json
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always() && inputs.animal_prefetch
        with:
          path: ${{ runner.temp }}/desktop-visibility-fixture.json
          archive: false
          retention-days: 7

[package]
name = "wild-guardians-africa"
version = "0.1.0"
description = "Wild Guardians Africa"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep the normal native features except per-request embedded Brotli decoding.
# Packaging candidate: assets/readiness remain identical; executable size may grow.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

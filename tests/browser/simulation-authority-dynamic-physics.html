<!doctype html><meta charset="utf-8"><script type="module">

 const chunks=[];for(let z=-1;z<=2;z++)for(let x=0;x<=5;x++)chunks.push(`${x},${z}`);
 const init=await createSimulation({mangrove:true,chunkKeys:chunks}),game=init.diagnosticWorld().game,sameSpecies=new URLSearchParams(location.search).has('same-species'),first=game.raid.animals.find(a=>a.species===(sameSpecies?'warthog':'hyena')&&!['gone','retreating'].includes(a.status)),second=game.raid.animals.find(a=>a.id!==first?.id&&(!sameSpecies||a.species===first.species)&&['hyena','lion','warthog','buffalo','rhino'].includes(a.species)&&!['gone','retreating'].includes(a.status));if(!first||!second)throw Error('Need two active animals');

 const compact=new URLSearchParams(location.search).has('active-poses'),activePoses=packet=>(packet.physicsPoses??(packet.physicsPose?[packet.physicsPose]:[])).filter(p=>p.active),response=await fetch('/src/world/wild-engine/spatial-savanna.wasm'),module=await WebAssembly.compile(await response.arrayBuffer()),reference=createSimulationAuthority(module,source,chunks),client=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,dynamicPhysics:true,shareSpeciesClips:sameSpecies,shareAdmissionSource:new URLSearchParams(location.search).has('shared-glb'),compactPhysicsPoses:compact,session:'dynamic-physics'});let seq=0,overlap=0,firstSteps=0,secondSteps=0,secondHit=false,finished=false,last,legacyPoseChars=0,workerPoseChars=0;

  await command({kind:'castAttack',id:'multi-attack-1',targetId:ids[0],x:first.x,z:first.z});

   const state=JSON.parse(last.snapshot),target=state.raid?.animals.find(a=>a.id===ids[1]);

    return {compared,elapsed:state.elapsed,down:state.raid.animals.filter(a=>a.magicDown).map(a=>a.magicDown),scope:'Experimental long active-physics save via coordinator, comparing two real mangrove Workers; no browser storage, UI or visual validation.'};
   }

   else try{await command({kind:'advance',seconds:.05,nightFastForward:true});}catch(error){throw Error(error.message+'; previous: '+JSON.stringify({elapsed:state.elapsed,animals:state.raid?.animals.filter(a=>ids.includes(a.id)).map(a=>({id:a.id,down:a.magicDown}))}));}

  return {ids,species:[first.species,second.species],compared:seq,firstSteps,secondSteps,overlap,finished,framesWhilePending,compact,legacyPoseChars,workerPoseChars,scope:'Two dynamically admitted animals in one Rapier world from an island-mangrove capture, with ordered Worker commands compared to the same controller on the main thread. Pose counts are JSON characters, not transfer bytes; compact mode compares active poses only. A separate queued advance follows an asynchronous admission while animation frames continue. Does not compare WorldScene physics, prove body contact, or exercise production input and save/restore.'};
 }finally{client.dispose();reference.dispose();}
};window.ready=true;
</script>

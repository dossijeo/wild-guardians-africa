<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Production world lifecycle</title>
<script src="/i18n/loader.js"></script><link rel="stylesheet" href="/ui-theme.css?v=2"><div id="app"></div>
<details id="qaMobile" style="position:fixed;left:0;top:0;max-width:390px;max-height:35vh;overflow:auto;z-index:100000;background:#fffdeae8;font:10px system-ui;color:#18231e"><summary>QA</summary><button id="qaRead">Leer diagnóstico</button><pre id="qaReport"></pre><pre id="qaPlayer"></pre></details>
<script type="module">
import {Vector3} from 'three';
import {WorldScene} from '../../src/rendering/scene.js';
import {AudioSystem} from '../../src/audio/audio.js';
const memory=new Map([['wild-guardians:settings',JSON.stringify({quality:'muy_baja',sfx:0,music:0})]]);
// This fixture runs the real app, but its saves must not share the player's DB.
const qaDatabase=window.indexedDB;
Object.defineProperty(window,'indexedDB',{value:{open:(name,version)=>qaDatabase.open(name+'-qa-mobile-first-day',version)},configurable:true});
Object.defineProperty(window,'localStorage',{value:{get length(){return memory.size;},key:i=>[...memory.keys()][i]??null,getItem:k=>memory.get(String(k))??null,setItem:(k,v)=>memory.set(String(k),String(v)),removeItem:k=>memory.delete(String(k)),clear:()=>memory.clear()},configurable:true});
const worlds=[],systems=new Set(),errors=[],listeners=[],terminated=new WeakSet();
const homeFocus=WorldScene.prototype.focusFarm;
WorldScene.prototype.focusFarm=function(){homeFocus.call(this);const r=worlds.find(r=>r.world===this);if(r)(r.homeFocus??=[]).push({eye:this.camera.position.toArray(),target:this.controls.target.toArray()});};
const cameraReport=document.createElement('pre');cameraReport.id='qaCamera';document.querySelector('#qaMobile').append(cameraReport);
const cameraTimer=setInterval(()=>{const w=worlds.at(-1);cameraReport.textContent=JSON.stringify({homeFocus:w?.homeFocus??[],eye:w?.world.camera.position.toArray(),target:w?.world.controls.target.toArray()});},500);addEventListener('pagehide',()=>clearInterval(cameraTimer));
const add=EventTarget.prototype.addEventListener,remove=EventTarget.prototype.removeEventListener;
EventTarget.prototype.addEventListener=function(type,callback,options){if(this instanceof HTMLCanvasElement)listeners.push({target:this,type,callback,capture:typeof options==='boolean'?options:!!options?.capture,signal:options?.signal,removed:false});return add.call(this,type,callback,options);};
EventTarget.prototype.removeEventListener=function(type,callback,options){const capture=typeof options==='boolean'?options:!!options?.capture;for(const l of listeners)if(l.target===this&&l.type===type&&l.callback===callback&&l.capture===capture)l.removed=true;return remove.call(this,type,callback,options);};
const terminate=Worker.prototype.terminate;Worker.prototype.terminate=function(){terminated.add(this);return terminate.call(this);};
const load=WorldScene.prototype.load,dispose=WorldScene.prototype.dispose,render=WorldScene.prototype.render;
WorldScene.prototype.load=async function(...args){const record={state:args[0],biome:args[0].biome,culture:args[0].culture,initialMoney:args[0].ledger.balance,world:this,gl:this.renderer.getContext(),loads:0,disposals:0,renders:0,rendersAfterDispose:0,geometryCount:0,materialCount:0,geometryDisposed:0,materialDisposed:0};worlds.push(record);await load.apply(this,args);record.loads++;record.worker=this.chunkStream?.worker;const geometries=new Set(),materials=new Set();this.scene.traverse(o=>{if(o.isMesh){geometries.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:[o.material])materials.add(m);}});record.geometryCount=geometries.size;record.materialCount=materials.size;for(const g of geometries)g.addEventListener('dispose',()=>record.geometryDisposed++);for(const m of materials)m.addEventListener('dispose',()=>record.materialDisposed++);paint();};
WorldScene.prototype.dispose=function(){const r=worlds.find(r=>r.world===this);if(r&&!this.disposed)r.disposals++;const result=dispose.call(this);paint();return result;};
WorldScene.prototype.render=function(...args){const r=worlds.find(r=>r.world===this);if(r){r.renders++;if(this.disposed)r.rendersAfterDispose++;}return render.apply(this,args);};
for(const name of ['unlock','stop','gameplay']){const original=AudioSystem.prototype[name];AudioSystem.prototype[name]=function(...args){systems.add(this);return original.apply(this,args);};}
addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));

const loading=[],campaignEvents=[],campaignPhases=[];let lastLoading=null,seenCampaignEvents=new Set(),lastCampaignPhase=null;
new MutationObserver(()=>{const stage=document.querySelector('#stage'),cover=document.querySelector('#world-loading'),button=document.querySelector('#menuButton');const value=JSON.stringify({cover:!!cover,busy:stage?.getAttribute('aria-busy'),hudVisibility:button?getComputedStyle(button).visibility:null});if(value!==lastLoading){lastLoading=value;loading.push({stamp:performance.now(),...JSON.parse(value)});}}).observe(document.querySelector('#app'),{childList:true,subtree:true,attributes:true,attributeFilter:['class','aria-busy']});
function player(){
 const r=worlds.at(-1),w=r?.world,s=r?.state;if(!s||!w.nav||w.disposed)return;
 const project=p=>{const v=new Vector3(p.x,w.nav.field.surface(p.x,p.z)+.025,p.z).project(w.camera),rect=w.renderer.domElement.getBoundingClientRect();return {x:Math.round(rect.left+(v.x+1)*rect.width/2),y:Math.round(rect.top+(1-v.y)*rect.height/2),depth:v.z,inFrustum:Math.abs(v.x)<=1&&Math.abs(v.y)<=1&&Math.abs(v.z)<=1};};
 const center=s.structures.find(c=>c.kind==='center'),spots=[];
 if(center)for(let dz=-3;dz<=3;dz+=1.5)for(let dx=5;dx<=10;dx+=1.5){const p={x:Math.round((center.x+dx)/1.5)*1.5,z:Math.round((center.z+dz)/1.5)*1.5};if(w.nav.placement(p.x,p.z,.4).valid)spots.push({...p,screen:project(p)});}
 const observed={day:s.day,time:s.time,elapsed:s.elapsed};
 for(const event of s.events)if(!seenCampaignEvents.has(event.id))campaignEvents.push({...observed,...event});
 seenCampaignEvents=new Set(s.events.map(event=>event.id));if(campaignEvents.length>300)campaignEvents.splice(0,campaignEvents.length-300);
 const raid=s.raid?{id:s.raid.id,animals:s.raid.animals.map(a=>({id:a.id,species:a.species,status:a.status,x:a.x,z:a.z,spawn:a.spawn,exit:a.exit,screen:project(a)}))}:null;
 const phase={...observed,completedNights:s.completedNights,result:s.result,raid,pauses:s.pauses.slice(),structures:s.structures.map(c=>({id:c.id,status:c.status,hp:c.hp,maxHp:c.maxHp})),notices:[...document.querySelectorAll('#notices button')].map(el=>el.textContent)};
 const phaseKey=JSON.stringify({day:s.day,completedNights:s.completedNights,result:s.result,raid:raid?.animals.map(a=>[a.id,a.status]),pauses:s.pauses,structures:phase.structures});
 if(phaseKey!==lastCampaignPhase){lastCampaignPhase=phaseKey;campaignPhases.push(phase);if(campaignPhases.length>100)campaignPhases.shift();}
 document.querySelector('#qaPlayer').textContent=JSON.stringify({loading,campaignEvents,campaignPhases,raid,raidView:w.nav.raidView??null,completedNights:s.completedNights,result:s.result,nightPlan:s.nightPlan,viewport:{width:innerWidth,height:innerHeight},day:s.day,time:s.time,elapsed:s.elapsed,balance:s.ledger.balance,pauses:s.pauses,tutorial:s.tutorial,hands:{hudVisible:!!document.querySelector('.tutorial-hud-hand:not([hidden])'),worldVisible:w.hands?.mesh.visible,toolKind:w.tutorialToolKind,worldTarget:w.handTargetCache,worldScreen:w.handTargetCache?project({x:w.handTargetCache.position[0],z:w.handTargetCache.position[2]}):null},structures:s.structures.map(c=>({id:c.id,x:c.x,z:c.z,screen:project(c)})),proposedCenter:s.villages[0].center?{...s.villages[0].center,screen:project(s.villages[0].center)}:null,plantSpots:spots,plants:s.plants.map(p=>({id:p.id,growth:p.growth,alive:p.alive,water:p.water,screen:project(p)})),workers:s.workers.map(p=>({id:p.id,status:p.status,running:p.running,x:p.x,z:p.z,path:p.path,screen:project(p)})),delivered:s.crates.filter(c=>c.delivered).length},null,2);
}

function paint(){player();document.querySelector('#qaReport').textContent=JSON.stringify({cycles:worlds.map((r,i)=>({cycle:i+1,biome:r.biome,culture:r.culture,initialMoney:r.initialMoney,loads:r.loads,disposals:r.disposals,renders:r.renders,rendersAfterDispose:r.rendersAfterDispose,disposed:!!r.world.disposed,contextLost:r.gl.isContextLost(),canvasConnected:r.world.renderer.domElement.isConnected,canvasListenersLive:listeners.filter(l=>l.target===r.world.renderer.domElement&&!l.removed&&!l.signal?.aborted).length,ownListenersAborted:r.world.canvasEvents?.signal.aborted,workerTerminated:r.worker?terminated.has(r.worker):null,streamDead:r.world.chunkStream?.dead,streamTimer:r.world.chunkStream?.timer,streamQueue:r.world.chunkStream?.queue.length,geometryCount:r.geometryCount,geometryDisposed:r.geometryDisposed,materialCount:r.materialCount,materialDisposed:r.materialDisposed})),audio:[...systems].map(a=>({voices:a.voices.size,active:a.active.length,transport:!!a.transport,context:a.context?.state})),worldCanvases:document.querySelectorAll('#world').length,menuFrames:document.querySelectorAll('#native-menu').length,isolatedSlots:[...memory.keys()].filter(k=>/^wild-guardians:slot:/.test(k)&&!k.endsWith(':backup')&&!k.endsWith(':pending')).length,errors,limits:'Retains old references; context loss is queried on real WebGL, not inferred from DOM removal. Resource disposal events are counts, not GPU memory bytes. One global app RAF and QA sampling timer remain intentionally active.'},null,2);}
document.querySelector('#qaRead').onclick=paint;
const timer=setInterval(paint,500);addEventListener('pagehide',()=>clearInterval(timer));
// Opt-in saved-world setup exercises the actual Continue menu and HUD button.
// This controlled camera fixture stays paused and uses only the QA save DB.
if(new URLSearchParams(location.search).has('resume-camera')){
 const Game=await import('../../src/simulation/game.js'),{Navigation,BIOME_IDS}=await import('../../src/world/navigation.js'),{findInitialLocationAsync}=await import('../../src/world/villages.js'),{json}=await import('../../src/rendering/assets.js'),{BrowserSaveRepository}=await import('../../src/persistence/browser-saves.js');
 const biome=new URLSearchParams(location.search).get('biome')??'sabana',s=Game.newGame({seed:712,biome,slotId:'qa-resume-camera'}),pack=await json('/content/biome-'+BIOME_IDS[biome]+'.json'),payload=(await json('/content/villages.json')).find(v=>v.id==='mapungubwe'),nav=new Navigation(712,biome,pack.profile),site=await findInitialLocationAsync(nav,payload);
 Object.assign(s.villages[0],site);s.suppressed.push(...site.suppress);nav.setState(s);Game.placeStructure(s,'qa-paid-center',site.center,nav);
 for(let dz=-4;dz<=4;dz+=2)for(let dx=5;dx<=10;dx+=2)if(s.plants.length<4&&nav.placement(site.center.x+dx,site.center.z+dz,.4).valid)Game.plant(s,'qa-plant-'+s.plants.length,'mijo',site.center.x+dx,site.center.z+dz,nav);
 s.tutorial.step='done';s.initialPreparation=false;s.hiringPaidDay=1;Game.pause(s,'qa-camera');await new BrowserSaveRepository(localStorage).save(s);
}
await import('../../src/app/main.js');paint();
</script></html>

<!doctype html><html lang="es"><meta charset="utf-8"><title>QA duración lógica y visual de magias</title>
<style>body{margin:0;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:absolute;z-index:2;background:#fff9ed;padding:8px;max-width:90vw}button{padding:7px}pre{max-height:24vh;overflow:auto;font-size:11px}</style>
<header><details open><summary>QA duración de las tres magias</summary><p>Centro, tres semillas y trabajador pagados. Fixture declarada: día 5, cinco segundos antes del anochecer, sin incursión; avance manual del tiempo simulado. Mundo y materiales reales, sin ranuras persistentes.</p><button id="cast" disabled>Activar las tres magias</button><button id="step" disabled>Avanzar 5 s simulados</button><button id="pause" disabled>Procesar 60 s reales en pausa</button><button id="reload" disabled>Recrear mundo desde snapshot</button><span id="status">Cargando…</span><pre id="report"></pre></details></header><canvas id="world"></canvas>
<script type="module">
import * as Game from '../../src/simulation/game.js';
import {Navigation} from '../../src/world/navigation.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {WorldScene} from '../../src/rendering/scene.js';
import {json} from '../../src/rendering/assets.js';
import {serialize,deserialize} from '../../src/persistence/snapshots.js';
const kinds=['shield','growth','multiply'],errors=[],status=document.querySelector('#status'),report=document.querySelector('#report');
addEventListener('error',e=>fail(e));addEventListener('unhandledrejection',e=>fail(e.reason));
let state,nav,world,payload,profile,sites=[],pauseIdentical=null,reloadIdentical=null,renderDomainIdentical=null;
function fail(e){errors.push(String(e.message??e));status.textContent='FAIL: '+errors.join(' · ');}
function focus(){const x=sites.reduce((n,p)=>n+p.x,0)/3,z=sites.reduce((n,p)=>n+p.z,0)/3,y=nav.field.surface(x,z);world.controls.target.set(x,y+.8,z);world.camera.position.set(x+14,y+16,z+22);world.controls.update();}
async function create(){world?.dispose();world=new WorldScene(document.querySelector('#world'),()=>{});world.onError=fail;world.qualitySetting('media');await world.load(state,nav,payload);focus();}
async function draw(){const before=serialize(state);world.updateCamera();world.syncChunks();await world.whenChunksReady();world.render(0);renderDomainIdentical=serialize(state)===before;
 const effects=[...world.shieldVfx.effects.entries(),...world.agricultureVfx.effects.entries()].map(([key,e])=>({key,definition:e.native.definition.id,age:e.native.time,visible:e.visible,sprites:e.sprites.geometry.instanceCount,rigids:[...e.rigids.values()].reduce((n,m)=>n+m.geometry.instanceCount,0)}));
 const glError=world.renderer.getContext().getError();if(glError)throw Error('WebGL '+glError);
 report.textContent=JSON.stringify({elapsed:state.elapsed,time:state.time,day:state.day,balance:state.ledger.balance,pauses:state.pauses,sites,spells:state.spells,cooldowns:state.cooldowns,plants:state.plants.map(p=>({id:p.id,growth:p.growth,water:p.water})),effects,pauseIdentical,reloadIdentical,renderDomainIdentical,errors},null,2);
 status.textContent=`${state.elapsed.toFixed(2)} s · ${state.time<300?'día':'noche'} · ${effects.length} VFX · errores ${errors.length}`;
}
async function action(fn){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();await draw();}catch(e){fail(e);}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);document.querySelector('#cast').disabled=state.commandIds.includes('qa-shield');}}
try{
 const pack=await json('/content/biome-savanna.json');profile=pack.profile;payload=(await json('/content/villages.json')).find(v=>v.id==='mapungubwe');state=Game.newGame({seed:712,slotId:'qa-spell-duration-no-save'});nav=new Navigation(712,'sabana',profile);const place=await findInitialLocationAsync(nav,payload);Object.assign(state.villages[0],place);state.suppressed.push(...place.suppress);nav.setState(state);Game.resume(state,'intro');Game.placeStructure(state,'qa-center',place.center,nav);
 for(let dz=-15;dz<=15&&sites.length<3;dz+=1.5)for(let dx=6;dx<=18&&sites.length<3;dx+=1.5){const p={x:Math.round((place.center.x+dx)/1.5)*1.5,z:Math.round((place.center.z+dz)/1.5)*1.5};if(nav.placement(p.x,p.z,.4).valid&&sites.every(q=>Math.hypot(p.x-q.x,p.z-q.z)>=7)){Game.plant(state,'qa-seed-'+sites.length,'mijo',p.x,p.z,nav);sites.push(p);}}
 if(sites.length!==3)throw Error('Faltan tres parcelas legales separadas');Game.openInitialHiring(state);Game.hire(state,'qa-worker',{olderMale:1});state.tutorial.step='done';state.day=5;state.time=295;state.dayPlan={done:true};state.nightPlan={done:true,group:[]};Game.pause(state,'qa');await create();await draw();
 document.querySelector('#cast').onclick=()=>action(()=>{Game.resume(state,'qa');try{for(const [i,kind] of kinds.entries())Game.cast(state,'qa-'+kind,kind,sites[i].x,sites[i].z,nav);}finally{Game.pause(state,'qa');}});
 document.querySelector('#step').onclick=()=>action(()=>{Game.resume(state,'qa');try{Game.tick(state,5,nav);}finally{Game.pause(state,'qa');}});
 document.querySelector('#pause').onclick=()=>action(()=>{const before=serialize(state);Game.advanceReal(state,60,nav);pauseIdentical=before===serialize(state);});
 document.querySelector('#reload').onclick=()=>action(async()=>{const before=serialize(state);state=deserialize(before);nav=new Navigation(712,'sabana',profile);nav.setState(state);reloadIdentical=before===serialize(state);await create();});
 document.querySelectorAll('button').forEach(b=>b.disabled=false);addEventListener('pagehide',()=>world.dispose(),{once:true});
}catch(e){fail(e);}
</script></html>

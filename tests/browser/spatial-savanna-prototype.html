<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA · Sabana espacial WASM</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cfd7c4;font:14px system-ui}canvas{display:block}#status{position:fixed;top:12px;left:12px;padding:8px 12px;color:#fff;background:#193028d9;border-radius:6px;pointer-events:none}</style>
</head><body><div id="status">Preparando chunk WASM…</div><script type="module">
import * as THREE from 'three';
import {Assets} from '../../src/rendering/assets.js';
import {createSpatialSavannaPrototype} from '../../src/world/wild-engine/spatial-savanna-adapter.js';
import wasmUrl from '../../src/world/wild-engine/spatial-savanna.wasm?url';

const status=document.querySelector('#status');
try{
  const [binary,pack]=await Promise.all([fetch(wasmUrl).then(r=>r.arrayBuffer()),fetch('/content/biome-savanna.json').then(r=>r.json())]);
  const core=createSpatialSavannaPrototype(new WebAssembly.Module(binary));
  core.generate(712,0,0);core.buildNavigation(1.1,false);
  const assets=new Assets(),models=await assets.biome(pack);
  const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);
  const scene=new THREE.Scene();scene.background=new THREE.Color('#cdd6c5');scene.fog=new THREE.Fog('#cdd6c5',75,145);
  const camera=new THREE.PerspectiveCamera(53,innerWidth/innerHeight,.1,250);camera.position.set(48,44,57);camera.lookAt(0,5,0);
  scene.add(new THREE.HemisphereLight('#fff9e6','#655034',2.2));
  const sun=new THREE.DirectionalLight('#fff1cd',2.0);sun.position.set(-35,60,20);scene.add(sun);
  const terrain=new THREE.Mesh(core.geometry(),new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,side:THREE.DoubleSide}));scene.add(terrain);
  const river=new THREE.Mesh(core.waterGeometry(),new THREE.MeshStandardMaterial({color:'#49aeb6',roughness:.38,metalness:0,side:THREE.DoubleSide}));scene.add(river);
  const lists=core.instances(),dummy=new THREE.Object3D();let visible=0;
  for(let slot=0;slot<20;slot++){
    const records=lists[slot];if(!records.length)continue;
    const source=models[slot][0],mesh=new THREE.InstancedMesh(source.geometry,source.material,records.length);
    records.forEach((p,i)=>{dummy.position.set(p.x,p.y,p.z);dummy.rotation.y=p.yaw;dummy.scale.set(p.sx,p.sy,p.sz);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);});
    mesh.instanceMatrix.needsUpdate=true;mesh.computeBoundingSphere();scene.add(mesh);visible+=records.length;
  }
  renderer.render(scene,camera);
  window.qaReady=true;window.qaStats={visible,geometryVertices:terrain.geometry.getAttribute('position').count,
    sectors:core.metrics().loadedSectors,wasmBytes:binary.byteLength};
  status.textContent=`WASM · ${visible} objetos · ${core.metrics().loadedSectors} sectores`;
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);});
}catch(error){status.textContent=String(error.stack??error);window.qaError=String(error.stack??error);}
</script></body></html>

<!doctype html><meta charset="utf-8"><script type="module">
import {newGame} from '../../src/simulation/game.js';
import {villageLayout} from '../../src/world/villages.js';
import {serialize,deserialize} from '../../src/persistence/snapshots.js';
import {createConfirmedStateReceiver} from '../../src/simulation/confirmed-state-receiver.js';
import {createWorkerHostedRuntime} from '../../src/simulation/worker-hosted-runtime.js';
import {createWebGpuWorldClient} from '../../src/rendering/webgpu-world-client.js';
import {createWebGpuAutoRecoveryQa} from '../../src/app/webgpu-auto-recovery-qa.js';
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(predicate,label){for(let i=0;i<400;i++){if(predicate())return;await sleep(25);}throw Error('Timed out: '+label);}
window.audit=async()=>{
 const payload=(await (await fetch('/content/villages.json')).json()).find(item=>item.id==='mapungubwe'),initial=newGame({seed:712,biome:'sabana',culture:'mapungubwe',slotId:'webgpu-auto-loss'});initial.villages[0].buildings=villageLayout(payload,0,0).filter(item=>item.kind!=='Zona común'&&item.footprint?.length).slice(0,1);initial.pauses=['fixture'];const source=serialize(initial),state=deserialize(source),session='webgpu-auto-loss',camera={x:20,y:30,z:30,targetX:0,targetY:0,targetZ:0},errors=[],canvases=[],canvas=()=>{const c=document.createElement('canvas');c.width=c.height=32;document.body.append(c);canvases.push(c);return c;};let runtime=null,client=null,auto=null,attached=null,checkpoint=null,first=null;
 function create(options){return createWebGpuWorldClient({...options,onError:error=>{if(!auto?.trigger(error))errors.push(error.message);}});}
 try{
  first=client=create({canvas:canvas(),session,snapshot:source,camera,width:32,height:32,experimentalWorkRecovery:true});await first.ready;
  runtime=createWorkerHostedRuntime({world:{createConfirmedReceiver:id=>createConfirmedStateReceiver(state,id)},session,clientOptions:{snapshot:source,chunkKeys:['0,0']},terrainPort:first.terrainPort,presentationPort:first.presentationPort,runtimeOptions:{stepSeconds:.05,maxBatchSteps:2,diagnostics:true,coalescePublications:true,qaVisualRecovery:true,qaVisualWorkRecovery:true},onError:e=>errors.push(e.message)});await runtime.start();await runtime.submit({kind:'snapshot',visualTerrain:true});await until(()=>runtime.status().recoveryBaseSequence,'checkpoint');const base=runtime.status().recoveryBaseSequence;
  auto=createWebGpuAutoRecoveryQa({isCurrent:()=>!!runtime,markLost:()=>runtime.markVisualLostForQa(),recover:async()=>{const prepared=await runtime.prepareVisualRecoveryForQa();checkpoint=prepared.checkpoint;if(checkpoint.sequence!==base||checkpoint.workCheckpoint?.sequence!==base)throw Error('Incorrect checkpoint');const channel=new MessageChannel(),next=create({canvas:canvas(),session,snapshot:checkpoint.snapshot,camera,width:32,height:32,initialSequence:checkpoint.sequence,recoveryPort:channel.port1,experimentalWorkRecovery:true});try{await next.ready;attached=await runtime.attachVisualRecoveryForQa({terrainPort:next.terrainPort,presentationPort:next.presentationPort,recoveryPort:channel.port2});client=next;next.finishRecoveryForQa();runtime.finishVisualRecoveryForQa();}catch(error){next.dispose();throw error;}},onError:e=>errors.push(e.message)});
  first.loseDeviceForQa();await until(()=>attached||errors.length,'automatic recovery');if(errors.length)throw Error(errors.join('; '));const inspection=await client.inspect();if(inspection.backend!=='WebGPU'||!Number.isSafeInteger(inspection.state.sequence)||inspection.state.sequence<attached.sequence)throw Error(`Recovered state mismatch: backend=${inspection.backend}, observed=${inspection.state?.sequence}, attached=${attached.sequence}`);await runtime.submit({kind:'snapshot'});return {base,attached:attached.sequence,observed:inspection.state.sequence,backend:inspection.backend,scope:'Actual device.destroy and automatic coordinator; real host and authority, one chunk, no characters or active work effects. Not a full game.'};
 }finally{auto?.dispose();client?.dispose();first?.dispose();runtime?.dispose();for(const c of canvases)c.remove();}
};window.ready=true;
</script>

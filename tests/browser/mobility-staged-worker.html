<!doctype html><html><body><script type="module">
import {createProjectionReceiver} from './mobility-delta-prototype.js';
async function run(delayed){const worker=new Worker('./mobility-staged-worker.js',{type:'module'}),rx=createProjectionReceiver('s');try{await new Promise((ok,bad)=>{worker.onerror=e=>bad(Error(e.message));worker.onmessage=({data})=>data.kind==='ready'?ok():data.kind==='error'?bad(Error(data.error)):null;});const send=c=>new Promise((ok,bad)=>{worker.onerror=e=>bad(Error(e.message));worker.onmessage=({data})=>data.kind==='error'?bad(Error(data.error)):ok(data);worker.postMessage(c);});const first=await send({kind:'advance'}),one=rx.accept(first.result);if(!one.accepted||!one.lastEvent)throw Error('No initial events');if(!delayed)await send({kind:'ack',index:one.lastEvent});const second=await send({kind:'advance'});let pending=second.result,refused=null;if(delayed){if(pending.reason!=='event-capacity')throw Error('Expected saturation: '+JSON.stringify(pending));refused=await send({kind:'advance'});if(refused.kind!=='refused'||refused.steps!==2||refused.time!==second.time||refused.snapshot!==second.snapshot)throw Error('Blocked advance changed state');pending=(await send({kind:'ack',index:one.lastEvent})).result;}if(!rx.accept(pending).accepted)throw Error('Second packet rejected');const eventIndex=rx.state().lastEvent;await send({kind:'ack',index:eventIndex});const third=await send({kind:'advance'});if(!rx.accept(third.result).accepted)throw Error('Third packet rejected');return {firstPending:first.status.pendingBytes,secondResult:second.result.kind,secondReason:second.result.reason??null,blockedStepRefused:!!refused,finalSnapshot:third.snapshot,eventTypes:rx.state().events.map(x=>x.event.type),steps:third.steps};}finally{worker.terminate();}}
window.audit=async()=>{const [reference,delayed]=[await run(false),await run(true)];if(reference.finalSnapshot!==delayed.finalSnapshot||JSON.stringify(reference.eventTypes)!==JSON.stringify(delayed.eventTypes)||reference.steps!==3||delayed.steps!==3)throw Error('Final state or event mismatch');return {firstPending:delayed.firstPending,secondReason:delayed.secondReason,blockedStepRefused:delayed.blockedStepRefused,eventTypes:delayed.eventTypes,snapshotMatches:true,scope:'Real advanceReal and event observer; intentionally injected large diagnostic payload forces buffer contention. No visual rendering, physics, recovery or FPS measurement.'};};window.ready=true;
</script></body></html>

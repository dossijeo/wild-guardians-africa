<!doctype html><html lang="es"><meta charset="utf-8"><title>QA transporte musical por ventanas</title>
<style>body{background:#18231e;color:#edf3dc;font:16px system-ui;padding:24px}button{padding:10px;margin:3px}pre{white-space:pre-wrap}</style>
<h1>Transporte por ventanas · WebAudio real</h1><p>Ruta de gameplay de producción, MP3 originales desde caché, salida silenciada. Frecuencia seleccionable con el parámetro rate.</p>
<div id="cases"></div><button id="all">Comprobar ocho casos</button><button id="stop">Parar</button><p id="status">Preparado</p><pre id="report"></pre>
<script type="module">
import {AudioSystem} from '/src/audio/audio.js';
import {musicRangeReader} from '/src/audio/music-range-reader.js';
import {json} from '/src/rendering/assets.js';
let audio,timer,result={},generation=0;const requestedRate=Number(new URLSearchParams(location.search).get('rate')??48000);
const status=document.querySelector('#status'),report=document.querySelector('#report');
function paint(){
 const pool=audio?.musicWindowPool,transport=audio?.transport;
 result.peakPoolPcmBytes=Math.max(result.peakPoolPcmBytes??0,pool?.pcmBytes()??0);result.peakSources=Math.max(result.peakSources??0,audio?.active.length??0);
 const sources=audio?.active??[];let maximumClockError=0;
 for(const source of sources)maximumClockError=Math.max(maximumClockError,Math.abs(source.musicWindowFirstSample/48000+(source.offsetAtStart??0)-(source.musicDeckOffset+source.whenAtStart-source.musicDeckStart)));
 result.maximumClockError=Math.max(result.maximumClockError??0,maximumClockError);
 report.textContent=JSON.stringify({...result,contextTime:audio?.context.currentTime,primaryStart:transport?.primary.start,primaryOffset:transport?.primary.offset,primaryEnd:transport?.primary.end,planAt:transport?.plan?.at,section:transport?.section.id,edge:transport?.lastEdge,jumps:transport?.jumps,loops:transport?.loops,decks:transport?.decks.length,activeSources:sources.length,currentPoolPcmBytes:pool?.pcmBytes()??0,decodedKeys:[...(pool?.ready.keys()??[])],history:transport?.history,musicError:audio?.musicError?.message??null},null,2);
}
function stop(){generation++;clearInterval(timer);audio?.dispose();audio=null;paint();}
function update(day){
 audio.updateMusic({day,time:100,raid:null,workers:[],spells:[]});
 if(audio.musicError&&!result.errors.includes(audio.musicError.message))result.errors.push(audio.musicError.message);
 if(audio.transport&&audio.transport!==result.initialTransport){result.restarts=(result.restarts??0)+1;result.initialTransport=audio.transport;}
}
async function run(pack,edge){
 stop();const own=generation;result={pack,requestedEdge:edge,errors:[]};status.textContent='Cargando';
 try{
  const bank=await json(`/content/music-${pack}.json`);
  const reader=musicRangeReader({fetch:async()=>{throw Error('Production windows must be cached for this proof');}});result.reader=reader.stats;
  const navigation=edge==='wrap'?null:bank.navigation.edges.find(e=>e.id===edge),from=navigation?bank.navigation.sections.find(s=>s.id===navigation.source):null;
  const offset=from?from.end-6:bank.duration-8;
  audio=new AudioSystem({music:0,sfx:0},{json:async url=>{const value=await json(url);(result.jsonRequests??=[]).push({url,sections:value.navigation?.sections?.length,indexVersion:value.version});return value;},musicReader:reader,musicTransport:{offset,random:edge==='wrap'?()=>1:()=>0}});audio.sfx={items:[]};audio.context=new AudioContext({sampleRate:requestedRate});await audio.unlock();result.sampleRate=audio.context.sampleRate;
  result.nativeWindowRates=AudioSystem.prototype.gameplay.toString().match(/\[[^\]]*\]\.includes\(this.context.sampleRate\)/)?.[0]??'not present';
  const original=audio.context.createBufferSource.bind(audio.context);audio.context.createBufferSource=()=>{const source=original(),start=source.start.bind(source);source.start=(when,offset)=>{source.whenAtStart=when;source.offsetAtStart=offset;return start(when,offset);};return source;};
  const day=pack==='a'?1:2;await audio.gameplay(day);result.transport=audio.transport?.constructor.name;Object.defineProperty(result,'initialTransport',{value:audio.transport,writable:true});result.restarts=0;result.initialContextTime=audio.context.currentTime;result.initialPrimaryStart=audio.transport?.primary.start;result.initialOffset=offset;result.bankDuration=bank.duration;
  if(own!==generation)return;
  status.textContent='Reproduciendo';timer=setInterval(()=>{update(day);paint();},25);paint();
 }catch(error){if(own===generation){result.errors.push(error.message);status.textContent='Error';paint();}}
}
for(const pack of ['a','b']){
 const bank=await json(`/content/music-${pack}.json`);
 for(const edge of [...bank.navigation.edges.map(e=>e.id),'wrap']){const button=document.createElement('button');button.textContent=`${pack.toUpperCase()} ${edge}`;button.onclick=()=>run(pack,edge);document.querySelector('#cases').append(button);}
}
document.querySelector('#stop').onclick=()=>{stop();status.textContent='Parado';};window.addEventListener('pagehide',stop);
document.querySelector('#all').onclick=async()=>{
 const captures=[];
 for(const pack of ['a','b']){
  const bank=await json(`/content/music-${pack}.json`);
  for(const edge of [...bank.navigation.edges.map(e=>e.id),'wrap']){
   await run(pack,edge);if(!audio?.transport)return;
   const own=generation,until=audio.context.currentTime+9.5;result.captureDeadline=until;
   const day=pack==='a'?1:2;
   while(audio?.context.currentTime<until){await new Promise(resolve=>setTimeout(resolve,100));if(generation!==own)return;update(day);}
   // A background-tab timer can be delivered after the deadline. Consume its
   // native clock before capturing, rather than observing stale transport state.
   update(day);paint();captures.push(JSON.parse(report.textContent));
  }
 }
 const passed=captures.filter(c=>!c.errors.length&&!c.musicError&&!c.restarts&&(c.requestedEdge==='wrap'?c.loops===1:c.edge===c.requestedEdge)).length;
 stop();status.textContent=`${passed}/8 casos correctos`;report.textContent=JSON.stringify({status:passed===8?'passed':'failed',passed,total:8,peakPoolPcmBytes:Math.max(...captures.map(c=>c.peakPoolPcmBytes)),networkReads:captures.reduce((sum,c)=>sum+c.reader.networkReads,0),cases:captures},null,2);
};
</script></html>

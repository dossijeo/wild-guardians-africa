<!doctype html><meta charset="utf-8"><script type="module">
import {createReplayEventReceiver} from './mobility-replay-events.js';
function connect(session,source=null,chunks=null){const worker=new Worker(new URL('./mobility-simulation-crash-worker.js',import.meta.url),{type:'module'}),signal=new SharedArrayBuffer(4),pending=new Map();let id=0;worker.onerror=e=>{for(const p of pending.values())p.reject(Error(e.message));pending.clear();};worker.onmessage=({data:d})=>{const p=pending.get(d.id);if(p&&d.kind!=='started'){pending.delete(d.id);d.kind==='error'?p.reject(Error(d.error)):p.resolve(d);}};const send=(kind,data={})=>new Promise((resolve,reject)=>{const request=++id;pending.set(request,{resolve,reject});worker.postMessage({kind,session,...data,id:request});});return {worker,session,signal,send,ready:send('init',{signal,source,chunks})};}
window.audit=async()=>{if(!crossOriginIsolated||typeof SharedArrayBuffer==='undefined')throw Error('Isolation unavailable');const first=connect(crypto.randomUUID()),receiver=createReplayEventReceiver(),effects=[];let second;
try{await first.ready;const checkpoint=await first.send('advance',{steps:10}),before=JSON.parse(checkpoint.state.snapshot),existing=new Set(before.events.map(e=>e.id)),delivered=await first.send('damageAdvance',{steps:80}),firstEvents=JSON.parse(delivered.state.snapshot).events.filter(e=>!existing.has(e.id));if(!firstEvents.some(e=>e.type==='StructureRuined'))throw Error('No destroyed event');let firstApplied=0;for(const event of firstEvents)if(receiver.apply(event,e=>effects.push(e.id)))firstApplied++;
// The event was applied, but checkpoint/command acknowledgment is deliberately not advanced.
first.worker.terminate();const v=before.villages[0],cx=Math.floor((v.x+24)/48),cz=Math.floor((v.z+24)/48),chunks=[];for(let z=cz-1;z<=cz+1;z++)for(let x=cx-1;x<=cx+1;x++)chunks.push(`${x},${z}`);const start=performance.now();second=connect(crypto.randomUUID(),checkpoint.state.snapshot,chunks);await second.ready;const replay=await second.send('damageAdvance',{steps:80}),replayed=JSON.parse(replay.state.snapshot).events.filter(e=>!existing.has(e.id));let duplicateApplied=0;for(const event of replayed)if(receiver.apply(event,e=>effects.push(e.id)))duplicateApplied++;if(delivered.state.snapshot!==replay.state.snapshot||firstEvents.length!==replayed.length||duplicateApplied!==0||effects.length!==firstEvents.length)throw Error('Replay changed events or duplicated effect');return {checkpointBytes:new TextEncoder().encode(checkpoint.state.snapshot).length,deliveredEvents:firstEvents.length,eventTypes:firstEvents.map(e=>e.type),firstApplied,duplicatesSuppressed:replayed.length,duplicateApplied,finalEqual:true,recoveryReplayMs:performance.now()-start};
}finally{first.worker.terminate();second?.worker.terminate();}};window.ready=true;
</script>

<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Caja caída y recuperada</title>
<p>Centro/semilla/trabajador pagados, créditoQA10000, postgame y navegación dirigida sin obstáculos. Una incursión real se solicita durante el transporte; la IA suelta/recupera la caja. Solo se reproduce el MP3 original de manejo de caja. Sin mundo3D y con salida silenciada.</p><button id="run">Probar recuperación de caja</button><output id="status">Lista</output><pre id="report"></pre>
<script type="module">
import * as Game from '../../src/simulation/game.js';import {spawnRaid} from '../../src/simulation/raids.js';import {isMature} from '../../src/simulation/crops.js';import {rational} from '../../src/simulation/money.js';import {serialize} from '../../src/persistence/snapshots.js';import {AudioSystem} from '../../src/audio/audio.js';
const nav={placement:()=>({valid:true,suppress:[]}),setState(){},walkable:()=>true,path:(_a,b)=>[{x:b.x,z:b.z}]},errors=[],accepted=[],status=document.querySelector('#status'),report=document.querySelector('#report');let live=null,state=null;
const assert=(v,message)=>{if(!v)throw Error(message);},dispose=()=>{if(live){live.dispose();live=null;}};addEventListener('pagehide',dispose);addEventListener('error',e=>errors.push(String(e.error??e.message)));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 const audio=live=new AudioSystem({sfx:0,music:0});await audio.unlock();audio.sfx=await audio.sfxBank();const item=audio.sfx.items.find(i=>i.id==='farm_crate_move'),buffer=await audio.buffer(item.audio.url),original=audio.sound.bind(audio);audio.sound=async(id,options)=>{if(id!=='farm_crate_move')return null;const source=await original(id,options);if(source){const actor=state.workers.find(w=>w.id===options.emitter),voice=audio.voices.get(source);assert(source.buffer===buffer&&source.playbackRate.value===1&&!source.loop,'Original alterado');accepted.push({elapsed:state.elapsed,emitter:voice.emitter,family:voice.family,bus:voice.bus,status:actor?.status??null,task:state.tasks.find(t=>t.id===actor?.taskId)?.kind??null,rate:source.playbackRate.value});}return source;};
 state=Game.newGame({seed:712,slotId:'qa-native-crate-recovery'});Game.resume(state,'intro');state.ledger.balance=rational(10000);state.day=101;state.completedNights=100;state.postgame=true;state.initialPreparation=false;state.tutorial.step='done';Game.placeStructure(state,'center',{x:4,z:0},nav);Game.plant(state,'seed','mijo',10,4,nav);Game.pause(state,'hiring');Game.hire(state,'hire-'+state.day,{olderFemale:1});audio.remember(state.events);audio.updateFarm(state);let raidStarted=false,steps=0,cratePhaseSeen=false;
 while(!state.crates.some(c=>c.delivered)&&steps++<16000&&!state.result){
  if(state.pauses.includes('hiring'))Game.hire(state,'hire-'+state.day,{olderFemale:1});if(isMature(state.plants[0])&&!state.plants[0].harvestRequested)Game.harvest(state,'harvest',state.plants[0].id);
  if(!raidStarted&&state.workers.some(w=>w.status==='carrying')){state.postgame=false;spawnRaid(state,{group:['warthog']},nav);state.postgame=true;assert(state.raid,'No hay incursión');assert(state.events.some(e=>e.type==='CrateDropped'),'La huida no suelta la caja');raidStarted=true;}
  Game.advanceReal(state,.05,nav);if(state.workers.some(w=>w.status==='acting'&&state.tasks.find(t=>t.id===w.taskId)?.kind==='crate'))cratePhaseSeen=true;const before=serialize(state);audio.process(state.events,{state});audio.updateFarm(state);assert(serialize(state)===before,'Audio cambia dominio');status.textContent=state.raid?'Incursión':cratePhaseSeen?'Recogiendo caja':'Cultivo/transporte';await new Promise(done=>setTimeout(done,0));
 }
 assert(raidStarted&&cratePhaseSeen,'Falta fase de recuperación');assert(state.crates.filter(c=>c.delivered).length===1,'No entrega única');assert(state.events.filter(e=>e.type==='CrateDropped').length===1,'Caída duplicada');assert(state.events.filter(e=>e.type==='CropPicked').length===1&&state.events.filter(e=>e.type==='CrateDelivered').length===1,'Ingreso/cosecha duplicado');assert(accepted.length===2&&accepted[0].emitter===state.crates[0].id&&accepted[1].task==='crate','No son caída y contacto de recuperación');audio.stop();assert(audio.active.length===0&&audio.farm.entries.size===0,'Fuente sin liberar');dispose();await new Promise(done=>setTimeout(done,80));assert(audio.context.state==='closed','Contexto abierto');report.textContent=JSON.stringify({steps,day:state.day,simulatedSeconds:state.elapsed,raidStarted,cratePhaseSeen,accepted,decoded:{channels:buffer.numberOfChannels,sampleRate:buffer.sampleRate,duration:buffer.duration},drops:1,picks:1,deliveries:1,finalVoices:audio.active.length,context:audio.context.state,errors,muted:true,world3D:false},null,2);status.textContent='Completada';
 }catch(e){errors.push(String(e));report.textContent=JSON.stringify({accepted,errors},null,2);status.textContent='FAIL: '+e.message;dispose();}};
</script></html>

<h1>Atlas offline · Acacia paraguas de Sabana</h1><p>Herramienta de precálculo, fuera del gameplay. Ocho vistas de 256 × 256, encuadre idéntico, base fija, color neutro y alpha. No carga chunks.</p>
<button id="bake" disabled>Precalcular ocho vistas</button> <a id="download" download="savanna-acacia-8views.png" hidden>Guardar atlas PNG</a><p id="status" role="status">Cargando geometría original…</p><img id="atlas" alt="Atlas precalculado de ocho vistas de acacia" hidden><h2>Atlas precalculado guardado (WebP)</h2><img id="stored" src="../../docs/qa/far-vegetation-atlas/savanna-acacia-8views.webp" alt="Ocho vistas del atlas WebP guardado"><pre id="report"></pre>
<script type="module">
import * as THREE from 'three';
import {AfricanToon} from '../../src/rendering/african-toon.js';
import {NATIVE_LIGHT_DIRECTION} from '../../src/rendering/shadow-camera.js';
import {atlasElevationFrame} from '../../tools/experiments/atlas-elevation-frame.js';
import {Assets,json} from '../../src/rendering/assets.js';
const params=new URLSearchParams(location.search),bakeMode=params.get('bake'),normalBake=bakeMode==='normals',prelitBake=['day','night'].includes(bakeMode),toon=normalBake||prelitBake?new AfricanToon():null;const status=document.querySelector('#status'),report=document.querySelector('#report'),button=document.querySelector('#bake'),assets=new Assets(),errors=[];
const biome=params.get('biome')??'savanna',slot=Number(params.get('slot')??0),gameBiome={savanna:'sabana',grand_river:'gran-rio',mangrove:'manglares',volcanoes:'volcanes',canyons:'gran-canon',desert:'desierto'}[biome];if(!gameBiome||!Number.isInteger(slot)||slot<0||slot>(biome==='canyons'?1:3))throw Error('Invalid offline tree selection');
const bakedLod=Number(params.get('lod')??0);if(!Number.isInteger(bakedLod)||bakedLod<0||bakedLod>2)throw Error('Invalid atlas LOD');
const rotationViews=prelitBake&&params.get('rotations')==='8'?8:1,cameraViews=prelitBake&&params.get('views')==='16'?16:8,viewResolution=params.get('resolution')==='128'?128:256,atlasWidth=cameraViews*viewResolution,atlasHeight=rotationViews*viewResolution;
let renderer,mesh,material,scene,metadata,prototypes=[];
try{
 const pack=await json('/content/biome-'+biome+'.json'),levels=await assets.biome({...pack,assets:pack.assets.slice(slot,slot+1)}),source=levels[0][bakedLod],geometry=source.geometry,frameGeometry=levels[0][0].geometry,position=frameGeometry.getAttribute('position'),box=frameGeometry.boundingBox,height=box.max.y-box.min.y;
 prototypes=levels;
 const low=[];for(let i=0;i<position.count;i++)if(position.getY(i)<=box.min.y+height*.015)low.push([position.getX(i),position.getZ(i)]);
 const base=[(Math.min(...low.map(p=>p[0]))+Math.max(...low.map(p=>p[0])))/2,box.min.y,(Math.min(...low.map(p=>p[1]))+Math.max(...low.map(p=>p[1])))/2];
 let halfWidth=0;for(let view=0;view<8;view++){const angle=view*Math.PI/4,c=Math.cos(angle),s=Math.sin(angle);for(let i=0;i<position.count;i++)halfWidth=Math.max(halfWidth,Math.abs((position.getX(i)-base[0])*c-(position.getZ(i)-base[2])*s));}
 const width=halfWidth*2*1.08,elevation=atlasElevationFrame(position,base,height,Number(params.get('elevation')??0),cameraViews),frameHeight=elevation.impostorHeight;
 metadata={experimental:true,species:pack.assets[slot].name,biome:gameBiome,packBiome:biome,slot,views:cameraViews,viewResolution,atlasWidth,atlasHeight,rotationViews,rotationsDegrees:Array.from({length:rotationViews},(_,i)=>i*360/rotationViews),anglesDegrees:Array.from({length:cameraViews},(_,i)=>i*360/cameraViews),localBase:base,impostorWidth:width,impostorHeight:frameHeight,baseV:elevation.baseV,elevation,sourceBounds:{min:box.min.toArray(),max:box.max.toArray()},bakedLod,framingLod:0,sourceVertices:geometry.getAttribute('position').count,sourceTriangles:geometry.index.count/3,lighting:'Unlit original base color and factor; no directional light, normal bake or time-of-day variants',errors};
 renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(viewResolution,viewResolution);renderer.setClearColor(0,0);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;

  material.dispose();material=source.material.clone();material.userData={...source.material.userData};material.onBeforeCompile=source.material.onBeforeCompile;material.customProgramCacheKey=()=>source.material.customProgramCacheKey()+'|offline-atlas-'+bakeMode;
  const sun=new THREE.DirectionalLight();if(params.get('native-sun')==='1')sun.position.copy(NATIVE_LIGHT_DIRECTION).multiplyScalar(240);else sun.position.set(-30,55,25);toon.update(bakeMode==='night'?1:0,sun,gameBiome);toon.material(material);
  if(normalBake){
  const previous=material.onBeforeCompile;material.onBeforeCompile=(shader,renderer)=>{previous.call(material,shader,renderer);shader.fragmentShader=shader.fragmentShader.replace('#include <opaque_fragment>','outgoingLight=normalize(toonN)*.5+.5;\n#include <opaque_fragment>').replace('#include <colorspace_fragment>','').replace('#include <tonemapping_fragment>','');};
  renderer.debug.onShaderError=()=>errors.push('Normal atlas shader failed');
  metadata.lighting='Encoded local light normal from native normal map + art canopy; no baked illumination';metadata.normalEncoding='RGB = normal * 0.5 + 0.5; linear data, no sRGB conversion; source orientation';metadata.normalExperimental=true;
  document.querySelector('h1').textContent='Atlas offline de normales · Acacia de Sabana';document.querySelector('#download').download='savanna-acacia-normals-8views.png';
  }else{
   metadata.lighting='Native AfricanToon and source material, baked '+bakeMode;metadata.bakedPhase=bakeMode;metadata.nightAmount=bakeMode==='night'?1:0;metadata.sunPosition=sun.position.toArray();metadata.nativeSunDirection=params.get('native-sun')==='1';metadata.sourceYaw=rotationViews===1?0:null;metadata.rowMeaning='Tree world yaw relative to fixed sun; columns are camera angles relative to that tree';metadata.colorEncoding='sRGB display color, native shader grading; no runtime normal atlas';
   renderer.debug.onShaderError=()=>errors.push('Prelit atlas shader failed');document.querySelector('h1').textContent='Atlas offline precocinado · '+bakeMode;document.querySelector('#download').download=biome+'-tree-'+slot+'-'+bakeMode+'-'+cameraViews+'views'+(rotationViews>1?'-rotations8':'')+'.png';
  }
 }

 mesh=new THREE.Mesh(geometry,material);mesh.position.fromArray(base).multiplyScalar(-1);scene=new THREE.Scene();scene.add(mesh);
 button.textContent='Precalcular '+cameraViews+' vistas × '+rotationViews+' orientaciones';document.querySelector('h1+p').textContent='Precálculo offline: '+cameraViews+' vistas de '+viewResolution+' × '+viewResolution+' por orientación. Encuadre común y base fija; sin chunks.';button.disabled=false;status.textContent='Geometría lista. El atlas solo se genera al pulsar precalcular.';report.textContent=JSON.stringify(metadata,null,2);
 button.onclick=()=>{
 try{
 const atlas=document.createElement('canvas');atlas.width=atlasWidth;atlas.height=atlasHeight;const ctx=atlas.getContext('2d'),camera=new THREE.OrthographicCamera(-width/2,width/2,elevation.elevationDegrees?elevation.projectedTop:frameHeight/2,elevation.elevationDegrees?elevation.projectedBottom:-frameHeight/2,.01,100),distance=Math.max(width,frameHeight)*3,center=new THREE.Vector3(0,elevation.elevationDegrees?0:frameHeight/2,0),pitch=elevation.elevationDegrees*Math.PI/180;
 for(let row=0;row<rotationViews;row++){
 const yaw=row*Math.PI*2/rotationViews,c=Math.cos(yaw),s=Math.sin(yaw);mesh.rotation.y=yaw;mesh.position.set(-base[0]*c-base[2]*s,-base[1],base[0]*s-base[2]*c);
 for(let view=0;view<cameraViews;view++){const angle=view*Math.PI*2/cameraViews+yaw;camera.position.set(Math.sin(angle)*distance*Math.cos(pitch),center.y+distance*Math.sin(pitch),Math.cos(angle)*distance*Math.cos(pitch));camera.lookAt(center);camera.updateMatrixWorld();renderer.render(scene,camera);ctx.drawImage(renderer.domElement,view*viewResolution,row*viewResolution);}}

 const pixels=ctx.getImageData(0,0,atlasWidth,atlasHeight).data,cells=[];
 for(let row=0;row<rotationViews;row++)for(let view=0;view<cameraViews;view++){let minX=viewResolution,minY=viewResolution,maxX=-1,maxY=-1,opaquePixels=0;for(let y=0;y<viewResolution;y++)for(let x=0;x<viewResolution;x++)if(pixels[((row*viewResolution+y)*atlasWidth+view*viewResolution+x)*4+3]>0){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);opaquePixels++;}cells.push({row,treeYawDegrees:row*360/rotationViews,view,angleDegrees:view*360/cameraViews,minX,minY,maxX,maxY,opaquePixels});}
 metadata.cells=cells;metadata.webglError=renderer.getContext().getError();metadata.drawCallsPerView=renderer.info.render.calls;
 const data=atlas.toDataURL('image/png'),image=document.querySelector('#atlas');image.src=data;image.alt='Atlas precalculado de '+cameraViews+' vistas y '+rotationViews+' orientaciones';image.hidden=false;const link=document.querySelector('#download');link.href=data;link.hidden=false;status.textContent=prelitBake?'Atlas precocinado listo · '+bakeMode+' · '+rotationViews+' orientaciones del árbol':normalBake?'Atlas de normales listo; datos lineales, sin iluminación horneada.':'Atlas de ocho vistas listo; transparente, base común, sin luz horneada.';report.textContent=JSON.stringify(metadata,null,2);
 }catch(error){errors.push(String(error));status.textContent='ERROR al precalcular';report.textContent=JSON.stringify({...metadata,errors},null,2);}
 };
}catch(error){errors.push(String(error.stack??error));status.textContent='ERROR de carga';report.textContent=JSON.stringify({errors},null,2);}
addEventListener('pagehide',()=>{const resources=new Set();for(const levels of prototypes)for(const source of levels){resources.add(source.geometry);resources.add(source.material);for(const value of Object.values(source.material))if(value?.isTexture)resources.add(value);}for(const resource of resources)resource.dispose();material?.dispose();toon?.shadowUniforms.fallback.dispose();assets.disposeModels();renderer?.dispose();renderer?.forceContextLoss();},{once:true});

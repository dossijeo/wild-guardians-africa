<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Juice - isolated presentation QA</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<link rel="stylesheet" href="/content/fonts.css"><link rel="stylesheet" href="/ui-theme.css?v=2"><link rel="stylesheet" href="/content/hud.css"><style>body{margin:0}#stage{background:linear-gradient(#a5b5b0,#dbd0a7 45%,#807449)}aside{position:fixed;z-index:80;bottom:4px;left:8px;max-width:calc(100% - 16px);display:flex;gap:3px;flex-wrap:wrap}aside button{font-size:11px;padding:5px}#report{display:none}#fixture{position:absolute;top:45%;left:12%;color:#243a2d;font-size:13px;max-width:50%}</style>
<main id="stage" class="game"></main><aside><button id="income">Income</button><button id="expense">Expense</button><button id="dawn">Dawn</button><button id="place">Plant</button><button id="build">Build</button><button id="magic">Magic</button><button id="ready">Ready</button><button id="critical">Critical</button><button id="collapse">Collapse</button><button id="save">Save</button><button id="priority">Priority</button><button id="language">ES / EN</button><button id="stress">Stress + ABBA</button><button id="cleanup">Cleanup</button><button id="hold">Hold capture</button></aside><p id="report"></p>
<script type="module">
import '../../src/ui/styles.css';
import * as Game from '../../src/simulation/game.js';
import {GameJuice} from '../../src/ui/game-juice.js';
import {GameJuiceModel} from '../../src/ui/game-juice-model.js';
import {hudMarkup,ASSETS,layoutHud} from '../../src/ui/native-hud.js';
import {rational,transact,numberOf} from '../../src/simulation/money.js';
import {clearNavigation} from '../clear-navigation.js';
import {saveGame} from '../../src/app/save-game.js';
import {Vector3,PerspectiveCamera} from 'three';
const deliveries=Math.max(1,Math.min(100,Number(new URLSearchParams(location.search).get('deliveries')??100)));
const stage=document.querySelector('#stage');stage.innerHTML=hudMarkup+'<div id="events"></div><div id="placementBanner"></div><div id="fixture">Isolated native HUD / presentation fixture. No world renderer or audio. Transactions and placement commands use the real engine.</div>';
for(const img of stage.querySelectorAll('[data-sprite]'))img.src=ASSETS[img.dataset.sprite].src;
layoutHud(stage);window.addEventListener('resize',()=>layoutHud(stage));
const state=Game.newGame({seed:712}),nav=clearNavigation();Game.placeStructure(state,'qa-center',{x:4,z:0},nav);state.day=5;
let stamp=performance.now(),blocked=false,language='es',held=null,benchmarking=false;
const world={nav:{field:{surface:()=>0}},camera:new PerspectiveCamera(42,innerWidth/innerHeight,.1,100),raidCamera:{}};world.camera.position.set(15,12,15);world.camera.lookAt(new Vector3(4,0,0));world.camera.updateMatrixWorld();
const juice=new GameJuice(stage,state,world,{priority:()=>blocked,language:()=>language,now:()=>held??performance.now()});const report={scope:'Native DOM presentation fixture; no GPU renderer. ABBA measures JS+DOM scheduling, not GPU time.',checks:{},benchmarks:[]};let sequence=0;
function refresh(){document.querySelector('#moneyValue').textContent=numberOf(state.ledger.balance);document.querySelector('#report').textContent=JSON.stringify(report);}
function emit(type,detail){Game.emit(state,type,detail);juice.process(state);refresh();}
document.querySelector('#income').onclick=()=>{const id='crate-'+sequence++;transact(state.ledger,`deliver:${id}`,rational(45));emit('CrateDelivered',{targetId:id});};
document.querySelector('#expense').onclick=()=>{const id='hire-'+sequence++;transact(state.ledger,id,rational(-30));emit('HiringConfirmed',{paymentId:id,count:1,cost:30});};
document.querySelector('#dawn').onclick=()=>{state.completedNights=10;emit('Dawn');};
document.querySelector('#place').onclick=()=>{Game.plant(state,'plant-'+sequence++,'mijo',8+sequence*1.2,0,nav);juice.process(state);refresh();};
document.querySelector('#build').onclick=()=>{Game.buildWallChain(state,'wall-'+sequence++,'zarzas',[[3,8],[10,8]],nav);juice.process(state);refresh();};
document.querySelector('#magic').onclick=()=>{Game.cast(state,'magic-'+sequence++,'growth',8,0,nav);juice.process(state);refresh();};
document.querySelector('#ready').onclick=()=>{state.cooldowns.shield=1;juice.process(state);state.cooldowns.shield=0;juice.process(state);refresh();};
document.querySelector('#critical').onclick=()=>{const event=document.createElement('div');event.className='notice-card urgent';event.textContent=language==='es'?'El poblado necesita ayuda':'The village needs help';document.querySelector('#events').replaceChildren(event);emit('StructureHit',{targetId:state.structures[0].id,structureHit:{hp:20,maxHp:600}});};
document.querySelector('#collapse').onclick=()=>{emit('StructureRuined',{targetId:state.structures[0].id});const before=world.camera.position.clone();world.presentationDraw(()=>{});report.checks.exactCameraRestore=world.camera.position.equals(before);refresh();};
document.querySelector('#save').onclick=async()=>{const before=state.messages.length;await saveGame(state,{save:()=>Promise.resolve()},{confirm:true,onConfirm:()=>juice.savedSuccessfully()});report.checks.saveNoSimulationMessage=state.messages.length===before;refresh();};
document.querySelector('#priority').onclick=()=>{blocked=!blocked;document.querySelector('#fixture').textContent='Mandatory dialog priority: '+blocked;};
document.querySelector('#language').onclick=()=>{language=language==='es'?'en':'es';document.documentElement.lang=language;};
function freeze(){held=null;juice.update(state);juice.update(state);held=performance.now()+Math.min(350,(juice.overlays.policy.active?.end-juice.overlays.policy.active?.start||300)*.45);juice.update(state);for(const a of document.getAnimations()){a.pause();a.currentTime=Math.min(300,Number(a.effect.getTiming().duration)*.5);}report.capture={effect:juice.overlays.policy.active?.id??null,quality:world.quality??'media',reduced:juice.overlays.reduced(),width:juice.overlays.canvas.width,height:juice.overlays.canvas.height};refresh();}
let captureNext=false;document.querySelector('#hold').onclick=freeze;
const capture=document.createElement('button');capture.textContent='Capture next';capture.id='capture';document.querySelector('aside').append(capture);capture.onclick=()=>{held=null;captureNext=true;};
document.addEventListener('click',e=>{if(captureNext&&e.target.id!=='capture'){captureNext=false;freeze();}});
for(const [label,type,kind] of [['Raid','RaidSpawned'],['Nightfall','NightStarted'],['Victory','CampaignWon'],['Defeat','GameOver'],['Multiply','SpellActivated','multiply'],['Shield','SpellActivated','shield']]){const button=document.createElement('button');button.textContent=label;button.id='overlay-'+label.toLowerCase();button.onclick=()=>emit(type,kind?{kind,x:8,z:0}:{});document.querySelector('aside').append(button);}
const variants=document.createElement('button');variants.textContent='Overlay quality';document.querySelector('aside').append(variants);variants.onclick=()=>{held=null;world.quality=world.quality==='baja'?'muy_baja':world.quality==='muy_baja'?'media':'baja';juice.overlays.update();report.checks.overlayQuality={value:world.quality,width:juice.overlays.canvas.width,height:juice.overlays.canvas.height};refresh();};
const reducedButton=document.createElement('button');reducedButton.textContent='Reduced motion QA';document.querySelector('aside').append(reducedButton);let reducedQA=false;reducedButton.onclick=()=>{held=null;reducedQA=!reducedQA;juice.overlays.reduced=()=>reducedQA;report.checks.reducedMotionQA=reducedQA;refresh();};
const overlayChecks=document.createElement('button');overlayChecks.textContent='Overlay checks';document.querySelector('aside').append(overlayChecks);overlayChecks.onclick=()=>{held=null;juice.overlays.policy.dispose();blocked=true;juice.overlays.request('raid');juice.update(state);report.checks.blockedOverlayHidden=juice.overlays.canvas.hidden;report.checks.singlePending=juice.overlays.policy.pending?.id==='raid';blocked=false;juice.update(state);report.checks.unblockedOverlayVisible=!juice.overlays.canvas.hidden;juice.overlays.request('critical');juice.update(state);report.checks.highPriorityReplaces=juice.overlays.policy.active?.id==='critical';report.checks.singleCanvas=stage.querySelectorAll('.juice-overlay').length===1;report.checks.overlayIgnoresInput=getComputedStyle(juice.overlays.canvas).pointerEvents==='none';report.checks.belowHud=Number(getComputedStyle(juice.overlays.canvas).zIndex)<Number(getComputedStyle(document.querySelector('#hud')).zIndex);juice.overlays.policy.dispose();juice.update(state);report.checks.inactiveOverlayHidden=juice.overlays.canvas.hidden;refresh();};
const overlayBench=document.createElement('button');overlayBench.textContent='Overlay ABBA';document.querySelector('aside').append(overlayBench);overlayBench.onclick=async()=>{held=null;benchmarking=true;const samples=[];for(const [label,on]of [['A1',false],['B1',true],['B2',true],['A2',false]]){juice.overlays.policy.dispose();juice.overlays.canvas.hidden=true;const timings=[];for(let i=0;i<180;i++){await new Promise(requestAnimationFrame);const start=performance.now();if(on){juice.overlays.request('victory');juice.overlays.update();}timings.push(performance.now()-start);}const sorted=[...timings].sort((a,b)=>a-b);samples.push({label,on,median:sorted[90],p95:sorted[171],max:sorted.at(-1),timings});}report.overlayBenchmark={scope:'Isolated continuous largest lab overlay, no native renderer/audio/GPU queries. 200% intensity; 30 Hz max drawing. A disables overlay and B updates it.',samples,drawCount:juice.overlays.drawCount,canvases:stage.querySelectorAll('.juice-overlay').length};juice.overlays.policy.dispose();juice.overlays.update();benchmarking=false;refresh();};
document.querySelector('#cleanup').onclick=()=>{juice.dispose();report.checks.cleanup=stage.querySelectorAll('.game-juice,.juice-saved,.juice-overlay').length===0;refresh();};
document.querySelector('#stress').onclick=async()=>{
 const counts=[],timings={A:[],B:[]};benchmarking=true;
 for(const mode of ['A','B','B','A']){juice.pending.clear();juice.flushAt=0;juice.model.dispose();if(mode==='B')juice.model=new GameJuiceModel(state);for(const effect of [...juice.effects])juice.remove(effect);for(let frame=0;frame<180;frame++){
  const started=performance.now();for(let i=0;i<deliveries;i++){const id='stress-'+sequence++;transact(state.ledger,`deliver:${id}`,rational(45));Game.emit(state,'CrateDelivered',{targetId:id});}if(mode==='B'){juice.process(state);juice.update(state);counts.push(juice.effects.length);}
  timings[mode].push(performance.now()-started);await new Promise(requestAnimationFrame);
 }}benchmarking=false;juice.model=new GameJuiceModel(state);
 const stats=a=>{a.sort((x,y)=>x-y);return {median:a[Math.floor(a.length/2)],p95:a[Math.floor(a.length*.95)],max:a.at(-1)}};
 report.benchmarks.push({workload:`${deliveries} confirmed deliveries/frame, 360 active frames, ABBA, ${deliveries*720} real ledger settlements (identical work in A and B)`,off:stats(timings.A),on:stats(timings.B),maxEffects:Math.max(...counts),maxAllowed:4});report.checks.bounded=counts.every(n=>n<=4);refresh();
};
function frame(now){if(!juice.disposed&&!benchmarking)juice.update(state);stamp=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);refresh();
</script></html>

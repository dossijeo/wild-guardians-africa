<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Reacciones originales de trabajadores</title>
<p>Cuatro primeros días pagados con 1500 monedas: tarea y esfuerzo reales, después incursión dirigida de facóquero y huida real. Navegación sin obstáculos, sin mundo 3D y audio silenciado. No modifica crecimiento, velocidades ni RNG para producir reacciones.</p><button id="run">Probar los cuatro perfiles</button><output id="status">Lista</output><pre id="report"></pre>
<script type="module">
import * as Game from '../../src/simulation/game.js';import {spawnRaid} from '../../src/simulation/raids.js';import {serialize} from '../../src/persistence/snapshots.js';import {AudioSystem} from '../../src/audio/audio.js';import {WORKER_SOUND_IDS} from '../../src/audio/worker-audio.js';
const nav={placement:()=>({valid:true,suppress:[]}),setState(){},walkable:()=>true,path:(_a,b)=>[{x:b.x,z:b.z}]},errors=[],results=[],status=document.querySelector('#status'),report=document.querySelector('#report');let live=null;
const assert=(v,message)=>{if(!v)throw Error(message);},dispose=()=>{if(live){live.dispose();live=null;}};addEventListener('pagehide',dispose);addEventListener('error',e=>errors.push(String(e.error??e.message)));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 const audio=live=new AudioSystem({sfx:0,music:0});await audio.unlock();audio.sfx=await audio.sfxBank();const decoded={};for(const id of WORKER_SOUND_IDS){const item=audio.sfx.items.find(i=>i.id===id),buffer=await audio.buffer(item.audio.url);decoded[id]={buffer,channels:buffer.numberOfChannels,sampleRate:buffer.sampleRate,duration:buffer.duration};}
 let state=null,accepted=[];const original=audio.sound.bind(audio);audio.sound=async(id,options)=>{if(!WORKER_SOUND_IDS.includes(id))return null;const source=await original(id,options);if(source){const worker=state.workers.find(w=>w.id===options.emitter),voice=audio.voices.get(source);assert(source.buffer===decoded[id].buffer&&source.playbackRate.value===1&&!source.loop,'Original alterado');accepted.push({id,elapsed:state.elapsed,emitter:voice.emitter,family:voice.family,bus:voice.bus,status:worker?.status,task:state.tasks.find(t=>t.id===worker?.taskId)?.kind??null,rate:source.playbackRate.value});assert(audio.active.length<=20,'Límite global');assert([...audio.voices.values()].filter(v=>v.emitter===worker.id).length<=2,'Límite emisor');}return source;};
 for(const profile of ['olderMale','olderFemale','youngMale','youngFemale']){
  audio.stop();accepted=[];state=Game.newGame({seed:712,slotId:'qa-worker-'+profile});Game.placeStructure(state,'center',{x:28,z:0},nav);Game.plant(state,'seed','mijo',36,4,nav);Game.pause(state,'hiring');Game.hire(state,'hire',{[profile]:1});assert(state.workers.length===1&&state.workers[0].profile===profile,'Perfil contratado incorrecto');audio.remember(state.events);audio.updateWorkers(state);let steps=0,raidStarted=false;
  while(steps++<2500&&!accepted.some(c=>c.id==='npc_flee_shout')&&!state.result){
   Game.tick(state,.05,nav);const before=serialize(state);audio.updateWorkers(state,{listener:{x:28,z:0}});assert(serialize(state)===before,'Audio modifica simulación');
   if(!raidStarted&&accepted.some(c=>c.id==='npc_work_effort')){spawnRaid(state,{group:['warthog']},nav);assert(state.raid,'Incursión ausente');raidStarted=true;}
   status.textContent=profile+(raidStarted?' · huida':' · tarea');await new Promise(done=>setTimeout(done,0));
  }
  assert(raidStarted,'No observó esfuerzo antes de incursión');assert(accepted.map(c=>c.id).join('|')==='npc_acknowledge|npc_work_effort|npc_danger_react|npc_flee_shout','Cadencia/rutas incorrectas');assert(accepted.every(c=>c.family==='worker-voice'&&c.bus==='world'),'Familia/bus incorrecto');
  audio.stop();assert(audio.active.length===0&&audio.workers.entries.size===0,'Voces/observador sin liberar');results.push({profile,actualProfile:state.workers[0].profile,steps,simulatedSeconds:state.elapsed,raidStarted,accepted,finalVoices:audio.active.length});
 }
 dispose();await new Promise(done=>setTimeout(done,80));assert(audio.context.state==='closed','Contexto abierto');assert(errors.length===0,'Errores de navegador');report.textContent=JSON.stringify({results,decoded:Object.fromEntries(Object.entries(decoded).map(([id,{buffer,...data}])=>[id,data])),context:audio.context.state,errors,muted:true,world3D:false,predecoded:true},null,2);status.textContent='Completada';
 }catch(e){errors.push(String(e));report.textContent=JSON.stringify({results,errors},null,2);status.textContent='FAIL: '+e.message;dispose();}};
</script></html>

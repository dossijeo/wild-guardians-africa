<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Impostores en mundo nativo</title><style>body{margin:0;font:14px system-ui}canvas{width:100vw;height:100vh;display:block}header{position:fixed;top:0;left:0;background:#fff9de;padding:12px;max-width:360px;max-height:90vh;overflow:auto}button{padding:8px}pre{font-size:11px;white-space:pre-wrap}</style><header><strong>Sabana nativa + impostores experimentales</strong><p>Sin guardados. Cámara libre; integración optativa de QA.</p><button id="move" disabled>Desplazar 96 m</button><button id="suppress" disabled>Retirar acacia</button><button id="detach" disabled>Desactivar impostores</button><button id="benchmark" disabled>Medir capa ABBA</button><pre id="report">Cargando mundo…</pre></header><canvas></canvas><script type="module">
import * as THREE from 'three';
import {GpuTimer} from './gpu-timer.js';
import * as Game from '../../src/simulation/game.js';
import {Navigation} from '../../src/world/navigation.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {WorldScene} from '../../src/rendering/scene.js';
import {json} from '../../src/rendering/assets.js';
import {attachNativeFarWorld} from '../../tools/experiments/attach-native-far-world.js';
const errors=[];let world,adapter,dead=false,last=performance.now(),lastReport=0,removed=null,profiling=false,benchmark=null;
addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
try{
 const pack=await json('/content/biome-savanna.json'),payload=(await json('/content/villages.json')).find(v=>v.id==='mapungubwe');
 const state=Game.newGame({seed:712,biome:'sabana',culture:'mapungubwe'}),nav=new Navigation(712,'sabana',pack.profile),site=await findInitialLocationAsync(nav,payload);
 Object.assign(state.villages[0],site);state.suppressed.push(...site.suppress);nav.setState(state);Game.pause(state,'qa');state.tutorial.step='done';
 world=new WorldScene(document.querySelector('canvas'),()=>{});world.onError=e=>errors.push(String(e));world.qualitySetting('media');await world.load(state,nav,payload);world.render(0);
 const metadata=await json('/docs/qa/far-prelit-elevation8/day.json'),loader=new THREE.TextureLoader(),texture=await loader.loadAsync('../../docs/qa/far-vegetation-atlas/savanna-acacia-8views.webp'),prelitAtlas={day:await loader.loadAsync('../../docs/qa/far-prelit-elevation8/day.webp'),night:await loader.loadAsync('../../docs/qa/far-prelit-elevation8/night.webp'),views:8,rotations:8,resolution:128};
 adapter=await attachNativeFarWorld(world,{metadata,texture,prelitAtlas});
 const enable=()=>{const p=adapter.layer.current?.prototype;if(p){p.uniforms.uDensityEnabled.value=1;p.uniforms.uDensityRange.value.set(180,400);}};enable();
 document.querySelectorAll('button').forEach(b=>b.disabled=false);
 document.querySelector('#move').onclick=()=>{world.controls.target.x+=96;world.camera.position.x+=96;world.controls.update();};
 document.querySelector('#suppress').onclick=()=>{const trees=adapter.layer.current?.trees??[],t=trees.find(t=>!nav.suppressed.has(t.id));if(t){removed=t.id;state.suppressed.push(t.id);nav.setState(state);}};
 document.querySelector('#benchmark').onclick=async()=>{
  if(profiling||!world.farVegetation)return;profiling=true;world.controls.enabled=false;document.querySelectorAll('button').forEach(b=>b.disabled=true);
  const snapshot=JSON.stringify(state),pose=world.camera.position.toArray(),gpu=new GpuTimer(world.renderer.getContext()),previousAutoReset=world.renderer.info.autoReset;
  const gl=world.renderer.getContext(),debug=gl.getExtension('WEBGL_debug_renderer_info');
  benchmark={pattern:'ABBA',done:false,lots:[],nativePreparationsBefore:adapter.stats.nativePreparations,device:{userAgent:navigator.userAgent,renderer:gl.getParameter(debug?debug.UNMASKED_RENDERER_WEBGL:gl.RENDERER),vendor:gl.getParameter(debug?debug.UNMASKED_VENDOR_WEBGL:gl.VENDOR),viewport:[innerWidth,innerHeight],canvas:[gl.drawingBufferWidth,gl.drawingBufferHeight],pixelRatio:world.renderer.getPixelRatio()},hiddenDuringRun:false};world.renderer.info.autoReset=false;
  const tick=()=>new Promise(resolve=>requestAnimationFrame(resolve)),summary=values=>{const sorted=[...values].sort((a,b)=>a-b);return values.length?{count:values.length,p50:sorted[Math.ceil(values.length*.5)-1],p95:sorted[Math.ceil(values.length*.95)-1],mean:values.reduce((a,b)=>a+b,0)/values.length}:null;};
  try{for(const [lot,enabled] of [false,true,true,false].entries()){
   adapter.enabled=enabled;for(let i=0;i<20;i++){await tick();world.render(0);}
   const samples=[];let previous=null;for(let i=0;i<90;i++){await tick();benchmark.hiddenDuringRun||=document.hidden;world.renderer.info.reset();const timed=gpu.begin(lot*10000+i),start=performance.now();world.render(0);const cpu=performance.now()-start;if(timed)gpu.end();samples.push({cpu,interval:previous===null?null:start-previous,calls:world.renderer.info.render.calls,triangles:world.renderer.info.render.triangles});previous=start;}
   benchmark.lots.push({enabled,cpu:summary(samples.map(s=>s.cpu)),frame:summary(samples.flatMap(s=>s.interval===null?[]:[s.interval])),calls:summary(samples.map(s=>s.calls)),triangles:summary(samples.map(s=>s.triangles))});
  }
  for(let i=0;i<30;i++){gpu.poll();if(!gpu.pending.length)break;await tick();}
  benchmark.gpu=gpu.report();for(let i=0;i<benchmark.lots.length;i++)benchmark.lots[i].gpu=summary(benchmark.gpu.samples.filter(s=>Math.floor(s.frame/10000)===i).map(s=>s.ms));
  benchmark.nativePreparationsAfter=adapter.stats.nativePreparations;benchmark.cameraStable=JSON.stringify(pose)===JSON.stringify(world.camera.position.toArray());benchmark.simulationUnchanged=snapshot===JSON.stringify(state);benchmark.done=true;
  }catch(error){errors.push(String(error));benchmark.error=String(error);}
  finally{gpu.dispose();world.renderer.info.autoReset=previousAutoReset;adapter.enabled=true;world.controls.enabled=true;profiling=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}
 };
 document.querySelector('#detach').onclick=()=>{adapter.dispose();document.querySelector('#detach').disabled=true;};
 function frame(now){if(dead)return;const dt=Math.min(.05,(now-last)/1000);last=now;enable();if(!profiling)world.render(dt);
  if(now-lastReport>500){lastReport=now;const current=adapter.layer.current,trees=current?.trees??[],near=trees.filter(t=>Math.hypot(t.x-world.camera.position.x,t.z-world.camera.position.z)<140),ready=near.filter(t=>current.prototype.treeState(t.id).ready===1).length;
   document.querySelector('#report').textContent=JSON.stringify({loaded:true,benchmark,camera:world.camera.position.toArray(),chunks:world.chunks.size,regions:adapter.stats.regions,regionKey:current?.key,trees:trees.length,nearTrees:near.length,readyNearTrees:ready,nativePreparations:adapter.stats.nativePreparations,stalePreparations:adapter.stats.stalePreparations,removed,removedState:removed?current?.prototype.treeState(removed):null,prototype:current?.prototype.stats(),detached:!world.farVegetation,errors:[...errors,...adapter.stats.errors],webglError:world.renderer.getContext().getError()},null,2);
  }requestAnimationFrame(frame);
 }requestAnimationFrame(frame);
 addEventListener('pagehide',()=>{dead=true;world.dispose();texture.dispose();prelitAtlas.day.dispose();prelitAtlas.night.dispose();},{once:true});
}catch(error){errors.push(String(error));document.querySelector('#report').textContent=JSON.stringify({errors});world?.dispose();}
</script></html>

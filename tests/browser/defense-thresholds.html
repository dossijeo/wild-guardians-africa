<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Umbrales BAST y DEST</title><style>body{margin:0;font:14px system-ui}header{position:absolute;z-index:2;padding:12px;background:#fff9edee;max-width:360px}pre{max-height:150px;overflow:auto}button{padding:8px;margin:4px}canvas{width:100vw;height:100vh;display:block}#status{display:block}</style><header>WorldScene con centro, cultivo, trabajador y zarzas pagados. Daño controlado de QA; reloj pausado y sin partidas guardadas.<br>
<label>Objetivo <select id="target"><option value="wall">Zarzas BAST</option><option value="center">Centro DEST</option></select></label>
<button id="hit" disabled>Golpe lógico de 40 PV</button><button id="before" disabled>Justo antes del umbral</button><button id="cross" disabled>Restar 0,01 PV</button><button id="step" disabled>Avanzar 0,1 s</button><button id="finish" disabled>Completar caída</button><button id="recreate" disabled>Recargar con renderer nuevo</button><button id="save" disabled>Guardar y recargar en memoria</button><span id="status" role="status">Cargando finca…</span><pre id="data"></pre></header><canvas id="world" aria-label="Muro nativo en el mundo original"></canvas><script type="module">
import {serialize,deserialize} from '../../src/persistence/snapshots.js';
import {hitStructure} from '../../src/simulation/rules.js';
import * as Game from '../../src/simulation/game.js';
import {Navigation} from '../../src/world/navigation.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {WorldScene} from '../../src/rendering/scene.js';
import {json} from '../../src/rendering/assets.js';
const pack=await json('/content/biome-savanna.json'),villages=await json('/content/villages.json'),payload=villages.find(v=>v.id==='mapungubwe');
let state=Game.newGame({seed:712});const nav=new Navigation(712,'sabana',pack.profile),location=await findInitialLocationAsync(nav,payload);
Object.assign(state.villages[0],location);state.suppressed.push(...location.suppress);nav.setState(state);Game.resume(state,'intro');
Game.placeStructure(state,'qa-center',{x:location.center.x,z:location.center.z},nav);
let site;
for(let z=-6;z<=6&&!site;z+=1.5)for(let x=4.5;x<12&&!site;x+=1.5){const p={x:location.center.x+x,z:location.center.z+z};if(nav.placement(p.x,p.z,.4).valid)site=p;}
Game.plant(state,'qa-seed','mijo',site.x,site.z,nav);Game.openInitialHiring(state);Game.hire(state,'qa-contract',{olderMale:1});
let defense;
for(let z=-9;z<=9&&!defense;z+=2.5)for(let x=7;x<16&&!defense;x+=2.5){const p={x:location.center.x+x,z:location.center.z+z};if(nav.placement(p.x,p.z,.8).valid){Game.placeStructure(state,'qa-wall',{kind:'wall',material:'zarzas',...p},nav);defense=state.structures.at(-1);}}
if(!defense)throw new Error('No hay posición legal para el muro de prueba');
let world=new WorldScene(document.querySelector('#world'),()=>{});world.onError=e=>document.querySelector('#status').textContent=e.message;world.qualitySetting('media');await world.load(state,nav,payload);
state.tutorial.step='done';Game.pause(state,'qa');let target=defense,errors=[],reloading=false,rendererGeneration=1;world.onError=e=>{errors.push(e.message);status();};
function focus(){world.focus(target);const y=nav.field.surface(target.x,target.z);world.controls.target.set(target.x,y+.8,target.z);world.camera.position.set(target.x+6,y+7,target.z+10);world.controls.update();}
function status(){const mesh=world.objects.get(target.id),data={rendererGeneration,kind:target.kind,hp:target.hp,maxHp:target.maxHp,status:target.status,collapseRemaining:target.collapseRemaining,elapsed:state.elapsed,balance:state.ledger.balance.n,visual:target.kind==='center'?mesh?.damage:mesh?.visual,stage:mesh?.stageKey,pauses:state.pauses,errors};document.querySelector('#data').textContent=JSON.stringify(data,null,2);document.querySelector('#status').textContent=`${target.kind} ${target.hp}/${target.maxHp} PV · ${target.status} · caída ${target.collapseRemaining.toFixed(3)} s · visual ${data.visual?.toFixed(4)} · reloj ${state.elapsed.toFixed(2)} s · ${errors.length} errores`;}
function damage(value){hitStructure(target,value,state.elapsed);nav.setState(state);world.render(0);status();}
function advance(seconds){Game.resume(state,'qa');Game.tick(state,seconds,nav);Game.pause(state,'qa');world.render(0);status();}
document.querySelector('#target').onchange=e=>{target=state.structures.find(s=>s.kind===e.target.value);focus();world.render(0);status();};
document.querySelector('#hit').onclick=()=>damage(40);
document.querySelector('#before').onclick=()=>damage(Math.max(0,target.hp-target.maxHp*(target.kind==='center'?.21:.2)-.01));
document.querySelector('#cross').onclick=()=>damage(.01);
document.querySelector('#step').onclick=()=>advance(.1);
document.querySelector('#finish').onclick=()=>advance(Math.max(0,target.collapseRemaining));
document.querySelector('#save').onclick=()=>{const id=target.id;state=deserialize(serialize(state));nav.setState(state);world.state=state;world.simElapsed=state.elapsed;target=state.structures.find(s=>s.id===id);world.render(0);status();};
document.querySelector('#recreate').onclick=async()=>{reloading=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);const text=serialize(state),id=target.id,eye=world.camera.position.clone(),aim=world.controls.target.clone();try{world.dispose();state=deserialize(text);nav.setState(state);target=state.structures.find(s=>s.id===id);world=new WorldScene(document.querySelector('#world'),()=>{});world.onError=e=>errors.push(e.message);world.qualitySetting('media');await world.load(state,nav,payload);world.camera.position.copy(eye);world.controls.target.copy(aim);world.controls.update();await world.whenChunksReady();await Promise.all([...world.assets.cache.values()]);world.render(0);rendererGeneration++;}catch(e){errors.push(e.message);}finally{reloading=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);status();}};
await world.whenChunksReady();world.render(0);await Promise.all([...world.assets.cache.values()]);document.querySelectorAll('button').forEach(b=>b.disabled=false);focus();status();
requestAnimationFrame(function frame(){if(!reloading){world.render(0);status();}requestAnimationFrame(frame);});addEventListener('pagehide',()=>world.dispose());
</script></html>

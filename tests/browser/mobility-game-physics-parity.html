<!doctype html><html><head><meta charset="utf-8"><title>Game and physics Worker parity</title></head><body><script type="module">
import {runGamePhysics} from './mobility-game-physics-core.js';
try{
 const worker=new Worker('./mobility-game-physics-worker.js',{type:'module'}),remote=new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=e=>e.data.kind==='error'?reject(Error(e.data.error)):resolve(e.data.result);});
 const local=await runGamePhysics(),other=await remote;worker.terminate();
 const mismatch=(a,b)=>a.findIndex((x,i)=>x!==b[i]);const samples=mismatch(local.samples,other.samples),checkpoints=mismatch(local.checkpoints,other.checkpoints);
 if(samples!==-1||checkpoints!==-1||JSON.stringify(local.events)!==JSON.stringify(other.events)||JSON.stringify(local.phases)!==JSON.stringify(other.phases)||!local.network)throw Error(JSON.stringify({samples,checkpoints,localPhases:local.phases,otherPhases:other.phases,localEvents:local.events,otherEvents:other.events}));
 window.auditResult={samples:local.samples.length,checkpoints:local.checkpoints.length,events:local.events.map(e=>JSON.parse(e).type),phases:local.phases,activeSteps:local.activeSteps,animalId:local.animalId,network:local.network};
}catch(error){window.auditError=String(error?.stack??error);}
</script></body></html>

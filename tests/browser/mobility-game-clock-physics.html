<!doctype html><html><head><meta charset="utf-8"><title>Worker physics clock pacing</title></head><body><canvas id="view"></canvas><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {ANIMAL_ACTIONS} from '../../src/simulation/animal-actions-data.js';import {prepareAnimalModel} from '../../src/rendering/animal-actions.js';import {GpuTimer} from './gpu-timer.js';
const pct=(x,p)=>{const a=[...x].sort((a,b)=>a-b);return a.length?a[Math.floor((a.length-1)*p)]:null;};const stat=x=>({count:x.length,p95:pct(x,.95),p99:pct(x,.99),max:x.length?Math.max(...x):null});
window.runClockPhysics=async mode=>{
 if(!['frame','clock'].includes(mode))throw Error('Invalid mode');const worker=new Worker('./mobility-game-live-physics-worker.js',{type:'module'}),ready=new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=e=>e.data.kind==='ready'?resolve(e.data):e.data.kind==='error'?reject(Error(e.data.error)):null;});const renderer=new T.WebGLRenderer({canvas:document.querySelector('#view'),antialias:false,alpha:true});renderer.setSize(512,512,false);renderer.setPixelRatio(1);renderer.setClearColor(0,0);
 let timerId=null,failure=null,busy=false,sent=0,completed=0,sentAt=0,clockStart=null,doneAt=null,displayedFinalAt=null,packet=null,latestState=null,coalesced=0,applied=0,maxAhead=0;const samples=[],delivery=[],presentationDelay=[],tickTimes=[],workerTimes=[],applyTimes=[],frames=[],draw=[],visualGaps=[],rootShifts=[];let lastDisplayed=0;
 try{
  const [gltf,info]=await Promise.all([new GLTFLoader().loadAsync(ANIMAL_ACTIONS.animals.hyena.url),ready]);const root=new T.Group(),model=prepareAnimalModel(gltf.scene,'hyena'),bones=[];root.add(model);model.traverse(n=>{if(n.isBone)bones.push(n);});
  const apply=pose=>{const start=performance.now(),transform=(node,v)=>{if(v.length!==10||!v.every(Number.isFinite))throw Error('Invalid transform');node.position.fromArray(v,0);node.quaternion.fromArray(v,3);node.scale.fromArray(v,7);};transform(root,pose.root);transform(model,pose.model);if(pose.bones.length!==bones.length)throw Error('Invalid bones');for(let i=0;i<bones.length;i++){if(bones[i].name!==pose.bones[i].name)throw Error('Bone order');transform(bones[i],pose.bones[i].transform);}root.updateMatrixWorld(true);applyTimes.push(performance.now()-start);};apply(info.pose);
  const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x555555,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(1,5,4);scene.add(light,root);root.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});const camera=new T.PerspectiveCamera(40,1,.1,100);camera.position.set(root.position.x+5,root.position.y+3,root.position.z+6);camera.lookAt(root.position.x,root.position.y+1,root.position.z);const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info'),gpuTimer=new GpuTimer(gl,64),raf=()=>new Promise(requestAnimationFrame);
  const dispatch=()=>{timerId=null;if(failure||busy||sent>=120)return;const now=performance.now(),due=clockStart+(sent+1)*1000/60;if(mode==='clock'&&now<due){timerId=setTimeout(dispatch,Math.max(0,due-now));return;}if(mode==='clock')maxAhead=Math.max(maxAhead,(sent+1)*1000/60-(now-clockStart));sent++;sentAt=now;busy=true;worker.postMessage({kind:'step',sequence:sent,final:sent===120});};
  worker.onerror=e=>failure=e.message;worker.onmessage=e=>{if(e.data.kind==='error'){failure=e.data.error;return;}if(e.data.kind!=='result'||!busy||e.data.sequence!==completed+1){failure='Invalid result sequence';return;}const now=performance.now();completed++;delivery.push(now-sentAt);tickTimes.push(e.data.result.tickMs);workerTimes.push(e.data.computeMs);samples.push(e.data.result.sample);if(packet)coalesced++;packet={...e.data,receivedAt:now};if(e.data.state)latestState=e.data.state;if(completed===120)doneAt=now;if(mode==='clock'){busy=false;if(completed<120)dispatch();}};
  for(let i=0;i<20;i++){await raf();renderer.render(scene,camera);}clockStart=performance.now();if(mode==='clock')dispatch();const limit=clockStart+30000;let last=null,frame=0;
  while(displayedFinalAt===null||performance.now()-displayedFinalAt<500){const now=await raf();if(failure)throw Error(failure);if(performance.now()>limit)throw Error('Timeout');if(last!==null)frames.push(now-last);last=now;
   if(packet){const next=packet;packet=null;presentationDelay.push(performance.now()-next.receivedAt);const oldPosition=root.position.clone();apply(next.pose);rootShifts.push(root.position.distanceTo(oldPosition));visualGaps.push(next.sequence-lastDisplayed);lastDisplayed=next.sequence;applied++;if(mode==='frame')busy=false;if(next.sequence===120)displayedFinalAt=performance.now();}
   if(mode==='frame'&&!busy&&sent<120)dispatch();const start=performance.now(),timed=gpuTimer.begin(frame++);renderer.render(scene,camera);if(timed)gpuTimer.end();draw.push(performance.now()-start);
  }
  for(let i=0;i<30&&gpuTimer.pending.length;i++){await raf();gpuTimer.poll();}const gpu=gpuTimer.report();gpuTimer.dispose();if(completed!==120||!latestState||sent!==120||applied+coalesced!==120)throw Error('Incomplete publication');
  return {mode,samples,snapshot:latestState.snapshot,events:latestState.events,phases:latestState.phases,network:latestState.network,steps:completed,applied,coalesced,maxAheadMs:maxAhead,computeElapsedMs:doneAt-clockStart,displayElapsedMs:displayedFinalAt-clockStart,deliveryMs:stat(delivery),presentationDelayMs:stat(presentationDelay),tickMs:stat(tickTimes),workerComputeMs:stat(workerTimes),poseApplyMs:stat(applyTimes.slice(1)),visualGapSteps:stat(visualGaps),rootShift:stat(rootShifts),frames:stat(frames),renderMs:stat(draw),gpu:{reason:gpu.reason,count:gpu.samples.length,p95:pct(gpu.samples.map(s=>s.ms),.95),p99:pct(gpu.samples.map(s=>s.ms),.99),disjoint:gpu.disjointEvents,discarded:gpu.discarded},renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)};
 }finally{if(timerId!==null)clearTimeout(timerId);worker.terminate();renderer.dispose();}
};window.ready=true;
</script></body></html>

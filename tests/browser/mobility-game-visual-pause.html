<!doctype html><html><head><meta charset="utf-8"><title>Worker physics pause and presentation</title></head><body><canvas id="view"></canvas><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {ANIMAL_ACTIONS} from '../../src/simulation/animal-actions-data.js';import {prepareAnimalModel} from '../../src/rendering/animal-actions.js';import {createSimulationPacer} from '../../tools/trees/prototype_simulation_pacer.mjs';import {createPausePresentationGate} from '../../tools/trees/prototype_pause_presentation_gate.mjs';
window.runVisualPause=async()=>{
 const worker=new Worker('./mobility-game-visual-pause-worker.js',{type:'module'}),ready=new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=e=>e.data.kind==='ready'?resolve(e.data):e.data.kind==='error'?reject(Error(e.data.error)):null;}),renderer=new T.WebGLRenderer({canvas:document.querySelector('#view'),antialias:false,alpha:true});renderer.setSize(256,256,false);renderer.setClearColor(0,0);let waitTimer=null;
 try{
  const [info,gltf]=await Promise.all([ready,new GLTFLoader().loadAsync(ANIMAL_ACTIONS.animals.hyena.url)]),root=new T.Group(),model=prepareAnimalModel(gltf.scene,'hyena'),bones=[];root.add(model);model.traverse(n=>{if(n.isBone)bones.push(n);if(n.isMesh)n.frustumCulled=false;});
  const apply=pose=>{const set=(node,a)=>{node.position.fromArray(a,0);node.quaternion.fromArray(a,3);node.scale.fromArray(a,7);};set(root,pose.root);set(model,pose.model);if(pose.bones.length!==bones.length)throw Error('Bone count mismatch');for(let i=0;i<bones.length;i++){if(bones[i].name!==pose.bones[i].name)throw Error('Bone order mismatch');set(bones[i],pose.bones[i].transform);}root.updateMatrixWorld(true);};apply(info.pose);
  const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x555555,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(1,5,4);scene.add(light,root);const camera=new T.PerspectiveCamera(40,1,.1,100);camera.position.set(root.position.x+5,root.position.y+3,root.position.z+6);camera.lookAt(root.position.x,root.position.y+1,root.position.z);const target=new T.WebGLRenderTarget(256,256),pixels=new Uint8Array(256*256*4);
  const capture=()=>{scene.updateMatrixWorld(true);root.traverse(o=>{if(o.isSkinnedMesh)o.skeleton.update();});renderer.setRenderTarget(target);renderer.clear();renderer.render(scene,camera);renderer.readRenderTargetPixels(target,0,0,256,256,pixels);renderer.setRenderTarget(null);return new Uint8Array(pixels);};const diff=(a,b)=>{let changed=0,max=0,visible=0;for(let i=0;i<a.length;i+=4){if(a[i+3])visible++;let d=0;for(let j=0;j<4;j++)d=Math.max(d,Math.abs(a[i+j]-b[i+j]));if(d)changed++;max=Math.max(max,d);}return {changed,max,visible};};
  const baseline=capture(),pacer=createSimulationPacer('pacer-test',{initialTime:info.initialTime}),gate=createPausePresentationGate(info.session,info.initialTime);pacer.inspect(performance.now());await new Promise(resolve=>setTimeout(resolve,25));const request=pacer.request(performance.now());if(!request.accepted)throw Error('Step not due');
  let pauseAt=null,pauseImage=null,step=null,ackAt=null;const ack=new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=e=>{try{const d=e.data;if(d.kind==='error')throw Error(d.error);if(d.kind==='result'){if(d.command!==1||!pacer.acknowledge({session:'pacer-test',sequence:d.sequence,completed:true,simulationTime:d.simulationTime}).accepted)throw Error('Bad step acknowledgment');step=d;}else if(d.kind==='pause-ack'){ackAt=performance.now();if(d.command!==2||!d.pauses.includes('diagnostic')||!gate.confirmPause({session:info.session,sequence:2,paused:true,time:d.time}))throw Error('Bad pause acknowledgment');resolve(d);}else throw Error('Unexpected worker response');}catch(error){reject(error);}};});
  worker.postMessage({session:info.session,command:1,kind:'step',sequence:request.sequence});await new Promise((resolve,reject)=>{waitTimer=setTimeout(()=>{try{pauseAt=performance.now();pacer.pause(pauseAt);if(!gate.requestPause(2))throw Error('Pause request rejected');worker.postMessage({session:info.session,command:2,kind:'pause'});pauseImage=capture();resolve();}catch(error){reject(error);}},5);});
  const confirmed=await Promise.race([ack,new Promise((_,reject)=>setTimeout(()=>reject(Error('Pause timeout')),30000))]);await new Promise(requestAnimationFrame);const frozen=capture(),snapshot=gate.snapshot(),resumeAllowed=gate.requestResume(3);if(!step||!snapshot.needsReconciliation||resumeAllowed||snapshot.displayed!==info.initialTime||snapshot.confirmed!==confirmed.time||!pacer.inspect(performance.now()).paused)throw Error('Pause gate failed');const frozenDiff=diff(baseline,frozen),pauseDiff=diff(baseline,pauseImage);if(frozenDiff.changed||pauseDiff.changed||!frozenDiff.visible)throw Error('Paused image changed');apply(step.pose);const advanced=capture(),advancedDiff=diff(baseline,advanced);
  const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');target.dispose();return {renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),initialTime:info.initialTime,confirmedTime:confirmed.time,displayedTime:snapshot.displayed,needsReconciliation:snapshot.needsReconciliation,resumeAllowed,gamePaused:confirmed.pauses.includes('diagnostic'),pauseAckMs:ackAt-pauseAt,pauseDiff,frozenDiff,advancedDiff,scope:'Actual game/physics step and ordered pause in Worker; visual model remains at initial confirmed pose. Deliberate post-check applies later pose as a diagnostic, without claiming reconciliation. Synchronous pixel readbacks; not an FPS test or gameplay integration.'};
 }finally{if(waitTimer!==null)clearTimeout(waitTimer);worker.terminate();renderer.dispose();}
};window.ready=true;
</script></body></html>

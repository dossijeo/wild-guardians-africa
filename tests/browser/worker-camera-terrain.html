<!doctype html><meta charset="utf-8"><script type="module">
import {newGame} from '../../src/simulation/game.js';
import {villageLayout} from '../../src/world/villages.js';
import {serialize,deserialize} from '../../src/persistence/snapshots.js';
import {createConfirmedStateReceiver} from '../../src/simulation/confirmed-state-receiver.js';
import {createWorkerHostedRuntime} from '../../src/simulation/worker-hosted-runtime.js';
import {createWebGpuWorldClient} from '../../src/rendering/webgpu-world-client.js';
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
window.audit=async()=>{const data=(await (await fetch('/content/villages.json')).json()).find(v=>v.id==='mapungubwe'),initial=newGame({seed:712,biome:'sabana',culture:'mapungubwe',slotId:'camera-terrain'});initial.villages[0].buildings=villageLayout(data,0,0).filter(b=>b.kind!=='Zona común'&&b.footprint?.length).slice(0,1);initial.pauses=['fixture'];const snapshot=serialize(initial),state=deserialize(snapshot),canvas=document.createElement('canvas'),session='camera-terrain-qa',client=createWebGpuWorldClient({canvas,session,snapshot,width:32,height:32,camera:{x:20,y:30,z:30,targetX:0,targetY:0,targetZ:0},experimentalCameraTerrain:true}),runtime=createWorkerHostedRuntime({world:{createConfirmedReceiver:id=>createConfirmedStateReceiver(state,id)},session,clientOptions:{snapshot,chunkKeys:['0,0']},terrainPort:client.terrainPort,presentationPort:client.presentationPort,onConfirmedState:sequence=>client.confirmCameraTerrain(sequence),runtimeOptions:{stepSeconds:.05,maxBatchSteps:2,coalescePublications:true}});try{await client.ready;await runtime.start();for(let i=0;i<160&&!client.cameraTerrain?.status().chunks;i++)await sleep(25);if(!client.cameraTerrain?.status().chunks)throw Error('No confirmed camera terrain');const y=client.cameraTerrain.surface(0,0),inspection=await client.inspect();if(!Number.isFinite(y)||inspection.backend!=='WebGPU')throw Error('Invalid terrain or backend');return {height:y,terrain:client.cameraTerrain.status(),backend:inspection.backend,scope:'Real Workers and one confirmed chunk, no camera injection or exclusion parity.'};}finally{runtime.dispose();client.dispose();}};window.ready=true;
</script>

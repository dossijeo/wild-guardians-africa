<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Fases sonoras nativas de bestias</title>
<p>Cinco incursiones contra centros pagados, navegación dirigida sin obstáculos y sin mundo3D. Estados/ataques/retiradas de Game y Opus/WebAudio de producción. Salida silenciada: no acredita escucha ni mezcla del mundo completo.</p><button id="run">Probar las cinco especies</button><output id="status">Lista</output><pre id="report"></pre>
<script type="module">
import * as Game from '../../src/simulation/game.js';
import {spawnRaid} from '../../src/simulation/raids.js';
import {rational} from '../../src/simulation/money.js';
import {serialize} from '../../src/persistence/snapshots.js';
import {AudioSystem} from '../../src/audio/audio.js';
import {ANIMAL_SOUND_ROUTES,ANIMAL_SOUND_IDS} from '../../src/audio/animal-audio.js';
const nav={placement:()=>({valid:true,suppress:[]}),setState(){},walkable:()=>true,path:(_a,b)=>[{x:b.x,z:b.z}],activeBounds:[-96,-96,96,96]};
const errors=[],history=[],decoded=[],status=document.querySelector('#status'),report=document.querySelector('#report');let live=null,currentState=null,accepted=[],arrivals=[];
const assert=(v,message)=>{if(!v)throw Error(message);};const dispose=()=>{if(live){live.dispose();live=null;}};addEventListener('pagehide',dispose);
addEventListener('error',e=>errors.push(String(e.error??e.message)));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 const audio=live=new AudioSystem({sfx:0,music:0});await audio.unlock();audio.sfx=await audio.sfxBank();status.textContent='Decodificando veinte originales';
 await Promise.all([...ANIMAL_SOUND_IDS,'game_enemy_detected'].map(async id=>{const item=audio.sfx.items.find(i=>i.id===id),buffer=await audio.buffer(item.audio.url);decoded.push({id,channels:buffer.numberOfChannels,sampleRate:buffer.sampleRate,duration:buffer.duration});}));
 const original=audio.sound.bind(audio);audio.sound=async(id,options)=>{const source=await original(id,options);if(source&&id==='game_enemy_detected'){const voice=audio.voices.get(source);assert(voice.bus==='ui'&&voice.emitter==='ui:raid-arrival'&&source.playbackRate.value===1&&!source.loop,'Aviso local incorrecto');arrivals.push({id,elapsed:currentState.elapsed,bus:voice.bus,rate:source.playbackRate.value,samples:source.buffer.length});return source;}if(source){const actor=currentState?.raid?.animals.find(a=>a.id===options.emitter),voice=audio.voices.get(source);assert(source.playbackRate.value===1&&!source.loop,'Tono/bucle cambiado');assert(voice.bus==='world'&&voice.emitter===actor?.id,'Bus/emisor incorrecto');accepted.push({id,elapsed:currentState.elapsed,status:actor.status,attackId:actor.attackId??null,family:voice.family,rate:source.playbackRate.value,gain:voice.volume.gain.value});}return source;};
 for(const species of Object.keys(ANIMAL_SOUND_ROUTES)){
  status.textContent='Incursión '+species;audio.stop();accepted=[];arrivals=[];const s=currentState=Game.newGame({seed:712,slotId:'qa-native-animal-'+species});Game.resume(s,'intro');s.ledger.balance=rational(10000);s.day=3;s.completedNights=2;s.initialPreparation=false;s.tutorial.step='done';Game.placeStructure(s,'center',{x:4,z:0},nav);s.time=400;s.dayPlan={done:true};s.nightPlan={done:true};audio.updateAnimals(s);spawnRaid(s,{group:[species]},nav);const attackIds=new Set();let steps=0;
  while(s.raid&&steps++<5000){Game.tick(s,.05,nav);const before=serialize(s);audio.updateAnimals(s,{listener:{x:0,z:0}});assert(serialize(s)===before,'Audio cambia simulación');for(const a of s.raid?.animals??[])if(a.status==='attacking')attackIds.add(a.attackId);await new Promise(done=>setTimeout(done,0));}
  assert(arrivals.length===1,'Aviso de entrada repetido o perdido');assert(!s.raid,'Incursión sin terminar');const ids=accepted.map(c=>c.id);for(const id of Object.values(ANIMAL_SOUND_ROUTES[species]))assert(ids.includes(id),'Falta '+id);assert(ids.filter(id=>id===ANIMAL_SOUND_ROUTES[species].attack).length===attackIds.size,'Ataque repetido o perdido');assert(ids.filter(id=>id===species+'_retreat').length===1,'Retirada repetida');assert(audio.active.length===0&&audio.animals.entries.size===0,'Actividad sin liberar');
  history.push({species,steps,simulatedSeconds:s.elapsed,attackIds:[...attackIds],logicalHits:s.events.filter(e=>e.type==='AnimalLogicalHit').length,structureHits:s.events.filter(e=>e.type==='StructureHit').length,accepted:[...accepted],arrivals:[...arrivals],finalVoices:audio.active.length});
 }
 dispose();await new Promise(done=>setTimeout(done,80));assert(audio.context.state==='closed','Contexto abierto');report.textContent=JSON.stringify({history,decoded,errors,muted:true,world3D:false,context:audio.context.state},null,2);status.textContent='Completada';
 }catch(e){errors.push(String(e));report.textContent=JSON.stringify({history,decoded,errors},null,2);status.textContent='FAIL: '+e.message;dispose();}};
</script></html>

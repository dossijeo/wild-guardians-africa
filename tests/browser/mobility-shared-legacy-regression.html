<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';
window.audit=async mode=>{if(!crossOriginIsolated||typeof SharedArrayBuffer==='undefined')throw Error('Isolation unavailable');const worker=new Worker(new URL('./mobility-shared-ordered-pause-worker.js',import.meta.url),{type:'module'}),signal=new SharedArrayBuffer(4),flag=new Int32Array(signal),pending=new Map();let id=0,readyResolve,readyReject,pausePromise,pauseAt;const ready=new Promise((a,b)=>{readyResolve=a;readyReject=b;});worker.onerror=e=>readyReject(Error(e.message));const send=x=>new Promise((resolve,reject)=>{const request=++id;pending.set(request,{resolve,reject});worker.postMessage({...x,id:request,session:'pause-lab'});});const requestPause=()=>{pauseAt=performance.now();Atomics.store(flag,0,1);pausePromise=send({kind:'pause',token:1});};worker.onmessage=({data:d})=>{if(d.kind==='ready')readyResolve();else if(d.kind==='started'&&d.id===1&&mode==='during')requestPause();else{const p=pending.get(d.id);if(p&&d.kind!=='started'){pending.delete(d.id);d.kind==='error'?p.reject(Error(d.error)):p.resolve(d);}else if(d.kind==='error')readyReject(Error(d.error));}};let ref;

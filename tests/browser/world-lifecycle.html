<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Production world lifecycle</title>
<script src="/i18n/loader.js"></script><div id="app"></div>
<aside style="position:fixed;right:8px;top:8px;width:300px;max-height:45vh;overflow:auto;z-index:100000;background:#fffdeae8;pointer-events:none;padding:8px;font:12px system-ui;color:#18231e"><strong>QA-150 · Production lifecycle</strong><p>Real native menu and production world. Parent saves/settings are isolated in memory. Audio muted. Old world/context references intentionally retained for disposal checks.</p><button id="qaRead" style="pointer-events:auto">Read lifecycle evidence</button><pre id="qaReport" style="white-space:pre-wrap"></pre></aside>
<script type="module">
import {WorldScene} from '../../src/rendering/scene.js';
import {AudioSystem} from '../../src/audio/audio.js';
const memory=new Map([['wild-guardians:settings',JSON.stringify({quality:'muy_baja',sfx:0,music:0})]]);
Object.defineProperty(window,'localStorage',{value:{get length(){return memory.size;},key:i=>[...memory.keys()][i]??null,getItem:k=>memory.get(String(k))??null,setItem:(k,v)=>memory.set(String(k),String(v)),removeItem:k=>memory.delete(String(k)),clear:()=>memory.clear()},configurable:true});
const worlds=[],systems=new Set(),errors=[],listeners=[],terminated=new WeakSet();
const add=EventTarget.prototype.addEventListener,remove=EventTarget.prototype.removeEventListener;
EventTarget.prototype.addEventListener=function(type,callback,options){if(this instanceof HTMLCanvasElement)listeners.push({target:this,type,callback,capture:typeof options==='boolean'?options:!!options?.capture,signal:options?.signal,removed:false});return add.call(this,type,callback,options);};
EventTarget.prototype.removeEventListener=function(type,callback,options){const capture=typeof options==='boolean'?options:!!options?.capture;for(const l of listeners)if(l.target===this&&l.type===type&&l.callback===callback&&l.capture===capture)l.removed=true;return remove.call(this,type,callback,options);};
const terminate=Worker.prototype.terminate;Worker.prototype.terminate=function(){terminated.add(this);return terminate.call(this);};
const load=WorldScene.prototype.load,dispose=WorldScene.prototype.dispose,render=WorldScene.prototype.render;
WorldScene.prototype.load=async function(...args){const record={biome:args[0].biome,culture:args[0].culture,initialMoney:args[0].ledger.balance,world:this,gl:this.renderer.getContext(),loads:0,disposals:0,renders:0,rendersAfterDispose:0,geometryCount:0,materialCount:0,geometryDisposed:0,materialDisposed:0};worlds.push(record);await load.apply(this,args);record.loads++;record.worker=this.chunkStream?.worker;const geometries=new Set(),materials=new Set();this.scene.traverse(o=>{if(o.isMesh){geometries.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:[o.material])materials.add(m);}});record.geometryCount=geometries.size;record.materialCount=materials.size;for(const g of geometries)g.addEventListener('dispose',()=>record.geometryDisposed++);for(const m of materials)m.addEventListener('dispose',()=>record.materialDisposed++);paint();};
WorldScene.prototype.dispose=function(){const r=worlds.find(r=>r.world===this);if(r&&!this.disposed)r.disposals++;const result=dispose.call(this);paint();return result;};
WorldScene.prototype.render=function(...args){const r=worlds.find(r=>r.world===this);if(r){r.renders++;if(this.disposed)r.rendersAfterDispose++;}return render.apply(this,args);};
for(const name of ['unlock','stop','gameplay']){const original=AudioSystem.prototype[name];AudioSystem.prototype[name]=function(...args){systems.add(this);return original.apply(this,args);};}
addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
function paint(){document.querySelector('#qaReport').textContent=JSON.stringify({cycles:worlds.map((r,i)=>({cycle:i+1,biome:r.biome,culture:r.culture,initialMoney:r.initialMoney,loads:r.loads,disposals:r.disposals,renders:r.renders,rendersAfterDispose:r.rendersAfterDispose,disposed:!!r.world.disposed,contextLost:r.gl.isContextLost(),canvasConnected:r.world.renderer.domElement.isConnected,canvasListenersLive:listeners.filter(l=>l.target===r.world.renderer.domElement&&!l.removed&&!l.signal?.aborted).length,ownListenersAborted:r.world.canvasEvents?.signal.aborted,workerTerminated:r.worker?terminated.has(r.worker):null,streamDead:r.world.chunkStream?.dead,streamTimer:r.world.chunkStream?.timer,streamQueue:r.world.chunkStream?.queue.length,geometryCount:r.geometryCount,geometryDisposed:r.geometryDisposed,materialCount:r.materialCount,materialDisposed:r.materialDisposed})),audio:[...systems].map(a=>({voices:a.voices.size,active:a.active.length,transport:!!a.transport,context:a.context?.state})),worldCanvases:document.querySelectorAll('#world').length,menuFrames:document.querySelectorAll('#native-menu').length,isolatedSlots:[...memory.keys()].filter(k=>/^wild-guardians:slot:/.test(k)).length,errors,limits:'Retains old references; context loss is queried on real WebGL, not inferred from DOM removal. Resource disposal events are counts, not GPU memory bytes. One global app RAF and QA sampling timer remain intentionally active.'},null,2);}
document.querySelector('#qaRead').onclick=paint;
const timer=setInterval(paint,500);addEventListener('pagehide',()=>clearInterval(timer));
await import('../../src/app/main.js');paint();
</script></html>

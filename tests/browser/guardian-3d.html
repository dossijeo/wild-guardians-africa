<!doctype html><html lang="es"><meta charset="utf-8"><title>Guardián 3D · Validación</title>
<style>body{margin:0;background:#292d29;color:#eee;font:14px system-ui;display:grid;grid-template-columns:minmax(360px,1fr) 340px;height:100vh}canvas{width:100%;height:100%;min-height:0}aside{padding:20px;overflow:auto}label{display:block;margin:14px 0}select,button{padding:8px;max-width:100%}input[type=range]{width:95%}pre{white-space:pre-wrap;font-size:12px}audio{width:100%}</style>
<canvas id="avatar"></canvas><aside><h1>Guardián 3D</h1><label>Locución <select id="voice"></select></label><audio id="audio" controls></audio><button id="stop">Interrumpir</button><label>Visema <select id="viseme"><option value="">Automático</option></select></label><label>Parpadeo <input id="blink" type="range" min="-1" max="1" step=".01" value="-1"></label><label>Ojos <select id="eyeSide"><option value="">Ambos</option><option value="L">Izquierdo</option><option value="R">Derecho</option></select></label><label>Mirada horizontal <input id="eyeX" type="range" min="-1" max="1" step=".01" value="0"></label><label>Mirada vertical <input id="eyeY" type="range" min="-.5" max="1" step=".01" value=".27"></label><label>Animación <select id="clip"><option value="">Automática</option></select></label><label>Expresión <select id="expression"><option value="">Neutral</option><option>joy</option><option>focus</option><option>surprise</option></select></label><label><input id="freeze" type="checkbox"> Congelar movimiento</label><label>Tiempo del ciclo (s) <input id="motionTime" type="range" min="0" max="12" step=".05" value="0"></label><label><input id="closeFace" type="checkbox"> Detalle de ojos</label><label><input id="hideVortex" type="checkbox"> Ocultar v�rtice para inspecci�n</label><label>Vista <select id="view"><option value="0">Frontal</option><option value="0.6">Tres cuartos</option><option value="1.3">Lateral</option><option value="-0.6">Tres cuartos opuesto</option><option value="-1.3">Lateral opuesto</option></select></label><button id="checks">Ejecutar pruebas</button><pre id="report"></pre><button id="recordWind">Grabar ciclo de viento</button><span id="recordStatus"></span><button id="reset">Restablecer</button><pre id="status">Cargando…</pre></aside>
<script type="module">
import {Guardian3D} from '../../src/ui/guardian-3d.js';import {VISEMES} from '../../src/ui/guardian-face.js';import {assetUrl} from '../../src/rendering/asset-url.js';
import {checkGuardian} from './guardian-3d-checks.js';
const $=id=>document.getElementById(id),actor=new Guardian3D($('avatar'),new URLSearchParams(location.search).has('mantleBaseline')?{modelUrl:'/test-results/guardian-before-mantle.glb'}:new URLSearchParams(location.search).has('mantleTrial')?{modelUrl:'/test-results/guardian-mantle-weights.glb'}:new URLSearchParams(location.search).has('lidsTrial')?{modelUrl:'/content/source/guardian/eyelids-candidate.glb'}:{}),audio=$('audio');window.guardianLab={actor,audio};
const voices=await fetch(assetUrl('content/guardian/voices.json')).then(r=>r.json());for(const v of voices)$('voice').add(new Option(v.id+' · '+v.text.slice(0,42),v.id));for(const v of VISEMES)$('viseme').add(new Option(v,v));
await actor.ready;const updateVortex=actor.vortex.update.bind(actor.vortex);actor.vortex.update=(...args)=>{updateVortex(...args);if($('hideVortex').checked)actor.vortex.visible=false;};for(const name of actor.actions.keys())$('clip').add(new Option(name,name));
async function selectVoice(){audio.pause();const v=voices.find(v=>$('voice').value===v.id);audio.src=assetUrl(v.audio);await actor.setRecord({id:v.id,path:v.audio});}
$('voice').onchange=selectVoice;await selectVoice();$('stop').onclick=()=>{audio.pause();audio.currentTime=0;audio.removeAttribute('src');audio.load();};
$('viseme').onchange=()=>actor.manual.viseme=$('viseme').value||null;$('blink').oninput=()=>actor.manual.blink=+$('blink').value<0?null:+$('blink').value;
for(const id of ['eyeX','eyeY','eyeSide'])$(id).oninput=()=>actor.lookAt(actor.target.clone().set(+$('eyeX').value,+$('eyeY').value,1),$('eyeSide').value||null);
$('clip').onchange=()=>actor.manual.clip=$('clip').value||null;$('expression').onchange=()=>actor.manual.expression=$('expression').value?{name:$('expression').value,value:1}:null;
$('reset').onclick=()=>location.reload();new ResizeObserver(()=>actor.resize()).observe($('avatar'));
let testing=false; $('checks').onclick=async()=>{testing=true;try{$('report').textContent='Pruebas en curso…';const report=await checkGuardian(actor,audio,voices,assetUrl);$('report').textContent=JSON.stringify(report,null,2);}catch(e){$('report').textContent=e.stack;}finally{testing=false;await selectVoice();}};
const view=()=>{const a=+$('view').value,y=$('closeFace').checked?.26:0;actor.camera.zoom=$('closeFace').checked?3.4:1;actor.camera.position.set(2*Math.sin(a),y,2*Math.cos(a));actor.camera.lookAt(0,y,0);actor.camera.updateProjectionMatrix();};$('view').onchange=view;$('closeFace').onchange=view;
let recordingWind=false;
$('recordWind').onclick=async()=>{
 if(recordingWind)return;recordingWind=true;$('recordWind').disabled=true;
 const stream=$('avatar').captureStream(30),chunks=[],rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8',videoBitsPerSecond:6000000});
 const done=new Promise(resolve=>rec.onstop=resolve);rec.ondataavailable=e=>chunks.push(e.data);
 try{
  $('freeze').checked=false;rec.start();$('recordStatus').textContent='Grabando 12 segundos�';
  await new Promise(resolve=>setTimeout(resolve,12000));rec.stop();await done;
  const response=await fetch('http://127.0.0.1:5197/idle.webm',{method:'POST',body:new Blob(chunks,{type:'video/webm'})});
  if(!response.ok)throw Error('No se pudo guardar la grabaci�n');
  $('recordStatus').textContent='Ciclo de viento guardado';
 }catch(error){$('recordStatus').textContent=error.message;}
 finally{if(rec.state==='recording')rec.stop();stream.getTracks().forEach(track=>track.stop());recordingWind=false;$('recordWind').disabled=false;}
};
let last=0;function frame(ms){if(!testing)actor.draw({time:$('freeze').checked?+$('motionTime').value:ms/1000,audio,gesture:'speak'});if(ms-last>500){$('status').textContent=JSON.stringify({...actor.metrics,audioTime:audio.currentTime,cues:actor.face.data?.mouthCues.length,error:actor.face.error?.message},null,2);last=ms;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>

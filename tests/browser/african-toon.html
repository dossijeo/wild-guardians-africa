<!doctype html><html lang="es"><meta charset="utf-8"><title>QA African Toon V4.1.4</title><style>body{margin:0;font:14px system-ui;background:#fff9ed}header{position:absolute;z-index:2;padding:8px;background:#fff9ed}canvas{width:100vw;height:100vh;display:block}button{padding:8px}#status{display:block}</style><header>QA aislada: terreno y poblado originales; personajes a escala nativa 1; sin guardados.<br><button id="next">Siguiente combinación</button><button id="night">Día / noche</button><button id="actors">Ver personajes</button><button id="village">Ver poblado</button><button id="sky">Ver horizonte</button><button id="relief">Ver relieve nativo</button><button id="buried">Cámara enterrada (QA)</button><button id="obstruction">Ver obstáculo cercano (QA)</button><button id="visibility">Ocultación sí / no (QA)</button><button id="volcanic">Emisión volcánica sí / no (QA)</button><button id="volcanicView">Ver prop volcánico (QA)</button><button id="contact">Contacto sí / no (QA)</button><button id="contactView">Ver suelo con contacto (QA)</button><button id="contactRemove">Retirar prop de contacto (QA)</button><button id="hdr">Reflejos HDR sí / no (QA)</button><button id="yaw">Girar cielo 90° (QA)</button><button id="travel">Viajar un chunk (QA)</button><button id="water">Ver fluido</button><button id="pool">Ver charca del asset</button><button id="reflection">Rasante sin props (QA)</button><button id="dusk">Atardecer 50 %</button><button id="step">Pose +0,1s</button><button id="materials">Cultivos y defensas</button><button id="centerClose">Ver centro de cerca (QA)</button><button id="rotateCenter">Girar centro 90° (QA)</button><button id="damage">Daño DEST</button><label>Calidad <select id="quality"><option value="media">Media</option><option value="baja">Baja</option><option value="muy_baja">Muy baja</option><option value="alta">Alta</option></select></label><span id="status">Cargando…</span></header><canvas id="world"></canvas><script type="module">
import * as THREE from 'three';

const cultures=['mapungubwe','suajili','musgum','saheliana','etiope'],biomes=Object.keys(BIOME_IDS),payloads=await json('/content/villages.json');
let world,index=Number(new URL(document.URL).searchParams.get('case')??1)-1,night=false,phase=null,actors=false,ready=false,errors=[];
const status=document.querySelector('#status');
const error=e=>{errors.push(String(e.message??e));status.textContent=errors.join(' · ');};
addEventListener('error',error);addEventListener('unhandledrejection',e=>error(e.reason));
const originalError=console.error;console.error=(...args)=>{errors.push(args.join(' '));originalError(...args);};
async function load(){ready=false;contactTarget=null;document.querySelectorAll('button').forEach(b=>b.disabled=true);world?.dispose();
 const biome=biomes[Math.floor(index/5)],culture=cultures[index%5],payload=payloads.find(v=>v.id===(culture==='saheliana'?'saheliano':culture));if(!payload)throw new Error('Cultura no encontrada '+culture);
 const pack=await json('/content/biome-'+BIOME_IDS[biome]+'.json'),state=Game.newGame({biome,culture,seed:712}),nav=new Navigation(712,biome,pack.profile),location=await findInitialLocationAsync(nav,payload);
 Object.assign(state.villages[0],location);state.suppressed.push(...location.suppress);nav.setState(state);
 world=new WorldScene(document.querySelector('#world'),()=>{});world.onError=error;world.qualitySetting(new URL(document.URL).searchParams.get('q')??'media');document.querySelector('#quality').value=world.quality;await world.load(state,nav,payload);
 const center=location.center;Game.resume(state,'intro');Game.placeStructure(state,'qa-center',center,nav);Game.pause(state,'qa');state.tutorial.step='done';
 // Explicit visual fixture actors, not a claimed gameplay scenario. No persistence.
 const profiles=['olderMale','olderFemale','youngMale','youngFemale'];
 state.workers=profiles.map((profile,i)=>({id:'qa-worker-'+profile,profile,x:center.x+(i-1.5)*3,z:center.z+10,status:'idle',path:[],taskId:null}));
 state.raid={animals:['warthog','hyena','buffalo','lion','rhino'].map((species,i)=>({id:'qa-animal-'+species,species,x:center.x+(i-2)*4,z:center.z+17,status:'idle',hitsRemaining:4,path:[],heading:0}))};
 const crops=['maiz','algodon','girasol','platano','sorgo','mijo','yuca','batata'];
 state.plants=crops.flatMap((species,i)=>[1,.4806].map((ratio,j)=>({id:'qa-plant-'+i+'-'+j,species,alive:true,growth:cropSpec(species).growth_seconds*ratio,x:center.x+30+(i-3.5)*2,z:center.z+10+j*3})));
 for(const [i,material] of ['zarzas','empalizada','adobe','reforzado','piedra'].entries())for(const gate of [false,true])state.structures.push({id:'qa-wall-'+material+'-'+gate,kind:'wall',material,gate,x:center.x+30+(i-2)*4,z:center.z+18+(gate?4:0),yaw:0,hp:100,maxHp:100,status:'intact',collapseRemaining:0,gateOpen:.4});

}
function camera(){for(const g of world.chunks.values())g.traverse(o=>{if(o.isInstancedMesh)o.visible=!actors;});for(const v of world.state.villages)world.objects.get(v.id).visible=!actors;const p=world.state.villages[0];if(actors==='materials'){const c=world.state.structures[0],y=world.nav.field.surface(c.x+30,c.z+16);world.controls.target.set(c.x+30,y+1,c.z+16);world.camera.position.set(c.x+30,y+13,c.z+37);}else if(actors){const c=world.state.structures[0],y=world.nav.field.surface(c.x,c.z+13);world.controls.target.set(c.x,y+1.3,c.z+13);world.camera.position.set(c.x,y+11,c.z+36);}else{world.focus({x:p.x,z:p.z});}world.controls.update();}
document.querySelector('#next').onclick=()=>{location.href='?case='+((index+1)%30+1);};document.querySelector('#night').onclick=()=>{night=!night;phase=null;draw();};document.querySelector('#actors').onclick=()=>{actors=true;camera();draw();};document.querySelector('#village').onclick=()=>{actors=false;camera();draw();};
document.querySelector('#volcanic').onclick=()=>{const enabled=world.prototypes[0][0].material.userData.nativeVolcanicGlow.value>0;for(const levels of world.prototypes)levels[0].material.userData.nativeVolcanicGlow.value=enabled?0:(world.pack.material.volcanicGlow??0);draw();};
document.querySelector('#volcanicView').onclick=()=>{const slot=world.pack.assets.findIndex(a=>/cono volcánico/.test(a.name)),origin=world.controls.target,list=[...world.chunks.values()].flatMap(g=>g.userData.contactInstances[slot<0?10:slot]);list.sort((a,b)=>Math.hypot(a.x-origin.x,a.z-origin.z)-Math.hypot(b.x-origin.x,b.z-origin.z));const p=list[0];if(!p){status.textContent='Sin prop de referencia';return;}world.controls.target.set(p.x,p.y+1,p.z);world.camera.position.set(p.x+8,p.y+7,p.z+10);world.controls.update();world.obstructionEnabled=false;world.obstructionStats=updateObstructions(world.chunks,world.camera,world.controls.target,0,{enabled:false,snap:true});draw();};
let contactTarget=null;
document.querySelector('#contact').onclick=()=>{world.contacts.uniforms.uContactOn.value=1-world.contacts.uniforms.uContactOn.value;draw();};
document.querySelector('#contactView').onclick=()=>{const candidates=[...world.chunks.values()].flatMap(g=>g.userData.contactInstances.flatMap((list,slot)=>[0,3].includes(world.contactPrototypes[slot].group)?list:[])),origin=world.controls.target;candidates.sort((a,b)=>Math.hypot(a.x-origin.x,a.z-origin.z)-Math.hypot(b.x-origin.x,b.z-origin.z));const p=candidates.find(p=>!world.nav.field.waterInfo(p.x,p.z).inside);if(!p){status.textContent='Sin prop de contacto terrestre';return;}contactTarget=p;world.controls.target.set(p.x,world.nav.field.surface(p.x,p.z)+.18,p.z);world.camera.position.set(p.x+8,p.y+8,p.z+10);world.controls.update();draw();};
document.querySelector('#contactRemove').onclick=()=>{if(!contactTarget){status.textContent='Primero seleccionar suelo con contacto';return;}world.state.suppressed.push(contactTarget.id);world.nav.setState(world.state);world.syncChunks(true);draw();};
document.querySelector('#reflection').onclick=()=>{for(const g of world.chunks.values())g.traverse(o=>{if(o.isInstancedMesh&&!o.userData.nativeFluid)o.visible=false;});for(const v of world.state.villages)world.objects.get(v.id).visible=false;const p=world.controls.target;world.camera.position.set(p.x+14,p.y+1.5,p.z+14);world.controls.update();draw();};
document.querySelector('#dusk').onclick=()=>{phase=300+Math.log(2)/2.4;draw();};
document.querySelector('#water').onclick=()=>fluidCamera(false);document.querySelector('#pool').onclick=()=>fluidCamera(true);
function fluidCamera(poolsOnly){const p=world.state.villages[0];let nearest=null,distance=Infinity;for(const g of world.chunks.values())g.traverse(o=>{if(!o.isMesh||!o.material.userData.paintUniforms||poolsOnly&&o.userData.nativeFluid!=='asset')return;const a=o.geometry.attributes.position,point=new THREE.Vector3(),instance=new THREE.Matrix4(),matrix=new THREE.Matrix4();o.updateWorldMatrix(true,false);for(let j=0;j<(o.isInstancedMesh?o.count:1);j++){matrix.copy(o.matrixWorld);if(o.isInstancedMesh){o.getMatrixAt(j,instance);matrix.multiply(instance);}for(let i=0;i<a.count;i+=3){point.fromBufferAttribute(a,i).add(new THREE.Vector3().fromBufferAttribute(a,i+1)).add(new THREE.Vector3().fromBufferAttribute(a,i+2)).multiplyScalar(1/3).applyMatrix4(matrix);const d=Math.hypot(point.x-p.x,point.z-p.z);if(d<distance){distance=d;nearest={x:point.x,y:point.y,z:point.z};}}}});if(!nearest){status.textContent='Sin fluido en los chunks visibles';return;}world.controls.target.set(nearest.x,nearest.y,nearest.z);world.camera.position.set(nearest.x+(poolsOnly?6:9),nearest.y+(poolsOnly?8:13),nearest.z+(poolsOnly?8:14));world.controls.update();draw();}
document.querySelector('#visibility').onclick=()=>{world.obstructionEnabled=world.obstructionEnabled===false;for(let i=0;i<12;i++)world.obstructionStats=updateObstructions(world.chunks,world.camera,world.controls.target,.12,{enabled:world.obstructionEnabled!==false});draw();};
document.querySelector('#obstruction').onclick=()=>{const records=[...world.chunks.values()].flatMap(g=>g.children.flatMap(m=>m.geometry?.userData.obstruction?.records??[])),eye=world.camera.position;records.sort((a,b)=>Math.hypot(a.x-eye.x,a.z-eye.z)-Math.hypot(b.x-eye.x,b.z-eye.z));const r=records.find(r=>r.half[1]>2);if(!r){status.textContent='Sin obstáculo alto cercano';return;}world.controls.target.set(r.x,r.y+.18,r.z-10);world.camera.position.set(r.x,r.y+Math.max(2,r.center[1]),r.z);world.controls.update();for(let i=0;i<12;i++)world.obstructionStats=updateObstructions(world.chunks,world.camera,world.controls.target,.12,{enabled:world.obstructionEnabled!==false});draw();};
document.querySelector('#hdr').onclick=()=>{const u=world.toon.environmentUniforms.uNativeEnvEnabled;u.value=u.value?0:1;draw();};
document.querySelector('#yaw').onclick=()=>{world.sky.uniforms.uSkyYaw.value+=.25;draw();};

document.querySelector('#sky').onclick=()=>{const p=world.state.villages[0],y=world.nav.field.surface(p.x,p.z);world.controls.target.set(p.x,y+8,p.z);world.camera.position.set(p.x+35,y+12,p.z+50);world.controls.update();draw();};
document.querySelector('#centerClose').onclick=()=>{const p=world.state.structures[0],y=world.nav.field.surface(p.x,p.z),bounds=world.objects.get(p.id).template.body.boundingBox,height=bounds.max.y-bounds.min.y,distance=height*2.2+10;world.controls.target.set(p.x,y+.18,p.z);world.camera.position.set(p.x+distance*.6,y+height*1.5+4,p.z+distance*.8);world.controls.update();draw();};
document.querySelector('#rotateCenter').onclick=()=>{world.state.structures[0].yaw=(world.state.structures[0].yaw??0)+Math.PI/2;draw();};
document.querySelector('#materials').onclick=()=>{actors='materials';camera();draw();};document.querySelector('#damage').onclick=()=>{hitStructure(world.state.structures[0],250);world.focus(world.state.structures[0]);draw();};

function draw(){if(ready){world.state.time=phase??(night?350:150);world.render(.016);const gpuError=world.renderer.getContext().getError();if(gpuError){error(new Error('WebGL error '+gpuError));return;}status.textContent=`${index+1}/30 · ${biomes[Math.floor(index/5)]} / ${cultures[index%5]} · ${phase!==null?'transición 50 %':night?'noche':'día'} · ${actors==='materials'?'8 cultivos (etapas originales y morph) + 5 muros/5 puertas':actors?'4 trabajadores + 5 bestias, escala 1':'poblado + terreno + centro'} · puentes ${world.scene.children.filter(o=>o.name.startsWith('puente_')&&o.visible).reduce((n,o)=>n+o.count,0)} · ${world.quality} / ${world.terrainMeshes[0]?.material.type} / sombras ${world.renderer.shadowMap.enabled} · fase ${world.toon.uniforms.uNight.value.toFixed(4)} / centro ${world.objects.get(world.state.structures[0].id)?.uniforms?.uNight.value.toFixed(4)} · daño DEST ${world.objects.get(world.state.structures[0].id)?.damage.toFixed(3)} / escombros ${world.objects.get(world.state.structures[0].id)?.effects.debris.geometry.instanceCount??0} · exposición ${world.toon.uniforms.uExposure.value} / DEST ${world.objects.get(world.state.structures[0].id)?.uniforms.uExposure.value} · emisión ${world.prototypes[0][0].material.userData.nativeVolcanicGlow.value} · contacto ${world.contacts.uniforms.uContactOn.value} / subidas ${world.contacts.uploads} / bytes ${world.contacts.texture.image.data.length} · HDR ${world.toon.environmentUniforms.uNativeEnvEnabled.value} / giro ${world.toon.environmentUniforms.uEnvYaw.value.toFixed(2)} · atlas normales ${world.prototypes.flat().filter(p=>p.material.normalMap).length}/${world.prototypes.flat().length} · tangentes ${world.prototypes.flat().filter(p=>p.geometry.attributes.tangent).length} · LOD ${world.lodStats.counts.join("/")} / triangulos ${world.lodStats.triangles}/${world.lodStats.fullTriangles} / descartados ${world.lodStats.culled} / cambios ${world.lodStats.updates} / chunks ${world.chunks.size} · horizonte ${world.horizon?.group?.children.length??0} · ocultación ${world.obstructionEnabled!==false} / ${world.obstructionStats?.hidden??0} ocultos / ${world.obstructionStats?.fading??0} en transición · niebla ${Boolean(world.scene.fog)} · altura cámara ${(world.camera.position.y-world.nav.field.surface(world.camera.position.x,world.camera.position.z)).toFixed(4)} · cámara ${world.camera.position.toArray().map(v=>v.toFixed(6)).join(',')} · errores ${errors.length}`;}}

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA · Transferencia espacial WASM</title>
<style>body{margin:0;padding:24px;background:#182821;color:#f3ecd5;font:14px/1.5 system-ui}pre{white-space:pre-wrap;word-break:break-word}h1{font-size:20px}</style>
</head><body><h1>Sabana · Web Worker real</h1><pre id="status">Iniciando medición…</pre><script type="module">
import * as THREE from 'three';
import {Navigation} from '../../src/world/navigation.js';

const status=document.querySelector('#status'),now=()=>performance.now();
function request(worker,message){
  return new Promise((resolve,reject)=>{
    const start=now(),timer=setTimeout(()=>{worker.removeEventListener('message',receive);reject(Error('Worker timeout'));},20000);
    function receive({data}){
      if(data.id!==message.id)return;
      clearTimeout(timer);worker.removeEventListener('message',receive);
      if(data.error)reject(Error(data.error));else resolve({roundtripMs:now()-start,...data});
    }
    worker.addEventListener('message',receive);worker.postMessage(message);
  });
}
function prepareThree(data,cx,cz){
  const start=now(),positions=new Float32Array(49*49*3),indices=new Uint16Array(48*48*6);
  for(let z=0;z<49;z++)for(let x=0;x<49;x++){
    const i=z*49+x;positions[i*3]=cx*48-24+x;positions[i*3+1]=data.heights[i];positions[i*3+2]=cz*48-24+z;
  }
  for(let z=0;z<48;z++)for(let x=0;x<48;x++){
    const i=z*48+x,k=i*6,a=z*49+x,b=a+1,d=a+49,c=d+1;
    indices.set([a,d,b,b,d,c],k);
  }
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geometry.setAttribute('color',new THREE.BufferAttribute(data.colors,3));
  geometry.setIndex(new THREE.BufferAttribute(indices,1));geometry.computeVertexNormals();
  const waterGeometry=new THREE.BufferGeometry();
  waterGeometry.setAttribute('position',new THREE.BufferAttribute(data.waterTriangles,3));
  waterGeometry.computeVertexNormals();
  const vertices=geometry.getAttribute('position').count,waterVertices=waterGeometry.getAttribute('position').count;
  geometry.dispose();waterGeometry.dispose();
  return {ms:now()-start,vertices,waterVertices};
}
try{
  const profile=await fetch('/content/biome-savanna.json').then(response=>response.json()).then(pack=>pack.profile);
  const seed=Number(new URLSearchParams(location.search).get('seed')??712);
  const nav=new Navigation(String(seed),'sabana',profile),baseline=new Worker(new URL('../../src/rendering/chunk-worker.js',import.meta.url),{type:'module'});
  const baselineFirst=await request(baseline,{id:1,epoch:0,config:nav.config,profile,cx:0,cz:0});
  const baselineSecond=await request(baseline,{id:2,epoch:0,config:nav.config,profile,cx:1,cz:0});
  baseline.terminate();
  const candidate=new Worker(new URL('./spatial-savanna-transfer-worker.js',import.meta.url),{type:'module'});
  const candidateFirst=await request(candidate,{id:3,seed,cx:0,cz:0,reset:true,radius:1.1});
  const candidateSecond=await request(candidate,{id:4,seed,cx:1,cz:0,radius:1.1});
  candidate.terminate();
  for(const result of [candidateFirst,candidateSecond]){
    if(result.data.heights.length!==2401||result.data.colors.length!==7203||
       result.data.water.length!==2304||result.data.groundMask.length!==4900||result.data.waterLevels.length!==2304||
       result.data.waterTriangles.length%9!==0||
       result.data.props.byteLength!==result.data.count*28)
      throw Error('Transferred WASM buffers have inconsistent lengths');
  }
  for(let z=0;z<49;z++)if(candidateFirst.data.heights[z*49+48]!==candidateSecond.data.heights[z*49])
    throw Error(`Transferred terrain seam differs at row ${z}`);
  const current=[baselineFirst,baselineSecond].map(result=>({roundtripMs:result.roundtripMs,
    bytes:result.data.terrain.byteLength+result.data.water.byteLength+result.data.groundMask.byteLength,
    props:result.data.instances.reduce((n,list)=>n+list.length,0)}));
  const spatial=[candidateFirst,candidateSecond].map(result=>({roundtripMs:result.roundtripMs,
    ...result.timing,three:prepareThree(result.data,result.cx,result.cz),
    props:result.data.count,metrics:result.metrics}));
  window.qaStats={seed,current,spatial,checks:{transferLengths:true,terrainSeam:true}};window.qaReady=true;
  status.textContent=JSON.stringify(window.qaStats,null,2);
}catch(error){window.qaError=String(error.stack??error);status.textContent=window.qaError;}
</script></body></html>

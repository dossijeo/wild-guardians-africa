<!doctype html><html><head><meta charset="utf-8"><title>Worker physics pause pacing</title></head><body><script type="module">
import {createSimulationPacer} from '../../tools/trees/prototype_simulation_pacer.mjs';import {createGamePhysics} from './mobility-game-physics-core.js';
window.runPacerPause=async()=>{
 const worker=new Worker('./mobility-game-pacer-worker.js',{type:'module'}),ready=new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=e=>e.data.kind==='ready'?resolve(e.data):e.data.kind==='error'?reject(Error(e.data.error)):null;}),samples=[];let timer=null,pausedAt=null,pauseTarget=null,pauseFinished=null,ackAt=null,finishedAt=null,firstSentAt=null,lastState=null,reference,fail=null;
 try{
  const info=await ready,pacer=createSimulationPacer('pacer-test',{stepSeconds:1/60,maxBacklogSteps:120,initialTime:info.initialTime});let finishResolve,finishReject;const done=new Promise((a,b)=>{finishResolve=a;finishReject=b;}),start=performance.now();pacer.inspect(start);
  const schedule=()=>{if(fail)return;const now=performance.now(),state=pacer.inspect(now);if(state.completed>=30){finishedAt=now;finishResolve();return;}const request=pacer.request(now);if(request.accepted){if(request.sequence===1){firstSentAt=performance.now();setTimeout(()=>{try{pausedAt=performance.now();pacer.pause(pausedAt);pauseTarget=pacer.inspect(pausedAt).targetSteps;}catch(e){fail=e;finishReject(e);}},5);}worker.postMessage({kind:'step',sequence:request.sequence,final:request.sequence===30});}else if(request.reason==='not-due'){timer=setTimeout(schedule,Math.max(1,Math.ceil(pacer.inspect(performance.now()).nextDelayMs)));}else if(request.reason!=='paused'&&request.reason!=='busy'){fail=Error('Pacer rejected '+request.reason);finishReject(fail);}};
  worker.onerror=e=>{fail=Error(e.message);finishReject(fail);};worker.onmessage=async e=>{try{const d=e.data;if(d.kind==='error')throw Error(d.error);if(d.kind!=='result')throw Error('Invalid response');const ack=pacer.acknowledge({session:'pacer-test',sequence:d.sequence,completed:true,simulationTime:d.simulationTime});if(!ack.accepted)throw Error('Invalid acknowledgment');samples.push(d.result.sample);if(d.state)lastState=d.state;if(d.sequence===1){ackAt=performance.now();if(pausedAt===null||!pacer.inspect(ackAt).paused)throw Error('First step finished before pause');await new Promise(resolve=>setTimeout(resolve,120));pauseFinished=performance.now();const still=pacer.inspect(pauseFinished);if(still.targetSteps!==pauseTarget||still.completed!==1||!still.paused||pacer.request(pauseFinished).reason!=='paused')throw Error('Clock advanced during pause');pacer.setRate(pauseFinished,2);pacer.resume(pauseFinished);}schedule();}catch(error){fail=error;finishReject(error);}};
  schedule();await Promise.race([done,new Promise((_,reject)=>setTimeout(()=>reject(Error('Pacer timeout')),30000))]);if(!lastState||samples.length!==30||pausedAt===null||ackAt<pausedAt)throw Error('Incomplete run');
  reference=await createGamePhysics({originalClips:true,initialAnimation:true,referenceRig:true});const expected=[];for(let i=0;i<30;i++)expected.push(reference.step().sample);const expectedState=reference.state();if(JSON.stringify(samples)!==JSON.stringify(expected)||lastState.snapshot!==expectedState.snapshot||JSON.stringify(lastState.events)!==JSON.stringify(expectedState.events))throw Error('Pause/resume changed simulation');
  return {steps:samples.length,pausedDuringFirstStep:true,pauseTargetSteps:pauseTarget,ackDelayMs:ackAt-pausedAt,pauseWallMs:pauseFinished-pausedAt,firstStepResponseMs:ackAt-firstSentAt,completedAfterPause:1,simulationEqual:true,rateAfterResume:2,totalWallMs:finishedAt-start,finalPacer:pacer.inspect(finishedAt)};
 }finally{if(timer!==null)clearTimeout(timer);reference?.dispose();worker.terminate();}
};window.ready=true;
</script></body></html>

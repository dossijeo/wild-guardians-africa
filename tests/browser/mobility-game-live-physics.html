<!doctype html><html><head><meta charset="utf-8"><title>Worker physics presentation pacing</title></head><body><canvas id="view"></canvas><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {ANIMAL_ACTIONS} from '../../src/simulation/animal-actions-data.js';import {prepareAnimalModel} from '../../src/rendering/animal-actions.js';import {createGamePhysics} from './mobility-game-physics-core.js';import {GpuTimer} from './gpu-timer.js';
const pct=(x,p)=>{const a=[...x].sort((a,b)=>a-b);return a.length?a[Math.floor((a.length-1)*p)]:null;};const stat=x=>({count:x.length,p95:pct(x,.95),p99:pct(x,.99),max:x.length?Math.max(...x):null});
window.runLivePhysics=async mode=>{
 if(!['main','worker'].includes(mode))throw Error('Invalid mode');let session,worker,packet=null,failure=null,busy=false,sent=0,completed=0,sentAt=0,packetReceivedAt=0,latestState=null;const delays=[],delivery=[],presentationDelay=[],tickTimes=[],applyTimes=[],workerTimes=[],bytes=[],samples=[];
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('#view'),antialias:false,alpha:true});renderer.setSize(512,512,false);renderer.setPixelRatio(1);renderer.setClearColor(0,0);const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x555555,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(1,5,4);scene.add(light);const camera=new T.PerspectiveCamera(40,1,.1,100),raf=()=>new Promise(requestAnimationFrame);let root,model,bones;
 const apply=packet=>{const start=performance.now(),transform=(node,v)=>{if(v.length!==10||!v.every(Number.isFinite))throw Error('Invalid transform');node.position.fromArray(v,0);node.quaternion.fromArray(v,3);node.scale.fromArray(v,7);};transform(root,packet.root);transform(model,packet.model);if(packet.bones.length!==bones.length)throw Error('Invalid bones');for(let i=0;i<bones.length;i++){if(bones[i].name!==packet.bones[i].name)throw Error('Bone order');transform(bones[i],packet.bones[i].transform);}root.updateMatrixWorld(true);applyTimes.push(performance.now()-start);};
 try{
  if(mode==='main'){session=await createGamePhysics({originalClips:true,initialAnimation:true,referenceRig:true});({root,model,bones}=session.visualRig());}
  else{
   const init=performance.now();worker=new Worker('./mobility-game-live-physics-worker.js',{type:'module'});const ready=new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=e=>e.data.kind==='ready'?resolve(e.data):e.data.kind==='error'?reject(Error(e.data.error)):null;});const [gltf,info]=await Promise.all([new GLTFLoader().loadAsync(ANIMAL_ACTIONS.animals.hyena.url),ready]);root=new T.Group();model=prepareAnimalModel(gltf.scene,'hyena');root.add(model);bones=[];model.traverse(n=>{if(n.isBone)bones.push(n);});apply(info.pose);worker.onerror=e=>failure=e.message;worker.onmessage=e=>{if(e.data.kind==='error'){failure=e.data.error;return;}if(e.data.kind!=='result'||!busy||e.data.sequence!==completed+1){failure='Invalid result sequence';return;}packetReceivedAt=performance.now();packet=e.data;};
  }
  scene.add(root);root.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});root.updateMatrixWorld(true);camera.position.set(root.position.x+5,root.position.y+3,root.position.z+6);camera.lookAt(root.position.x,root.position.y+1,root.position.z);const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info'),timer=new GpuTimer(gl,64);const frames=[],draw=[],overlaps=[];let previous=null,startedAt=null,finishedAt=null,frame=0;
  for(let i=0;i<20;i++){await raf();renderer.render(scene,camera);}
  const limit=performance.now()+30000;while(finishedAt===null||performance.now()-finishedAt<500){
   const now=await raf();if(failure)throw Error(failure);if(performance.now()>limit)throw Error('Presentation timeout');if(previous!==null){frames.push(now-previous);if(busy)overlaps.push(now-previous);}previous=now;
   if(packet){const receivedAt=performance.now(),value=packet;packet=null;busy=false;completed++;delays.push(receivedAt-sentAt);delivery.push(packetReceivedAt-sentAt);presentationDelay.push(receivedAt-packetReceivedAt);tickTimes.push(value.result.tickMs);workerTimes.push(value.computeMs);bytes.push(new TextEncoder().encode(JSON.stringify(value.pose)).length);samples.push(value.result.sample);apply(value.pose);if(value.state)latestState=value.state;if(completed===120)finishedAt=performance.now();}
   if(completed<120&&!busy){if(startedAt===null)startedAt=performance.now();sent++;sentAt=performance.now();if(mode==='main'){const value=session.step();completed++;samples.push(value.sample);tickTimes.push(value.tickMs);delays.push(performance.now()-sentAt);if(completed===120){latestState=session.state();finishedAt=performance.now();}}else{busy=true;worker.postMessage({kind:'step',sequence:sent,final:sent===120});}}
   const start=performance.now(),timed=timer.begin(frame++);renderer.render(scene,camera);if(timed)timer.end();draw.push(performance.now()-start);
  }
  for(let i=0;i<30&&timer.pending.length;i++){await raf();timer.poll();}const gpu=timer.report();timer.dispose();if(!latestState||completed!==120||sent!==120)throw Error('Incomplete simulation');
  return {mode,renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),samples,snapshot:latestState.snapshot,events:latestState.events,phases:latestState.phases,network:latestState.network,frames:stat(frames),overlap:stat(overlaps),renderMs:stat(draw),responseMs:stat(delays),deliveryMs:stat(delivery),presentationDelayMs:stat(presentationDelay),tickMs:stat(tickTimes),workerComputeMs:stat(workerTimes),poseApplyMs:stat(applyTimes.slice(1)),poseJsonBytes:stat(bytes),gpu:{reason:gpu.reason,samples:gpu.samples.length,p95:pct(gpu.samples.map(s=>s.ms),.95),p99:pct(gpu.samples.map(s=>s.ms),.99),disjoint:gpu.disjointEvents,discarded:gpu.discarded},elapsedMs:finishedAt-startedAt,framesDuringWork:frames.length,steps:completed};
 }finally{worker?.terminate();session?.dispose();renderer.dispose();}
};
window.ready=true;
</script></body></html>

<!doctype html><html><body><script type="module">
import {createProjectionReceiver} from './mobility-delta-prototype.js';
window.audit=async intervals=>{const worker=new Worker('./mobility-cadence-ack-worker.js',{type:'module'}),rx=createProjectionReceiver('s'),projections=[],samples=[];try{await new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=({data})=>data.kind==='ready'?resolve():data.kind==='error'?reject(Error(data.message)):null;});let lastEvent=0,ack=0,snapshot=null,duplicates=0;for(let i=0;i<intervals.length;i++){const start=performance.now(),d=await new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=({data})=>data.kind==='error'?reject(Error(data.message)):resolve(data);worker.postMessage({kind:'advance',sequence:i+1,seconds:intervals[i],ack,final:i===intervals.length-1});});const prior=rx.state().events.length,result=rx.accept(d.packet);if(!result.accepted)throw Error(`Packet ${i+1}: ${result.reason}`);const state=rx.state(),fresh=state.events.slice(prior).map(e=>e.event);duplicates+=d.packet.events.length-fresh.length;projections.push({...state.state,firstEvent:lastEvent,events:fresh});lastEvent=result.lastEvent;if(i>=1)ack=lastEvent;if(d.snapshot)snapshot=d.snapshot;samples.push({sequence:d.sequence,workMs:d.workMs,publishMs:d.publishMs,delayMs:performance.now()-start,pending:d.pending,fresh:fresh.length});}const hash=async x=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x))),n=>n.toString(16).padStart(2,'0')).join('');return {eventCount:lastEvent,duplicates,projectionHash:await hash(JSON.stringify(projections)),snapshotHash:await hash(snapshot),samples,scope:'Single-in-flight publisher with one deliberately delayed event acknowledgment; no lost messages, retry timeout, recovery, game scene, Rapier or rendering.'};}finally{worker.terminate();}};window.ready=true;
</script></body></html>

<!doctype html><html><body><canvas id="view" width="128" height="128"></canvas><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';import {advanceReal} from '../../src/simulation/game.js';
window.audit=async()=>{const intervals=[.011,.017,.031,.008,.025,.016,.013,.029,.012,.019,.015,.022],commands=intervals.map(seconds=>({kind:'advance',seconds}));commands.splice(4,0,{kind:'pause'},{kind:'advance',seconds:.05},{kind:'resume'});const worker=new Worker('./mobility-real-cadence-worker.js',{type:'module'}),gl=document.querySelector('canvas').getContext('webgl2'),times=[],samples=[];let active=true,frame=0,reply,failed;const render=t=>{if(!active)return;times.push(t);gl.clearColor((frame++%255)/255,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);requestAnimationFrame(render);};requestAnimationFrame(render);
try{await new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=({data})=>data.kind==='ready'?resolve():data.kind==='error'?reject(Error(data.message)):null;});const snapshots=[];worker.onmessage=({data})=>{if(data.kind==='error'){failed?.(Error(data.message));return;}reply?.(data);};for(let i=0;i<commands.length;i++){const sent=performance.now(),result=await new Promise((resolve,reject)=>{reply=resolve;failed=reject;worker.postMessage({...commands[i],sequence:i+1});});if(result.sequence!==i+1)throw Error('Sequence mismatch');snapshots.push(result.snapshot);samples.push({kind:commands[i].kind,workMs:result.workMs,responseMs:performance.now()-sent,elapsed:result.elapsed,pauses:result.pauses});}active=false;const workerFrameTimes=times.slice();const reference=await createSimulation({mangrove:true});try{const {game,nav}=reference.diagnosticWorld();for(let i=0;i<commands.length;i++){const c=commands[i];if(c.kind==='advance'){advanceReal(game,c.seconds,nav);nav.serviceRaidConnectivityDemand?.();}else if(c.kind==='pause')reference.pause('diagnostic');else reference.resume('diagnostic');if(reference.state().snapshot!==snapshots[i])throw Error(`Snapshot mismatch at ${i+1}`);}}finally{reference.dispose();}const differences=workerFrameTimes.slice(1).map((t,i)=>t-workerFrameTimes[i]);return {samples,frames:differences.length,maxFrameMs:differences.length?Math.max(...differences):null,scope:'Ordered advanceReal intervals and diagnostic pause, Worker owns converted mangrove fixture with synthetic chunks. Reference uses same intervals, full serialized state checked after each command. Minimal WebGL canvas, no physics manager, game scene, input or safe visual horizon.'};}finally{active=false;worker.terminate();}};window.ready=true;
</script></body></html>

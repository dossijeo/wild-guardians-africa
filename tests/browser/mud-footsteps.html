<!doctype html><html lang="en"><meta charset="utf-8"><title>QA · Authored mud contacts</title><style>body{font:16px system-ui;background:#172c22;color:#eee;padding:20px}button{padding:12px}canvas{display:block;background:#7f985f;margin:16px 0}pre{font:12px monospace;max-height:240px;overflow:auto}</style>
<p>Original mangrove mud geometry and exact contact points of the four native worker gaits. Declared two-step movement setup; no paid calendar or 3D world. Original grass/mud MP3s, predecoded and muted.</p><button id="run">Test mud and moss contacts</button><output id="status">Ready</output><canvas id="map" width="480" height="480"></canvas><pre id="report"></pre>
<script type="module">
import {TerrainField} from '../../src/world/terrain.js';import {mudPatchGeometry,residentMudSurface} from '../../src/rendering/mud-patches.js';import {FOOTSTEPS} from '../../src/rendering/footsteps-data.js';import {AudioSystem} from '../../src/audio/audio.js';
const field=new TerrainField({seed:'712',biome:'mangrove',river:true,relief:1}),g=mudPatchGeometry(field,0,0),chunks=new Map([['0,0',{userData:{mudSurface:g.userData}}]]),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),report=document.querySelector('#report'),accepted=[],results=[],errors=[];let audio,state;const assert=(v,m)=>{if(!v)throw Error(m);},flush=()=>new Promise(done=>setTimeout(done,0));
function paint(){ctx.clearRect(0,0,480,480);ctx.fillStyle='#6b4e37';const p=g.attributes.position;for(let i=0;i<p.count;i+=3){ctx.beginPath();for(let j=0;j<3;j++){const x=(p.getX(i+j)+24)*10,z=(p.getZ(i+j)+24)*10;if(j===0)ctx.moveTo(x,z);else ctx.lineTo(x,z);}ctx.closePath();ctx.fill();}for(const result of results){ctx.fillStyle=result.expected==='step_mud'?'#ffe39d':'#d3ffff';ctx.beginPath();ctx.arc((result.contact[0]+24)*10,(result.contact[1]+24)*10,3,0,Math.PI*2);ctx.fill();}}
paint();addEventListener('pagehide',()=>{audio?.dispose();g.dispose();});addEventListener('error',e=>errors.push(String(e.error??e.message)));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 audio=new AudioSystem({sfx:0,music:0});await audio.unlock();audio.sfx=await audio.sfxBank();const decoded={};for(const id of ['step_mud','step_grass']){const item=audio.sfx.items.find(i=>i.id===id);decoded[id]=await audio.buffer(item.audio.url);}const original=audio.sound.bind(audio);
 audio.sound=async(id,o)=>{const source=await original(id,o);if(source){assert(source.buffer===decoded[id]&&source.playbackRate.value===1&&!source.loop,'Original changed');accepted.push({id,emitter:audio.voices.get(source).emitter,rate:source.playbackRate.value,channels:source.buffer.numberOfChannels,sampleRate:source.buffer.sampleRate});}return source;};
 const center=g.userData.mudCenters[0];let moss=[0,0];while(residentMudSurface(chunks,...moss))moss[0]++;
 for(const profile of ['youngMale','youngFemale','olderMale','olderFemale'])for(const [expected,point] of [['step_mud',[center.x,center.z]],['step_grass',moss]]){
  audio.stop();const clip=FOOTSTEPS.sources[profile].clips.Walk_Skip,step=clip.contacts[0],actor={id:profile,profile,x:point[0]-step.point[0]-.03,z:point[1]-step.point[1],status:'walking',walkPhase:step.time-.04},queries=[];state={elapsed:0,biome:'manglares',pauses:[],workers:[actor]};audio.updateMovement(state,{surfaceAt:(x,z)=>residentMudSurface(chunks,x,z)});actor.x+=.06;actor.walkPhase=step.time+.04;state.elapsed=.08;const before=JSON.stringify(state),n=accepted.length;audio.updateMovement(state,{surfaceAt:(x,z)=>{queries.push([x,z]);return residentMudSurface(chunks,x,z);}});await flush();assert(JSON.stringify(state)===before,'Audio changes state');assert(accepted.length===n+1&&accepted.at(-1).id===expected,'Incorrect surface contact');assert(Math.hypot(queries[0][0]-point[0],queries[0][1]-point[1])<1e-8,'Body used instead of toe');results.push({profile,expected,contact:queries[0],source:accepted.at(-1)});
 }
 audio.stop();assert(audio.active.length===0,'Unreleased voices');audio.dispose();await new Promise(done=>setTimeout(done,80));assert(audio.context.state==='closed','Context open');assert(!errors.length,'Browser errors');paint();report.textContent=JSON.stringify({results,accepted,errors,context:audio.context.state,finalVoices:audio.active.length,muted:true,predecoded:true,world3D:false,declaredMovementSetup:true},null,2);status.textContent='Completed · 8 original contacts on actual mud and moss';
 }catch(e){errors.push(String(e));status.textContent='FAIL: '+e.message;report.textContent=JSON.stringify({results,accepted,errors},null,2);audio?.dispose();}};
</script></html>

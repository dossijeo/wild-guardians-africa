<!doctype html><html lang="es"><meta charset="utf-8"><title>QA evolución musical nativa</title>
<style>body{background:#18231e;color:#edf3dc;font:16px system-ui;padding:24px}button{padding:12px;margin:4px}pre{white-space:pre-wrap;font-size:13px}</style>
<h1>Evolución y arreglos temporales A/B</h1><p>WebAudio real silenciado; cadence original 16 compases. No modifica partidas.</p>
<button id="a">Cargar A</button><button id="b">Cargar B</button><button id="success">Éxito</button><button id="failure">Fracaso</button><button id="stop">Parar</button>
<p id="status">Preparado</p><p id="summary"></p><pre id="report"></pre>
<script type="module">
import {AudioSystem} from '/src/audio/audio.js';
import {musicEventLevels} from '/src/audio/music-policy.js';
const audio=new AudioSystem({sfx:0,music:0}),state={time:100,raid:null},history=[],errors=[];
let timer,lastAuto=null,eventId=0,pendingCapture=null;
const report=document.querySelector('#report'),status=document.querySelector('#status');
function gains(){const mixer=audio.mixer;return mixer?mixer.bank.tracks.map(t=>({id:t.id,logical:mixer.value(t.id,audio.context.currentTime),actual:[...mixer.voices.get(t.id)].map(g=>g.value)})):[];}
function snapshot(){return {pack:audio.pack??null,clock:audio.context?.currentTime??0,active:audio.active.length,musicActive:[...audio.voices.values()].filter(v=>v.music).length,sfxActive:[...audio.voices.values()].filter(v=>!v.music).length,rates:audio.active.map(s=>s.playbackRate.value),decks:audio.transport?.decks.length??0,scene:audio.mixer?.scene??null,event:audio.mixer?.event?{kind:audio.mixer.event.kind,at:audio.mixer.event.at}:null,lastAuto:audio.mixer?.lastAutoId??null,nextAuto:audio.mixer?.nextAuto??null,pending:audio.mixer?.pending??[],gains:gains(),history,errors};}
function paint(){
 audio.updateMusic(state);const m=audio.mixer,now=audio.context?.currentTime??0;
 if(m&&m.lastAutoId!==lastAuto){history.push({kind:'evolution',at:now,id:m.lastAutoId,pending:m.pending.map(p=>({...p})),active:audio.active.length,rates:audio.active.map(s=>s.playbackRate.value)});lastAuto=m.lastAutoId;}
 if(pendingCapture&&now>=pendingCapture.at){history.push({...pendingCapture,observed:now,active:audio.active.length,gains:gains(),pending:m.pending.map(p=>({...p})),event:m.event?.kind??null});pendingCapture=null;}
 const data=snapshot();document.querySelector('#summary').textContent=`Pack ${data.pack??'—'} · música ${data.musicActive} · SFX ${data.sfxActive} · evolución ${data.lastAuto??'pendiente'} · evento ${data.event?.kind??'ninguno'} · errores ${errors.length}`;
 report.textContent=JSON.stringify(data,null,2);
}
async function load(day){status.textContent='Cargando';try{await audio.unlock();await audio.gameplay(day);history.length=0;lastAuto=null;pendingCapture=null;history.push({kind:'load',pack:audio.pack,at:audio.context.currentTime,active:audio.active.length,initial:gains()});clearInterval(timer);timer=setInterval(paint,100);status.textContent='Listo';paint();}catch(e){errors.push(e.message);status.textContent='Error';paint();}}
for(const [id,day] of [['a',1],['b',2]])document.querySelector('#'+id).onclick=()=>load(day);
for(const kind of ['success','failure'])document.querySelector('#'+kind).onclick=()=>{if(!audio.mixer)return;const now=audio.context.currentTime,saved=[...audio.mixer.levels];audio.process([{id:'qa-result-'+(++eventId),type:kind==='success'?'CampaignWon':'GameOver'}]);paint();history.push({kind,at:now,saved,expected:musicEventLevels(audio.pack,kind),returnsAt:audio.mixer.event.at});pendingCapture={kind:'event-settled',at:now+3,expected:musicEventLevels(audio.pack,kind)};paint();};
document.querySelector('#stop').onclick=()=>{audio.stop();clearInterval(timer);status.textContent='Parado';history.push({kind:'stop',active:audio.active.length,voices:audio.voices.size});paint();};
window.addEventListener('pagehide',()=>{clearInterval(timer);audio.dispose();});
</script></html>

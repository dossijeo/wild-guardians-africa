<!doctype html><html><head><meta charset="utf-8"><title>Worker physics pose rendering</title></head><body><canvas id="view"></canvas><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {ANIMAL_ACTIONS} from '../../src/simulation/animal-actions-data.js';
import {prepareAnimalModel} from '../../src/rendering/animal-actions.js';
import {createGamePhysics} from './mobility-game-physics-core.js';
try{
 const worker=new Worker('./mobility-game-render-worker.js',{type:'module'}),ready=new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=e=>e.data.kind==='ready'?resolve():e.data.kind==='error'?reject(Error(e.data.error)):null;});
 const [local,gltf]=await Promise.all([createGamePhysics({originalClips:true,initialAnimation:true,traceBones:true,referenceRig:true}),new GLTFLoader().loadAsync(ANIMAL_ACTIONS.animals.hyena.url),ready]);
 const source=local.visualRig(),copy=new T.Group(),model=prepareAnimalModel(gltf.scene,'hyena');copy.add(model);const bones=[];model.traverse(n=>{if(n.isBone)bones.push(n);});if(bones.length!==source.bones.length)throw Error('Bone count mismatch');
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('#view'),antialias:false,alpha:true});renderer.setSize(256,256,false);renderer.setClearColor(0,0);const scene=new T.Scene(),camera=new T.PerspectiveCamera(40,1,.1,100),target=new T.WebGLRenderTarget(256,256),pixels=new Uint8Array(256*256*4);scene.add(new T.HemisphereLight(0xffffff,0x555555,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(1,5,4);scene.add(light,source.root,copy);source.root.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});copy.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});
 const apply=(node,v)=>{if(v.length!==10||!v.every(Number.isFinite))throw Error('Invalid pose');node.position.fromArray(v,0);node.quaternion.fromArray(v,3);node.scale.fromArray(v,7);};
 const pose=packet=>{apply(copy,packet.root);apply(model,packet.model);if(packet.bones.length!==bones.length)throw Error('Bone count changed');for(let i=0;i<bones.length;i++){if(bones[i].name!==packet.bones[i].name)throw Error('Bone order mismatch');apply(bones[i],packet.bones[i].transform);}copy.updateMatrixWorld(true);};
 const capture=()=>{scene.updateMatrixWorld(true);for(const o of [source.root,copy])o.traverse(m=>{if(m.isSkinnedMesh)m.skeleton.update();});renderer.setRenderTarget(target);renderer.clear();renderer.render(scene,camera);renderer.readRenderTargetPixels(target,0,0,256,256,pixels);renderer.setRenderTarget(null);return new Uint8Array(pixels);};
 const diff=(a,b)=>{let changed=0,max=0,visible=0;for(let i=0;i<a.length;i+=4){if(a[i+3])visible++;let d=0;for(let c=0;c<4;c++)d=Math.max(d,Math.abs(a[i+c]-b[i+c]));if(d)changed++;max=Math.max(max,d);}return {changed,max,visible};};
 const request=count=>new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=e=>e.data.kind==='result'?resolve(e.data):e.data.kind==='error'?reject(Error(e.data.error)):null;worker.postMessage({kind:'step',count});});
 const samples=[],steps=[1,30,60,120,300,500,600,630,650,700,900];let previous=0;
 try{for(const end of steps){const pending=request(end-previous);let result;for(let i=previous;i<end;i++)result=local.step();const remote=await pending;if(result.sample!==remote.result.sample)throw Error('State/pose mismatch at '+end);pose(remote.pose);const p=source.root.position;camera.position.set(p.x+5,p.y+3,p.z+6);camera.lookAt(p.x,p.y+1,p.z);camera.updateProjectionMatrix();source.root.visible=true;copy.visible=false;const a=capture(),a2=capture();source.root.visible=false;copy.visible=true;const b=capture();const control=diff(a,a2),comparison=diff(a,b);if(!comparison.visible||comparison.changed>20||comparison.max>4||control.changed>20||control.max>4)throw Error('Visible image parity failed '+JSON.stringify({end,control,comparison}));samples.push({step:end,phase:JSON.parse(result.sample).magicDown?.phase??'released',control,comparison});previous=end;}
 if(!samples.some(sample=>sample.phase==='recovering'))throw Error('Recovery pose was not sampled');
 window.auditResult={samples,renderer:renderer.getContext().getParameter(renderer.getContext().getExtension('WEBGL_debug_renderer_info')?.UNMASKED_RENDERER_WEBGL??renderer.getContext().RENDERER),boneCount:bones.length};
 }finally{worker.terminate();local.dispose();target.dispose();renderer.dispose();}
}catch(error){window.auditError=String(error?.stack??error);}
</script></body></html>

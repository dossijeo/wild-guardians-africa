<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Impactos por material</title><style>body{margin:0;font:14px system-ui}header{position:absolute;z-index:2;padding:12px;background:#fff9ed}button,select{padding:8px;margin:4px}canvas{display:block;width:100vw;height:100vh}</style><header>Ensayo de presentación: centro y muro pagados, ataque comprometido preparado explícitamente. No acredita una incursión natural.<br><label>Material <select id="material"><option value="empalizada">Empalizada</option><option value="adobe">Adobe</option><option value="piedra">Piedra</option><option value="zarzas">Zarzas</option><option value="reforzado">Reforzado</option></select></label><button id="hit">Completar un golpe lógico</button><button id="step">Avanzar 0,1 s</button><button id="reload">Recargar en memoria</button><button id="fade">Disipar cuatro segundos</button><div id="status">Cargando…</div></header><canvas id="world" aria-label="Muro y restos originales tras un único golpe"></canvas><script type="module">
import * as Game from '../../src/simulation/game.js';
import {Navigation} from '../../src/world/navigation.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {reachableApproach} from '../../src/simulation/raids.js';
import {ANIMAL_ACTIONS} from '../../src/simulation/animal-actions-data.js';
import {WorldScene} from '../../src/rendering/scene.js';
import {json} from '../../src/rendering/assets.js';
import {serialize,deserialize} from '../../src/persistence/snapshots.js';
const pack=await json('/content/biome-savanna.json'),villages=await json('/content/villages.json'),payload=villages.find(v=>v.id==='suajili'),nav=new Navigation(712,'sabana',pack.profile),location=await findInitialLocationAsync(nav,payload);
let state,world,wall,error='';
async function reset(){world?.dispose();world=null;state=Game.newGame({seed:712,culture:'suajili'});Object.assign(state.villages[0],location);state.suppressed.push(...location.suppress);nav.setState(state);Game.resume(state,'intro');Game.placeStructure(state,'center',{x:location.center.x,z:location.center.z},nav);const center=state.structures[0];let site;
 for(let z=-6;z<=6&&!site;z+=1.5)for(let x=4.5;x<12&&!site;x+=1.5){const p={x:center.x+x,z:center.z+z};if(nav.placement(p.x,p.z,.8).valid)site=p;}
 Game.placeStructure(state,'wall',{kind:'wall',material:document.querySelector('#material').value,...site,yaw:.35},nav);wall=state.structures[1];state.day=2;state.time=320;state.initialPreparation=false;state.tutorial.step='done';
 const radius=ANIMAL_ACTIONS.animals.warthog.presentation.footprint.radius,approach=reachableApproach({x:wall.x,z:wall.z+8,radius},wall,nav),duration=ANIMAL_ACTIONS.animals.warthog.clips.Right_Hand_Sword_Slash.duration;
 if(!approach)throw Error('No hay aproximación válida para el ensayo');
 const animal={id:'qa-animal',species:'warthog',...approach.point,radius,spawn:{x:wall.x,z:wall.z+8},heading:Math.atan2(wall.x-approach.point.x,wall.z-approach.point.z),hitsRemaining:1,status:'attacking',targetId:wall.id,reservation:'structure:'+wall.id,animation:'Right_Hand_Sword_Slash',attackId:'qa-attack',attackDuration:duration,attackRemaining:duration,hitApplied:false};animal.id='qa-animal';state.raid={id:'qa-raid',encounters:[],reservations:{[animal.reservation]:animal.id},animals:[animal]};Game.pause(state,'qa');
 world=new WorldScene(document.querySelector('#world'),()=>{});world.onError=e=>{error=e.message;status();};await world.load(state,nav,payload);const y=nav.field.surface(wall.x,wall.z);world.controls.target.set(wall.x,y+.8,wall.z);world.camera.position.set(wall.x+6,y+3.6,wall.z+2.5);world.controls.update();world.render(0);status();}
function status(){if(!world?.materialVfx)return;document.querySelector('#status').textContent=`${wall.material} · saldo ${state.ledger.balance.n} · muro ${wall.hp}/${wall.maxHp} PV · golpes ${state.events.filter(e=>e.type==='AnimalLogicalHit').length} · restos ${[...world.materialVfx.effects.values()].map(e=>e.native.definition.id+' '+e.native.time.toFixed(2)+' s / '+e.native.rigids.length+' sólidos').join(', ')||'ninguno'}${error?' · '+error:''}`;}
function advance(dt){Game.resume(state,'qa');Game.tick(state,dt,nav);Game.pause(state,'qa');world.render(0);status();}
document.querySelector('#material').onchange=reset;document.querySelector('#hit').onclick=()=>advance(state.raid?.animals[0].attackRemaining??0);document.querySelector('#step').onclick=()=>advance(.1);document.querySelector('#fade').onclick=()=>advance(4);document.querySelector('#reload').onclick=()=>{state=deserialize(serialize(state));nav.setState(state);wall=state.structures[1];world.state=state;world.simElapsed=state.elapsed;world.render(0);status();};
await reset();function frame(){if(world?.materialVfx){world.render(0);status();}requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('pagehide',()=>world?.dispose());
</script></html>

<!doctype html><html><head><meta charset="utf-8"><title>Ordered game pause in Worker</title></head><body><script type="module">
import {createSimulationPacer} from '../../tools/trees/prototype_simulation_pacer.mjs';import {createGamePhysics} from './mobility-game-physics-core.js';
window.runOrderedPause=async()=>{
 const worker=new Worker('./mobility-game-pacer-ordered-worker.js',{type:'module'}),ready=new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=e=>e.data.kind==='ready'?resolve(e.data):e.data.kind==='error'?reject(Error(e.data.error)):null;}),samples=[];let timer=null,reference,fail=null,command=0,lastReply=0,pausedAt=null,pauseTarget=null,tickAckAt=null,pauseAckAt=null,pauseTime=null,resumeAt=null,finishedAt=null,lastState=null,probeRejected=false,pauseCommand=null,probeCommand=null,resumeCommand=null;
 try{
  const info=await ready,pacer=createSimulationPacer('pacer-test',{stepSeconds:1/60,maxBacklogSteps:120,initialTime:info.initialTime});let finishResolve,finishReject;const done=new Promise((a,b)=>{finishResolve=a;finishReject=b;}),start=performance.now();pacer.inspect(start);
  const send=(kind,extra={})=>{const current=++command;worker.postMessage({session:info.session,command:current,kind,...extra});return current;};
  const schedule=()=>{if(fail)return;const now=performance.now(),state=pacer.inspect(now);if(state.completed>=30){finishedAt=now;finishResolve();return;}const request=pacer.request(now);if(request.accepted){send('step',{sequence:request.sequence,final:request.sequence===30});if(request.sequence===1)setTimeout(()=>{try{pausedAt=performance.now();pacer.pause(pausedAt);pauseTarget=pacer.inspect(pausedAt).targetSteps;pauseCommand=send('pause');}catch(error){fail=error;finishReject(error);}},5);}else if(request.reason==='not-due'){timer=setTimeout(schedule,Math.max(1,Math.ceil(pacer.inspect(performance.now()).nextDelayMs)));}else if(!['paused','busy'].includes(request.reason)){fail=Error('Pacer rejected '+request.reason);finishReject(fail);}};
  worker.onerror=e=>{fail=Error(e.message);finishReject(fail);};worker.onmessage=e=>{try{const d=e.data;if(d.kind==='error')throw Error(d.error);if(d.session!==info.session||d.command!==lastReply+1)throw Error('Invalid response order');lastReply=d.command;
   if(d.kind==='result'){const ack=pacer.acknowledge({session:'pacer-test',sequence:d.sequence,completed:true,simulationTime:d.simulationTime});if(!ack.accepted)throw Error('Invalid acknowledgment');samples.push(d.result.sample);if(d.state)lastState=d.state;if(d.sequence===1){tickAckAt=performance.now();if(pausedAt===null||!pacer.inspect(tickAckAt).paused)throw Error('First step finished before pause');}else schedule();}
   else if(d.kind==='pause-ack'){pauseAckAt=performance.now();if(d.command!==pauseCommand||!d.pauses.includes('diagnostic')||pacer.inspect(pauseAckAt).completed!==1)throw Error('Pause not confirmed');pauseTime=d.time;probeCommand=send('step',{sequence:2});}
   else if(d.kind==='rejected'){if(d.command!==probeCommand||d.reason!=='paused'||d.time!==pauseTime)throw Error('Paused step not rejected');probeRejected=true;setTimeout(()=>{try{const now=performance.now(),state=pacer.inspect(now);if(state.targetSteps!==pauseTarget||state.completed!==1||!state.paused||pacer.request(now).reason!=='paused')throw Error('Clock advanced while paused');pacer.setRate(now,2);resumeCommand=send('resume');}catch(error){fail=error;finishReject(error);}},120);}
   else if(d.kind==='resume-ack'){resumeAt=performance.now();if(d.command!==resumeCommand||d.pauses.includes('diagnostic')||d.time!==pauseTime)throw Error('Resume mismatch');pacer.resume(resumeAt);schedule();}else throw Error('Unexpected response');
  }catch(error){fail=error;finishReject(error);}};
  schedule();await Promise.race([done,new Promise((_,reject)=>setTimeout(()=>reject(Error('Pacer timeout')),30000))]);if(!lastState||samples.length!==30||!probeRejected||pauseAckAt<tickAckAt||resumeAt<pauseAckAt)throw Error('Incomplete run');
  reference=await createGamePhysics({originalClips:true,initialAnimation:true,referenceRig:true});const expected=[];for(let i=0;i<30;i++)expected.push(reference.step().sample);const expectedState=reference.state();if(JSON.stringify(samples)!==JSON.stringify(expected)||lastState.snapshot!==expectedState.snapshot||JSON.stringify(lastState.events)!==JSON.stringify(expectedState.events))throw Error('Pause/resume changed simulation');
  return {steps:samples.length,pauseTargetSteps:pauseTarget,pauseRequestToTickMs:tickAckAt-pausedAt,pauseRequestToGameAckMs:pauseAckAt-pausedAt,pausedTime:pauseTime,probeRejected,confirmedPause:true,resumed:true,rateAfterResume:2,simulationEqual:true,totalWallMs:finishedAt-start,finalPacer:pacer.inspect(finishedAt),commands:command};
 }finally{if(timer!==null)clearTimeout(timer);reference?.dispose();worker.terminate();}
};window.ready=true;
</script></body></html>

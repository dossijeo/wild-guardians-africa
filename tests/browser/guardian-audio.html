<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Presencia sonora del Espíritu original</title>
<style>body{font-family:system-ui;margin:20px;background:#e8eddb}header{position:relative;z-index:30}button{padding:10px;margin:8px}pre{font-size:12px;max-height:60vh;overflow:auto}</style>
<header><p>Retrato, malla, ocho gestos y transiciones del Guardian V8 real. Audio original silenciado; no mundo 3D ni partida.</p><button id="run">Probar entrada del Espíritu</button><button id="finish" hidden>Probar gestos y salida completa</button><output id="status">Lista</output><pre id="report"></pre></header><div id="guardian"></div>
<script type="module">
import {NativeGuardian} from '../../src/ui/guardian.js';import {AudioSystem} from '../../src/audio/audio.js';import {GUARDIAN_SOUND_IDS} from '../../src/audio/guardian-audio.js';
const status=document.querySelector('#status'),report=document.querySelector('#report'),errors=[],accepted=[],phases=[];let audio=null,actor=null,running=true,key=0,decoded={};
const assert=(v,m)=>{if(!v)throw Error(m);},sleep=ms=>new Promise(done=>setTimeout(done,ms));
function dispose(){running=false;actor?.dispose();audio?.dispose();}addEventListener('pagehide',dispose);addEventListener('error',e=>errors.push(String(e.error??e.message)));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
async function until(predicate,seconds=8){const start=performance.now();while(!predicate()){if(performance.now()-start>seconds*1000)throw Error('Tiempo agotado en fase nativa');await sleep(20);}}
function show(gesture='greeting'){actor.show({key:++key,text:'Soy el Espíritu que cuida estas tierras. Mis gestos y transiciones conservan el retrato original del laboratorio.',gesture});}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 audio=new AudioSystem({sfx:0,music:0});await audio.unlock();audio.sfx=await audio.sfxBank();for(const id of GUARDIAN_SOUND_IDS){const item=audio.sfx.items.find(i=>i.id===id),buffer=await audio.buffer(item.audio.url);decoded[id]={buffer,channels:buffer.numberOfChannels,sampleRate:buffer.sampleRate,duration:buffer.duration};}
 const original=audio.sound.bind(audio);audio.sound=async(id,options)=>{if(!GUARDIAN_SOUND_IDS.includes(id))return null;const source=await original(id,options);if(source){assert(source.buffer===decoded[id].buffer&&source.playbackRate.value===1&&!source.loop,'Archivo/velocidad alterados');const voice=audio.voices.get(source),record={id,start:audio.context.currentTime,duration:source.buffer.duration,phase:actor.lifecycle.phase,bus:voice.bus,family:voice.family,emitter:voice.emitter,rate:source.playbackRate.value,ended:false};accepted.push(record);const ended=source.onended;source.onended=()=>{record.ended=true;record.end=audio.context.currentTime;ended?.();};}return source;};
 actor=new NativeGuardian(document.querySelector('#guardian'),e=>errors.push(String(e)),phase=>{if(phases.at(-1)?.phase!==phase)phases.push({phase,at:audio.context.currentTime});audio.guardianPhase(phase);});await actor.ready;
 function frame(){if(running){actor.update();requestAnimationFrame(frame);}}requestAnimationFrame(frame);show();await until(()=>actor.lifecycle.phase==='reading'&&accepted.length===1);assert(accepted[0].id==='spirit_appear','Entrada ausente');
 status.textContent='Entrada nativa comprobada · retrato visible';document.querySelector('#finish').hidden=false;
 }catch(e){errors.push(String(e));status.textContent='FAIL: '+e.message;report.textContent=JSON.stringify({errors},null,2);dispose();}};
document.querySelector('#finish').onclick=async()=>{document.querySelector('#finish').disabled=true;try{
 const gestures=['greeting','speak','acknowledge','curious','warning','reveal','idle','farewell'];for(const gesture of gestures){show(gesture);await sleep(250);assert(actor.root.dataset.gesture===gesture,'Gesto ausente');}assert(accepted.length===1,'Cambio de texto/gesto repite aparición');
 actor.hide();await until(()=>actor.lifecycle.phase==='closed'&&accepted.length===2);const tail=accepted[1];assert(tail.id==='spirit_disappear'&&tail.phase==='outro','Salida fuera de fase');assert(!tail.ended&&audio.active.length===1,'Se corta la cola al cerrar');const closedAt=audio.context.currentTime;
 await until(()=>tail.ended);assert(tail.end-tail.start>=tail.duration-.08,'Final original truncado');assert(audio.active.length===0,'No limpia fuente terminada');
 show('greeting');await until(()=>accepted.length===3);assert(accepted[2].id==='spirit_appear','Reentrada ausente');actor.hide({immediate:true});await sleep(80);assert(audio.active.length===0&&audio.guardianAudio.voice===null,'Ocultación inmediata no limpia fuentes');
 dispose();await sleep(80);assert(audio.context.state==='closed','Contexto abierto');assert(errors.length===0,'Errores de navegador');report.textContent=JSON.stringify({gestures,accepted,phases,closedAt,decoded:Object.fromEntries(Object.entries(decoded).map(([id,{buffer,...data}])=>[id,data])),finalVoices:audio.active.length,context:audio.context.state,errors,muted:true,world3D:false,predecoded:true},null,2);status.textContent='Completada · 8 gestos, salida original completa y limpieza verificados';
 }catch(e){errors.push(String(e));status.textContent='FAIL: '+e.message;report.textContent=JSON.stringify({accepted,phases,errors},null,2);dispose();}};
</script></html>

<!doctype html><html lang="es"><meta charset="utf-8"><title>Paridad física Worker</title><body><pre id="status">Preparando…</pre><script type="module">
import {runPhysics} from './mobility-physics-parity-core.js';
import {loadTestRig} from './mobility-physics-rig.js';
import {Group} from 'three';
window.audit=async(options={})=>{
 const main=await runPhysics(options),start=performance.now();
 const remote=await new Promise((resolve,reject)=>{const worker=new Worker(new URL('./mobility-physics-parity-worker.js',import.meta.url),{type:'module'});worker.onerror=e=>reject(Error(e.message));worker.onmessage=e=>{worker.terminate();e.data.error?reject(Error(e.data.error)):resolve(e.data.result);};worker.postMessage(options);});
 const workerWallMs=performance.now()-start;let mismatch=-1;for(let i=0;i<main.samples.length;i++)if(JSON.stringify(main.samples[i])!==JSON.stringify(remote.samples[i])){mismatch=i;break;}
 if(mismatch!==-1||!main.phases.includes('falling')||!main.phases.includes('recovering')||!main.phases.includes('released')||!main.recoveriesUsed.includes('AuthoredBeastRecovery'))throw Error(`Parity or phases: ${mismatch} ${main.phases} ${main.recoveriesUsed}`);
 if(main.peerContacts!==remote.peerContacts||main.barrierContacts!==remote.barrierContacts||options.crowd&&(!main.peerContacts||!main.barrierContacts))throw Error('Contact counts differ or scenario did not exercise both contacts');
 let reconstruction=null;
 if(options.reconstruct){
  if(options.crowd)throw Error('Reconstruction fixture supports one actor');
  const model=await loadTestRig('hyena'),root=new Group(),bones=[];root.add(model);model.traverse(b=>{if(b.isBone)bones.push(b);});let maxError=0;const start=performance.now();
  for(const sample of remote.samples){const apply=(node,v,i)=>{node.position.fromArray(v,i);node.quaternion.fromArray(v,i+3);node.scale.fromArray(v,i+7);};apply(root,sample.localPose.root,0);bones.forEach((b,i)=>apply(b,sample.localPose.bones,i*10));root.updateMatrixWorld(true);let offset=0;for(const b of bones)for(const n of b.matrixWorld.elements)maxError=Math.max(maxError,Math.abs(n-sample.boneMatrices[offset++]));}
  if(maxError>1e-9)throw Error(`Reconstruction error ${maxError}`);
  reconstruction={maxError,boneCount:bones.length,rawFloat64Bytes:(10+bones.length*10)*8,totalApplyMs:performance.now()-start};
 }
 return {equal:true,steps:main.samples.length,phases:main.phases,recoveriesUsed:main.recoveriesUsed,boneCount:main.boneCount,peerContacts:main.peerContacts,barrierContacts:main.barrierContacts,reconstruction,main:{initializationMs:main.initializationMs,runMs:main.runMs},worker:{initializationMs:remote.initializationMs,runMs:remote.runMs,wallMs:workerWallMs}};
};window.ready=true;document.querySelector('#status').textContent='Preparado';
</script></body></html>

<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';
import {serialize,deserialize} from '../../src/persistence/snapshots.js';
import {captureRaidWaitBindings} from '../../src/simulation/raid-wait-handoff.js';
import {observePresentationGameEvents} from '../../src/simulation/game.js';
import {createConfirmedStateReceiver} from '../../src/simulation/confirmed-state-receiver.js';
import {createSimulationAuthorityClient} from '../../src/simulation/simulation-authority-client.js';
import {createHostPublicationQueue} from '../../src/simulation/host-publication-queue.js';
window.audit=async()=>{
 const chunks=[];for(let z=-1;z<=2;z++)for(let x=0;x<=5;x++)chunks.push(`${x},${z}`);
 const fixture=await createSimulation({mangrove:true,chunkKeys:chunks}),{game,nav}=fixture.diagnosticWorld(),source=serialize(game),bindings=captureRaidWaitBindings(game,nav);fixture.dispose();
 const views=new URLSearchParams(location.search).has('views'),a=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,raidWaitBindings:bindings,compactViewAcks:views,session:'direct'}),b=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,raidWaitBindings:bindings,compactViewAcks:views,session:'merged'}),left=deserialize(source),right=deserialize(source),direct=createConfirmedStateReceiver(left,'direct'),merged=createConfirmedStateReceiver(right,'merged'),seenA=[],seenB=[],stopA=observePresentationGameEvents(left,e=>seenA.push({event:structuredClone(e),state:serialize(left)})),stopB=observePresentationGameEvents(right,e=>seenB.push({event:structuredClone(e),state:serialize(right)})),sent=[];
 const queue=createHostPublicationQueue({session:'merged',foldViews:views,send:message=>sent.push(message)}),send=async(client,command)=>{const request=client.submit(command);if(!request.accepted)throw Error('Command not accepted');return request.result;};
 try{await Promise.all([a.ready,b.ready]);let mergedCount=0;
  for(let i=0;i<100;i++){
   const command={kind:'advance',seconds:.05,nightFastForward:true},[one,two]=await Promise.all([send(a,command),send(b,command)]);if(one.snapshot!==two.snapshot||JSON.stringify(one.events)!==JSON.stringify(two.events))throw Error('Authority mismatch at '+i);
   const accepted=direct.accept(one);if(!accepted.accepted)throw Error('Direct receiver failed');queue.publication(two,true);
   if(views&&i%3===0){const view={bounds:[0,-48,288,144],eye:{x:100+i,z:5},target:{x:90,z:0}},[v1,v2]=await Promise.all([send(a,{kind:'setNavigationView',view}),send(b,{kind:'setNavigationView',view})]);if(!v1.unchanged||!v2.unchanged||!direct.acceptUnchanged(v1).accepted)throw Error('View acknowledgement mismatch');const folded=queue.publication(v2,false);queue.message({kind:'viewReceipt',sequence:v2.sequence,folded});}
  }
  let cursor=0;while(cursor<sent.length){const item=sent[cursor++];if(item.kind==='viewReceipt'){if(merged.status().sequence!==item.sequence)throw Error('View receipt overtook state');continue;}if(item.kind!=='publication')throw Error('Unexpected queue message');const accepted=item.publication.unchanged?merged.acceptUnchanged(item.publication):merged.accept(item.publication,{firstSequence:item.firstSequence});if(!accepted.accepted)throw Error('Merged receiver failed');queue.ack(item.publication.sequence);mergedCount++;}
  if(!seenA.length||JSON.stringify(seenA)!==JSON.stringify(seenB)||serialize(left)!==serialize(right)||queue.status().coalesced===0)throw Error('Event or state delivery mismatch');
  return {ticks:100,views,publications:mergedCount,coalesced:queue.status().coalesced,foldedViews:queue.status().foldedViewCount,events:seenA.map(x=>x.event.type),scope:'Two real mangrove simulation Workers; presentation queue held until all ticks complete, comparing every event and its observed state. No physics rigs, rendered frames or real game UI.'};
 }finally{stopA();stopB();a.dispose();b.dispose();}
};window.ready=true;
</script>

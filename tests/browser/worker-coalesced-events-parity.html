<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';
import {serialize,deserialize} from '../../src/persistence/snapshots.js';

window.audit=async()=>{
 const chunks=[];for(let z=-1;z<=2;z++)for(let x=0;x<=5;x++)chunks.push(`${x},${z}`);
 const fixture=await createSimulation({mangrove:true,chunkKeys:chunks}),{game,nav}=fixture.diagnosticWorld(),animal=game.raid.animals.find(a=>a.species==='hyena'),second=game.raid.animals.find(a=>a.species==='warthog'&&a.status==='entering'),source=serialize(game),bindings=captureRaidWaitBindings(game,nav);fixture.dispose();
 const params=new URLSearchParams(location.search),views=params.has('views'),physics=params.has('physics'),multi=physics&&params.has('multi'),physicsOptions=physics?(multi?{physicsActorIds:[animal.id,second.id]}:{physicsActorId:animal.id}):{},a=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,raidWaitBindings:bindings,compactViewAcks:views,...physicsOptions,session:'direct'}),b=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,raidWaitBindings:bindings,compactViewAcks:views,...physicsOptions,session:'merged'}),left=deserialize(source),right=deserialize(source),worldA={state:left,mixers:new Map()},worldB={state:right,mixers:new Map()},direct=physics?createConfirmedSceneReceiver(left,'direct',worldA):createConfirmedStateReceiver(left,'direct'),merged=physics?createConfirmedSceneReceiver(right,'merged',worldB):createConfirmedStateReceiver(right,'merged'),seenA=[],seenB=[],stopA=observePresentationGameEvents(left,e=>seenA.push({event:structuredClone(e),state:serializeConfirmedState(left)})),stopB=observePresentationGameEvents(right,e=>seenB.push({event:structuredClone(e),state:serializeConfirmedState(right)})),sent=[];

  const attack=async(target,id)=>{const command={kind:'castAttack',id,targetId:target.id,x:target.x,z:target.z},[one,two]=await Promise.all([send(a,command),send(b,command)]);if(!one.value||one.snapshot!==two.snapshot||JSON.stringify(one.events)!==JSON.stringify(two.events)||JSON.stringify(one.physicsPoses)!==JSON.stringify(two.physicsPoses)||!direct.accept(one).accepted)throw Error('Attack mismatch '+JSON.stringify({id,one:one.value,two:two.value,rejection:one.rejection,eventsA:one.events,eventsB:two.events,snap:one.snapshot===two.snapshot,poses:JSON.stringify(one.physicsPoses)===JSON.stringify(two.physicsPoses)}));queue.publication(two,false);queue.message({kind:'viewReceipt',sequence:two.sequence});};

   if(multi&&i===250){const target=left.raid?.animals.find(a=>a.id===second.id);if(!target||['gone','retreating'].includes(target.status))throw Error('Second target left before cooldown');await attack(target,'coalesce-second-hit');}
   const command={kind:'advance',seconds:.05,nightFastForward:true},[one,two]=await Promise.all([send(a,command),send(b,command)]);if(one.snapshot!==two.snapshot||JSON.stringify(one.events)!==JSON.stringify(two.events)||JSON.stringify(one.physicsPose)!==JSON.stringify(two.physicsPose)||JSON.stringify(one.physicsPoses)!==JSON.stringify(two.physicsPoses))throw Error('Authority mismatch at '+i);if(two.physicsPose?.active)active++;if((two.physicsPoses??[]).filter(p=>p.active).length>1)simultaneous++;

  }

  if(!seenA.length||JSON.stringify(seenA)!==JSON.stringify(seenB)||serializeConfirmedState(left)!==serializeConfirmedState(right)||queue.status().coalesced===0||physics&&!active)throw Error('Event or state delivery mismatch');

 }finally{stopA();stopB();a.dispose();b.dispose();}
};window.ready=true;
</script>

<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';

window.audit=async()=>{
 const chunks=[];for(let z=-1;z<=2;z++)for(let x=0;x<=5;x++)chunks.push(`${x},${z}`);
 const fixture=await createSimulation({mangrove:true,chunkKeys:chunks}),{game,nav}=fixture.diagnosticWorld(),animal=game.raid.animals.find(a=>a.species==='hyena'),source=serialize(game),bindings=captureRaidWaitBindings(game,nav);fixture.dispose();
 const params=new URLSearchParams(location.search),views=params.has('views'),physics=params.has('physics'),a=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,raidWaitBindings:bindings,compactViewAcks:views,...(physics?{physicsActorId:animal.id}:{}),session:'direct'}),b=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,raidWaitBindings:bindings,compactViewAcks:views,...(physics?{physicsActorId:animal.id}:{}),session:'merged'}),left=deserialize(source),right=deserialize(source),worldA={state:left,mixers:new Map()},worldB={state:right,mixers:new Map()},direct=physics?createConfirmedSceneReceiver(left,'direct',worldA):createConfirmedStateReceiver(left,'direct'),merged=physics?createConfirmedSceneReceiver(right,'merged',worldB):createConfirmedStateReceiver(right,'merged'),seenA=[],seenB=[],stopA=observePresentationGameEvents(left,e=>seenA.push({event:structuredClone(e),state:serializeConfirmedState(left)})),stopB=observePresentationGameEvents(right,e=>seenB.push({event:structuredClone(e),state:serializeConfirmedState(right)})),sent=[];

  }

 }finally{stopA();stopB();a.dispose();b.dispose();}
};window.ready=true;
</script>

<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';import {createProjectionReceiver} from './mobility-delta-prototype.js';
window.audit=async()=>{const worker=new Worker(new URL('./mobility-delta-cap-worker.js',import.meta.url),{type:'module'}),rx=createProjectionReceiver('bounded-test');let n=0,resolveReady,rejectReady;const pending=new Map(),ready=new Promise((a,b)=>{resolveReady=a;rejectReady=b;});worker.onerror=e=>rejectReady(Error(e.message));worker.onmessage=({data:d})=>{if(d.kind==='ready')resolveReady();else{const p=pending.get(d.id);if(p){pending.delete(d.id);d.kind==='error'?p.reject(Error(d.error)):p.resolve(d);}else if(d.kind==='error')rejectReady(Error(d.error));}};const send=x=>new Promise((resolve,reject)=>{const id=++n;pending.set(id,{resolve,reject});worker.postMessage({...x,id});});let ref;
try{await ready;ref=await createSimulation();ref.damageCenter();let actual=0,blocked=null,local,maxBytes=0;for(let i=0;i<60;i++){
 const row=await send({kind:'step',damage:i===0,synthetic:i===0});if(!row.advanced)throw Error('Unexpected blocked step');actual++;local=JSON.parse(ref.run(1,.1,{full:false}).projection);delete local.events;maxBytes=Math.max(maxBytes,row.status.pendingBytes);
 if(row.packet.kind==='blocked'){blocked=row;if(row.packet.reason!=='event-capacity')throw Error('Unexpected saturation');const denied=await send({kind:'step'});if(denied.advanced||denied.ticks!==actual)throw Error('Simulation advanced while publication held');const ack=await send({kind:'ack',session:'bounded-test',sequence:1});if(!ack.accepted)throw Error('Ack failed');const retry=await send({kind:'retry'});if(retry.packet.kind!=='delta'||retry.ticks!==actual||!rx.accept(retry.packet).accepted)throw Error('Retry failed');maxBytes=Math.max(maxBytes,retry.status.pendingBytes);}
 else if(!rx.accept(row.packet).accepted)throw Error('Invalid delta');
 if(JSON.stringify(rx.state().state)!==JSON.stringify(local))throw Error('Projection mismatch');}
const view=rx.state(),ack=await send({kind:'ack',session:'bounded-test',sequence:view.lastEvent});if(!blocked||!view.events.some(x=>x.event.type==='StructureRuined')||!ack.accepted||ack.status.pending||maxBytes>150)throw Error('Missing event or unsafe capacity');return {ticks:actual,blockedAtTick:blocked.ticks,blockedReason:blocked.packet.reason,neededBytes:blocked.packet.needed,capacity:150,maxPublishedBytes:maxBytes,finalVersion:view.version,eventTypes:view.events.map(x=>x.event.type),eventsAcknowledged:ack.status.acknowledged,pending:ack.status.pending,projectionEqual:true};
}finally{ref?.dispose();worker.terminate();}};window.ready=true;
</script>

<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';import {createProjectionReceiver} from './mobility-delta-prototype.js';
window.audit=async()=>{const worker=new Worker(new URL('./mobility-delta-worker.js',import.meta.url),{type:'module'}),rx=createProjectionReceiver('delta-test');let next=0,resolveReady,rejectReady;const pending=new Map(),ready=new Promise((r,j)=>{resolveReady=r;rejectReady=j;});worker.onerror=e=>rejectReady(Error(e.message));worker.onmessage=({data:d})=>{if(d.kind==='ready')resolveReady();else{const p=pending.get(d.id);if(p){pending.delete(d.id);d.kind==='error'?p.reject(Error(d.error)):p.resolve(d);}else if(d.kind==='error')rejectReady(Error(d.error));}};const send=message=>new Promise((resolve,reject)=>{const id=++next;pending.set(id,{resolve,reject});worker.postMessage({...message,id});});let ref;
try{await ready;ref=await createSimulation();ref.damageCenter();const samples=[],allEvents=[];let gaps=0,recovery=null,last;
for(let i=0;i<60;i++){const start=performance.now(),remote=await send({kind:'step',damage:i===0}),local=JSON.parse(ref.run(1,.1,{full:false}).projection);allEvents.push(...local.events);delete local.events;if(i!==19){let answer=rx.accept(remote.packet);if(i===20){if(answer.reason!=='gap')throw Error('Missing gap');gaps++;recovery=await send({kind:'snapshot'});answer=rx.accept(recovery.packet);}if(!answer.accepted||JSON.stringify(rx.state().state)!==JSON.stringify(local))throw Error('Projection mismatch '+i);}samples.push({packetBytes:remote.packetBytes,projectionBytes:remote.projectionBytes,encodeMs:remote.encodeMs,tickMs:remote.tickMs,responseMs:performance.now()-start});last=local;}
const observed=rx.state(),expectedEvents=allEvents;if(JSON.stringify(observed.events.map(x=>x.event))!==JSON.stringify(expectedEvents)||!expectedEvents.some(x=>x.type==='StructureRuined'))throw Error('Event mismatch');const wrong=await send({kind:'ack',session:'wrong',sequence:observed.lastEvent}),ack=await send({kind:'ack',session:'delta-test',sequence:observed.lastEvent});if(wrong.accepted||!ack.accepted||ack.status.pending)throw Error('Invalid ack');
const stats=a=>{const s=[...a].sort((a,b)=>a-b);return {count:s.length,p50:s[Math.floor((s.length-1)*.5)],p95:s[Math.floor((s.length-1)*.95)],p99:s[Math.floor((s.length-1)*.99)],max:s.at(-1)};};return {steps:60,gaps,recoveryBytes:recovery.packetBytes,eventCount:expectedEvents.length,eventTypes:expectedEvents.map(x=>x.type),finalVersion:observed.version,finalProjectionEqual:JSON.stringify(observed.state)===JSON.stringify(last),wrongAckRejected:!wrong.accepted,pending:ack.status.pending,packetBytes:stats(samples.map(s=>s.packetBytes)),projectionBytes:stats(samples.map(s=>s.projectionBytes)),buildMs:stats(samples.map(s=>s.encodeMs)),responseMs:stats(samples.map(s=>s.responseMs)),tickMs:stats(samples.map(s=>s.tickMs))};
}finally{ref?.dispose();worker.terminate();}};window.ready=true;
</script>

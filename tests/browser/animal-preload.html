<!doctype html><html><head><meta charset="utf-8"><title>Animal preload QA</title><style>body{margin:0;background:#172019;color:#fff;font:14px system-ui}canvas{width:100vw;height:100vh}pre{position:fixed;top:0;left:0;max-width:520px;padding:12px;background:#172019ed;white-space:pre-wrap}</style><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body><canvas></canvas><pre id="report">Loading native world and five species…</pre><script type="module">
import * as Game from '/src/simulation/game.js';
import {Navigation,BIOME_IDS} from '/src/world/navigation.js';
import {findInitialLocationAsync} from '/src/world/villages.js';

const biome=new URLSearchParams(location.search).get('biome')??'gran-canon',errors=[];
addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
try{
const pack=await json('/content/biome-'+BIOME_IDS[biome]+'.json'),payload=(await json('/content/villages.json')).find(v=>v.id==='mapungubwe');

world.render(0);await new Promise(resolve=>setTimeout(resolve,0));world.render(0);

const after={downloads,programs:world.renderer.info.programs.length,newPrograms:world.renderer.info.programs.filter(p=>!before.programIds.includes(p.id)).map(p=>({id:p.id,name:p.name})),animalPrograms:animalPrograms(state.raid.animals.map(a=>world.mixers.get(a.id).model))};

}catch(error){document.querySelector('#report').textContent=JSON.stringify({ok:false,error:error.stack,errors},null,2);}
</script></body></html>

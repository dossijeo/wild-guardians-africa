<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Transición de acacia lejana</title>
<style>body{margin:0;font:14px system-ui}header{position:absolute;z-index:1;background:#fffae9;padding:10px;max-width:390px}button{padding:7px;margin:3px}canvas{display:block;width:100vw;height:100vh}pre{max-height:150px;overflow:auto;font-size:10px}</style>
<header><strong>Impostores aislados · Sabana</strong><p>Atlas precalculado, ocho árboles cercanos y mil árboles lejanos experimentales. No chunks ni gameplay. Iluminación uniforme compartida de diagnóstico.</p><button id="near">Acercar</button><button id="mix">Transición</button><button id="far">Alejar</button><button id="orbit">Girar 22,5°</button><button id="night">Cambiar día/noche</button><button id="blend">Cambiar mezcla angular</button><button id="ready">Retener/liberar modelo 3D</button><button id="representation" hidden>Comparar modelo/atlas</button><button id="phase" hidden>Cambiar fase de luz</button><button id="population">Cambiar población lejana</button><button id="benchmark">Medir lotes</button><span id="status" role="status">Cargando…</span><pre id="report"></pre><pre id="measurements" aria-label="Mediciones de lotes"></pre></header><canvas id="world" aria-label="Prueba aislada de acacias e impostores"></canvas>
<script type="module">
import {AfricanToon} from '../../src/rendering/african-toon.js';import {skyNight} from '../../src/rendering/sky.js';import {GpuTimer} from './gpu-timer.js';import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {Assets,json} from '../../src/rendering/assets.js';import {createFarImpostorPrototype} from '../../tools/experiments/far-impostor-prototype.js';import {atlasViews,lodMix,billboardRight} from '../../tools/experiments/far-impostor-math.js';
const realLighting=new URLSearchParams(location.search).get('lighting')==='real',toon=realLighting?new AfricanToon():null;
const errors=[],canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true}),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.1,500),controls=new OrbitControls(camera,canvas),assets=new Assets();renderer.debug.onShaderError=()=>errors.push('Shader compilation failed');renderer.setPixelRatio(1);scene.background=new THREE.Color('#b5d9e8');scene.fog=new THREE.Fog('#b5d9e8',120,300);controls.target.set(0,3,0);controls.enableDamping=false;
let prototype,night=false,held=false,ready=1,last=performance.now(),lastReport=0,owned=[],benchmark=null;let timer=new GpuTimer(renderer.getContext());
function pose(z,y){camera.position.set(0,y,z);controls.target.set(0,3,0);controls.update();}
pose(70,18);
try{
 const metadata=await json('/docs/qa/far-vegetation-atlas/acacia.json'),pack=await json('/content/biome-savanna.json'),levels=await assets.biome({...pack,assets:pack.assets.slice(0,1)});owned=levels.flat();const texture=await new THREE.TextureLoader().loadAsync('../../docs/qa/far-vegetation-atlas/savanna-acacia-8views.webp');
 const trees=Array.from({length:8},(_,i)=>({id:'prototype-tree-'+i,x:i?((i%3)-1)*22:0,y:0,z:i?-Math.ceil(i/3)*22:0,yaw:i*Math.PI/4,scale:i%2?1.2:1}));let seed=712;const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};for(let i=0;i<1000;i++)trees.push({id:'diagnostic-far-'+i,x:(random()-.5)*360,y:0,z:-90-random()*140,yaw:random()*Math.PI*2,scale:.7+random()*.6});prototype=createFarImpostorPrototype(levels[0][0],texture,metadata,trees,{toon});scene.add(prototype.impostors,prototype.models);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshBasicMaterial({color:'#979b61'}));ground.rotation.x=-Math.PI/2;ground.position.y=-.01;scene.add(ground);owned.push(ground);
 const sun=new THREE.DirectionalLight('#ffe2a8',3);sun.position.set(-30,55,25);const ambient=new THREE.HemisphereLight('#ebf1d9','#765b3b',2);scene.add(sun,sun.target,ambient);
 const phases=[{name:'amanecer',time:Math.log(2)/2.4,day:2},{name:'mediodía',time:150,day:2},{name:'atardecer',time:300+Math.log(2)/2.4,day:2},{name:'noche',time:350,day:2}];let phaseIndex=1,representation='lod';
 function applyPhase(index){phaseIndex=index;const amount=skyNight(phases[index]);night=amount>.5;sun.intensity=3-2.6*amount;ambient.intensity=2-.9*amount;toon?.update(amount,sun,'sabana');scene.background.copy(new THREE.Color('#b5d9e8').lerp(new THREE.Color('#182b45'),amount));scene.fog.color.copy(scene.background);ground.material.color.copy(new THREE.Color('#979b61').lerp(new THREE.Color('#263432'),amount));}
 if(realLighting){document.querySelector('header p').textContent='Material 3D real + receta artística del mundo en impostores con envolvente de copa aproximada. Terreno plano de diagnóstico.';document.querySelector('#representation').hidden=false;document.querySelector('#representation').onclick=()=>{representation=representation==='lod'?'model':representation==='model'?'impostor':'lod';prototype.uniforms.uStart.value=representation==='model'?54:40;prototype.uniforms.uEnd.value=representation==='model'?55:60;};document.querySelector('#phase').hidden=false;document.querySelector('#phase').onclick=()=>applyPhase((phaseIndex+1)%4);applyPhase(1);}
 document.querySelector('#near').onclick=()=>pose(25,10);document.querySelector('#mix').onclick=()=>pose(50,14);document.querySelector('#far').onclick=()=>pose(100,25);
 document.querySelector('#orbit').onclick=()=>{const offset=camera.position.clone().sub(controls.target).applyAxisAngle(new THREE.Vector3(0,1,0),Math.PI/8);camera.position.copy(controls.target).add(offset);controls.update();};
 document.querySelector('#night').onclick=()=>{if(realLighting){applyPhase(phaseIndex===3?1:3);return;}night=!night;prototype.uniforms.uLighting.value.setRGB(...(night?[.14,.24,.43]:[1,1,1]));scene.background.set(night?'#182b45':'#b5d9e8');scene.fog.color.copy(scene.background);ground.material.color.set(night?'#263432':'#979b61');};
 document.querySelector('#blend').onclick=()=>prototype.uniforms.uBlend.value=1-prototype.uniforms.uBlend.value;
 document.querySelector('#ready').onclick=()=>{held=!held;if(held)ready=0;};
 const population=count=>{prototype.impostors.geometry.instanceCount=count;};population(8);
 document.querySelector('#population').onclick=()=>population(prototype.impostors.geometry.instanceCount===8?1008:8);
 const configurations=[{count:8,blend:1},{count:1008,blend:1},{count:1008,blend:0},{count:8,blend:0},{count:8,blend:0},{count:1008,blend:0},{count:1008,blend:1},{count:8,blend:1}];
 function startStage(){const configuration=configurations[benchmark.stage];population(configuration.count);prototype.uniforms.uBlend.value=configuration.blend;timer.dispose();timer=new GpuTimer(renderer.getContext());benchmark.frame=0;benchmark.cpu=[];benchmark.intervals=[];benchmark.previous=null;}
 function finishBenchmark(aborted=false){document.querySelector('#measurements').textContent=JSON.stringify({aborted,realLighting,phase:realLighting?phases[phaseIndex].name:null,viewport:[canvas.width,canvas.height],dpr:1,warmupFrames:45,measuredFrames:180,camera:camera.position.toArray(),results:benchmark.results},null,2);benchmark=null;controls.enabled=true;for(const button of document.querySelectorAll('button'))button.disabled=false;}
 document.querySelector('#benchmark').onclick=()=>{pose(100,25);held=false;ready=1;if(realLighting){applyPhase(1);representation='lod';prototype.uniforms.uStart.value=40;prototype.uniforms.uEnd.value=60;}benchmark={stage:0,results:[]};controls.enabled=false;for(const button of document.querySelectorAll('button'))button.disabled=true;document.querySelector('#measurements').textContent='Medición en curso…';startStage();};
 function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;ready=held?0:Math.min(1,ready+dt);prototype.uniforms.uReady.value=representation==='impostor'?0:ready;if(canvas.width!==innerWidth||canvas.height!==innerHeight){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}if(benchmark&&document.hidden)finishBenchmark(true);const measuring=benchmark&&benchmark.frame>=45&&benchmark.frame<225;const cpuStart=performance.now();prototype.update(camera);const updateMs=performance.now()-cpuStart;if(measuring)timer.begin(benchmark.frame);const renderStart=performance.now();renderer.render(scene,camera);const renderMs=performance.now()-renderStart;if(measuring)timer.end();timer.poll();if(benchmark){if(measuring){benchmark.cpu.push({updateMs,renderMs});if(benchmark.previous!==null)benchmark.intervals.push(now-benchmark.previous);benchmark.previous=now;}benchmark.frame++;if(benchmark.frame>=225&&(timer.pending.length===0||benchmark.frame>=285)){benchmark.results.push({...configurations[benchmark.stage],cpu:benchmark.cpu,intervals:benchmark.intervals,gpu:timer.report(),drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,selection:prototype.stats(),webglError:renderer.getContext().getError()});benchmark.stage++;if(benchmark.stage===configurations.length)finishBenchmark();else startStage();}}if(now-lastReport>200){lastReport=now;const base=trees[0],distance=Math.hypot(camera.position.x-base.x,camera.position.z-base.z);document.querySelector('#status').textContent=` · ${night?'noche':'día'} · ${prototype.models.count} modelos / ${prototype.impostors.geometry.instanceCount} impostores${benchmark?` · lote ${benchmark.stage+1}/8`:""}`;document.querySelector('#report').textContent=JSON.stringify({realLighting,representation,transition:[prototype.uniforms.uStart.value,prototype.uniforms.uEnd.value],phase:realLighting?phases[phaseIndex].name:null,nightAmount:toon?.uniforms.uNight.value??null,materialType:prototype.models.material.type,night,held,ready,angularBlend:!!prototype.uniforms.uBlend.value,camera:camera.position.toArray(),firstTree:{...base,distance,atlas:atlasViews(camera.position,base,base.yaw),right:billboardRight(camera.position,base),impostorVisibility:lodMix(distance,prototype.uniforms.uStart.value,prototype.uniforms.uEnd.value,prototype.uniforms.uReady.value)},drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,modelCount:prototype.models.count,impostorCount:prototype.impostors.geometry.instanceCount,selection:prototype.stats(),webglError:renderer.getContext().getError(),errors},null,2);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
}catch(error){errors.push(String(error.stack??error));document.querySelector('#status').textContent='ERROR';document.querySelector('#report').textContent=JSON.stringify({errors},null,2);}
addEventListener('pagehide',()=>{timer.dispose();prototype?.dispose();toon?.shadowUniforms.fallback.dispose();const resources=new Set();for(const mesh of owned){resources.add(mesh.geometry);resources.add(mesh.material);for(const value of Object.values(mesh.material))if(value?.isTexture)resources.add(value);}for(const resource of resources)resource.dispose();controls.dispose();renderer.dispose();renderer.forceContextLoss();},{once:true});
</script></html>

<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Ataques VFX en la finca</title><style>body{margin:0;font:14px system-ui}header{position:absolute;z-index:2;padding:12px;background:#fff9ed;max-width:95vw}button{padding:8px;margin:4px}canvas{width:100vw;height:100vh;display:block}#status{display:block}</style><header>Incursión natural de la noche 2 en terreno original. Centro y semilla pagados; contratación de cero. Sin partidas guardadas.<br><button id="raid">Buscar incursión real</button><button id="attack">Buscar ataque comprometido</button><button id="impact">Avanzar hasta un único golpe</button><button id="step">Avanzar 0,1 s</button><button id="fade">Disipar efectos</button><button id="reload">Guardar y recargar en memoria</button><span id="status">Cargando finca…</span></header><canvas id="world" aria-label="Animal, animación y VFX originales durante una incursión natural"></canvas><script type="module">
import * as Game from '../../src/simulation/game.js';
import {Navigation} from '../../src/world/navigation.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {WorldScene} from '../../src/rendering/scene.js';
import {json} from '../../src/rendering/assets.js';
import {serialize,deserialize} from '../../src/persistence/snapshots.js';
const pack=await json('/content/biome-savanna.json'),villages=await json('/content/villages.json'),payload=villages.find(v=>v.id==='suajili');
let state=Game.newGame({culture:'suajili',seed:712});const nav=new Navigation(712,'sabana',pack.profile),location=await findInitialLocationAsync(nav,payload);
Object.assign(state.villages[0],location);state.suppressed.push(...location.suppress);nav.setState(state);Game.resume(state,'intro');Game.placeStructure(state,'qa-center',{x:location.center.x,z:location.center.z},nav);const center=state.structures[0];let site;
for(let z=-6;z<=6&&!site;z+=1.5)for(let x=4.5;x<12&&!site;x+=1.5){const p={x:center.x+x,z:center.z+z};if(nav.placement(p.x,p.z,.4).valid)site=p;}
Game.plant(state,'qa-seed','mijo',site.x,site.z,nav);Game.openInitialHiring(state);Game.hire(state,'qa-contract-1',{});Game.pause(state,'qa');state.tutorial.step='done';
const world=new WorldScene(document.querySelector('#world'),()=>{});let error='';world.onError=e=>{error=e.message;status();};world.qualitySetting('media');await world.load(state,nav,payload);
world.focus(site);const ground=nav.field.surface(site.x,site.z);world.controls.target.set(site.x,ground+.8,site.z);world.camera.position.set(site.x+5,ground+4,site.z+6);world.controls.update();
function status(){const animal=state.raid?.animals[0],effects=[...world.attackVfx.effects.values(),...world.shieldVfx.effects.values()];document.querySelector('#status').textContent=`Día ${state.day} · tiempo ${state.elapsed.toFixed(2)} s · saldo ${state.ledger.balance.n} · Escudo ${(state.spells.find(s=>s.kind==='shield')?.remaining??0).toFixed(2)} s / recarga ${state.cooldowns.shield.toFixed(2)} s · centro ${state.structures[0].hp} PV · plantas vivas ${state.plants.filter(p=>p.alive).length} · golpes lógicos ${state.events.filter(e=>e.type==='AnimalLogicalHit').length} · ${animal?`${animal.species} ${animal.status} ${animal.animation??''} ${animal.attackRemaining.toFixed(2)} s pendientes`:'sin incursión'} · VFX ${effects.map(e=>`${e.native.definition.id} ${e.native.time.toFixed(2)} s / ${e.sprites.geometry.instanceCount} sprites / ${e.native.contacts.length} contactos decorativos`).join(', ')||'ninguno'}${error?' · '+error:''}`;}
function advance(dt){Game.resume(state,'qa');if(state.pauses.includes('hiring'))Game.hire(state,'qa-contract-'+state.day,{});Game.tick(state,dt,nav);Game.pause(state,'qa');}
async function run(until,max=16000){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{for(let i=0;i<max&&!state.result;i++){advance(.1);world.attackVfx.update(state);if(until())break;if(i%25===24){world.render(0);status();await new Promise(resolve=>setTimeout(resolve,0));}}world.render(0);status();}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
const extra=document.createElement('div');extra.innerHTML='<button id="near">Esperar aproximación a siete metros</button><button id="shield">Activar Escudo legal</button><button id="expire">Avanzar hasta terminar Escudo</button>';document.querySelector('header').insertBefore(extra,document.querySelector('#status'));
document.querySelector('#near').onclick=()=>run(()=>state.raid?.animals.some(a=>Math.hypot(a.x-site.x,a.z-site.z)<7));
document.querySelector('#shield').onclick=()=>{Game.resume(state,'qa');try{Game.cast(state,'qa-shield','shield',site.x,site.z,nav);}finally{Game.pause(state,'qa');}world.render(0);status();};
document.querySelector('#expire').onclick=()=>run(()=>!state.spells.some(s=>s.kind==='shield'),250);
document.querySelector('#raid').onclick=()=>run(()=>!!state.raid);document.querySelector('#attack').onclick=()=>run(()=>state.raid?.animals.some(a=>a.status==='attacking'));
document.querySelector('#impact').onclick=()=>{const count=state.events.filter(e=>e.type==='AnimalLogicalHit').length;run(()=>state.events.filter(e=>e.type==='AnimalLogicalHit').length>count,300);};
document.querySelector('#step').onclick=()=>{advance(.1);world.render(0);status();};document.querySelector('#fade').onclick=()=>run(()=>world.attackVfx.effects.size===0,60);
document.querySelector('#reload').onclick=()=>{state=deserialize(serialize(state));nav.setState(state);world.state=state;world.simElapsed=state.elapsed;world.render(0);status();};
function frame(){world.render(0);status();requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('pagehide',()=>world.dispose());
</script></html>

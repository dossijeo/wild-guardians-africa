<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Envolventes de cultivos en GPU</title>
<style>body{font:15px system-ui;background:#eee8d8;color:#253426;padding:20px}pre{white-space:pre-wrap}canvas{width:1px;height:1px}</style>
<h1>Envolventes nativas de crecimiento y morph</h1><p>Transform feedback WebGL2 sobre todas las posiciones originales. No mide rendimiento de gameplay.</p><button id="run">Verificar vértices en GPU</button><output id="status">Listo</output><pre id="report"></pre><canvas id="gpu" width="1" height="1"></canvas>
<script type="module">
import * as THREE from 'three';
import {Assets,json} from '../../src/rendering/assets.js';
import {createCropBatch} from '../../src/rendering/crop-batch.js';
import {installCropFrustum,growthEnvelope,bridgeEnvelope} from './crop-frustum.js';
const button=document.querySelector('#run'),status=document.querySelector('#status'),report=document.querySelector('#report');
const assert=(v,m)=>{if(!v)throw Error(m);},next=()=>new Promise(requestAnimationFrame);
const hash=async text=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))).map(x=>x.toString(16).padStart(2,'0')).join('');
button.onclick=async()=>{
 button.disabled=true;const output={scope:'Native WebGL2 transform feedback of authored growth/bridge vertex hooks on all 40 original meshes and 32 opaque bridges. Local deformation envelopes, not camera/shadow/color equivalence, mobile, performance, gameplay or all real-time parameter combinations.',cases:[],errors:[],points:0};
 let assets,batch,candidate;
 try{
  const gl=document.querySelector('#gpu').getContext('webgl2');assert(gl,'WebGL2 required');
  const debug=gl.getExtension('WEBGL_debug_renderer_info');output.renderer=debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
  const models=await json('/content/models.json'),source=models.find(m=>m.source.includes('Cultivos'));assert(source,'Missing native crops');assets=new Assets();
  const gltf=await assets.model(source.url),data=await json('/content/crop-bridges.json'),scene=new THREE.Scene();
  batch=createCropBatch(scene,{capabilities:{getMaxAnisotropy:()=>1}},gltf,data,1);candidate=installCropFrustum(batch,scene,gltf);
  const stub='void main(){\n#include <begin_vertex>\nvBounds=transformed;gl_Position=vec4(0.,0.,0.,1.);\n}';
  for(const item of candidate.items){
   status.textContent='Verificando '+item.mesh.name;await next();
   const shader={uniforms:{},vertexShader:stub,fragmentShader:'void main(){}'},depth={uniforms:{},vertexShader:stub,fragmentShader:'void main(){}'};
   item.mesh.material.onBeforeCompile(shader);item.mesh.customDepthMaterial.onBeforeCompile(depth);
   assert(shader.vertexShader===depth.vertexShader,'Color/depth position hooks differ');
   const vertex='#version 300 es\nprecision highp float;precision highp int;\n#define attribute in\nin vec3 position;out vec3 vBounds;\n'+shader.vertexShader.replace('#include <begin_vertex>','vec3 transformed=position;');
   const compile=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);assert(gl.getShaderParameter(s,gl.COMPILE_STATUS),gl.getShaderInfoLog(s));return s;};
   const vs=compile(gl.VERTEX_SHADER,vertex),fs=compile(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;out vec4 color;void main(){color=vec4(1.);}'),program=gl.createProgram();
   gl.attachShader(program,vs);gl.attachShader(program,fs);gl.transformFeedbackVaryings(program,['vBounds'],gl.INTERLEAVED_ATTRIBS);gl.linkProgram(program);assert(gl.getProgramParameter(program,gl.LINK_STATUS),gl.getProgramInfoLog(program));gl.useProgram(program);
   const vao=gl.createVertexArray(),feedback=gl.createTransformFeedback(),buffers=[];gl.bindVertexArray(vao);gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK,feedback);
   const geo=item.mesh.geometry,count=geo.attributes.position.count;
   for(const [name,attr] of Object.entries(geo.attributes))if(name!=='iGrowth'&&name!=='iBridge'){
    const loc=gl.getAttribLocation(program,name);if(loc<0)continue;
    const buffer=gl.createBuffer();buffers.push(buffer);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,attr.array,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,attr.itemSize,gl.FLOAT,false,0,0);
   }
   const target=gl.createBuffer();gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER,target);gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER,count*12,gl.STREAM_READ);gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER,0,target);
   const values=new Float32Array(count*3),cases=item.metas?[0,.2,.5,.8,1].flatMap(t=>[0,.5,1].map(e=>[t,e,7,0])):[[.045,.3,.45,7],[1,1,1,7],[3,2.8,.5,7]];
   let checked=0,maxOutside=0;
   try{
    gl.enable(gl.RASTERIZER_DISCARD);
    for(const attrs of cases)for(const clock of [0,17.3]){
     const f=attrs.map(Math.fround),loc=gl.getAttribLocation(program,item.metas?'iBridge':'iGrowth');assert(loc>=0,'Missing growth input');gl.disableVertexAttribArray(loc);gl.vertexAttrib4fv(loc,f);
     for(const [name,uniform] of Object.entries(shader.uniforms)){
      const at=gl.getUniformLocation(program,name);if(at===null)continue;const value=name==='uClock'?clock:uniform.value;
      if(value?.isVector2)gl.uniform2f(at,value.x,value.y);else gl.uniform1f(at,value);
     }
     gl.beginTransformFeedback(gl.POINTS);gl.drawArrays(gl.POINTS,0,count);gl.endTransformFeedback();gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER,target);gl.getBufferSubData(gl.TRANSFORM_FEEDBACK_BUFFER,0,values);
     assert(gl.getError()===gl.NO_ERROR,'Transform feedback WebGL error');
     const b=item.metas?bridgeEnvelope(item.raw,item.metas,f[1]):growthEnvelope(item.raw,f[0],f[1],1-f[2]);
     for(let i=0;i<values.length;i+=3){const x=values[i],y=values[i+1],z=values[i+2];assert(Number.isFinite(x+y+z),'Nonfinite GPU output');const outside=item.metas?Math.hypot(x,y,z)-b.radius:Math.max(Math.hypot(x,z)-b.radius,b.lo-y,y-b.hi);maxOutside=Math.max(maxOutside,outside);assert(outside<=1e-4,'Vertex outside envelope '+item.mesh.name);checked++;}
    }
   }finally{gl.disable(gl.RASTERIZER_DISCARD);gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK,null);gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER,0,null);gl.bindVertexArray(null);for(const b of [...buffers,target])gl.deleteBuffer(b);gl.deleteTransformFeedback(feedback);gl.deleteVertexArray(vao);gl.deleteProgram(program);gl.deleteShader(vs);gl.deleteShader(fs);}
   output.points+=checked;output.cases.push({name:item.mesh.name,kind:item.metas?'bridge':'original',vertices:count,parameterSamples:cases.length*2,checked,maxOutside,vertexHookSha256:await hash(shader.vertexShader),colorDepthPositionHooksIdentical:true});
  }
  assert(output.cases.length===72,'Missing native meshes');status.textContent='PASS · '+output.points+' vértices verificados';
 }catch(e){output.errors.push(String(e));status.textContent='FAIL · '+e.message;console.error(e);}
 finally{candidate?.dispose();batch?.dispose();assets?.disposeModels();button.disabled=false;report.textContent=JSON.stringify(output,null,2);}
};
</script></html>

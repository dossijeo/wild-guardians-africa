<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA pantalla encendida</title><style>body{background:#17261e;color:#fff;font:18px system-ui;padding:24px}button{padding:14px;margin:6px}pre{white-space:pre-wrap}</style><h1>Pantalla encendida durante la partida</h1><p>Prueba del controlador de producción y la API real del navegador. No cambia las partidas guardadas.</p><button id="start">Entrar en partida</button><button id="exit">Volver al menú</button><pre role="status" id="status"></pre><script type="module">
import {GameScreenWakeLock} from '../../src/ui/screen-wake-lock.js';
const report={supported:!!navigator.wakeLock,secureContext:isSecureContext,requests:0,grants:0,releases:0,errors:[],active:false,held:false};
const show=()=>{report.active=controller.active;report.held=!!controller.sentinel&&!controller.sentinel.released;document.querySelector('#status').textContent=JSON.stringify(report,null,2);};
const api=navigator.wakeLock?{async request(type){report.requests++;try{const sentinel=await navigator.wakeLock.request(type);report.grants++;sentinel.addEventListener('release',()=>{report.releases++;queueMicrotask(show);},{once:true});setTimeout(show,0);return sentinel;}catch(e){report.errors.push(e.name+': '+e.message);setTimeout(show,0);throw e;}}}:null;
const controller=new GameScreenWakeLock({wakeLock:api});document.querySelector('#start').onclick=()=>{controller.setActive(true);show();};document.querySelector('#exit').onclick=()=>{controller.setActive(false);show();};document.addEventListener('visibilitychange',()=>setTimeout(show,0));window.addEventListener('beforeunload',()=>controller.dispose());show();
</script></html>

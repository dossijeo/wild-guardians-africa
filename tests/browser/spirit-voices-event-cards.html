<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Spirit voices and event cards</title><script src="../../i18n/loader.js"></script><style>body{margin:0}#qa{position:absolute;z-index:80;left:12px;top:100px;max-width:calc(100vw - 120px);max-height:140px;overflow:auto;background:#fff1c8da;padding:7px;border-radius:8px;font:11px system-ui}#qa button,#qa select{padding:6px;font-size:11px}#report{white-space:pre-wrap;font:10px monospace;max-height:105px;overflow:auto;margin:5px 0}#stage{background:linear-gradient(#abc9d0,#b8c386)}#qa.toast-mode{top:auto;bottom:10px;max-height:65px;overflow:hidden}#qa.toast-mode #report{display:none}</style><main id="stage" class="game"><div id="hud"></div><div id="qa" data-no-i18n><label>Language <select id="language"><option value="en">English</option><option value="es">Español</option></select></label><select id="clip"><option value="sequence">Tutorial sequence</option></select><button id="play">Play / restart</button><button id="toasts">Show event cards</button><button id="complete">Complete real center action</button><button id="missing">Load error fallback</button><pre id="report"></pre></div><div id="events" hidden></div><div id="placementBanner" hidden></div><div id="narrator"></div><div id="notices" class="notices"></div></main><script type="module">
import '../../src/ui/styles.css';import '../../src/ui/tutorial.css';
import {NativeGuardian} from '../../src/ui/guardian.js';import {SpiritVoice} from '../../src/audio/spirit-voice.js';import {assetUrl} from '../../src/rendering/asset-url.js';
import manifest from '../../content/manifests/spirit-voices.json' with {type:'json'};
import {ASSETS,hudMarkup,layoutHud} from '../../src/ui/native-hud.js';import {EventCards} from '../../src/ui/event-cards.js';import {NoticeLifetime} from '../../src/app/notices.js';
import {TutorialController} from '../../src/tutorial/controller.js';import * as Game from '../../src/simulation/game.js';import {TutorialHudHand,tutorialHudHandTarget} from '../../src/ui/tutorial-hud-hand.js';import {syncTutorialActionPause} from '../../src/tutorial/action-pause.js';
await window.WildGuardiansLanguageReady;const errors=[],history=[],stage=document.querySelector('#stage');
const sheet=document.createElement('link');sheet.rel='stylesheet';sheet.href=assetUrl('/content/hud.css');document.head.append(sheet);const fonts=document.createElement('link');fonts.rel='stylesheet';fonts.href=assetUrl('/content/fonts.css');document.head.append(fonts);
for(const a of Object.values(ASSETS))a.src=assetUrl(a.src);document.querySelector('#hud').outerHTML=hudMarkup;document.querySelectorAll('[data-sprite]').forEach(i=>i.src=ASSETS[i.dataset.sprite].src);layoutHud(stage);
document.querySelector('#clockValue').textContent='07:00';document.querySelector('#moneyValue').textContent='1.500';document.querySelector('#dayValue').textContent='Día 1';
let state,tutorial,standalone=null,standaloneMode=false,last=performance.now();const notices=new NoticeLifetime(),cards=new EventCards(document.querySelector('#notices'),ASSETS),hand=new TutorialHudHand(stage);
const voice=new SpiritVoice({url:assetUrl,onState:status=>history.push({type:'voice',status,time:Math.round(performance.now()),clip:voice.audio?.src?.split('/').at(-1)??null})});
const actor=new NativeGuardian(document.querySelector('#narrator'),e=>errors.push(e.message),()=>{},voice);await actor.ready;
const clip=document.querySelector('#clip');manifest.records.filter(r=>r.language==='es').forEach(r=>clip.add(new Option(r.index+' · '+r.text.slice(0,45),String(r.index))));
function reset(){actor.hide({immediate:true});state=Game.newGame({seed:71});tutorial=new TutorialController(state,{read:()=>new Set(),record(){},basicCompleted:true});standalone=null;standaloneMode=false;notices.reset();history.length=0;}
function ended(){history.push({type:'ended',id:standalone?.id??tutorial.presentation()?.id,time:Math.round(performance.now())});if(standalone){standalone=null;actor.hide();}else tutorial.dismiss({automatic:true});show();}
function show(){const message=standalone??(standaloneMode?null:tutorial.presentation());if(message){actor.show({key:message.id+':'+!!message.reading+':'+document.documentElement.lang,...message,onVoiceEnded:ended,advance:()=>{voice.stop();ended();},dismiss:()=>{voice.stop();if(standalone)standalone=null;else tutorial.dismiss();actor.hide();show();},skip:message.canSkip?()=>{voice.stop();tutorial.skipBasic();show();}:null});}else actor.hide();const target=tutorialHudHandTarget(state,message);hand.show(target);syncTutorialActionPause(state,{hudTarget:!!target});}
document.querySelector('#play').onclick=()=>{document.querySelector('#qa').classList.remove('toast-mode');reset();if(clip.value!=='sequence'){standaloneMode=true;const record=manifest.records.find(r=>r.language==='es'&&r.index===Number(clip.value));standalone={id:record.id,text:record.text,gesture:'speak'};}show();};
document.querySelector('#language').value=window.WildGuardiansLanguage.getLanguage();document.querySelector('#language').onchange=e=>window.WildGuardiansLanguage.setLanguage(e.target.value);addEventListener('wild-guardians:language-change',()=>{voice.stop();actor.key=null;show();});
document.querySelector('#toasts').onclick=()=>{document.querySelector('#qa').classList.add('toast-mode');actor.hide({immediate:true});standalone=null;tutorial.dismiss();state.tutorial.basicSkipped=true;tutorial.update();hand.show(null);notices.reset();state.messages=[{id:'fertile',text:'Suelo fértil: mejora la próxima cosecha de 8 plantas.'},{id:'repair',text:'La reparación se canceló: fondos insuficientes al llegar.'},{id:'weather',text:'Buena temporada: aumenta el margen hasta el próximo riego de 8 plantas.'}];};
document.querySelector('#complete').onclick=()=>{if(!state.structures.length){Game.placeStructure(state,'qa-center',{x:10,z:0},{placement:()=>({valid:true,suppress:[]}),setState(){},field:{surface:()=>0},path:(_a,b)=>[{x:b.x,z:b.z}]});tutorial.update();actor.key=null;show();}};
document.querySelector('#missing').onclick=()=>{reset();show();voice.play({path:'content/spirit-voices/missing.ogg'},ended);};
document.querySelector('#notices').onclick=e=>{if(e.target.dataset.dismissNotice)notices.dismiss(e.target.dataset.dismissNotice);};
reset();function frame(now){const dt=(now-last)/1000;last=now;tutorial.advance(dt,{visible:!standaloneMode&&!voice.active});tutorial.update();show();actor.update();cards.render(notices.visible(state,now/1000,standalone??(standaloneMode?null:tutorial.presentation()),{tutorialVisible:actor.lifecycle.phase!=='closed',maxVisible:stage.classList.contains('short')?2:3}),notices,now/1000);document.querySelector('#report').textContent=JSON.stringify({language:document.documentElement.lang,message:standalone?.id??(standaloneMode?null:tutorial.presentation()?.id)??null,voice:voice.status,clip:voice.audio?.src?.split('/').at(-1)??null,currentTime:voice.audio?.currentTime??null,duration:voice.duration,structures:state.structures.length,plants:state.plants.length,step:state.tutorial.step,guide:state.tutorial.guideAfterAuto,pauses:state.pauses,hand:!hand.image.hidden,notices:cards.cards.size,history,errors},null,1);requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('resize',()=>layoutHud(stage));addEventListener('pagehide',()=>{actor.dispose();hand.dispose();});
</script></html>

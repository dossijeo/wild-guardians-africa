<!doctype html><html lang="es"><meta charset="utf-8"><title>QA señal musical por ventanas</title>
<style>body{background:#18231e;color:#edf3dc;font:16px system-ui;padding:24px}button{padding:12px}pre{white-space:pre-wrap}</style>
<h1>Señal renderizada · original frente a ventanas</h1><p>OfflineAudioContext real, estéreo a 48 kHz. Dos pistas representativas por conjunto, seis saltos, dos retornos y avance natural con offset fraccional.</p>
<button id="run">Comparar señales renderizadas</button><button id="scenes">Comparar escenas y resultados</button><p id="status">Preparado</p><pre id="report"></pre>
<script type="module">
import {AudioSystem} from '/src/audio/audio.js';
import {MusicTransport} from '/src/audio/music-transport.js';
import {MusicWindowTransport} from '/src/audio/music-window-transport.js';
import {MusicWindowPool} from '/src/audio/music-window-pool.js';
import {musicRangeReader} from '/src/audio/music-range-reader.js';
import {json,bytes} from '/src/rendering/assets.js';
let running=false;const status=document.querySelector('#status'),report=document.querySelector('#report');
async function render(kind,pack,bank,index,track,full,item){
 const {offset,random,seconds=12,initialScene='day',scenario}=item;
 const offline=new OfflineAudioContext(2,seconds*48000,48000),audio=new AudioSystem({music:1,sfx:0});audio.musicScene=initialScene;
 // Plan against a controlled clock, then let native WebAudio render the entire
 // graph. Deferring disconnect avoids deleting already planned past sound.
 const facade={state:'running',currentTime:0,sampleRate:48000,createGain(){const gain=offline.createGain();gain.disconnect=()=>{};return gain;},createBufferSource(){const source=offline.createBufferSource(),stop=source.stop.bind(source);let end=Infinity;source.disconnect=()=>{};source.stop=at=>{end=Math.min(end,at??facade.currentTime);stop(end);};return source;}};
 audio.context=facade;audio.musicGain=offline.createGain();audio.musicGain.connect(offline.destination);
 if(kind==='windows'){
  const reader=musicRangeReader({fetch:async()=>{throw Error('Candidate windows require disk cache');}});
  audio.musicWindowPool=new MusicWindowPool(index,{readRange:reader.readRange,decode:data=>offline.decodeAudioData(data)});
  await audio.musicWindowPool.load(track.id,audio.musicWindowPool.at(track.id,offset).window);
 }
 const Transport=kind==='windows'?MusicWindowTransport:MusicTransport;
 audio.transport=new Transport(audio,pack,bank,[{track,buffer:full}],{offset,random});audio.mixer.automatic=false;
 for(let step=0;step<seconds*40;step++){
  facade.currentTime=step*.025;
  if(step===20&&['success','failure'].includes(scenario))audio.mixer.triggerEvent(scenario,facade.currentTime);
  const scene=scenario==='scene-return'?(step<20||step>=800?'day':'minimal'):scenario==='scene-entrance'&&step>=20?'day':initialScene;
  audio.transport.update(scene,facade.currentTime);
  if(audio.musicWindowPool){await Promise.all([...audio.musicWindowPool.pending.values()]);audio.transport.update(scene,facade.currentTime);}
 }
 const history=audio.transport.history.slice(),output=await offline.startRendering();audio.stop();return {output,history};
}
async function compare(mode){
 if(running)return;running=true;const results=[],decoder=new AudioContext({sampleRate:48000});
 try{
  for(const pack of ['a','b']){
   const bank=await json(`/content/music-${pack}.json`),index=await json(`/content/music-windows-${pack}.json`);
   for(const id of mode==='scenes'?['s1','s9']:['s2','s9']){
    const track=bank.tracks.find(t=>t.id===id),full=await decoder.decodeAudioData(await bytes(track.data.url));
    const cases=mode==='scenes'?['scene-entrance','scene-return','success','failure'].map(scenario=>({id:scenario,scenario,offset:29.91327,random:()=>1,seconds:30,initialScene:['scene-entrance','success','failure'].includes(scenario)?'minimal':'day'})):[...bank.navigation.edges.map(edge=>({id:edge.id,offset:bank.navigation.sections.find(s=>s.id===edge.source).end-6,random:()=>0})),{id:'wrap',offset:bank.duration-8,random:()=>1},{id:'natural-fractional',offset:29.91327,random:()=>1}];
    for(const item of cases){
     status.textContent=`Render ${pack}/${id}/${item.id}`;
     const reference=await render('full',pack,bank,index,track,full,item),candidate=await render('windows',pack,bank,index,track,full,item);const comparedSamples=(item.seconds??12)*48000*2;
     let maximumError=0,sum=0,changed=0,referenceEnergy=0;const firstDifferences=[];
     for(let channel=0;channel<2;channel++){
      const original=reference.output.getChannelData(channel),windows=candidate.output.getChannelData(channel);
      for(let sample=0;sample<original.length;sample++){
       const difference=Math.abs(original[sample]-windows[sample]);maximumError=Math.max(maximumError,difference);sum+=difference*difference;referenceEnergy+=original[sample]*original[sample];if(difference>1e-7){changed++;if(firstDifferences.length<8)firstDifferences.push({channel,sample,seconds:sample/48000,original:original[sample],candidate:windows[sample]});}
      }
     }
     results.push({pack,track:id,case:item.id,offset:item.offset,comparedSamples,maximumError,rmsError:Math.sqrt(sum/comparedSamples),changedAbove1e7:changed,firstDifferences,referenceRms:Math.sqrt(referenceEnergy/comparedSamples),referenceHistory:reference.history,candidateHistory:candidate.history});
     report.textContent=JSON.stringify({status:'running',results},null,2);
    }
   }
  }
  status.textContent='Comparación terminada';report.textContent=JSON.stringify({status:'completed',maximumError:Math.max(...results.map(r=>r.maximumError)),totalComparedSamples:results.reduce((sum,r)=>sum+r.comparedSamples,0),results},null,2);
 }catch(error){status.textContent='Error';report.textContent=JSON.stringify({status:'failed',error:error.message,results},null,2);}
 finally{await decoder.close();running=false;}
}
document.querySelector('#run').onclick=()=>compare('seams');document.querySelector('#scenes').onclick=()=>compare('scenes');
</script></html>

<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Ataques originales del bestiario</title>
<style>body{margin:0;background:#e7ddc6;color:#293025;font:15px system-ui}header{position:absolute;z-index:1;left:0;right:0;padding:12px;background:#fff9ed}button,select,input{font:inherit;margin:5px}canvas{width:100vw;height:100vh;display:block}#status{display:block;font-size:13px}</style>
<header>Visor de los cinco GLB originales y el controlador de producción. Orden: facóquero, hiena, búfalo, león, rinoceronte.
<div><label>Ataque <select id="attack"><option value="Right_Hand_Sword_Slash">Tajo derecho</option><option value="Charged_Upward_Slash">Tajo cargado</option><option value="Weapon_Combo">Combo 1</option><option value="Weapon_Combo_2">Combo 2</option></select></label>
<button id="replay">Repetir ataque</button><button id="pause">Pausar</button><label>Fase del clip <input id="phase" type="range" min="0" max="1000" value="0"></label></div><span id="status">Cargando rigs y texturas originales…</span></header>
<canvas id="view" aria-label="Cinco animales originales con ataques completos sin bucle"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Assets,json} from '../../src/rendering/assets.js';
import {prepareAnimalClips,applyAnimalPose,animalGroundSamples} from '../../src/rendering/animal-actions.js';
const canvas=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#e7ddc6');const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(12,9,24);
const controls=new OrbitControls(camera,canvas);controls.target.set(0,1.2,0);controls.update();scene.add(new THREE.HemisphereLight('#fff','#8d7052',2.2));
const sun=new THREE.DirectionalLight('#fff5db',3);sun.position.set(2,10,5);sun.castShadow=true;sun.shadow.camera.left=-15;sun.shadow.camera.right=15;sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:'#c4ae81',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const libraries=(await json('/content/animal-actions.json')).animals,assets=new Assets(),actors=[];
for(const [i,[species,library]] of Object.entries(libraries).entries()){
  const gltf=await assets.model(library.url),model=gltf.scene,root=new THREE.Group();root.position.x=(i-2)*4;root.add(model);scene.add(root);
  model.traverse(mesh=>{if(mesh.isMesh)mesh.castShadow=mesh.receiveShadow=true;});
  actors.push({species,library,model,root,mixer:new THREE.AnimationMixer(model),clips:prepareAnimalClips(gltf.animations),groundSamples:animalGroundSamples(model)});
}
let elapsed=0,last=performance.now(),paused=false,attack='Right_Hand_Sword_Slash',attackId=1;
const maxDuration=()=>Math.max(...actors.map(a=>a.library.clips[attack].duration));
function replay(){elapsed=0;attackId++;paused=false;document.querySelector('#pause').textContent='Pausar';}
document.querySelector('#attack').onchange=e=>{attack=e.target.value;replay();};document.querySelector('#replay').onclick=replay;
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausar';};
document.querySelector('#phase').oninput=e=>{paused=true;elapsed=Number(e.target.value)/1000*maxDuration();document.querySelector('#pause').textContent='Continuar';};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)elapsed=Math.min(maxDuration(),elapsed+dt);
  for(const actor of actors){const duration=actor.library.clips[attack].duration;
    applyAnimalPose(actor,{species:actor.species,status:'attacking',animation:attack,attackId:String(attackId),attackDuration:duration,attackRemaining:Math.max(0,duration-elapsed)},elapsed);
  }
  document.querySelector('#phase').value=Math.min(1000,elapsed/maxDuration()*1000);
  document.querySelector('#status').textContent=attack+' · '+elapsed.toFixed(2)+' / '+maxDuration().toFixed(2)+' s · '+(paused?'tiempo simulado congelado':elapsed===maxDuration()?'clip completo, último fotograma conservado':'animación sin bucle')+' · visor de poses; el daño se comprueba en las pruebas de simulación';
  controls.update();renderer.render(scene,camera);requestAnimationFrame(frame);
}requestAnimationFrame(frame);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></html>

<!doctype html><meta charset="utf-8"><title>QA zero-coverage impostors</title><button id="run">Comparar cobertura cero</button><pre id="report">Preparado</pre><canvas></canvas><script type="module">
import * as THREE from 'three';
import {createFarImpostorPrototype} from '../../tools/experiments/far-impostor-prototype.js';
document.querySelector('#run').onclick=()=>{
 const errors=[],rows=[];let renderer,legacy,pilot,target,source,texture;
 try{
 renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:false});renderer.setSize(256,256);renderer.setClearColor('#314657');renderer.outputColorSpace=THREE.SRGBColorSpace;
 const bytes=new Uint8Array(128*16*4);for(let y=0;y<16;y++)for(let x=0;x<128;x++){const i=(y*128+x)*4;bytes.set([64+x%16*8,130+y*5,60,((x%16-8)**2+(y-8)**2)<55?255:0],i);}
 texture=new THREE.DataTexture(bytes,128,16);texture.needsUpdate=true;texture.magFilter=THREE.LinearFilter;texture.minFilter=THREE.LinearMipmapLinearFilter;
 source=new THREE.Mesh(new THREE.BoxGeometry(),new THREE.MeshBasicMaterial());const metadata={impostorWidth:2,impostorHeight:3,localBase:[0,0,0]},trees=[{id:'tree',x:0,y:0,z:0,yaw:.4,scale:1}];
 const make=cullZeroImpostors=>createFarImpostorPrototype(source,texture,metadata,trees,{start:40,end:60,nativeModels:false,cullZeroImpostors});legacy=make(false);pilot=make(true);
 target=new THREE.WebGLRenderTarget(256,256);target.texture.colorSpace=THREE.SRGBColorSpace;const camera=new THREE.PerspectiveCamera(45,1,.1,250),scene=new THREE.Scene();scene.fog=new THREE.Fog('#b3b5c0',100,200);
 const read=p=>{scene.add(p.impostors);p.update(camera);renderer.setRenderTarget(target);renderer.render(scene,camera);const out=new Uint8Array(256*256*4);renderer.readRenderTargetPixels(target,0,0,256,256,out);scene.remove(p.impostors);return out;};
 const compare=(label)=>{const a=read(legacy),b=read(pilot);let channels=0,max=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i]){channels++;max=Math.max(max,Math.abs(a[i]-b[i]));}rows.push({label,channels,max,glError:renderer.getContext().getError()});};
 for(const distance of [5,45,80])for(const angle of [0,1.1,3.5])for(const ready of [0,.5,1]){camera.position.set(Math.sin(angle)*distance,1+distance*.2,Math.cos(angle)*distance);camera.lookAt(0,1,0);camera.updateMatrixWorld();for(const p of [legacy,pilot])p.setTreeReadiness('tree',ready);compare({distance,angle,ready});}
 for(const p of [legacy,pilot]){p.uniforms.uDensityEnabled.value=1;p.uniforms.uDensityRange.value.set(1,2);p.uniforms.uDensityMinimum.value=0;}compare('density omitted');
 for(const p of [legacy,pilot])p.setTreeEnabled('tree',false);compare('suppressed');
 for(const p of [legacy,pilot]){p.setTreeEnabled('tree',true);p.uniforms.uDensityEnabled.value=0;p.uniforms.uDistanceFadeRange.value.set(1,2);}compare('beyond maximum');
 renderer.setRenderTarget(null);scene.add(pilot.impostors);renderer.render(scene,camera);
 document.querySelector('#report').textContent=JSON.stringify({passed:rows.every(r=>r.channels===0&&r.glError===0),rows,errors,scope:'Isolated billboard shader/texture/coverage readback. Not full-world visual acceptance, GPU timing or residency proof.'},null,2);
 }catch(error){errors.push(String(error));document.querySelector('#report').textContent=JSON.stringify({passed:false,rows,errors},null,2);}
 finally{target?.dispose();legacy?.dispose({disposeTexture:false});pilot?.dispose({disposeTexture:false});source?.geometry.dispose();source?.material.dispose();texture?.dispose();renderer?.dispose();}
};
</script>

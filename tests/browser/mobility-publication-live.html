<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';import {createProjectionReceiver} from './mobility-delta-prototype.js';
window.audit=async options=>{const worker=new Worker(new URL('./mobility-publication-live-worker.js',import.meta.url),{type:'module'});let n=0,resolveReady,rejectReady;const pending=new Map(),ready=new Promise((a,b)=>{resolveReady=a;rejectReady=b;});worker.onerror=e=>rejectReady(Error(e.message));worker.onmessage=({data:d})=>{if(d.kind==='ready')resolveReady();else{const p=pending.get(d.id);if(p){pending.delete(d.id);d.kind==='error'?p.reject(Error(d.error)):p.resolve(d);}else if(d.kind==='error')rejectReady(Error(d.error));}};const send=x=>new Promise((resolve,reject)=>{const id=++n;pending.set(id,{resolve,reject});worker.postMessage({...x,id});});let ref;
try{worker.postMessage({source:options.source,chunks:options.chunks});await ready;ref=await createSimulation({snapshotSource:options.source,chunkKeys:options.chunks});const expected=[],events=[];for(let i=0;i<60;i++){const p=JSON.parse(ref.run(1,.05,{full:false}).projection);events.push(...p.events);delete p.events;expected.push(JSON.stringify(p));}const stats=a=>{const s=[...a].sort((a,b)=>a-b);return {count:s.length,p50:s[Math.floor((s.length-1)*.5)],p95:s[Math.floor((s.length-1)*.95)],p99:s[Math.floor((s.length-1)*.99)],max:s.at(-1)};};const runs=[];
for(const mode of ['snapshot','delta','delta','snapshot']){await send({kind:'begin',mode});const rx=createProjectionReceiver('replay'),rows=[];let ack=0;for(let i=0;i<60;i++){const start=performance.now(),packet=await send({kind:'step',index:i,ack}),applyStart=performance.now(),accepted=rx.accept(packet.packet),applyMs=performance.now()-applyStart;if(!accepted.accepted||JSON.stringify(rx.state().state)!==expected[i])throw Error(`Projection mismatch ${mode} ${i}`);ack=accepted.lastEvent;rows.push({responseMs:applyStart-start,applyMs,buildMs:packet.buildMs,bytes:packet.bytes,byteMs:packet.byteMs});}if(JSON.stringify(rx.state().events.map(e=>e.event))!==JSON.stringify(events))throw Error('Event mismatch');runs.push({mode,events:events.length,responseMs:stats(rows.map(r=>r.responseMs)),applyMs:stats(rows.map(r=>r.applyMs)),buildMs:stats(rows.map(r=>r.buildMs)),bytes:stats(rows.map(r=>r.bytes)),byteMeasurementMs:stats(rows.map(r=>r.byteMs))});}
return {runs,events:events.map(x=>x.type),projectionsEqual:true};}finally{ref?.dispose();worker.terminate();}};window.ready=true;
</script>

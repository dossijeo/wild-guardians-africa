<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Preparar expansión en juego</title>
<p>Origen local de QA. Prepara Sabana/Mapungubwe nativa y un centro pagado, día 101 y 200000 monedas explícitas de prueba. No acredita haber sobrevivido la campaña. Solo guarda qa-village-ui en este origen.</p><button id="open" disabled>Abrir prueba en el juego</button><pre id="status">Preparando…</pre>
<script type="module">
import * as Game from '../../src/simulation/game.js';import {Navigation} from '../../src/world/navigation.js';import {findInitialLocationAsync} from '../../src/world/villages.js';import {SaveRepository} from '../../src/persistence/snapshots.js';import {rational} from '../../src/simulation/money.js';import {json} from '../../src/rendering/assets.js';
const pack=await json('/content/biome-savanna.json'),payload=(await json('/content/villages.json')).find(v=>v.id==='mapungubwe'),state=Game.newGame({seed:712,slotId:'qa-village-ui'}),nav=new Navigation(712,'sabana',pack.profile),place=await findInitialLocationAsync(nav,payload);
Object.assign(state.villages[0],place);state.suppressed.push(...place.suppress);nav.setState(state);Game.resume(state,'intro');Game.placeStructure(state,'qa-paid-center',place.center,nav);
const victory=new URLSearchParams(location.search).has('victory');
if(victory){let site;for(let z=-6;z<=6&&!site;z+=1.5)for(let x=6;x<15&&!site;x+=1.5){const p={x:place.center.x+x,z:place.center.z+z};if(nav.placement(p.x,p.z,.4).valid)site=p;}if(!site)throw new Error('Falta cultivo nativo legal');Game.plant(state,'qa-paid-mijo','mijo',site.x,site.z,nav);}
state.day=victory?100:101;state.completedNights=victory?99:100;state.postgame=!victory;state.initialPreparation=false;state.tutorial.step='done';state.time=victory?599.9:30;state.dayPlan={day:state.day,done:true};state.nightPlan=victory?{done:true,group:[]}:null;state.hiringPaidDay=state.day;state.ledger.balance=rational(200000);
if(victory){state.slotId='qa-victory-ui';document.querySelector('p').textContent='QA de victoria: Sabana/Mapungubwe nativa, centro y mijo pagados. Prepara noche 100 a 0,1 segundos del amanecer, 200000 monedas explícitas. El reloj real del juego debe resolver la victoria; no acredita haber jugado las 99 noches previas. Solo guarda qa-victory-ui en este origen.';}
document.querySelector('#status').textContent=JSON.stringify({slot:state.slotId,day:state.day,money:state.ledger.balance,place},null,2);document.querySelector('#open').disabled=false;document.querySelector('#open').onclick=()=>{new SaveRepository(localStorage).save(state);location.href='../../';};
</script></html>

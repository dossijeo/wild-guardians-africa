<!doctype html><html lang="en"><meta charset="utf-8"><title>Biome atlases · Tinify comparison</title>
<style>body{background:#e2d6b9;color:#322719;font:14px system-ui;margin:12px}canvas{display:block;width:960px;max-width:100%;height:auto}header{display:flex;gap:16px;align-items:center}.labels{display:flex;justify-content:space-around;width:960px;max-width:100%}pre{font-size:11px;max-height:160px;overflow:auto}</style>
<h1>Native biome props — original / Tinify</h1><header><label>Biome <select id="biome"></select></label><button id="phase">Show night</button><span id="status">Loading...</span></header>
<div class="labels"><b>Original atlas</b><b>Tinify WebP atlas</b></div><canvas width="960" height="460"></canvas><pre id="report">Loading...</pre>
<script type="module">
import * as THREE from 'three';
import items from '../../docs/qa/tinify-biome-atlases/items.json';
import {Assets,json} from '../../src/rendering/assets.js';
import {nativeAssetMaterial} from '../../src/rendering/asset-surface.js';
import {AfricanToon} from '../../src/rendering/african-toon.js';
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true}),camera=new THREE.PerspectiveCamera(40,480/460,.1,100);
renderer.setSize(960,460,false);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;camera.position.set(10,7,18);camera.lookAt(0,1.5,0);
const select=document.querySelector('#biome'),button=document.querySelector('#phase'),status=document.querySelector('#status'),result={done:false,ok:false,rows:[],errors:[]};
for(const item of items){const option=document.createElement('option');option.value=item.name;option.textContent=item.name;select.append(option);}
let prototypes=[],scenes=[],toons=[],lights=[],extraTextures=[],night=false,loading=false;
addEventListener('error',e=>result.errors.push(e.message));addEventListener('unhandledrejection',e=>result.errors.push(String(e.reason)));
const baseIds={savanna:'sabana',grand_river:'gran-rio',mangrove:'manglares',volcanoes:'volcanes',canyons:'gran-canon',desert:'desierto'};
function release(){const resources=new Set(extraTextures);for(const mesh of prototypes.flat()){resources.add(mesh.geometry);resources.add(mesh.material);for(const value of Object.values(mesh.material))if(value?.isTexture)resources.add(value);}for(const scene of scenes)scene.traverse(mesh=>{if(mesh.isMesh)resources.add(mesh.material);});for(const value of resources)value.dispose();prototypes=[];scenes=[];extraTextures=[];toons=[];lights=[];}
function draw(){renderer.setScissorTest(true);for(let side=0;side<2;side++){const scene=scenes[side],sun=lights[side];scene.background=new THREE.Color(night?'#283245':'#d1d9b8');scene.children.find(o=>o.isHemisphereLight).intensity=night?.3:1.6;sun.intensity=night?.35:3;sun.color.set(night?'#718dc4':'#ffe2a8');toons[side].update(night,sun,baseIds[select.value]);renderer.setViewport(side*480,0,480,460);renderer.setScissor(side*480,0,480,460);renderer.render(scene,camera);}const error=renderer.getContext().getError();if(error)throw Error('WebGL '+error);status.textContent=select.value+' / '+(night?'night':'day')+' / native material + toon / errors '+result.errors.length;button.textContent=night?'Show day':'Show night';}
async function load(){if(loading)return;loading=true;select.disabled=button.disabled=true;result.done=false;result.ok=false;status.textContent='Loading...';release();try{
 const item=items.find(r=>r.name===select.value),pack=await json('/content/biome-'+item.name+'.json'),assets=new Assets();prototypes=await assets.biome(pack);
 const maps=[];for(const source of [item.source,item.candidate]){const url=new URL('../../'+source,document.URL),response=await fetch(url);if(!response.ok)throw Error('Atlas HTTP '+response.status);const bytes=await response.arrayBuffer(),hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),n=>n.toString(16).padStart(2,'0')).join('');if(hash!== (source===item.source?item.sourceSha256:item.candidateSha256))throw Error('Atlas hash mismatch');const img=new Image();img.src=url.href;await img.decode();if(img.naturalWidth!==2048||img.naturalHeight!==2048)throw Error('Atlas dimensions changed');const texture=await new THREE.TextureLoader().loadAsync(url.href);texture.colorSpace=THREE.SRGBColorSpace;texture.flipY=false;maps.push(texture);extraTextures.push(texture);}
 for(let side=0;side<2;side++){const scene=new THREE.Scene(),toon=new AfricanToon(),sun=new THREE.DirectionalLight('#ffe2a8',3);sun.position.set(-30,55,25);scene.add(sun,new THREE.HemisphereLight('#e5e8ce','#776549',1.6));for(const [column,index] of [0,4,10].entries()){const source=prototypes[index][0],bounds=source.geometry.boundingBox,textures={baseColor:maps[side],normal:source.material.normalMap,metallicRoughness:source.material.roughnessMap},material=nativeAssetMaterial(pack,pack.assets[index],index,textures,bounds),mesh=new THREE.Mesh(source.geometry,material),size=bounds.getSize(new THREE.Vector3()),scale=3/Math.max(size.y,.1);mesh.scale.setScalar(scale);mesh.position.set((column-1)*4-(bounds.min.x+bounds.max.x)*scale/2,-bounds.min.y*scale,-(bounds.min.z+bounds.max.z)*scale/2);scene.add(mesh);toon.material(material);}scenes.push(scene);toons.push(toon);lights.push(sun);}
 draw();result.rows.push({biome:item.name,phase:night?'night':'day',width:2048,height:2048,original:item.source,candidate:item.candidate,props:[0,4,10],webglError:0});result.ok=!result.errors.length;
 }catch(error){result.errors.push(String(error.stack??error));status.textContent='Failed';}finally{result.done=true;loading=false;select.disabled=button.disabled=false;document.querySelector('#report').textContent=JSON.stringify(result,null,2);}}
select.addEventListener('change',load);button.addEventListener('click',()=>{night=!night;try{draw();result.rows.push({biome:select.value,phase:night?'night':'day',props:[0,4,10],webglError:0});result.ok=!result.errors.length;}catch(error){result.errors.push(String(error));result.ok=false;}document.querySelector('#report').textContent=JSON.stringify(result,null,2);});
addEventListener('pagehide',()=>{release();renderer.dispose();renderer.forceContextLoss();},{once:true});load();
</script></html>

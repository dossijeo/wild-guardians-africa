<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Pisadas nativas en suelo plano</title>
<style>body{margin:0;font:14px system-ui}header{position:absolute;z-index:2;background:#fff9ed;padding:10px}button,select{padding:8px}canvas{display:block;width:100vw;height:100vh}</style>
<header>Prueba aislada sobre suelo plano: comandos pagados, recorrido y animaciones originales. Sin guardados de usuario.<br>
<label>Trabajador <select id="profile"><option value="olderMale">Hombre mayor</option><option value="olderFemale">Mujer mayor</option><option value="youngMale">Hombre joven</option><option value="youngFemale">Mujer joven</option></select></label>
<button id="feet" disabled>Ver pies</button><button id="next" disabled>Buscar siguiente pisada</button><button id="step" disabled>Avanzar 0,1 s</button><button id="reload" disabled>Recargar en memoria</button><div id="status">Cargando…</div></header><canvas id="world"></canvas>
<script type="module">
import * as THREE from 'three';
import {clone} from 'three/addons/utils/SkeletonUtils.js';
import {Assets,json} from '../../src/rendering/assets.js';
import {applyWorkerPose} from '../../src/rendering/worker-actions.js';
import {LocomotionVfx} from '../../src/rendering/locomotion-vfx.js';
import {BuildingDestructionPass} from '../../src/rendering/buildings.js';
import {VfxLibrary} from '../../src/rendering/vfx.js';
import {Navigation} from '../../src/world/navigation.js';
import {serialize,deserialize} from '../../src/persistence/snapshots.js';
import * as Game from '../../src/simulation/game.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();scene.background=new THREE.Color('#d3dac6');scene.add(new THREE.HemisphereLight('#fff4df','#706746',2));
const sun=new THREE.DirectionalLight('#fff3db',3);sun.position.set(-4,8,5);scene.add(sun);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:'#806c48',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
const assets=new Assets(),profiles=await json('/content/worker-actions.json'),catalog=await json('/content/vfx.json'),library=new VfxLibrary(catalog,await assets.texture(catalog.atlas));
const pipeline=new BuildingDestructionPass(renderer,sun),manager=new LocomotionVfx(library,pipeline,scene,()=>0);
let state,nav,root,data,feet=false;
function status(){const worker=state.workers[0];document.querySelector('#status').textContent=`${worker.profile} · ${worker.status} · tiempo ${state.elapsed.toFixed(2)} s · saldo ${state.ledger.balance.n} · pisadas ${manager.effects.size} · ${[...manager.effects.values()].map(e=>`${e.native.time.toFixed(3)} s / ${e.sprites.geometry.instanceCount} sprites / ${e.native.rigids.length} sólidos`).join('; ')}`;}
function pose(){const worker=state.workers[0];root.position.set(worker.x,0,worker.z);root.rotation.y=worker.heading??0;applyWorkerPose(data,worker,state.tasks.find(t=>t.id===worker.taskId),state.elapsed,profiles[worker.profile]);}
function draw(){pose();manager.update(state,new Map([[state.workers[0].id,root]]));const worker=state.workers[0];camera.position.set(worker.x+(feet?1:3),feet?.7:2.3,worker.z+(feet?1.2:3.6));camera.lookAt(worker.x,feet?.15:.8,worker.z);if(manager.prepare(camera))pipeline.captureDepth(camera,scene);renderer.render(scene,camera);status();}
async function setup(){document.querySelectorAll('button,select').forEach(b=>b.disabled=true);manager.dispose();if(root){scene.remove(root);data.mixer.stopAllAction();data.mixer.uncacheRoot(data.model);}
 state=Game.newGame({seed:712});Game.resume(state,'intro');state.tutorial.step='center';
 nav=Object.create(Navigation.prototype);nav.field={blocked:()=>false,slope:()=>0};nav.propsAt=()=>[];nav.chunks=new Map();nav.walkCache=new Map();nav.segmentCache=new Map();nav.failedPaths=new Set();nav.closedRegions=new Map();nav.searchedRegions=[];nav.obstacles=[];
 Game.placeStructure(state,'qa-center',{x:12,z:8},nav);Game.plant(state,'qa-seed','mijo',18,8,nav);Game.openInitialHiring(state);Game.hire(state,'qa-hire',{[document.querySelector('#profile').value]:1});Game.pause(state,'qa');
 const gltf=await assets.model(profiles[state.workers[0].profile].url),model=clone(gltf.scene);root=new THREE.Group();root.add(model);scene.add(root);data={model,mixer:new THREE.AnimationMixer(model),clips:gltf.animations,name:null};draw();document.querySelectorAll('button,select').forEach(b=>b.disabled=false);
}
function step(){Game.resume(state,'qa');Game.tick(state,.05,nav);Game.pause(state,'qa');pose();manager.update(state,new Map([[state.workers[0].id,root]]));}
document.querySelector('#feet').onclick=()=>{feet=!feet;draw();};document.querySelector('#next').onclick=()=>{const previous=new Set(manager.effects.keys());for(let i=0;i<1000;i++){step();if([...manager.effects.keys()].some(k=>!previous.has(k)))break;}draw();};
document.querySelector('#step').onclick=()=>{step();step();draw();};
document.querySelector('#reload').onclick=()=>{state=deserialize(serialize(state));nav.setState(state);draw();};
document.querySelector('#profile').onchange=()=>setup().catch(e=>document.querySelector('#status').textContent=e.message);
await setup();addEventListener('pagehide',()=>{manager.dispose();library.dispose();pipeline.dispose();renderer.dispose();});
</script></html>

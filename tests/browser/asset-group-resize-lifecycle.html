<!doctype html><meta charset="utf-8"><title>Asset group resize lifecycle QA</title><canvas></canvas><pre id="report">Running real WebGL lifecycle…</pre><script type="module">
import * as THREE from 'three';

 }

finally{probe.dispose();resources.dispose();renderer.dispose();renderer.forceContextLoss();}
</script>

<!doctype html><html lang="es"><meta charset="utf-8"><title>QA CULT V4 en WorldScene</title>
<style>body{margin:0;font:14px system-ui}canvas{width:100vw;height:100vh;display:block}header{position:absolute;z-index:2;background:#fff9ed;padding:8px;max-width:95vw}pre{max-height:30vh;overflow:auto;font-size:11px}button{padding:8px}</style>
<header><details open><summary>CULT V4: ocho especies y cinco fases</summary><p>WorldScene, navegación y terreno nativos. Crédito QA explícito de 1600 monedas; centro y semillas pagados. Sin trabajadores ni guardados de usuario. Las fases y el reloj son controles QA explícitos.</p><button id="plant" disabled>Plantar las ocho especies</button><button id="rotate" disabled>Girar cámara</button><button id="stage" disabled>Siguiente fase</button><button id="bridge" disabled>Puente</button><button id="night" disabled>Día / noche</button><button id="wind" disabled>Viento 6s</button><button id="finish" disabled>Guardar evidencia y cerrar GPU</button><span id="status">Cargando…</span><pre id="report"></pre></details></header><canvas id="world"></canvas>
<script type="module">
import * as Game from '../../src/simulation/game.js';
import {rational,numberOf} from '../../src/simulation/money.js';
import {cropSpec} from '../../src/simulation/rules.js';
import {Navigation} from '../../src/world/navigation.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {WorldScene} from '../../src/rendering/scene.js';
import {json} from '../../src/rendering/assets.js';
const ids=['maiz','algodon','girasol','platano','sorgo','mijo','yuca','batata'];
const status=document.querySelector('#status'),report=document.querySelector('#report'),errors=[];
const fail=e=>{errors.push(String(e.message??e));status.textContent='FAIL: '+errors.join(' · ');};
addEventListener('error',fail);addEventListener('unhandledrejection',e=>fail(e.reason));
let world,state,nav,plots,turn=0,ledger=[],stage=0,captures=[];
const marks=[.065,.27,.53,.78,1];
function focus(){const p=plots[3],q=plots[4],x=(p.x+q.x)/2,z=(p.z+q.z)/2,y=nav.field.surface(x,z);world.controls.target.set(x,y+.2,z);world.camera.position.set(x+Math.sin(turn)*7,y+5,z+Math.cos(turn)*7);world.controls.update();}
async function draw(){world.updateCamera();world.syncChunks();await world.whenChunksReady();world.render(0);const glError=world.renderer.getContext().getError();if(glError)throw Error('WebGL '+glError);
 const samples=state.plants.map(p=>({id:p.id,species:p.species,alive:p.alive,growth:p.growth,water:p.water,render:world.cropBatch.sample(p.species,p.growth)}));
 const meshes=world.scene.children.filter(m=>m.isInstancedMesh&&m.visible&&m.count&&m.geometry.hasAttribute('iGrowth')).map(m=>({name:m.name,count:m.count,growth:Array.from(m.geometry.getAttribute('iGrowth').array.slice(0,4))}));
 report.textContent=JSON.stringify({biome:state.biome,culture:state.culture,terrainVersion:state.terrainVersion,balance:numberOf(state.ledger.balance),elapsed:state.elapsed,workers:state.workers.length,plots,ledger,samples,meshes,errors},null,2);
 status.textContent=`V4 fase ${stage+1}: ${samples.length}/8 plantas · saldo ${numberOf(state.ledger.balance)} · reloj ${state.elapsed} · errores ${errors.length}`;
}
try{
 const pack=await json('/content/biome-savanna.json'),payload=(await json('/content/villages.json')).find(v=>v.id==='mapungubwe');
 state=Game.newGame({biome:'sabana',culture:'mapungubwe',seed:712,slotId:'qa-sprouts-no-save'});nav=new Navigation(712,'sabana',pack.profile);const place=await findInitialLocationAsync(nav,payload);Object.assign(state.villages[0],place);state.suppressed.push(...place.suppress);nav.setState(state);
 state.ledger.balance=rational(1600);Game.resume(state,'intro');Game.placeStructure(state,'qa-paid-center',place.center,nav);
 search:for(let dz=-18;dz<=18;dz+=1.5)for(let dx=-18;dx<=18;dx+=1.5){const x=Math.round((place.center.x+dx)/1.5)*1.5,z=Math.round((place.center.z+dz)/1.5)*1.5,candidate=ids.map((_,i)=>({x:x+(i%4)*1.5,z:z+Math.floor(i/4)*1.5}));if(candidate.every(p=>nav.placement(p.x,p.z,.4).valid)){plots=candidate;break search;}}
 if(!plots)throw Error('Faltan ocho parcelas legales contiguas');
 world=new WorldScene(document.querySelector('#world'),()=>{});world.onError=fail;world.qualitySetting('media');await world.load(state,nav,payload);focus();await draw();
 document.querySelector('#plant').disabled=false;document.querySelector('#plant').onclick=async()=>{try{document.querySelector('#plant').disabled=true;for(const [i,species] of ids.entries()){const before=numberOf(state.ledger.balance),p=plots[i];Game.plant(state,'qa-sprout-'+i,species,p.x,p.z,nav);ledger.push({species,expected:cropSpec(species).plant_cost,charged:before-numberOf(state.ledger.balance)});}world.syncResidentProps();await draw();for(const id of ['rotate','stage','bridge','night','wind','finish'])document.querySelector('#'+id).disabled=false;}catch(e){fail(e);}};
 document.querySelector('#rotate').onclick=async()=>{try{turn+=Math.PI/2;focus();await draw();}catch(e){fail(e);}};

 document.querySelector('#stage').onclick=async()=>{stage=(stage+1)%5;for(const p of state.plants)p.growth=marks[stage]*cropSpec(p.species).growth_seconds;await draw();};
 document.querySelector('#bridge').onclick=async()=>{const from=Math.min(stage,3);for(const p of state.plants){const duration=cropSpec(p.species).growth_seconds;p.growth=(marks[from]+.81*(marks[from+1]-marks[from]))*duration;}await draw();};
 document.querySelector('#night').onclick=async()=>{state.elapsed=state.elapsed===150?450:150;await draw();};
 document.querySelector('#wind').onclick=async()=>{document.querySelector('#wind').disabled=true;const start=performance.now(),elapsed=state.elapsed;while(performance.now()-start<6000){state.elapsed=elapsed+(performance.now()-start)/1000;await draw();await new Promise(requestAnimationFrame);}document.querySelector('#wind').disabled=false;};
 document.querySelector('#finish').onclick=async()=>{await draw();world.render(0);const png=document.querySelector('#world').toDataURL('image/png'),payload=JSON.parse(report.textContent);payload.recipeVersion=world.cropBridgeData.recipeVersion;payload.sides=world.scene.children.filter(m=>m.geometry?.getAttribute('iGrowth')||m.geometry?.getAttribute('iBridge')).map(m=>({name:m.name,side:m.material.side,shadowSide:m.material.shadowSide,depthSide:m.customDepthMaterial.side}));world.dispose();payload.cleanup={closed:true,contextLost:world.renderer.getContext().isContextLost()};await fetch('/__crops_v4_report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({report:payload,png})});const image=new Image();image.src=png;image.style='width:100%;height:auto';document.querySelector('#world').replaceWith(image);status.textContent='CULT V4 exportado; GPU cerrada';};
 addEventListener('pagehide',()=>world.dispose(),{once:true});
}catch(e){fail(e);}
</script></html>

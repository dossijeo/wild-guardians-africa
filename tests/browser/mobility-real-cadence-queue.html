<!doctype html><html><body><canvas id="view" width="128" height="128"></canvas><script type="module">

window.audit=async()=>{const commands=[{kind:'advance',seconds:.011},{kind:'advance',seconds:.031},{kind:'pause'},{kind:'advance',seconds:.05},{kind:'resume'},{kind:'advance',seconds:.017},{kind:'advance',seconds:.025}],worker=new Worker('./mobility-real-cadence-worker.js',{type:'module'}),gl=document.querySelector('canvas').getContext('webgl2'),frames=[],result=[];let active=true,frame=0;const render=t=>{if(!active)return;frames.push(t);gl.clearColor((frame++%255)/255,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);requestAnimationFrame(render);};requestAnimationFrame(render);

al WebGL canvas; no input, world scene, physics, secure horizon or lost-message recovery.'};}finally{active=false;worker.terminate();}};window.ready=true;

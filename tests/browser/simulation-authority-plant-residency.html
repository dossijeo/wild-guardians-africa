<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';
import {serialize} from '../../src/persistence/snapshots.js';
import {createSimulationAuthorityClient} from '../../src/simulation/simulation-authority-client.js';
window.audit=async()=>{
 const chunks=[];for(let z=-1;z<=2;z++)for(let x=0;x<=5;x++)chunks.push(`${x},${z}`);
 const full=await createSimulation({mangrove:true,chunkKeys:chunks}),{game,nav}=full.diagnosticWorld();game.raid=null;game.time=100;game.pauses=[];nav.setState(game);const existing=game.plants.find(p=>p.alive),center=game.structures.find(s=>s.kind==='center'&&s.status==='intact');if(!existing||!center)throw Error('Missing farm fixture');
 let site=null;for(let dz=-20;dz<=20&&!site;dz++)for(let dx=-20;dx<=20&&!site;dx++){const x=center.x+dx,z=center.z+dz;let check;try{check=nav.placement(x,z,.4);}catch(error){if(error.name==='SpatialChunkUnavailable')continue;throw error;}if(check.valid&&!game.plants.some(p=>p.alive&&Math.hypot(p.x-x,p.z-z)<1.1))site={x,z};}if(!site)throw Error('No planting site');
 const source=serialize(game),partial=await createSimulation({mangrove:true,chunkKeys:[],snapshotSource:source});let missing,blocked=null;
 try{
  try{partial.diagnosticWorld().nav.placement(site.x,site.z,.4);throw Error('Expected unknown region');}catch(error){if(error.name!=='SpatialChunkUnavailable')throw error;missing=error.missing;}
  for(let dz=-20;dz<=20&&!blocked;dz++)for(let dx=-20;dx<=20&&!blocked;dx++){const x=center.x+dx,z=center.z+dz;let check;try{check=nav.placement(x,z,.4);}catch(error){if(error.name==='SpatialChunkUnavailable')continue;throw error;}if(check.reason!=='Un árbol o roca grande ocupa este terreno')continue;try{partial.diagnosticWorld().nav.placement(x,z,.4);}catch(error){if(error.name!=='SpatialChunkUnavailable')throw error;blocked={x,z};}}
  if(!blocked)throw Error('No initially unknown site blocked by a prop');
 }finally{partial.dispose();full.dispose();}
 const complete=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,session:'plant-full'}),empty=createSimulationAuthorityClient({snapshot:source,chunkKeys:[],session:'plant-empty'});
 try{
  await Promise.all([complete.ready,empty.ready]);const command={kind:'plant',id:'resident-plant',species:existing.species,...site},a=complete.submit(command),b=empty.submit(command);if(!a.accepted||!b.accepted)throw Error('Command not admitted');const [expected,actual]=await Promise.all([a.result,b.result]);
  if(!expected.value||!actual.value||!actual.commandLoadedChunks?.length||expected.snapshot!==actual.snapshot||JSON.stringify(expected.events)!==JSON.stringify(actual.events))throw Error('Resident planting diverged: '+JSON.stringify({expected:expected.value,actual:actual.value,loaded:actual.commandLoadedChunks,rejection:actual.rejection}));
  const follow=empty.submit({kind:'snapshot'});if(!follow.accepted||(await follow.result).sequence!==2||empty.status().state!=='ready')throw Error('Worker did not continue');
  const otherFull=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,session:'blocked-full'}),otherEmpty=createSimulationAuthorityClient({snapshot:source,chunkKeys:[],session:'blocked-empty'});let blockedResult;
  try{await Promise.all([otherFull.ready,otherEmpty.ready]);const input={kind:'plant',id:'blocked-plant',species:existing.species,...blocked},left=otherFull.submit(input),right=otherEmpty.submit(input),[known,discovered]=await Promise.all([left.result,right.result]);if(known.value!==false||discovered.value!==false||!known.rejection||known.rejection!==discovered.rejection||!discovered.commandLoadedChunks?.length||known.snapshot!==discovered.snapshot||discovered.events.length)throw Error('Blocked prop was not preserved');const retry=otherEmpty.submit({kind:'snapshot'});if(!retry.accepted||(await retry.result).sequence!==2||otherEmpty.status().state!=='ready')throw Error('Worker did not continue after blocked placement');blockedResult={site:blocked,rejection:discovered.rejection,loaded:discovered.commandLoadedChunks};}finally{otherFull.dispose();otherEmpty.dispose();}
  return {site,initialMissing:missing,loaded:actual.commandLoadedChunks,events:actual.events.map(e=>e.type),sequence:2,equalSnapshot:true,blocked:blockedResult,scope:'Programmatic valid and prop-blocked planting commands in a modified peaceful island-mangrove capture. Compares initially empty Worker residency against preloaded regions; no player UI, save/restore, concurrent geometry changes or production integration.'};
 }finally{complete.dispose();empty.dispose();}
};window.ready=true;
</script>

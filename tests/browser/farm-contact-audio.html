<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Contactos agrícolas originales</title>
<p>Cuatro primeros días pagados y dos casos de raíces en postgame con créditoQA10000. Navegación dirigida sin obstáculos, sin mundo3D; Game y MP3/WebAudio reales. Salida silenciada, sin evaluación auditiva. Las raíces crecen/regan normalmente y se contrata al amanecer.</p><button id="run">Probar agricultura nativa</button><output id="status">Lista</output><pre id="report"></pre>
<script type="module">
import * as Game from '../../src/simulation/game.js';
import {isMature} from '../../src/simulation/crops.js';
import {rational} from '../../src/simulation/money.js';
import {serialize} from '../../src/persistence/snapshots.js';
import {AudioSystem} from '../../src/audio/audio.js';
import {FARM_CONTACT_IDS} from '../../src/audio/farm-contact-audio.js';
import {PROFILES} from '../../src/simulation/workforce.js';
const nav={placement:()=>({valid:true,suppress:[]}),setState(){},walkable:()=>true,path:(_a,b)=>[{x:b.x,z:b.z}]};
const errors=[],history=[],decoded=[],status=document.querySelector('#status'),report=document.querySelector('#report'),ids=[...FARM_CONTACT_IDS,'farm_watering_can','farm_crop_to_crate','ui_buy'];let live=null,currentState=null,accepted=[];
const assert=(v,message)=>{if(!v)throw Error(message);};const dispose=()=>{if(live){live.dispose();live=null;}};addEventListener('pagehide',dispose);addEventListener('error',e=>errors.push(String(e.error??e.message)));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 const audio=live=new AudioSystem({sfx:0,music:0});await audio.unlock();audio.sfx=await audio.sfxBank();status.textContent='Decodificando nueve originales';await Promise.all(ids.map(async id=>{const item=audio.sfx.items.find(i=>i.id===id),buffer=await audio.buffer(item.audio.url);decoded.push({id,channels:buffer.numberOfChannels,sampleRate:buffer.sampleRate,duration:buffer.duration});}));
 const original=audio.sound.bind(audio);audio.sound=async(id,options={})=>{const source=await original(id,options);if(source&&ids.includes(id)){const worker=currentState.workers.find(w=>w.id===options.emitter),task=currentState.tasks.find(t=>t.id===worker?.taskId),voice=audio.voices.get(source);assert(source.playbackRate.value===1&&!source.loop,'Tono/bucle cambiado');accepted.push({id,elapsed:currentState.elapsed,day:currentState.day,profile:worker?.profile??null,status:worker?.status??null,task:task?.kind??null,remaining:worker?.actionRemaining??null,emitter:voice.emitter??null,family:voice.family,bus:voice.bus,rate:source.playbackRate.value});}return source;};
 const cases=[...PROFILES.map(p=>({profile:p.id,species:'mijo',rootQA:false})),...['batata','yuca'].map(species=>({profile:'olderFemale',species,rootQA:true}))];
 for(const spec of cases){
  status.textContent=spec.profile+' '+spec.species;audio.stop();audio.remember([]);accepted=[];const s=currentState=Game.newGame({seed:712,slotId:'qa-native-farm-'+spec.profile+'-'+spec.species});Game.resume(s,'intro');s.tutorial.step='done';if(spec.rootQA){s.day=101;s.completedNights=100;s.postgame=true;s.initialPreparation=false;s.ledger.balance=rational(10000);}
  Game.placeStructure(s,'center',{x:4,z:0},nav);Game.plant(s,'seed',spec.species,10,4,nav);if(spec.rootQA)Game.pause(s,'hiring');else Game.openInitialHiring(s);Game.hire(s,'hire-'+s.day,{[spec.profile]:1});audio.updateFarm(s);let steps=0,peakEmitter=0;
  while(!s.crates.some(c=>c.delivered)&&steps++<24000&&!s.result){if(s.pauses.includes('hiring'))Game.hire(s,'hire-'+s.day,{[spec.profile]:1});if(isMature(s.plants[0])&&!s.plants[0].harvestRequested)Game.harvest(s,'harvest',s.plants[0].id);Game.advanceReal(s,.05,nav);const before=serialize(s);audio.process(s.events,{state:s,listener:{x:0,z:0}});audio.updateWork(s,{listener:{x:0,z:0}});audio.updateFarm(s,{listener:{x:0,z:0}});assert(serialize(s)===before,'Audio cambia dominio');await new Promise(done=>setTimeout(done,0));const counts=new Map();for(const v of audio.voices.values())if(!v.music&&v.emitter){counts.set(v.emitter,(counts.get(v.emitter)??0)+1);peakEmitter=Math.max(peakEmitter,counts.get(v.emitter));}assert(peakEmitter<=2,'Presupuesto de emisor superado');}
  assert(s.crates.filter(c=>c.delivered).length===1,'No entrega única');const taken=accepted.map(c=>c.id);for(const id of ['ui_buy','farm_sow','farm_seeds_drop','farm_watering_can','farm_water_soil','farm_crop_to_crate',spec.rootQA?'farm_plant_pull':'farm_harvest_pick'])assert(taken.includes(id),'Falta '+id);assert(taken.filter(id=>id===(spec.rootQA?'farm_plant_pull':'farm_harvest_pick')).length===1,'Contacto de cosecha duplicado');assert(s.events.filter(e=>e.type==='CropPicked').length===1&&s.events.filter(e=>e.type==='CrateDelivered').length===1,'Ingreso/cosecha duplicado');audio.stop();assert(audio.active.length===0&&audio.farm.entries.size===0&&audio.work.entries.size===0,'Actividad sin liberar');history.push({...spec,steps,day:s.day,simulatedSeconds:s.elapsed,peakEmitter,accepted:[...accepted],finalVoices:audio.active.length});
 }
 dispose();await new Promise(done=>setTimeout(done,80));assert(audio.context.state==='closed','Contexto abierto');report.textContent=JSON.stringify({history,decoded,errors,muted:true,world3D:false,context:audio.context.state},null,2);status.textContent='Completada';
 }catch(e){errors.push(String(e));report.textContent=JSON.stringify({history,decoded,errors},null,2);status.textContent='FAIL: '+e.message;dispose();}};
</script></html>

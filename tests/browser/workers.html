<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Acciones nativas de trabajadores</title><style>
body{margin:0;background:#eee7d6;font:16px system-ui;color:#292d24}header{padding:12px;background:#fff9ed;position:absolute;z-index:1;left:0;right:0}canvas{display:block;width:100vw;height:100vh}button,select{font:inherit;margin:4px;padding:6px}#status{display:block;font-size:13px}
</style><header>Prueba visual de los cuatro GLB exportados y el controlador de producción.
<label>Acción <select id="action"><option value="idle">Reposo</option><option value="ambient">Espera autónoma · reposo/vigilancia/paseo</option><option value="walking">Caminar · 0,72 m/s</option><option value="running">Carrera laboral · 1,6 m/s</option><option value="initial">Siembra + primer riego</option><option value="water">Regar</option><option value="harvest">Cosechar</option><option value="carrying">Transportar caja</option><option value="fleeing">Huir</option><option value="slow-flight">Retirada ralentizada</option><option value="transition">Transición de caída (candidato)</option><option value="recovery">Levantarse (candidato)</option><option value="fall">Caída</option></select></label><button id="pause">Pausar</button><span id="status">Cargando geometría, texturas y rigs originales…</span></header><canvas id="view" aria-label="Cuatro trabajadores con acciones originales, de izquierda a derecha: hombre mayor, mujer mayor, hombre joven y mujer joven"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {clone} from 'three/addons/utils/SkeletonUtils.js';
import {Assets,json} from '../../src/rendering/assets.js';
import {prepareWorkerClips} from '../../src/rendering/worker-clips.js';
import {applyWorkerPose} from '../../src/rendering/worker-actions.js';
import {applyActorExpression} from '../../src/rendering/actor-expression.js';
import {PROFILES} from '../../src/simulation/workforce.js';
import {LOCOMOTION as L} from '../../src/simulation/locomotion-calibration.js';
import {updateIdle} from '../../src/simulation/idle.js';
const canvas=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#eee7d6');const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,60);camera.position.set(5,3.3,8.5);
const controls=new OrbitControls(camera,canvas);controls.target.set(0,.85,0);controls.update();
const ambient=new THREE.HemisphereLight('#ffffff','#8b7353',2.2);scene.add(ambient);const sun=new THREE.DirectionalLight('#fff5db',3);sun.position.set(1,5,4);sun.castShadow=true;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#ccb78c',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const assets=new Assets(),libraries=await json('/content/worker-actions.json'),actors=[];
for(const [i,profile] of PROFILES.entries()){
 const gltf=await assets.model(libraries[profile.id].url),model=clone(gltf.scene);model.position.x=(i-1.5)*2;model.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;if(o.isSkinnedMesh)o.frustumCulled=false;});scene.add(model);
 const recoveryData=await json('/content/source/animations/stand-up/workers/'+profile.id+'-candidate.json');
 const recovery=THREE.AnimationClip.parse(recoveryData.clip);
 const transition=THREE.AnimationClip.parse((await json('/content/source/animations/stand-up/workers/'+profile.id+'-transition.json')).clip);
 actors.push({profile,model,mixer:new THREE.AnimationMixer(model),clips:[...prepareWorkerClips(gltf.animations),recovery,transition],recovery,transition,name:null});
}
const review=document.createElement('span');review.innerHTML='<label> Tiempo <input id="reviewTime" type="number" min="0" max="60" step="0.02" value="0"></label><button id="focusKofi">Rostro de Kofi</button><button id="blinkKofi">Cierre de parpadeo Kofi</button>';document.querySelector('header').append(review);
function seek(value){elapsed=value;paused=true;document.querySelector('#pause').textContent='Continuar';document.querySelector('#reviewTime').value=value;}
document.querySelector('#reviewTime').oninput=e=>seek(Number(e.target.value));
document.querySelector('#focusKofi').onclick=()=>{const a=actors.find(a=>a.profile.id==='youngMale'),head=a.model.getObjectByName('mixamorigHead');head.getWorldPosition(controls.target);camera.position.copy(controls.target).add(new THREE.Vector3(.55,.1,1.5).applyAxisAngle(new THREE.Vector3(0,1,0),a.model.rotation.y));controls.update();};
document.querySelector('#blinkKofi').onclick=()=>{const a=actors.find(a=>a.profile.id==='youngMale'),phase=a.expression.phase,period=3.4+phase*2;seek(period-phase*period+.07);};
const torsoButton=document.createElement('button');torsoButton.id='focusTorso';torsoButton.textContent='Cuello y pecho de Kofi';document.querySelector('header').append(torsoButton);
torsoButton.onclick=()=>{const a=actors.find(a=>a.profile.id==='youngMale'),chest=a.model.getObjectByName('mixamorigSpine2');chest.getWorldPosition(controls.target);camera.position.copy(controls.target).add(new THREE.Vector3(.95,.65,.2));controls.update();};
const ambientNav={version:1,path:(_a,b)=>[{x:b.x,z:b.z}]};
let elapsed=0,last=performance.now(),paused=false,action='idle';document.querySelector('#action').onchange=e=>{action=e.target.value;elapsed=0;for(const actor of actors)actor.ambientWorker=null;};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausar';};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)elapsed+=dt;
 for(const actor of actors){const speed=actor.profile.speed,duration=action==='initial'?7.2:action==='water'?3.4:action==='harvest'?3.6:3.541667;
  const worker={id:actor.profile.id,profile:actor.profile.id,status:['initial','water','harvest'].includes(action)?'acting':action==='running'?'walking':action==='slow-flight'?'incapacitated':action,running:action==='running',incapacitated:action==='slow-flight',actionRemaining:(duration-elapsed*speed%duration)/speed,fallRemaining:action==='fall'?duration-elapsed%duration:0};
  const moving=['walking','running','fleeing','slow-flight','carrying'].includes(action),run=['running','fleeing','slow-flight'].includes(action);
  const phase=elapsed*(action==='slow-flight'?.35:1),angle=phase*(run?L.runMetresPerSecond:L.walkMetresPerSecond)/.68;
  worker.runPhase=phase;worker.walkPhase=phase;worker.carryPhase=phase;
  actor.model.position.set((PROFILES.indexOf(actor.profile)-1.5)*2+(moving?.68*Math.sin(angle):0),0,moving?.68*Math.cos(angle):0);
  actor.model.rotation.y=moving?angle+Math.PI/2:0;
  if(action==='ambient'){
    const anchor={id:'anchor-'+actor.profile.id,x:(PROFILES.indexOf(actor.profile)-1.5)*2,z:0};
    actor.ambientWorker??={id:actor.profile.id,personId:actor.profile.id,profile:actor.profile.id,status:'idle',x:anchor.x,z:anchor.z,runRemaining:80};
    if(!paused)updateIdle(actor.ambientWorker,anchor,dt,ambientNav,712);
    actor.model.position.set(actor.ambientWorker.x,0,actor.ambientWorker.z);actor.model.rotation.y=actor.ambientWorker.heading??0;
    applyWorkerPose(actor,actor.ambientWorker,null,elapsed,libraries[actor.profile.id]);
  }else if(action==='recovery'||action==='transition'){
   const selected=action==='transition'?actor.transition:actor.recovery;
   if(actor.name!==selected.name){actor.action?.stop();actor.action=actor.mixer.clipAction(selected).reset().setLoop(THREE.LoopOnce,1).play();actor.action.paused=true;actor.action.clampWhenFinished=true;actor.name=selected.name;}
   actor.action.time=Math.min(elapsed,selected.duration);actor.mixer.update(0);
 }else applyWorkerPose(actor,worker,{kind:action},elapsed,libraries[actor.profile.id]);
  applyActorExpression(actor,action==='ambient'?actor.ambientWorker:worker,'worker',elapsed);
 }
 document.querySelector('#status').textContent='GLB, controlador corporal y expresiones cargados · '+action+' · '+elapsed.toFixed(2)+' s'+(action==='ambient'?' · '+actors.map(a=>a.ambientWorker?.idleState?.mode).join('/'):'')+(paused?' · tiempo simulado congelado':'');controls.update();renderer.render(scene,camera);requestAnimationFrame(frame);
}requestAnimationFrame(frame);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></html>

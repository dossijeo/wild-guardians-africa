<!doctype html><meta charset="utf-8"><script type="module">
function connect(){const worker=new Worker(new URL('./mobility-compressed-checkpoint-worker.js',import.meta.url),{type:'module'}),pending=new Map();let id=0;worker.onerror=e=>{for(const p of pending.values())p.reject(Error(e.message));pending.clear();};worker.onmessage=({data:d})=>{const p=pending.get(d.id);if(p){pending.delete(d.id);d.kind==='error'?p.reject(Error(d.error)):p.resolve(d);}};const send=(kind,data={},transfer=[])=>new Promise((resolve,reject)=>{const request=++id;pending.set(request,{resolve,reject});worker.postMessage({kind,...data,id:request},transfer);});return {worker,send};}
window.audit=async()=>{const origin=connect();const recoveries=[];try{await origin.send('init');await origin.send('advance',{steps:10});const captures=[];for(const compressed of [false,true,true,false]){const start=performance.now(),row=await origin.send('checkpoint',{compressed});captures.push({compressed,payload:row.payload,serializeMs:row.serializeMs,compressMs:row.compressMs,responseMs:performance.now()-start,bytes:compressed?row.payload.byteLength:new TextEncoder().encode(row.payload).length});}
const expected=await origin.send('advance',{steps:20}),raw=captures.find(x=>!x.compressed).payload,v=JSON.parse(raw).villages[0],cx=Math.floor((v.x+24)/48),cz=Math.floor((v.z+24)/48),chunks=[];for(let z=cz-1;z<=cz+1;z++)for(let x=cx-1;x<=cx+1;x++)chunks.push(`${x},${z}`);
for(const c of captures){const start=performance.now(),worker=connect();try{let ready;if(c.compressed){const copy=c.payload.slice();ready=await worker.send('init',{compressed:copy.buffer,chunks},[copy.buffer]);}else ready=await worker.send('init',{source:c.payload,chunks});const responseMs=performance.now()-start;if(ready.state.snapshot!==raw)throw Error('Restore snapshot mismatch');const result=await worker.send('advance',{steps:20});if(result.state.snapshot!==expected.state.snapshot)throw Error('Continuation mismatch');recoveries.push({compressed:c.compressed,bytes:c.bytes,captureSerializeMs:c.serializeMs,captureCompressMs:c.compressMs,captureResponseMs:c.responseMs,decompressMs:ready.decompressMs,restoreWorkerMs:ready.initMs,restoreResponseMs:responseMs,initialEqual:true,finalEqual:true});}finally{worker.worker.terminate();}}
return {chunks:chunks.length,runs:recoveries};}finally{origin.worker.terminate();}};window.ready=true;
</script>

<!doctype html><html><meta charset="utf-8"><title>Web assets QA</title><pre id="result">Loading all GLBs…</pre><script type="module">
import * as THREE from 'three';
import {Assets} from '../../src/rendering/assets.js';
import {assetUrl} from '../../src/rendering/asset-url.js';
import manifest from '../../content/manifests/web-assets.json';
window.webAssetsResult={done:false,models:[]};
(async()=>{try{
 const assets=new Assets(),renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(256,256);document.body.append(renderer.domElement);
 const camera=new THREE.PerspectiveCamera(50,1,.01,1000);camera.position.set(0,2,10);
 for(const item of manifest.records){
  const model=await assets.model('/'+item.source),scene=new THREE.Scene();scene.add(model.scene,new THREE.HemisphereLight(0xffffff,0x666666,3));
  const box=new THREE.Box3().setFromObject(model.scene),size=box.getSize(new THREE.Vector3()).length(),center=box.getCenter(new THREE.Vector3());camera.position.copy(center).add(new THREE.Vector3(0,size*.3,Math.max(size*1.2,1)));camera.lookAt(center);
  if(model.animations.length){const mixer=new THREE.AnimationMixer(model.scene);for(const clip of model.animations)mixer.clipAction(clip).play();mixer.update(.4);}
  renderer.render(scene,camera);let meshes=0,skins=0,morphs=0,textures=0;
  model.scene.traverse(node=>{if(node.isMesh){meshes++;if(node.isSkinnedMesh)skins++;if(node.morphTargetInfluences)morphs++;for(const m of [].concat(node.material))for(const value of Object.values(m))if(value?.isTexture){if(!value.image?.width)throw Error('Undecoded texture');textures++;}}});
  window.webAssetsResult.models.push({source:item.source,url:assetUrl('/'+item.source),meshes,skins,morphs,clips:model.animations.length,textures});
 }
 renderer.dispose();window.webAssetsResult.done=true;document.querySelector('#result').textContent=JSON.stringify(window.webAssetsResult,null,2);
}catch(error){window.webAssetsResult.error=error.stack;window.webAssetsResult.done=true;throw error;}})();
</script></html>

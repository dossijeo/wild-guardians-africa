<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';
import {SpatialSurfaceView} from '../../src/world/wild-engine/spatial-surface-view.js';
import {serialize} from '../../src/persistence/snapshots.js';
import {captureRaidWaitBindings} from '../../src/simulation/raid-wait-handoff.js';
import {createSimulationAuthorityClient} from '../../src/simulation/simulation-authority-client.js';
import {validateConfirmedMotion} from '../../src/rendering/confirmed-motion-validation.js';
import {createConfirmedMotionFeed} from '../../src/rendering/confirmed-motion-feed.js';

window.audit=async()=>{
 const chunks=[];for(let z=-1;z<=2;z++)for(let x=1;x<=3;x++)chunks.push(`${x},${z}`);
 const fixture=await createSimulation({mangrove:false,chunkKeys:chunks}),{game,nav}=fixture.diagnosticWorld(),source=serialize(game),bindings=captureRaidWaitBindings(game,nav);fixture.dispose();
 const delivered=new Map(),ground=new SpatialSurfaceView();const channelA=new MessageChannel(),channelB=new MessageChannel();for(const [channel,record] of [[channelA,false],[channelB,true]])channel.port1.onmessage=({data})=>{if(data.kind==='terrain'){if(record){delivered.set(`${data.payload.cx},${data.payload.cz}`,{epoch:data.epoch,revision:data.revision});ground.install(data.payload);}channel.port1.postMessage({kind:'terrainAck',session:data.session,id:data.id});}};
 const baseline=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,raidWaitBindings:bindings,session:'baseline',terrainPort:channelA.port2,diagnostics:true}),observed=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,raidWaitBindings:bindings,session:'observed',terrainPort:channelB.port2,diagnostics:true}),feed=createConfirmedMotionFeed({maxActors:512});
 const send=async(client,command)=>{const start=performance.now(),request=client.submit(command);if(!request.accepted)throw Error('Worker command not admitted');const result=await request.result;return {result,roundTrip:performance.now()-start};};
 const quantile=(a,q)=>{const sorted=[...a].sort((x,y)=>x-y);return sorted[Math.min(sorted.length-1,Math.ceil(sorted.length*q)-1)];};
 const stats=items=>({mean:items.reduce((sum,item)=>sum+item,0)/items.length,p95:quantile(items,.95),p99:quantile(items,.99),max:Math.max(...items)});
 try{
  await Promise.all([baseline.ready,observed.ready]);const [initialA,initialB]=await Promise.all([send(baseline,{kind:'snapshot'}),send(observed,{kind:'trackPathMotion',actorId:null,world:true})]);if(!initialB.result.value||initialA.result.snapshot!==initialB.result.snapshot)throw Error('World motion activation changed state');
  let lastElapsed=initialB.result.elapsed,segments=0,actors=0,invalidated=0,terrainReadyCount=0,hyenaSamples=0,hyenaActors=0,stationaryWorld=0,stationaryWalkingHyena=0,chunkCrossings=0,singleChunkBatches=0,flatEndpointBatches=0,maxEndpointHeightDifference=0,underOneCm=0,underTwoCm=0,underFiveCm=0,maxSegmentHeightDifference=0,stableStateBatches=0,stableStateAndFiveCm=0,changedActors=0;const motionChunks=new Set();const measuredA=[],measuredB=[],traceBytes=[];
  for(let i=0;i<20;i++){
   const command={kind:'advance',seconds:.05,steps:2,nightFastForward:true};let a,b;
   if(i%2){b=await send(observed,command);a=await send(baseline,command);}else{a=await send(baseline,command);b=await send(observed,command);}
   if(a.result.snapshot!==b.result.snapshot||JSON.stringify(a.result.events)!==JSON.stringify(b.result.events))throw Error('State or events changed at batch '+i);
   const baselineBegin=performance.now(),baselineState=JSON.parse(a.result.snapshot);validateConfirmedMotion(a.result,baselineState,lastElapsed);const baselineValidationMs=performance.now()-baselineBegin;
   const begin=performance.now(),next=JSON.parse(b.result.snapshot),trace=b.result.worldMotionTrace;validateConfirmedMotion(b.result,next,lastElapsed);if(!trace.terrainManifest?.epoch||!trace.terrainManifest.chunks.length)throw Error('Missing real terrain manifest');const ticks=trace.hyenaTickSamples;if(!ticks?.complete)throw Error('Incomplete real hyena ticks');let pathMax=0,pathComplete=true;const crossings=(from,to,out)=>{if(from===to)return;for(let boundary=Math.ceil(Math.min(from,to));boundary<Math.max(from,to);boundary++){const t=(boundary-from)/(to-from);if(t>0&&t<1)out.push(t);}};for(const a of trace.actors){const h0=ground.surface(a.start.x,a.start.z);if(!Number.isFinite(h0)){pathComplete=false;continue;}for(const seg of a.segments){const ts=[0,1];crossings(seg.x0,seg.x1,ts);crossings(seg.z0,seg.z1,ts);crossings(seg.x0+seg.z0,seg.x1+seg.z1,ts);for(const t of ts){const h=ground.surface(seg.x0+(seg.x1-seg.x0)*t,seg.z0+(seg.z1-seg.z0)*t);if(!Number.isFinite(h)){pathComplete=false;continue;}pathMax=Math.max(pathMax,Math.abs(h-h0));}}}const actorTicks=trace.actorTickStates;if(!actorTicks?.complete)throw Error('Incomplete real actor ticks');let stable=true;for(const actor of actorTicks.actors){const first=actor.samples[0],fields=['status','running','gateWaiting','incapacitated','recovery','falling','taskId','animation','idleMode'];if(actor.samples.some(sample=>fields.some(k=>sample[k]!==first[k])||first.yaw===null&&sample.heading!==first.heading||(sample.yaw===null)!==(first.yaw===null)||sample.yaw!==null&&Math.abs(Math.atan2(Math.sin(sample.yaw-first.yaw),Math.cos(sample.yaw-first.yaw)))>.001)){stable=false;changedActors++;}}if(stable)stableStateBatches++;if(stable&&pathComplete&&pathMax<=.05)stableStateAndFiveCm++;if(pathComplete){maxSegmentHeightDifference=Math.max(maxSegmentHeightDifference,pathMax);if(pathMax<=.01)underOneCm++;if(pathMax<=.02)underTwoCm++;if(pathMax<=.05)underFiveCm++;}let flatEndpoints=true;for(const a of trace.actors){const baseline=ground.surface(a.start.x,a.start.z);if(!Number.isFinite(baseline)){flatEndpoints=false;continue;}for(const v of a.segments){for(const pt of [[v.x0,v.z0],[v.x1,v.z1]]){const h=ground.surface(...pt);if(!Number.isFinite(h)){flatEndpoints=false;continue;}const diff=Math.abs(h-baseline);maxEndpointHeightDifference=Math.max(maxEndpointHeightDifference,diff);if(diff>0.0001)flatEndpoints=false;}}}if(flatEndpoints)flatEndpointBatches++;const batchChunks=new Set();for(const a of trace.actors){const cell=p=>`${Math.floor((p.x+24)/48)},${Math.floor((p.z+24)/48)}`;motionChunks.add(cell(a.start));motionChunks.add(cell(a.end));batchChunks.add(cell(a.start));batchChunks.add(cell(a.end));if(cell(a.start)!==cell(a.end)||a.segments.some(g=>cell({x:g.x0,z:g.z0})!==cell({x:g.x1,z:g.z1})))chunkCrossings++;}if(batchChunks.size===1)singleChunkBatches++;if(trace.actors.every(a=>a.start.x===a.end.x&&a.start.z===a.end.z&&a.segments.every(s=>s.x0===s.x1&&s.z0===s.z1))){stationaryWorld++;if(ticks.actors.some(a=>a.samples.every(s=>s.status==='walking')))stationaryWalkingHyena++;}hyenaActors=ticks.actors.length;for(const actor of ticks.actors){if(actor.samples.length<2)throw Error('Missing real tick samples');hyenaSamples+=actor.samples.length;}const terrainReady=trace.terrainManifest.chunks.every(c=>{const d=delivered.get(`${c.cx},${c.cz}`);return d?.epoch===trace.terrainManifest.epoch&&d.revision===c.revision;});if(terrainReady)terrainReadyCount++;feed.accept({terrainReady,physicsAvailable:true,sequence:b.result.sequence,elapsed:b.result.elapsed,pauses:b.result.pauses,worldTrace:trace,terrainChanged:b.result.terrainChanged,eventful:b.result.events.length>0,physicsPose:b.result.physicsPose,physicsPoses:b.result.physicsPoses});const validateMs=performance.now()-begin;
   if(feed.getWorld()?.safeForAutonomousPlayback!==false)throw Error('Historical movement marked safe');lastElapsed=b.result.elapsed;actors=trace.actors.length;segments+=trace.actors.reduce((sum,actor)=>sum+actor.segments.length,0);if(!feed.getWorld().representable)invalidated++;
   if(i>=4){measuredA.push(a.roundTrip+baselineValidationMs);measuredB.push(b.roundTrip+validateMs);traceBytes.push(new TextEncoder().encode(JSON.stringify(trace)).byteLength);}
  }
  const deadline=performance.now()+5000;while(delivered.size<chunks.length&&performance.now()<deadline)await new Promise(resolve=>setTimeout(resolve,10));const finalManifest=feed.getWorld().trace.terrainManifest;if(!finalManifest.chunks.every(c=>{const d=delivered.get(`${c.cx},${c.cz}`);return d?.epoch===finalManifest.epoch&&d.revision===c.revision;}))throw Error('Terrain channel did not converge to manifest');if(actors<2||segments<1)throw Error('Fixture did not exercise multiple bodies');
  return {stableStateBatches,stableStateAndFiveCm,changedActors,underOneCm,underTwoCm,underFiveCm,maxSegmentHeightDifference,flatEndpointBatches,maxEndpointHeightDifference,singleChunkBatches,motionChunks:[...motionChunks],chunkCrossings,stationaryWorld,stationaryWalkingHyena,hyenaActors,hyenaSamples,terrainReadyCount,terrainChunks:delivered.size,manifestChunks:finalManifest.chunks.length,manifestBytes:new TextEncoder().encode(JSON.stringify(finalManifest)).length,actors,segments,invalidated,measuredBatches:measuredA.length,baselineRoundTripPlusValidationMs:stats(measuredA),observedRoundTripPlusValidationMs:stats(measuredB),traceBytes:stats(traceBytes),scope:'Real isolated browser simulation Workers and Wild Engine, no rendering, GPU, or full-game frame measurement. Alternating sequential A/B order; both timings include snapshot parse and validation, observed also updates its feed. Historical X/Z is not an autonomous playback certificate.'};
 }finally{feed.dispose();baseline.dispose();observed.dispose();channelA.port1.close();channelB.port1.close();}
};window.ready=true;
</script>

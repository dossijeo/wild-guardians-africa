<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';
function connect(session){const worker=new Worker(new URL('./mobility-shared-epoch-worker.js',import.meta.url),{type:'module'}),signal=new SharedArrayBuffer(4),pending=new Map();let id=0;worker.onerror=e=>{for(const p of pending.values())p.reject(Error(e.message));pending.clear();};worker.onmessage=({data:d})=>{const p=pending.get(d.id);if(p&&d.kind!=='started'){pending.delete(d.id);d.kind==='error'?p.reject(Error(d.error)):p.resolve(d);}};const send=(kind,data={})=>new Promise((resolve,reject)=>{const request=++id;pending.set(request,{resolve,reject});worker.postMessage({kind,session,...data,id:request});});return {worker,session,signal,flag:new Int32Array(signal),send,ready:send('init',{signal})};}
window.audit=async()=>{if(!crossOriginIsolated||typeof SharedArrayBuffer==='undefined')throw Error('Isolation unavailable');const old=connect(crypto.randomUUID()),current=connect(crypto.randomUUID());let reference;
try{await Promise.all([old.ready,current.ready]);Atomics.store(old.flag,0,7);const staleMessage=await current.send('pause',{session:old.session,token:7});if(staleMessage.reason!=='session')throw Error('Old session accepted');const oldBuffer=await current.send('advance',{steps:1,signal:old.signal});if(oldBuffer.reason!=='buffer')throw Error('Old buffer accepted');const first=await current.send('advance',{steps:1});if(first.performed!==1||first.interrupted)throw Error('Old signal affected current');Atomics.store(current.flag,0,1);const pause=await current.send('pause',{token:1});if(!pause.paused)throw Error('Current pause failed');const blocked=await current.send('advance',{steps:1});if(blocked.reason!=='paused')throw Error('Paused step accepted');const resume=await current.send('resume');if(resume.state.pauses.includes('diagnostic'))throw Error('Resume failed');Atomics.store(old.flag,0,2147483647);const last=await current.send('advance',{steps:1});if(last.performed!==1||last.interrupted)throw Error('Stale signal after resume affected current');reference=await createSimulation({mangrove:true});reference.advanceTick(.05);reference.advanceTick(.05);if(reference.state().snapshot!==last.state.snapshot)throw Error('Snapshot mismatch');return {oldSessionRejected:true,oldBufferRejected:true,oldSignalIgnored:true,currentPauseConfirmed:pause.paused,pausedAdvanceRejected:true,staleCurrentTokenIgnored:true,steps:2,snapshotEqual:true};}finally{reference?.dispose();old.worker.terminate();current.worker.terminate();}};window.ready=true;
</script>

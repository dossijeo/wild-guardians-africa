<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Guardián guía sobre HUD original</title>
<link rel="stylesheet" href="../../src/ui/styles.css"><link rel="stylesheet" href="../../public/content/hud.css"><link rel="stylesheet" href="../../src/ui/tutorial.css">
<style>#stage{background:linear-gradient(150deg,#75827b,#374c43)}#qa{position:absolute;top:12px;left:12px;z-index:25;background:#fff8e5;padding:10px;font:13px system-ui;color:#203629}#report{max-height:100px;overflow:auto}</style>
<main id="stage"><aside id="events" hidden></aside><aside id="placementBanner" hidden></aside><div id="narrator"></div><aside id="qa"><strong>Guardián 3D · Guía del menú</strong><p>HUD y personaje de producción; sin modificar partidas.</p><button id="build">Señalar Construir</button><button id="grow">Señalar Cultivar</button><button id="hide">Retirar guía</button><pre id="report"></pre></aside></main>
<script type="module">
import {hudMarkup,ASSETS,layoutHud} from '../../src/ui/native-hud.js';
import {TutorialHudGuide} from '../../src/ui/tutorial-hud-hand.js';
import {NativeGuardian} from '../../src/ui/guardian.js';
import {assetUrl} from '../../src/rendering/asset-url.js';
const stage=document.querySelector('#stage');stage.insertAdjacentHTML('afterbegin',hudMarkup);
for(const image of document.querySelectorAll('[data-sprite]'))image.src=assetUrl(ASSETS[image.dataset.sprite].src);
const errors=[],guide=new TutorialHudGuide(stage),guardian=new NativeGuardian(document.querySelector('#narrator'),e=>errors.push(e.message));let target='[data-menu="build"]';
await guardian.ready;guardian.show({key:'guide',text:'Elige Centro de trabajo. Puedes construirlo en cualquier lugar válido cerca del poblado.'});
for(const name of ['build','grow'])document.querySelector('#'+name).onclick=()=>target=`[data-menu="${name}"]`;
document.querySelector('#hide').onclick=()=>target=null;
function frame(){layoutHud(stage);guide.show(target);guardian.setGuide(guide.rect);guardian.update();document.querySelector('#report').textContent=JSON.stringify({target,visible:guide.visible,errors,draws:guardian.mesh?.metrics.drawCalls,legacyHands:document.querySelectorAll('.tutorial-hud-hand').length});requestAnimationFrame(frame);}frame();
addEventListener('pagehide',()=>{guardian.dispose();guide.dispose();});
</script></html>

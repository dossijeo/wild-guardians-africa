<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Amanecer y packs musicales originales</title>
<p>Referencia PCM completa con recorrido sin obstáculos, sin escena3D. Decodifica los diez stems originales de cada pack y cambia mediante un amanecer de Game. La producción por ventanas se prueba en music-world-dawn.html. Salida silenciada: no acredita escucha ni rendimiento de un teléfono.</p><button id="run">Probar amanecer musical</button><output id="status">Lista</output><pre id="report"></pre>
<script type="module">
import * as Game from '../../src/simulation/game.js';import {rational} from '../../src/simulation/money.js';import {serialize} from '../../src/persistence/snapshots.js';import {AudioSystem} from '../../src/audio/audio.js';
import {json,bytes} from '../../src/rendering/assets.js';
const audio=new AudioSystem({sfx:0,music:0},{json,bytes,musicWindows:false}),errors=[],history=[],status=document.querySelector('#status'),report=document.querySelector('#report');let disposed=false;const dispose=()=>{if(!disposed){disposed=true;audio.dispose();}};addEventListener('pagehide',dispose);addEventListener('error',e=>errors.push(String(e.error??e.message)));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));const assert=(v,m)=>{if(!v)throw Error(m);};
const nav={placement:()=>({valid:true,suppress:[]}),setState(){},walkable:()=>true,path:(_a,b)=>[{x:b.x,z:b.z}]};
async function loaded(pack){const start=performance.now();while(!audio.transport||audio.pack!==pack){if(audio.musicError)throw audio.musicError;if(performance.now()-start>30000)throw Error('Carga musical sin completar');await new Promise(done=>setTimeout(done,25));}}
function capture(state){const stems=audio.transport.loaded.map(({track,buffer})=>({id:track.id,channels:buffer.numberOfChannels,sampleRate:buffer.sampleRate,length:buffer.length,duration:buffer.duration,pcmBytes:buffer.length*buffer.numberOfChannels*4}));return {day:state.day,pack:audio.pack,stems,pcmSampleBytes:stems.reduce((sum,s)=>sum+s.pcmBytes,0),musicVoices:[...audio.voices.values()].filter(v=>v.music).length,sfxVoices:[...audio.voices.values()].filter(v=>!v.music).length,scheduledStart:audio.transport.primary.start,rates:audio.transport.primary.sources.map(s=>s.playbackRate.value),cachedMusicUrls:[...audio.musicBuffers]};}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 status.textContent='Cargando pack A original…';await audio.unlock();audio.sfx=await audio.sfxBank();const state=Game.newGame({seed:712,slotId:'qa-musical-dawn'});Game.resume(state,'intro');state.ledger.balance=rational(10000);state.day=101;state.completedNights=100;state.postgame=true;state.initialPreparation=false;state.tutorial.step='done';Game.placeStructure(state,'center',{x:4,z:0},nav);Game.plant(state,'seed','mijo',10,4,nav);Game.pause(state,'hiring');Game.hire(state,'hire',{olderFemale:1});
 const wind=audio.sfx.items.find(i=>i.id==='amb_wind_soft'),ambient=await audio.ambientSound(wind.id,{emitter:'diagnostic-wind'});assert(ambient,'Falta ambiente original');const before=serialize(state);audio.updateMusic(state);await loaded('a');assert(serialize(state)===before,'Música cambia dominio');history.push(capture(state));assert(history[0].musicVoices===10,'Pack A incompleto');assert(audio.voices.has(ambient),'Pack A corta el ambiente');const oldUrls=[...audio.musicBuffers];
 Game.tick(state,600,nav);assert(state.day===102&&state.events.some(e=>e.type==='Dawn'),'No hay amanecer nativo');status.textContent='Amanecer: cargando pack B original…';const dawn=serialize(state);audio.updateMusic(state);await loaded('b');assert(serialize(state)===dawn,'Música cambia amanecer');history.push(capture(state));assert(history[1].musicVoices===10,'Pack B incompleto');assert(audio.voices.has(ambient),'Cambio de pack corta ambiente');assert(oldUrls.every(url=>!audio.buffers.has(url)),'Caché retiene pack A');assert(history.every(h=>h.rates.every(r=>r===1)),'Tono acelerado');
 audio.stop();assert(audio.active.length===0,'Fuentes sin liberar');assert(audio.musicBuffers.size===0,'Caché musical sin liberar');status.textContent='Comprobando streaming del menú…';await audio.menu();const menuStream=audio.menuStream,menuGeneration=audio.musicGeneration;assert(menuStream&&!audio.active.length,'Menú incompleto');for(let i=0;i<20;i++)await audio.menu();assert(!audio.active.length&&audio.menuStream===menuStream&&audio.musicGeneration===menuGeneration,'Pulsaciones reinician música');const menu={repeatedRequests:20,sameStream:true,mediaStreams:1,musicVoices:0,retainedMusicUrls:audio.musicBuffers.size,rate:menuStream.media.playbackRate,duration:menuStream.media.duration};audio.stop();dispose();await new Promise(done=>setTimeout(done,80));report.textContent=JSON.stringify({history,menu,afterStop:audio.active.length,retainedMusicUrls:audio.musicBuffers.size,context:audio.context.state,errors,muted:true,geometry:'clear-path-directed',measurement:'PCM reference payload only, not production allocation or total browser memory'},null,2);status.textContent='Completada';
 }catch(e){errors.push(String(e));report.textContent=JSON.stringify({history,errors},null,2);status.textContent='FAIL: '+e.message;dispose();}};
</script></html>

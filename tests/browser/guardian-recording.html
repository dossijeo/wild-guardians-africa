<!doctype html><meta charset="utf-8"><title>Guardian · Video recordings</title>
<style>body{background:#202820;color:white;font:18px system-ui}canvas#source{width:640px;height:640px;position:absolute;left:-10000px}canvas#output{width:960px;max-width:100%}button{padding:12px;margin:10px}</style>
<button id="es">Grabar español</button><button id="en">Record English</button><p id="status">Loading</p><canvas id="source"></canvas><canvas id="output" width="1280" height="720"></canvas>
<script type="module">
import {Guardian3D} from '../../src/ui/guardian-3d.js';
import {assetUrl} from '../../src/rendering/asset-url.js';
const actor=new Guardian3D(document.querySelector('#source')),out=document.querySelector('#output'),ctx=out.getContext('2d'),status=document.querySelector('#status'),audio=new Audio();
const voices=await fetch(assetUrl('content/guardian/voices.json')).then(r=>r.json());await actor.ready;
let voice=null,running=false,started=0;
function wrap(text,x,y,width){let line='';for(const word of text.split(' ')){if(ctx.measureText(line+word).width>width){ctx.fillText(line,x,y);y+=34;line='';}line+=word+' ';}ctx.fillText(line,x,y);}
function frame(t){actor.draw({time:t/1000,audio});ctx.fillStyle='#202c29';ctx.fillRect(0,0,1280,720);ctx.drawImage(actor.canvas,0,40,640,640);ctx.fillStyle='#e9cf92';ctx.font='bold 30px system-ui';ctx.fillText('WILD GUARDIANS',660,100);ctx.fillStyle='#fff';ctx.font='24px system-ui';ctx.fillText(voice?.language==='es'?'Guardián · Español':'Guardian · English',660,150);ctx.font='22px system-ui';if(voice)wrap(voice.text,660,230,560);ctx.fillStyle='#b5c5bb';ctx.font='18px system-ui';ctx.fillText('Three.js · Original tutorial voice · '+(voice?.id??''),660,620);ctx.fillText('Audio '+audio.currentTime.toFixed(1)+' s',660,654);requestAnimationFrame(frame);}requestAnimationFrame(frame);
let ac,source,dest;
async function record(lang){if(running)return;running=true;try{ac??=new AudioContext();if(!source){source=ac.createMediaElementSource(audio);dest=ac.createMediaStreamDestination();source.connect(dest);source.connect(ac.destination);}await ac.resume();voice=voices.find(v=>v.id===lang+'_01');audio.src=assetUrl(voice.audio);await actor.setRecord({id:voice.id,path:voice.audio});await new Promise((res,rej)=>{audio.oncanplay=res;audio.onerror=rej;audio.load();});const stream=out.captureStream(30);for(const track of dest.stream.getAudioTracks())stream.addTrack(track);const chunks=[],rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8,opus',videoBitsPerSecond:4000000});rec.ondataavailable=e=>chunks.push(e.data);const done=new Promise(r=>rec.onstop=r);rec.start();status.textContent='Recording '+lang;await audio.play();await new Promise(r=>audio.onended=r);await new Promise(r=>setTimeout(r,1500));rec.stop();await done;const blob=new Blob(chunks,{type:'video/webm'});const response=await fetch('http://127.0.0.1:5197/'+lang.toLowerCase()+'.webm',{method:'POST',body:blob});if(!response.ok)throw Error('Save failed');status.textContent='Saved '+lang+' '+blob.size+' bytes';}catch(e){status.textContent=e.stack;}finally{running=false;}}
document.querySelector('#es').onclick=()=>record('ES');document.querySelector('#en').onclick=()=>record('EN');status.textContent='Ready';
</script>

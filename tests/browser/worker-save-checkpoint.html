<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';
import {serialize,deserialize} from '../../src/persistence/snapshots.js';
import {createSimulationAuthorityClient} from '../../src/simulation/simulation-authority-client.js';
import {createConfirmedStateReceiver} from '../../src/simulation/confirmed-state-receiver.js';
import {createWorkerGameRuntime} from '../../src/simulation/worker-game-runtime.js';
import {createWorkerSaveCoordinator} from '../../src/persistence/worker-save.js';
window.audit=async()=>{
 const chunks=[];for(let z=-1;z<=2;z++)for(let x=0;x<=5;x++)chunks.push(`${x},${z}`);
 const fixture=await createSimulation({mangrove:true,chunkKeys:chunks}),source=serialize(fixture.diagnosticWorld().game),state=deserialize(source);fixture.dispose();
 let clock=0,nextTimer=0,stored=null;const timers=new Map(),session='save-checkpoint',client=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,session}),world={createConfirmedReceiver:id=>createConfirmedStateReceiver(state,id)};
 const runtime=createWorkerGameRuntime({client,world,session,stepSeconds:.05,now:()=>clock,schedule:fn=>{const id=++nextTimer;timers.set(id,fn);return id;},cancel:id=>timers.delete(id)});
 const save=createWorkerSaveCoordinator({runtime,repository:{async save(snapshot){stored=serialize(snapshot);}},slotId:state.slotId,now:()=>123});
 try{
  await runtime.start();const initial=state.elapsed;clock=250;const [id,wake]=timers.entries().next().value;timers.delete(id);wake();
  const paused=runtime.submit({kind:'pause',reason:'save-test'}),result=await save.request();await paused;
  const saved=deserialize(stored);if(!result.saved||!saved.pauses.includes('save-test')||Math.abs(saved.elapsed-initial-.25)>1e-6||saved.savedAt!==123)throw Error('Checkpoint did not preserve ordered worker state');
  await runtime.submit({kind:'resume',reason:'save-test'});if(!saved.pauses.includes('save-test')||state.pauses.includes('save-test'))throw Error('Saved state was mutated by later publication');
  return {sequence:result.sequence,elapsed:saved.elapsed,paused:saved.pauses.includes('save-test'),scope:'Real simulation Worker with ordered pause and detached checkpoint; no physics restore or complete game UI.'};
 }finally{runtime.dispose();}
};window.ready=true;
</script>

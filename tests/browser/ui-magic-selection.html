<!doctype html><html lang="es"><meta charset="utf-8"><title>QA selección de magia nativa</title>
<p>UiAudio y AudioSystem de producción, SFX Opus real, salida silenciada. Tres selecciones y una carga retrasada controlada que se invalida al abrir otro panel. No ejecuta el HUD ni el mundo 3D.</p><button id="run">Probar selección</button><output id="status">Preparado</output><pre id="report"></pre>
<script type="module">
import {UiAudio} from '/src/audio/ui-audio.js';import {AudioSystem} from '/src/audio/audio.js';
let audio;const errors=[],rows=[];const check=(value,message)=>{if(!value)throw Error(message);};addEventListener('error',e=>errors.push(String(e.message)));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));addEventListener('pagehide',()=>audio?.dispose());
document.querySelector('#run').onclick=async()=>{const button=document.querySelector('#run');button.disabled=true;rows.length=errors.length=0;try{
 audio=new AudioSystem({sfx:0,music:0});await audio.unlock();const bank=await audio.sfxBank(),item=bank.items.find(i=>i.id==='spirit_select'),buffer=await audio.buffer(item.audio.url);let pending;
 const ui=new UiAudio((id,options)=>{pending=audio.sound(id,options).then(source=>{rows.push({id,accepted:!!source,bus:source?audio.voices.get(source)?.bus:null,rate:source?.playbackRate.value??null});return source;});return pending;});
 for(const spell of ['shield','growth','multiply']){ui.selectSpell(spell);const source=await pending;check(source,'Selection missing');check(audio.voices.get(source).bus==='ui'&&source.playbackRate.value===1,'Wrong bus or pitch');await new Promise((resolve,reject)=>{const end=source.onended,timer=setTimeout(()=>reject(Error('Source did not end')),buffer.duration*1000+5000);source.onended=()=>{end();clearTimeout(timer);resolve();};});check(audio.voices.size===0,'Retained voice');}
 const original=audio.buffer.bind(audio);let release;audio.buffer=url=>url===item.audio.url?new Promise(resolve=>release=()=>resolve(buffer)):original(url);ui.selectSpell('growth');const old=pending;await new Promise(resolve=>setTimeout(resolve,0));check(release,'No pending decode');ui.surface('panel','cultivos');release();check(await old===null,'Stale selection accepted');await pending;audio.buffer=original;
 ui.reset();audio.dispose();check(audio.voices.size===0,'Retained sources after dispose');check(!errors.length,'Global errors');document.querySelector('#report').textContent=JSON.stringify({ok:true,rows,decoded:{duration:buffer.duration,channels:buffer.numberOfChannels,sampleRate:buffer.sampleRate},delayedDecode:'controlled gate over native buffer',errors},null,2);document.querySelector('#status').textContent='Correcto';
 }catch(error){errors.push(error.message);document.querySelector('#report').textContent=JSON.stringify({ok:false,rows,errors},null,2);document.querySelector('#status').textContent='Error';audio?.dispose();}finally{button.disabled=false;}};
</script></html>

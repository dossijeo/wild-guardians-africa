<!doctype html><html lang="es"><meta charset="utf-8"><title>Guardián · Comparación de coste</title><style>body{background:#343b36;color:#fff;font:14px system-ui}section{display:flex;gap:20px}figure{margin:0;position:relative}canvas{width:300px;height:300px}#fx{position:absolute;left:0;top:0}pre{white-space:pre-wrap}</style><button id="run">Medir 240 fotogramas</button><section><figure><canvas id="old"></canvas><canvas id="fx"></canvas><figcaption>Retrato anterior</figcaption></figure><figure><canvas id="new"></canvas><figcaption>Guardián 3D</figcaption></figure></section><pre id="report">Preparando…</pre><script type="module">
import {GuardianMesh,GuardianMagic,OrnamentPhysics,guardianPose,GUARDIAN_SPRITE} from '../../src/ui/guardian-native.js';import {Guardian3D} from '../../src/ui/guardian-3d.js';import {assetUrl} from '../../src/rendering/asset-url.js';
const $=id=>document.getElementById(id),image=new Image();image.src=assetUrl(GUARDIAN_SPRITE);await image.decode();const old=new GuardianMesh($('old'),image),fx=new GuardianMagic($('fx')),physics=new OrnamentPhysics(),actor=new Guardian3D($('new'));await actor.ready;actor.manual.clip='Explain';actor.manual.viseme='C';
function oldFrame(t){const q=guardianPose('speak',t%6,6,t);physics.step(t,1/60,q.roll,q.yaw,q.reveal,1,1);old.update(q.roll,q.yaw,q.pitch,{...q,blend:1,angles:physics.angles,offsets:physics.offsets});old.draw();fx.draw(old,t,q,false);}
$('report').textContent='Listo';oldFrame(0);actor.draw({time:0});
$('run').onclick=async()=>{const a=[],b=[],updates=[],frames=[];let last=performance.now();for(let i=0;i<270;i++){await new Promise(requestAnimationFrame);const start=performance.now();oldFrame(i/60);const mid=performance.now();actor.draw({time:i/60});const end=performance.now();if(i>=30){a.push(mid-start);b.push(end-mid);updates.push(actor.updateMs);frames.push(start-last);}last=start;}
const summary=values=>{values.sort((a,b)=>a-b);return {medianMs:values[120],p95Ms:values[228]};};const gl=actor.renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');$('report').textContent=JSON.stringify({oldCpu:summary(a),newCpu:summary(b),newAnimationCpu:summary(updates),combinedFrameInterval:summary(frames),oldTriangles:old.indices.length/3,newMetrics:actor.metrics,oldCanvas:[$('old').width,$('old').height],newCanvas:[$('new').width,$('new').height],gpu:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):null,note:'CPU includes render submission, not GPU elapsed time; both actors at their runtime DPR caps, 300 CSS px; warmup 30 + 240 measured frames.'},null,2);};
</script></html>

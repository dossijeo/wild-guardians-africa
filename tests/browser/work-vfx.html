<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Trabajo VFX en la finca</title><style>body{margin:0;font:14px system-ui}header{position:absolute;z-index:2;padding:12px;background:#fff9ed;max-width:95vw}button{padding:8px;margin:4px}canvas{width:100vw;height:100vh;display:block}#status{display:block}</style><header>Terreno, centro, semilla y trabajador originales pagados. Sin partidas guardadas.<br><button id="next">Buscar siguiente fase de trabajo</button><button id="step">Avanzar 0,5 s</button><button id="day">Completar entrega real</button><button id="reload">Guardar y recargar en memoria</button><span id="status">Cargando finca…</span></header><canvas id="world" aria-label="VFX de siembra, riego y cosecha en terreno original"></canvas><script type="module">
import * as Game from '/src/simulation/game.js';
import {isMature} from '/src/simulation/crops.js';
import {Navigation} from '/src/world/navigation.js';
import {findInitialLocationAsync} from '/src/world/villages.js';
import {WorldScene} from '/src/rendering/scene.js';
import {json} from '/src/rendering/assets.js';
import {serialize,deserialize} from '/src/persistence/snapshots.js';
const pack=await json('/content/biome-savanna.json'),villages=await json('/content/villages.json'),payload=villages.find(v=>v.id==='suajili');
let state=Game.newGame({culture:'suajili',seed:712});const nav=new Navigation(712,'sabana',pack.profile),location=await findInitialLocationAsync(nav,payload);
Object.assign(state.villages[0],location);state.suppressed.push(...location.suppress);nav.setState(state);Game.resume(state,'intro');Game.placeStructure(state,'qa-center',{x:location.center.x,z:location.center.z},nav);let center=state.structures[0],site;
for(let z=-6;z<=6&&!site;z+=1.5)for(let x=4.5;x<12&&!site;x+=1.5){const p={x:center.x+x,z:center.z+z};if(nav.placement(p.x,p.z,.4).valid)site=p;}
Game.plant(state,'qa-seed','mijo',site.x,site.z,nav);Game.openInitialHiring(state);Game.hire(state,'qa-contract',{olderMale:1});Game.pause(state,'qa');state.tutorial.step='done';
const world=new WorldScene(document.querySelector('#world'),()=>{});let error='';world.onError=e=>{error=e.message;status();};world.qualitySetting('media');await world.load(state,nav,payload);
world.focus(site);const ground=nav.field.surface(site.x,site.z);world.controls.target.set(site.x,ground+.8,site.z);world.camera.position.set(site.x+4,ground+3.5,site.z+5);world.controls.update();
function status(){const worker=state.workers[0],effects=[...world.workVfx.effects.values()];document.querySelector('#status').textContent=`Trabajador ${worker.status} · tiempo ${state.elapsed.toFixed(2)} s · saldo ${state.ledger.balance.n} · entregas ${state.crates.filter(c=>c.delivered).length} · VFX ${effects.map(e=>`${e.native.definition.id} ${e.native.time.toFixed(2)} s / ${e.sprites.geometry.instanceCount} sprites / ${[...e.rigids.values()].reduce((n,m)=>n+m.geometry.instanceCount,0)} sólidos`).join(', ')||'ninguno'}${error?' · '+error:''}`;}
function advance(dt){Game.resume(state,'qa');if(isMature(state.plants[0])&&!state.plants[0].harvestRequested)Game.harvest(state,'qa-harvest',state.plants[0].id);Game.tick(state,dt,nav);Game.pause(state,'qa');}
async function run(until){document.querySelector('#next').disabled=document.querySelector('#day').disabled=true;for(let i=0;i<2000&&!state.result;i++){advance(.1);world.workVfx.update(state);if(until())break;if(i%25===24){world.render(0);status();await new Promise(resolve=>setTimeout(resolve,0));}}world.render(0);status();document.querySelector('#next').disabled=document.querySelector('#day').disabled=false;}
document.querySelector('#next').onclick=()=>{const previous=[...world.workVfx.effects.keys()][0];run(()=>world.workVfx.effects.size>0&&[...world.workVfx.effects.keys()][0]!==previous);};document.querySelector('#day').onclick=()=>run(()=>state.crates.some(c=>c.delivered));document.querySelector('#step').onclick=()=>{advance(.5);world.render(0);status();};document.querySelector('#reload').onclick=()=>{state=deserialize(serialize(state));nav.setState(state);world.state=state;world.simElapsed=state.elapsed;center=state.structures[0];world.render(0);status();};
function frame(){world.render(0);status();requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('pagehide',()=>world.dispose());
</script></html>

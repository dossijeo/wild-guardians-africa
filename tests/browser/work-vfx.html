<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Trabajo VFX en la finca</title><style>body{margin:0;font:14px system-ui}header{position:absolute;z-index:2;padding:12px;background:#fff9ed;max-width:95vw}button{padding:8px;margin:4px}canvas{width:100vw;height:100vh;display:block}#status{display:block}</style><header>Terreno, centro, semilla y trabajador originales pagados. Sin partidas guardadas.<br><button id="next">Buscar siguiente fase de trabajo</button><button id="repair">Reparar centro (QA)</button><button id="step">Avanzar 0,5 s</button><button id="day">Completar entrega real</button><button id="reload">Guardar y recargar en memoria</button><span id="status">Cargando finca…</span></header><canvas id="world" aria-label="VFX de siembra, riego y cosecha en terreno original"></canvas><script type="module">
import {Vector3} from 'three';
import * as Game from '../../src/simulation/game.js';
import {isMature} from '../../src/simulation/crops.js';
import {hitStructure} from '../../src/simulation/rules.js';
import {Navigation} from '../../src/world/navigation.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {WorldScene} from '../../src/rendering/scene.js';
import {json} from '../../src/rendering/assets.js';
import {serialize,deserialize} from '../../src/persistence/snapshots.js';
const pack=await json('/content/biome-savanna.json'),villages=await json('/content/villages.json'),payload=villages.find(v=>v.id==='suajili');
const profile=new URLSearchParams(window.location.search).get('profile')??'olderMale';if(!['youngMale','youngFemale','olderMale','olderFemale'].includes(profile))throw Error('Perfil QA inválido');
let state=Game.newGame({culture:'suajili',seed:712});const nav=new Navigation(712,'sabana',pack.profile),location=await findInitialLocationAsync(nav,payload);
Object.assign(state.villages[0],location);state.suppressed.push(...location.suppress);nav.setState(state);Game.resume(state,'intro');Game.placeStructure(state,'qa-center',{x:location.center.x,z:location.center.z},nav);let center=state.structures[0],site;
for(let z=-6;z<=6&&!site;z+=1.5)for(let x=4.5;x<12&&!site;x+=1.5){const p={x:center.x+x,z:center.z+z};if(nav.placement(p.x,p.z,.4).valid)site=p;}
Game.plant(state,'qa-seed','mijo',site.x,site.z,nav);Game.openInitialHiring(state);Game.hire(state,'qa-contract',{[profile]:1});Game.pause(state,'qa');state.tutorial.step='done';
const world=new WorldScene(document.querySelector('#world'),()=>{});let error='';world.onError=e=>{error=e.message;status();};world.qualitySetting('media');await world.load(state,nav,payload);
world.focus(site);const ground=nav.field.surface(site.x,site.z);world.controls.target.set(site.x,ground+.8,site.z);world.camera.position.set(site.x+4,ground+3.5,site.z+5);world.controls.update();
function status(){const worker=state.workers[0],effects=[...world.workVfx.effects.values()];document.querySelector('#status').textContent=`Trabajador ${profile} ${worker.status} · tiempo ${state.elapsed.toFixed(2)} s · saldo ${state.ledger.balance.n} · centro ${center.hp}/${center.maxHp} PV · reparaciones ${state.events.filter(e=>e.type==='RepairApplied').length} · entregas ${state.crates.filter(c=>c.delivered).length} · VFX ${effects.map(e=>`${e.native.definition.id} ${e.native.time.toFixed(2)} s / ${e.sprites.geometry.instanceCount} sprites / ${[...e.rigids.values()].reduce((n,m)=>n+m.geometry.instanceCount,0)} sólidos`).join(', ')||'ninguno'}${error?' · '+error:''}`;}
const waterReport=document.createElement('pre');waterReport.id='water-report';const diagnostics=document.createElement('details');diagnostics.innerHTML='<summary>Diagnóstico de boquilla</summary>';diagnostics.append(waterReport);document.querySelector('header').append(diagnostics);
function reportWater(){const worker=state.workers[0],effect=[...world.workVfx.effects.values()].find(e=>e.native.definition.id==='water'),model=world.mixers.get(worker.id)?.model,nozzle=model?.getObjectByName('Can_Nozzle');if(!effect||!nozzle){waterReport.textContent='Sin riego activo';return;}const source=world.wateringSource(worker.id,effect.native.time,effect),actual=new Vector3(0,.023,0);nozzle.localToWorld(actual);const emitted=new Vector3().fromArray(source.position);effect.localToWorld(emitted);waterReport.textContent=JSON.stringify({worker:{x:worker.x,z:worker.z,heading:worker.heading,renderYaw:world.objects.get(worker.id)?.rotation.y},crop:{x:state.plants[0].x,z:state.plants[0].z},standOffMeters:Math.hypot(worker.x-state.plants[0].x,worker.z-state.plants[0].z),sourceBound:!!world.workVfx.waterSource,profile,time:effect.native.time,nozzle:actual.toArray(),emitter:emitted.toArray(),offsetMeters:actual.distanceTo(emitted),drops:effect.native.rigids.filter(r=>r.kind==='water').length,error},null,2);}
function advance(dt){Game.resume(state,'qa');if(isMature(state.plants[0])&&!state.plants[0].harvestRequested)Game.harvest(state,'qa-harvest',state.plants[0].id);Game.tick(state,dt,nav);Game.pause(state,'qa');}
async function run(until){document.querySelectorAll('button').forEach(b=>b.disabled=true);for(let i=0;i<4000&&!state.result;i++){advance(.1);world.workVfx.update(state);if(until())break;if(i%25===24){world.render(0);status();await new Promise(resolve=>setTimeout(resolve,0));}}world.render(0);status();document.querySelectorAll('button').forEach(b=>b.disabled=false);}
document.querySelector('#next').onclick=()=>{const previous=[...world.workVfx.effects.keys()][0];run(()=>world.workVfx.effects.size>0&&[...world.workVfx.effects.keys()][0]!==previous);};document.querySelector('#day').onclick=()=>run(()=>state.crates.some(c=>c.delivered));document.querySelector('#step').onclick=()=>{advance(.5);world.render(0);status();};document.querySelector('#reload').onclick=()=>{state=deserialize(serialize(state));nav.setState(state);world.state=state;world.simElapsed=state.elapsed;center=state.structures[0];world.render(0);status();};

document.querySelector('#repair').onclick=async()=>{
 const previous=new Set(state.events.filter(e=>e.type==='RepairApplied').map(e=>e.id));
 Game.resume(state,'qa');
 try{hitStructure(center,40);nav.setState(state);Game.requestRepair(state,'qa-repair-'+state.sequence,center.id);}catch(e){error=e.message;status();return;}finally{Game.pause(state,'qa');}
 await run(()=>state.events.some(e=>e.type==='RepairApplied'&&!previous.has(e.id)));
 const event=state.events.find(e=>e.type==='RepairApplied'&&!previous.has(e.id));if(!event)return;
 advance(.12);const p=event.presentation,y=nav.field.surface(p.x,p.z);world.controls.target.set(p.x,y+.3,p.z);world.camera.position.set(p.x+2.8,y+2.4,p.z+3.5);world.controls.update();world.render(0);status();
};
function frame(){world.render(0);status();reportWater();requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('pagehide',()=>world.dispose());
</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Magic unlocks</title>
<link rel="stylesheet" href="../../src/ui/styles.css"><link rel="stylesheet" href="../../public/content/hud.css"><link rel="stylesheet" href="../../public/content/fonts.css">
<style>body{padding:16px;background:#172c22}header.qa{position:relative;color:white}#fixture{position:relative;width:390px;max-width:100%;height:410px;margin:16px 0}.panel{position:relative}pre{font:12px monospace;color:white;max-height:200px;overflow:auto}#status{display:block;margin:8px}#fixture .panel-body{max-height:340px;overflow:auto}</style>
<header class="qa"><p>Actual paid calendar to day 5, shared spell cards and original HUD icons/styles. Component width 390 px; clear navigation, no 3D world. Original unlock MP3, predecoded and muted.</p><button id="run">Test live unlocks</button><button id="spanish" hidden>Ver tarjetas en español</button><button id="english" hidden>Show cards in English</button><output id="status">Ready</output></header><div id="fixture"></div><pre id="report" data-no-i18n></pre>
<script type="module">
import * as Game from '../../src/simulation/game.js';import {serialize} from '../../src/persistence/snapshots.js';import {numberOf} from '../../src/simulation/money.js';import {AudioSystem} from '../../src/audio/audio.js';import {spellCardsMarkup,refreshSpellCards} from '../../src/ui/spell-cards.js';import {spellSVG,framePaint,ASSETS} from '../../src/ui/native-hud.js';import {setLanguage,localize} from '../../public/i18n/runtime.js';
const nav={placement:()=>({valid:true}),setState(){},terrainValid:()=>true,walkable:()=>true,path:(_a,b)=>[{x:b.x,z:b.z}]},errors=[],accepted=[],snapshots=[],status=document.querySelector('#status'),report=document.querySelector('#report'),host=document.querySelector('#fixture');let audio,state,originalNodes;
const assert=(v,m)=>{if(!v)throw Error(m);},flush=()=>new Promise(done=>setTimeout(done,0));addEventListener('pagehide',()=>audio?.dispose());addEventListener('error',e=>errors.push(String(e.error??e.message)));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
function show(){refreshSpellCards(host,state);localize(host);assert([...host.querySelectorAll('[data-spell]')].every((b,i)=>b===originalNodes[i]),'Cards recreated');}
function capture(tag){snapshots.push({tag,day:state.day,time:state.time,balance:numberOf(state.ledger.balance),cards:originalNodes.map(b=>({id:b.dataset.spell,disabled:b.disabled,label:b.querySelector('.spell-status').textContent,cooldown:b.querySelector('.cooldown-number').textContent}))});}
function language(code){setLanguage(code,{persist:false,broadcast:false});show();capture(code);report.textContent=JSON.stringify(result(),null,2);}
function result(){return {accepted,snapshots,errors,muted:true,world3D:false,componentWidth:host.clientWidth,context:audio?.context.state,finalVoices:audio?.active.length};}
document.querySelector('#spanish').onclick=()=>language('es');document.querySelector('#english').onclick=()=>language('en');
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 setLanguage('en',{persist:false,broadcast:false});audio=new AudioSystem({sfx:0,music:0});await audio.unlock();audio.sfx=await audio.sfxBank();const entry=audio.sfx.items.find(i=>i.id==='ui_unlock'),buffer=await audio.buffer(entry.audio.url),play=audio.sound.bind(audio);
 audio.sound=async(id,options)=>{if(id!=='ui_unlock')return null;const source=await play(id,options);if(source){assert(source.buffer===buffer&&source.playbackRate.value===1&&!source.loop,'Original changed');const voice=audio.voices.get(source);accepted.push({id,day:state.day,time:state.time,elapsed:state.elapsed,bus:voice.bus,emitter:voice.emitter,channels:buffer.numberOfChannels,sampleRate:buffer.sampleRate,duration:buffer.duration,rate:source.playbackRate.value});}return source;};
 state=Game.newGame({slotId:'native-unlocks',seed:712});Game.resume(state,'intro');Game.placeStructure(state,'center',{x:12,z:8},nav);Game.plant(state,'seed','mijo',17,8,nav);Game.openInitialHiring(state);Game.hire(state,'hire-1',{olderMale:1});
 host.innerHTML=`<section class="panel" role="dialog" aria-label="Magia"><canvas class="frame-canvas" aria-hidden="true"></canvas><header class="panel-head"><h2 class="panel-title">Magia</h2></header><div class="panel-body">${spellCardsMarkup(state,spellSVG)}</div></section>`;originalNodes=[...host.querySelectorAll('[data-spell]')];show();capture('day1');assert(originalNodes.every(b=>b.disabled),'Early spell enabled');framePaint(host,{short:false,portrait:true},Object.fromEntries(await Promise.all(Object.entries(ASSETS).filter(([key])=>key.startsWith('frame_')).map(([key,value])=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve([key,image]);image.onerror=reject;image.src=value.src;})))));audio.updateUnlocks(state);
 let loops=0;while(state.day<5){assert(++loops<2000,'Calendar stalled');Game.tick(state,2,nav);assert(!state.result,'Unexpected defeat');const before=serialize(state);audio.updateUnlocks(state);assert(before===serialize(state),'Observer changes state');if(state.pauses.includes('hiring')){Game.hire(state,'hire-'+state.day,{olderMale:1});audio.updateUnlocks(state);}show();await flush();}
 assert(accepted.length===3,'Unlock count');capture('day5');assert(originalNodes.every(b=>!b.disabled),'Unlocked card unavailable');
 Game.cast(state,'growth','growth',40,40,nav);show();capture('casting');Game.tick(state,1,nav);show();capture('cooldown');assert(originalNodes[1].querySelector('.cooldown-number').textContent==='89','Cooldown stale');const panel=host.querySelector('.panel-body');panel.scrollTop=12;const scroll=panel.scrollTop;for(let i=0;i<100;i++)show();assert(panel.scrollTop===scroll,'Scroll reset');
 audio.stop();audio.updateUnlocks(state);await flush();assert(accepted.length===3,'Stop/resume replay');audio.dispose();await new Promise(done=>setTimeout(done,80));assert(audio.active.length===0&&audio.context.state==='closed','Audio leak');assert(errors.length===0,'Browser errors');language('en');document.querySelector('#spanish').hidden=false;document.querySelector('#english').hidden=false;status.textContent='Completed · 3 original unlocks, live cards and cooldown verified';
 }catch(e){errors.push(String(e));status.textContent='FAIL: '+e.message;report.textContent=JSON.stringify(result(),null,2);audio?.dispose();}};
</script></html>

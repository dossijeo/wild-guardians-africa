<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · SFX 043/046 fragmentos</title>
<p>AudioContext nativo silenciado. Emisor de partículas original con focos sintéticos; no hay mundo 3D. Comprueba agrupación, primer contacto, reproducción hasta ended y liberación de fuentes. No acredita escucha perceptual.</p>
<button id="run" disabled>Probar fragmentos</button><output id="status">Cargando módulos</output><pre id="report"></pre>
<script type="module">
import {AudioSystem} from '../../src/audio/audio.js';
import {createNativeDestructionEffects} from '../../src/rendering/destruction-effects-native.js';
const status=document.querySelector('#status'),report=document.querySelector('#report'),errors=[],rows=[];let live;
status.textContent='Lista';document.querySelector('#run').disabled=false;
addEventListener('pagehide',()=>live?.dispose());addEventListener('error',e=>errors.push(String(e.message)));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
const assert=(v,m)=>{if(!v)throw Error(m);};
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 const audio=live=new AudioSystem({sfx:0,music:0});await audio.unlock();const bank=await audio.sfxBank();
 for(const id of ['wall_debris_small','wall_debris_ground']){const item=bank.items.find(i=>i.id===id);await audio.buffer(item.audio.url);}
 const sound=audio.sound.bind(audio),pending=[];
 audio.sound=(id,options)=>{const work=sound(id,options).then(source=>{
  assert(source,'Cue rechazado: '+id);const row={id,gain:options.gain,emitter:options.emitter,family:options.family,started:true,ended:false};rows.push(row);
  return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('No ended: '+id)),20000);source.addEventListener('ended',()=>{clearTimeout(timeout);row.ended=true;resolve();},{once:true});});
 });pending.push(work);return work;};
 const kernel={hitSites:Array.from({length:8},()=>({p:[0,1,0],n:[0,1,0],birth:.5,maxRadius:0})),radiusAt:()=>1},fx=createNativeDestructionEffects(kernel,{seed:123});
 const state={pauses:[]},entity={id:'qa-fragments',x:0,z:0},options={state,listener:{x:48,z:0}};
 fx.initialize(.8);fx.burst([0,1,0],[0,1,0],.5);audio.destructionCue({debrisEmitted:fx.stats.debrisEmitted},entity,options);
 let contactSeen=false;const started=performance.now();
 while(performance.now()-started<2200){
  const before=fx.stats.groundContacts;fx.advance(1/30);
  if(fx.stats.groundContacts>before&&!contactSeen){contactSeen=true;audio.destructionCue({groundContacts:fx.stats.groundContacts-before},entity,options);}
  await new Promise(resolve=>requestAnimationFrame(resolve));
 }
 await Promise.all(pending);assert(contactSeen,'Sin contacto físico');assert(rows.length===2&&rows.every(r=>r.ended&&r.gain===.2),'Fuentes incorrectas');assert(audio.active.length===0&&audio.voices.size===0,'Fuentes retenidas');
 await audio.dispose();live=null;assert(errors.length===0,'Errores globales');status.textContent='Completada';report.textContent=JSON.stringify({passed:true,rows,errors,emitted:fx.stats.debrisEmitted,contacts:fx.stats.groundContacts,voices:audio.voices.size,context:audio.context.state,muted:true,world3D:false},null,2);
 }catch(error){errors.push(String(error));status.textContent='FAIL';report.textContent=JSON.stringify({passed:false,rows,errors},null,2);await live?.dispose();}};
</script></html>

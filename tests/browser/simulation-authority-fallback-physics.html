<!doctype html><meta charset="utf-8"><script type="module">
import {runFallbackPhysics} from './fallback-physics-harness.js';
window.audit=async()=>{const worker=new Worker('./fallback-physics-harness.js',{type:'module'});try{const remote=new Promise((resolve,reject)=>{worker.onmessage=({data})=>data.error?reject(Error(data.error)):resolve(data.result);worker.onerror=e=>reject(Error(e.message));});worker.postMessage({});const local=await runFallbackPhysics(),result=await remote;if(JSON.stringify(local)!==JSON.stringify(result))throw Error('Fallback physics diverged');const alternate=await runFallbackPhysics({sampleEvery:5});if(JSON.stringify(local.frames.map(f=>f.animals))!==JSON.stringify(alternate.frames.map(f=>f.animals)))throw Error('Presentation sampling changes authoritative fallback state');const {frames,...summary}=result;return {...summary,steps:frames.length,samplingCadences:[1,5],scope:'Four simultaneous laboratory-injected impacts in island mangroves: three Rapier actors and one baked fallback, using the same worker physics driver locally and in a Worker. The injection bypasses gameplay cooldown only for the test. No full production scene comparison, player input, save/restore or visual acceptance.'};}finally{worker.terminate();}};window.ready=true;
</script>

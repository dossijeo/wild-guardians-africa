<!doctype html><html lang="es"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>QA · Manos V8 en la finca real</title><style>body{margin:0;font:14px system-ui;background:#ebe2c9}header{position:absolute;z-index:1;padding:12px;background:#fff9ed}button,select{font:inherit;padding:8px;margin:5px}canvas{width:100vw;height:100vh;display:block}#status{display:block}</style><header>Visor de manos: usa WorldScene, el terreno original y entidades creadas con comandos del juego.<br><label>Paso <select id="step"><option value="intro">Mano abierta</option><option value="center">Señalar</option><option value="plant">Tocar</option><option value="hire">Mantener pulsado</option><option value="observe">Arrastrar</option><option value="harvest">Pellizcar</option><option value="done">Tutorial terminado</option></select></label><button id="focus">Acercar al objetivo</button><button id="day">Mostrar día 2</button><span id="status" role="status">Cargando finca y seis texturas originales…</span></header><canvas id="world" aria-label="Finca original con manos del tutorial"></canvas><script type="module">
import * as Game from '../../src/simulation/game.js';
import {Navigation} from '../../src/world/navigation.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {WorldScene} from '../../src/rendering/scene.js';
import {json} from '../../src/rendering/assets.js';
const pack=await json('/content/biome-savanna.json'),villages=await json('/content/villages.json'),payload=villages.find(v=>v.id==='mapungubwe');
const state=Game.newGame({seed:712}),nav=new Navigation(712,'sabana',pack.profile),location=await findInitialLocationAsync(nav,payload);
Object.assign(state.villages[0],location);state.suppressed.push(...location.suppress);nav.setState(state);Game.resume(state,'intro');
Game.placeStructure(state,'qa-center',{x:location.center.x,z:location.center.z},nav);
let site;
for(let z=-6;z<=6&&!site;z+=1.5)for(let x=4.5;x<12&&!site;x+=1.5){const p={x:location.center.x+x,z:location.center.z+z};if(nav.placement(p.x,p.z,.4).valid)site=p;}
Game.plant(state,'qa-seed','mijo',site.x,site.z,nav);Game.openInitialHiring(state);Game.hire(state,'qa-contract',{olderMale:1});
const world=new WorldScene(document.querySelector('#world'),()=>{});world.onError=e=>document.querySelector('#status').textContent=e.message;world.qualitySetting('media');await world.load(state,nav,payload);
state.tutorial.step='intro';
function focus(){world.updateHands(.05);const corners=world.hands.hints.last?.corners;if(!corners)return;const points=[...corners,world.hands.hints.last.target];const p=corners[0].map((_,i)=>(Math.min(...points.map(c=>c[i]))+Math.max(...points.map(c=>c[i])))/2);const radius=Math.max(...points.map(c=>Math.hypot(...c.map((v,i)=>v-p[i]))));const distance=Math.max(8,radius/Math.sin(world.camera.fov*Math.PI/360)*1.15);world.controls.target.set(...p);world.camera.position.set(p[0]+distance*.45,p[1]+distance*.4,p[2]+distance*.8);world.controls.update();}
document.querySelector('#step').onchange=e=>{state.tutorial.step=e.target.value;focus();};document.querySelector('#focus').onclick=focus;
document.querySelector('#day').onclick=e=>{state.day=state.day===1?2:1;e.target.textContent=state.day===1?'Mostrar día 2':'Mostrar día 1';};focus();
let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;world.render(dt);const s=world.hands.hints.getState();document.querySelector('#status').textContent=`Día ${state.day} · ${s.kind??'sin manos'} · ${s.vertices} vértices / ${s.triangles} triángulos · profundidad activada · ${s.intersections.length} intersecciones · objetivo ${s.target??'ninguno'}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>

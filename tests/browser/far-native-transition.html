<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Transición nativa de acacia</title>
<style>body{margin:0;overflow:hidden;font:14px system-ui}header{position:absolute;z-index:1;background:#fff9de;padding:12px;max-width:370px;max-height:90vh;overflow:auto}button{padding:9px}pre{font-size:11px;white-space:pre-wrap}canvas{display:block}</style>
<header><strong>Lote nativo + impostor precocinado</strong><p>Prueba aislada, sin gameplay. La preparación GPU requiere una acción explícita.</p><button id="prepare" disabled>Preparar GPU</button><button id="hide" disabled>Ocultar/restaurar árbol</button><p><label>Distancia <select id="distance"><option>25</option><option>40</option><option>50</option><option>60</option><option>100</option></select></label></p><p id="status">Cargando…</p><pre id="report"></pre></header><canvas></canvas>
<script type="module">
import * as THREE from 'three';
import {Assets,json} from '../../src/rendering/assets.js';
import {AfricanToon} from '../../src/rendering/african-toon.js';
import {createAssetLod,updateAssetLods} from '../../src/rendering/asset-lod.js';
import {NativeAssetGroups} from '../../src/rendering/asset-groups.js';
import {createFarImpostorPrototype} from '../../tools/experiments/far-impostor-prototype.js';
import {modelOrigin} from '../../tools/experiments/far-impostor-math.js';
import {NativeTreeCoverage} from '../../tools/experiments/native-tree-coverage.js';

import {FarTreeTransitions} from '../../tools/experiments/far-tree-transitions.js';
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true}),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.1,500),assets=new Assets(),toon=new AfricanToon(),errors=[],status=document.querySelector('#status'),report=document.querySelector('#report');
renderer.setPixelRatio(1);renderer.debug.onShaderError=()=>errors.push('Shader compilation failed');scene.background=new THREE.Color('#b5d9e8');scene.fog=new THREE.Fog('#b5d9e8',30,300);camera.position.set(0,10,25);camera.lookAt(0,3,0);
const sun=new THREE.DirectionalLight('#ffe2a8',3);sun.position.set(-30,55,25);scene.add(sun,new THREE.HemisphereLight('#ebf1d9','#765b3b',2));toon.update(0,sun,'sabana');
let prototype,levels=[],group,groups,coverage,fade,controller,ground,dead=false,gpuReady=false,hidden=false,last=performance.now(),lastReport=0,prepareMs=null,preparedTextures=0;const chunks=new Map();
try{
 const metadata=await json('/docs/qa/far-vegetation-atlas/acacia.json'),pack=await json('/content/biome-savanna.json');levels=(await assets.biome({...pack,assets:pack.assets.slice(0,1)}))[0];for(const source of levels)toon.material(source.material);
 const loader=new THREE.TextureLoader(),texture=await loader.loadAsync('../../docs/qa/far-vegetation-atlas/savanna-acacia-8views.webp'),prelit={day:await loader.loadAsync('../../docs/qa/far-prelit-128/day.webp'),night:await loader.loadAsync('../../docs/qa/far-prelit-128/night.webp'),views:8,rotations:8,resolution:128},tree={id:'native-acacia',x:0,y:0,z:0,yaw:0,scale:1};
 prototype=createFarImpostorPrototype(levels[0],texture,metadata,[tree],{toon,prelitAtlas:prelit});scene.add(prototype.impostors);
 const origin=modelOrigin(tree,metadata.localBase,0,1),instance={...tree,...origin,sx:1,sy:1,sz:1};group=new THREE.Group();group.userData.nativeChunkOrigin=[0,0];createAssetLod(group,levels,[instance],{group:0},0);chunks.set('0,0',group);scene.add(group);groups=new NativeAssetGroups(scene);
 coverage=new NativeTreeCoverage();fade=new NativeFarCoverage(metadata.localBase);controller=new FarTreeTransitions();controller.bind(prototype,[tree]);
 ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshBasicMaterial({color:'#979b61'}));ground.rotation.x=-Math.PI/2;ground.position.y=-.01;scene.add(ground);
 document.querySelector('#prepare').disabled=false;document.querySelector('#hide').disabled=false;
 document.querySelector('#hide').onclick=()=>{hidden=!hidden;controller.setSuppressions(new Set(hidden?[tree.id]:[]));};
 document.querySelector('#distance').onchange=event=>{camera.position.z=Number(event.target.value);camera.lookAt(0,3,0);};
 document.querySelector('#prepare').onclick=async()=>{
  document.querySelector('#prepare').disabled=true;gpuReady=false;controller.setCoverage(coverage,false);const begin=performance.now();status.textContent='Preparando recursos GPU…';
  try{
   const textures=new Set([texture,prelit.day,prelit.night]);for(const source of levels)for(const value of Object.values(source.material))if(value?.isTexture)textures.add(value);for(const t of textures)renderer.initTexture(t);preparedTextures=textures.size;
   await renderer.compileAsync(scene,camera);if(dead)return;if(errors.length||renderer.getContext().getError())throw Error('GPU preparation failed');prepareMs=performance.now()-begin;gpuReady=true;controller.setCoverage(coverage,true);
  }catch(error){errors.push(String(error));status.textContent='Error de preparación';}
 };
 function frame(now){if(dead)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(canvas.width!==innerWidth||canvas.height!==innerHeight){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
  updateAssetLods(chunks,camera,'media');coverage.update(chunks);controller.setCoverage(coverage,gpuReady);controller.advance(dt);prototype.update(camera);fade.update(chunks,camera,id=>prototype.treeState(id),prototype.stats().readinessRevision);groups.update(chunks,camera,{x:0,z:0});renderer.render(scene,camera);
  if(now-lastReport>200){lastReport=now;const state=prototype.treeState(tree.id);status.textContent=gpuReady?'GPU preparada':'GPU retenida';report.textContent=JSON.stringify({camera:camera.position.toArray(),gpuReady,prepareMs,preparedTextures,state,activeTransitions:controller.active.size,nativePacked:coverage.has(tree.id),nativeColorCoverage:group.userData.lodBatches[0].meshes.map(m=>({count:m.count,coverage:m.geometry.attributes.nativeVisibility?.getX(0)})),mergedColorGroups:groups.colors.size,prototype:prototype.stats(),nativeFadeScans:fade.scans,programs:renderer.info.programs.length,drawCalls:renderer.info.render.calls,webglError:renderer.getContext().getError(),errors},null,2);}requestAnimationFrame(frame);
 }requestAnimationFrame(frame);
}catch(error){errors.push(String(error));status.textContent='ERROR';report.textContent=JSON.stringify({errors});}
addEventListener('pagehide',()=>{dead=true;controller?.clear();coverage?.clear();groups?.dispose();for(const b of group?.userData.lodBatches??[]){b.shadow.dispose();for(const mesh of b.meshes){mesh.dispose();if(mesh.geometry!==b.levels[0].geometry)mesh.geometry.dispose();}}prototype?.dispose();ground?.geometry.dispose();ground?.material.dispose();assets.disposeModels();toon.shadowUniforms.fallback.dispose();renderer.dispose();renderer.forceContextLoss();},{once:true});
</script></html>

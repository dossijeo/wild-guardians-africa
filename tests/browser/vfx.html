<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · VFX Atelier original en Three.js</title><style>body{margin:0;font:14px system-ui;background:#c1a575}header{position:absolute;z-index:2;padding:12px;background:#fff9ed;max-width:95vw}button,select{padding:7px;margin:3px}canvas{display:block;width:100vw;height:100vh}#report{max-height:200px;overflow:auto}#status{display:block}</style><header>Visor aislado de las 18 composiciones originales. Contactos decorativos; sin economía ni guardados.<br><select id="composition" aria-label="Composición original"></select><select id="light" aria-label="Iluminación"><option value="0">Día</option><option value=".43" selected>Atardecer</option><option value="1">Noche</option></select><select id="scale" aria-label="Escala de ensayo"><option value="1">Escala 1</option><option value="2">Escala 2</option><option value="4">Escala 4</option></select><button id="contact">Contacto</button><button id="step">Avanzar 0,1 s</button><button id="second">Avanzar 1 s</button><button id="clear">Limpiar efectos</button><button id="all">Comprobar las 18</button><span id="status">Cargando atlas original…</span><div id="report" role="log"></div></header><canvas id="world" aria-label="Partículas sólidas, cintas y atlas original en el renderer del juego"></canvas><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Assets,json} from '/src/rendering/assets.js';
import {BuildingDestructionPass} from '/src/rendering/buildings.js';
import {VfxLibrary} from '/src/rendering/vfx.js';
import {vfxDefinitions,vfxEnvironment} from '/src/rendering/vfx-native.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#world'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;
const scene=new THREE.Scene();scene.background=new THREE.Color('#c1a575');const camera=new THREE.PerspectiveCamera(43,1,.1,65);camera.position.set(6,4.4,8);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.7,0);controls.update();
const sun=new THREE.DirectionalLight('#ffe5b3',3);sun.position.set(-5,8,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=sun.shadow.camera.bottom=-6;sun.shadow.camera.right=sun.shadow.camera.top=6;scene.add(sun,sun.target,new THREE.HemisphereLight('#c6d2bf','#74583a',2));
const floor=new THREE.Mesh(new THREE.CylinderGeometry(4.52,4.52,.035,80),new THREE.MeshStandardMaterial({color:'#c1a575',roughness:.98}));floor.position.y=-.0175;floor.receiveShadow=true;scene.add(floor);
const bed=new THREE.Mesh(new THREE.BoxGeometry(2.5,.18,2.12),new THREE.MeshStandardMaterial({color:'#795839',roughness:1}));bed.position.y=.06;bed.receiveShadow=true;scene.add(bed);
const occluder=new THREE.Mesh(new THREE.BoxGeometry(.35,1.5,.65),new THREE.MeshStandardMaterial({color:'#ae8453',roughness:.91}));occluder.position.set(1.16,.75,0);occluder.castShadow=occluder.receiveShadow=true;scene.add(occluder);
const pipeline=new BuildingDestructionPass(renderer,sun),assets=new Assets(),catalog=await json('/content/vfx.json'),texture=await assets.texture(catalog.atlas),library=new VfxLibrary(catalog,texture);
const select=document.querySelector('#composition');for(const d of vfxDefinitions){const option=document.createElement('option');option.value=d.id;option.textContent=d.title;select.append(option);}let fx,error='';
function choose(id){fx?.dispose();fx=library.create(id,pipeline);scene.add(fx);fx.seek(0);select.value=id;bed.visible=['dig','water','harvest'].includes(id);occluder.visible=['rhino','lion','warthog','hyena','wood','adobe','stone'].includes(id);}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();choose('rhino');
function draw(){
 const night=Number(document.querySelector('#light').value),scale=Number(document.querySelector('#scale').value);fx.scale.setScalar(scale);fx.environment=vfxEnvironment(night);sun.intensity=night===1?.3:3;scene.background.set(night===1?'#293841':'#c1a575');bed.scale.setScalar(scale);bed.position.y=.06*scale;occluder.scale.setScalar(scale);occluder.position.set(1.16*scale,.75*scale,0);controls.update();
 const depth=fx.prepare(camera,scene);if(depth)pipeline.captureDepth(camera,scene);renderer.render(scene,camera);
 const glError=renderer.getContext().getError();if(glError)error='WebGL '+glError;
 document.querySelector('#status').textContent=`${fx.native.definition.title} · ${fx.native.time.toFixed(2)} s · sprites ${fx.sprites.geometry.instanceCount} · sólidos ${[...fx.rigids.values()].reduce((n,m)=>n+m.geometry.instanceCount,0)} · vértices de cintas ${fx.ribbons.geometry.drawRange.count} · contactos decorativos ${fx.native.contacts.length} · ${error||'WebGL sin errores'}`;
}
select.onchange=()=>choose(select.value);document.querySelector('#contact').onclick=()=>fx.seek(({dig:.7,water:1.6,harvest:.7,dust:.65,wood:.55,adobe:.55,stone:.55}[fx.native.definition.id])??fx.native.definition.duration*.5);document.querySelector('#step').onclick=()=>fx.advance(.1);document.querySelector('#second').onclick=()=>fx.advance(1);document.querySelector('#clear').onclick=()=>fx.clear();
document.querySelector('#all').onclick=async()=>{
 document.querySelector('#all').disabled=true;document.querySelector('#report').replaceChildren();
 for(const d of vfxDefinitions){choose(d.id);for(const phase of [.25,.5,.9]){fx.seek(d.duration*phase);draw();await new Promise(requestAnimationFrame);}const row=document.createElement('div');row.textContent=d.id+' · '+(error||'3 fases dibujadas sin errores WebGL');document.querySelector('#report').append(row);}
 document.querySelector('#all').disabled=false;
};
function frame(){draw();requestAnimationFrame(frame);}frame();addEventListener('pagehide',()=>{library.dispose();texture.dispose();pipeline.dispose();controls.dispose();renderer.dispose();});
</script></html>

<!doctype html><meta charset="utf-8"><script type="module">
import {deserialize} from '../../src/persistence/snapshots.js';
import {createConfirmedStateReceiver} from '../../src/simulation/confirmed-state-receiver.js';
import {createWorkerHostedRuntime} from '../../src/simulation/worker-hosted-runtime.js';
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(predicate,label){for(let i=0;i<160;i++){if(predicate())return;await sleep(25);}throw Error('Timed out: '+label);}
window.audit=async()=>{
 const source=await (await fetch('/tests/fixtures/manglares-123-d10-raid-state.json.gz')).text(),state=deserialize(source),session='visual-loss-fixture',terrain=new MessageChannel(),presentation=new MessageChannel(),recovery=new MessageChannel(),newTerrain=new MessageChannel(),newPresentation=new MessageChannel(),observed=[],replayed=[];let holdCandidate=false,held=null;
 function consumeTerrain(port){port.onmessage=({data})=>{if(data.kind==='terrain')port.postMessage({kind:'terrainAck',session,id:data.id});};port.start();}
 function consumePresentation(port){port.onmessage=({data})=>{if(data.kind!=='publication')return;const p=data.publication;observed.push({sequence:p.sequence,events:(p.events??[]).map(e=>e.id)});if(holdCandidate&&p.terrainCheckpoint){held=p;return;}port.postMessage({kind:'publicationAck',session,sequence:p.sequence,...(p.terrainCheckpoint?{workCheckpoint:{version:1,sequence:p.sequence,elapsed:p.elapsed,effects:[]}}:{})});};port.start();}
 consumeTerrain(terrain.port1);consumeTerrain(newTerrain.port1);consumePresentation(presentation.port1);consumePresentation(newPresentation.port1);
 recovery.port1.onmessage=({data})=>{replayed.push(data);recovery.port1.postMessage({kind:'recoveryAck',session,id:data.id,sequence:data.sequence,phase:data.kind.slice(8).toLowerCase()});};recovery.port1.start();
 const chunks=[];for(let z=-1;z<=1;z++)for(let x=0;x<=3;x++)chunks.push(`${x},${z}`);
 const delivered=[],runtime=createWorkerHostedRuntime({world:{createConfirmedReceiver:id=>createConfirmedStateReceiver(state,id)},session,clientOptions:{snapshot:source,chunkKeys:chunks},terrainPort:terrain.port2,presentationPort:presentation.port2,onConfirmedEvents:events=>delivered.push(...events.map(e=>e.id)),runtimeOptions:{stepSeconds:.05,maxBatchSteps:2,diagnostics:true,coalescePublications:true,qaVisualRecovery:true,qaVisualWorkRecovery:true}});
 try{
  await runtime.start();await runtime.submit({kind:'pause',reason:'visual-loss-fixture'});await runtime.submit({kind:'snapshot',visualTerrain:true});await until(()=>runtime.status().recoveryBaseSequence,'base ACK');const base=runtime.status().recoveryBaseSequence;
  holdCandidate=true;await runtime.submit({kind:'snapshot',visualTerrain:true});await until(()=>held,'candidate delivery');const candidate=held.sequence;if(candidate<=base)throw Error('Candidate precedes base');
  const eventOffset=delivered.length;await runtime.submit({kind:'resume',reason:'visual-loss-fixture'});await until(()=>delivered.length>eventOffset,'raid event');await runtime.submit({kind:'pause',reason:'visual-loss-fixture'});const events=delivered.slice(eventOffset);if(!events.length)throw Error('No event generated');
  const lost=await runtime.markVisualLostForQa();presentation.port1.close();const prepared=await runtime.prepareVisualRecoveryForQa();if(prepared.checkpoint.sequence!==base||prepared.checkpoint.workCheckpoint?.sequence!==base)throw Error('Lost acknowledged base');
  const attached=await runtime.attachVisualRecoveryForQa({terrainPort:newTerrain.port2,presentationPort:newPresentation.port2,recoveryPort:recovery.port2});const publications=replayed.filter(item=>item.kind==='recoveryPublication'),ids=publications.flatMap(item=>(item.publication.events??[]).map(event=>event.id)),eventIds=new Set(events),matched=ids.filter(id=>eventIds.has(id));if(JSON.stringify(matched)!==JSON.stringify(events))throw Error('Confirmed events missing, duplicated or reordered');if(!publications.some(item=>item.sequence===candidate)||attached.sequence<lost.sequence)throw Error('Candidate or tail missing');runtime.finishVisualRecoveryForQa();await runtime.submit({kind:'snapshot'});return {base,candidate,lost:lost.sequence,attached:attached.sequence,events,ids,replayPublications:publications.length,scope:'Real hosted simulation and authority Workers with mock visual, terrain and checkpoint consumers; no WebGPU device loss.'};
 }finally{runtime.dispose();for(const port of [terrain.port1,presentation.port1,newTerrain.port1,newPresentation.port1,recovery.port1])port.close();}
};window.ready=true;
</script>

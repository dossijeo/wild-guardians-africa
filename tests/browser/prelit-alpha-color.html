<!doctype html><html lang="en"><meta charset="utf-8"><title>QA prelit alpha color order</title>
<h1>Prelit atlas alpha/color order</h1><p>Isolated 1-pixel readback, no world or atlas replacement.</p><button id="run">Compare color conversion</button><pre id="report"></pre>
<script type="module">
import * as THREE from 'three';
import {premultiplyPrelitLinear} from '../../tools/experiments/prelit-linear-alpha.js';
const report=document.querySelector('#report');
document.querySelector('#run').onclick=()=>{
 const errors=[],renderer=new THREE.WebGLRenderer({alpha:false,antialias:false});renderer.setSize(1,1);renderer.outputColorSpace=THREE.LinearSRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;
 renderer.debug.onShaderError=()=>errors.push('Shader compilation failed');
 const target=new THREE.WebGLRenderTarget(1,1,{type:THREE.UnsignedByteType,colorSpace:THREE.NoColorSpace,depthBuffer:false,stencilBuffer:false}),scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);camera.position.z=1;
 const geometry=new THREE.PlaneGeometry(2,2),resources=[],rows=[],decode=x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4;
 for(const alpha of [255,192,128,64]){
  const canvas=document.createElement('canvas');canvas.width=canvas.height=1;const ctx=canvas.getContext('2d');ctx.putImageData(new ImageData(new Uint8ClampedArray([204,153,51,alpha]),1,1),0,0);
  const original=Array.from(ctx.getImageData(0,0,1,1).data),expected=original.slice(0,3).map(c=>Math.round(decode(c/255)*255));
  for(const mode of ['reference','current','decode-after-unpremultiply','offline-linear-premultiplied']){
   const uploadCanvas=mode==='offline-linear-premultiplied'?document.createElement('canvas'):canvas;if(uploadCanvas!==canvas){uploadCanvas.width=uploadCanvas.height=1;uploadCanvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(premultiplyPrelitLinear(new Uint8Array(original))),1,1),0,0);}
   const texture=new THREE.CanvasTexture(uploadCanvas);texture.colorSpace=mode==='decode-after-unpremultiply'?THREE.NoColorSpace:THREE.SRGBColorSpace;texture.premultiplyAlpha=mode==='current'||mode==='decode-after-unpremultiply';texture.minFilter=texture.magFilter=THREE.NearestFilter;texture.generateMipmaps=false;resources.push(texture);
   const fragment=mode==='reference'?'vec3 rgb=c.rgb;':['current','offline-linear-premultiplied'].includes(mode)?'vec3 rgb=c.rgb/max(c.a,.0001);':'vec3 raw=c.rgb/max(c.a,.0001);vec3 rgb=mix(raw/12.92,pow((raw+.055)/1.055,vec3(2.4)),step(vec3(.04045),raw));';
   const material=new THREE.ShaderMaterial({uniforms:{map:{value:texture}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'precision highp float;uniform sampler2D map;varying vec2 vUv;void main(){vec4 c=texture2D(map,vUv);'+fragment+'gl_FragColor=vec4(rgb,1.);}',depthTest:false,depthWrite:false,toneMapped:false});resources.push(material);
   const mesh=new THREE.Mesh(geometry,material);scene.add(mesh);renderer.setRenderTarget(target);renderer.render(scene,camera);const pixel=new Uint8Array(4);renderer.readRenderTargetPixels(target,0,0,1,1,pixel);scene.remove(mesh);
   rows.push({alpha,mode,canvasRGBA:original,expectedLinearRGB:expected,actualRGBA:Array.from(pixel),maximumChannelError:Math.max(...expected.map((c,i)=>Math.abs(c-pixel[i])))});
  }
 }
 const glError=renderer.getContext().getError();for(const resource of resources)resource.dispose();geometry.dispose();target.dispose();renderer.dispose();renderer.forceContextLoss();
 report.textContent=JSON.stringify({rows,errors,glError,limit:'Nearest sampling isolates upload/conversion order; it does not establish equivalence after filtering, angular mixing, or native tree rendering.'},null,2);
};
</script></html>

<!doctype html><html lang="es"><meta charset="utf-8"><title>QA finca grande y origen</title>
<style>body{margin:0;font:14px system-ui}canvas{width:100vw;height:100vh;display:block}header{position:absolute;z-index:2;left:0;top:0;background:#fffdeacc;padding:10px;max-width:460px}button{padding:8px;margin:3px}pre{max-height:180px;overflow:auto;font-size:11px}</style>
<header><strong>Finca grande · Sabana/Mapungubwe</strong><p>600 cultivos de ocho especies. Crédito QA explícito de 1000000; construcciones y semillas pagadas. Preparación botánica mediante riego/crecimiento nativos. Guarda únicamente qa-large-farm en este origen QA.</p>
<button id="measure" disabled>Medir finca</button><button id="compare" disabled>Comparar CPU anterior/actual</button><button id="resolution" disabled>Comparar resolución del mundo</button><button id="away" disabled>Descargar chunks de finca</button><button id="back" disabled>Volver y medir</button><button id="reload" disabled>Guardar y recargar</button>
<p id="status">Preparando finca…</p><p id="summary"></p><pre id="report"></pre><details><summary>Snapshot público</summary><pre id="snapshot"></pre></details></header><canvas id="world" aria-label="Finca grande lejos del origen"></canvas>
<script type="module">
import * as THREE from 'three';
import * as Game from '../../src/simulation/game.js';
import {rational} from '../../src/simulation/money.js';
import {cropSpec} from '../../src/simulation/rules.js';
import {waterPlant,advancePlant} from '../../src/simulation/crops.js';
import {SaveRepository,serialize} from '../../src/persistence/snapshots.js';
import {Navigation} from '../../src/world/navigation.js';
import {centerServicePoint} from '../../src/world/centers.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {WorldScene} from '../../src/rendering/scene.js';
import {json} from '../../src/rendering/assets.js';
import {createCropBatch} from '../../src/rendering/crop-batch.js';
import {applyWorldResolution} from '../../src/app/world-resolution.js';
const status=document.querySelector('#status'),report=document.querySelector('#report'),steps=[],errors=[],repo=new SaveRepository(localStorage);
const species=['maiz','algodon','girasol','platano','sorgo','mijo','yuca','batata'];
const pack=await json('/content/biome-savanna.json'),payload=(await json('/content/villages.json')).find(v=>v.id==='mapungubwe');
let state,nav,world,farm,home,baseline,baselineRoute,homeChunks,busy=true,disposed=false;
function assert(ok,message){if(!ok)throw new Error(message);}
const yieldUI=()=>new Promise(resolve=>setTimeout(resolve,0));
function publish(){report.textContent=JSON.stringify({steps,errors},null,2);document.querySelector('#snapshot').textContent=serialize(state);const last=steps.at(-1);document.querySelector('#summary').textContent=`${state.plants.length} cultivos · ${state.structures.length} estructuras · ${world?.chunks.size??0} chunks · errores ${errors.length}${last?.frameIntervalMs?' · frame medio '+last.frameIntervalMs.mean.toFixed(2)+' ms':''}`;}
function camera(away=false){const x=farm.x+(away?2048:0),z=farm.z+(away?2048:0),y=nav.field.surface(x,z);world.controls.target.set(x,y+.7,z);world.camera.position.set(x+45,y+58,z+72);world.controls.update();}
async function settle(){world.render(0);await world.whenChunksReady();world.render(0);}
function collisions(){return state.structures.map(s=>({id:s.id,x:s.x,z:s.z,blocked:!nav.walkable(s.x,s.z,.1),obstacle:nav.obstacles.some(o=>o.id===s.id)}));}
function route(){return nav.path(centerServicePoint(farm,state,.8),home.entry,.28,null,true);}
function geometryReport(){let instances=0,maxCropPositionError=0;const matched=new Set(),matrix=new THREE.Matrix4(),plants=new Map(state.plants.map(p=>[Number(p.id.replace(/\D/g,'')),p]));world.scene.traverse(o=>{if(!o.isInstancedMesh)return;const attr=o.geometry.getAttribute('iGrowth');if(!attr)return;instances+=o.count;for(let i=0;i<o.count;i++){const p=plants.get(attr.array[i*4+3]);assert(p,'Instancia sin planta lógica');o.getMatrixAt(i,matrix);const e=matrix.elements,error=Math.max(Math.abs(o.position.x+e[12]-p.x),Math.abs(o.position.z+e[14]-p.z),Math.abs(e[13]-nav.field.surface(p.x,p.z)));maxCropPositionError=Math.max(maxCropPositionError,error);matched.add(p.id);}});return {instances,matchedPlants:matched.size,maxCropPositionError,capacity:world.cropBatch.capacity,chunks:[...world.chunks.keys()],origin:{x:world.renderOrigin.x,z:world.renderOrigin.z},objects:world.objects.size,memory:{...world.renderer.info.memory},programs:world.renderer.info.programs.length};}
function invariants(){assert(serialize(state)===baseline,'Render/streaming altera el snapshot');assert(state.plants.length===600,'Se pierden cultivos');assert(collisions().every(c=>c.blocked&&c.obstacle),'Construcción sin colisión');const path=route();assert(path?.length,'Desaparece el camino entre centro y poblado');assert(JSON.stringify(path)===baselineRoute,'El camino cambia al hacer streaming o recargar');for(const s of state.structures){const root=world.objects.get(s.id);assert(root&&root.position.x===s.x&&root.position.z===s.z,'Construcción desplazada');}assert(world.scene.position.x===0&&world.scene.position.z===0,'Origen local no restaurado');}
async function measure(stage){
 for(let i=0;i<30;i++){await new Promise(requestAnimationFrame);world.render(0);}
 const cpu=[],frames=[],calls=[],triangles=[];let previous=performance.now();
 for(let i=0;i<60;i++){
  await new Promise(requestAnimationFrame);const start=performance.now();frames.push(start-previous);previous=start;
  world.render(0);cpu.push(performance.now()-start);calls.push(world.renderer.info.render.calls);triangles.push(world.renderer.info.render.triangles);
 }
 const summary=a=>{const sorted=[...a].sort((x,y)=>x-y);return {mean:a.reduce((x,y)=>x+y,0)/a.length,min:sorted[0],p50:sorted[Math.floor(sorted.length*.5)],p95:sorted[Math.ceil(sorted.length*.95)-1],max:sorted.at(-1)};};
 invariants();const info=geometryReport();assert(info.instances===600&&info.matchedPlants===600,'No se dibujan las 600 plantas');assert(info.maxCropPositionError<1e-5,'Colocación de cultivo inestable');
 steps.push({stage,...info,cpuRenderMs:summary(cpu),frameIntervalMs:summary(frames),drawCalls:summary(calls),triangles:summary(triangles),samples:{cpuRenderMs:cpu,frameIntervalMs:frames,drawCalls:calls,triangles},collisions:collisions(),route:route(),viewport:{css:[innerWidth,innerHeight],buffer:[world.canvas.width,world.canvas.height],dpr:devicePixelRatio},quality:world.quality,pixelRatioLimit:Number.isFinite(world.pixelRatioLimit)?world.pixelRatioLimit:null,shadowsEnabled:world.renderer.shadowMap.enabled});publish();status.textContent=stage;
}
async function run(action){if(busy)return;busy=true;for(const b of document.querySelectorAll('button'))b.disabled=true;try{await action();}catch(e){errors.push(String(e));status.textContent='FAIL: '+e.message;publish();console.error(e);}finally{busy=false;for(const b of document.querySelectorAll('button'))b.disabled=false;}}
try{
 const begin=performance.now();state=Game.newGame({seed:712,slotId:'qa-large-farm'});nav=new Navigation(712,'sabana',pack.profile);
 const initial=await findInitialLocationAsync(nav,payload);Object.assign(state.villages[0],initial);state.suppressed.push(...initial.suppress);nav.setState(state);state.ledger.balance=rational(1000000);Game.resume(state,'intro');
 Game.placeStructure(state,'paid-origin-center',initial.center,nav);
 // Explicit postgame QA checkpoint: founding villages is unavailable in campaign.
 state.initialPreparation=false;state.postgame=true;state.day=101;state.completedNights=100;
 let deadline=performance.now()+8,site;
 for(let ring=0;ring<70&&!site;ring++)for(let angle=0,count=ring?Math.max(24,Math.ceil(2*Math.PI*ring)):1;angle<count&&!site;angle++){
  const x=4096+Math.cos(angle/count*Math.PI*2)*ring*12,z=-4096+Math.sin(angle/count*Math.PI*2)*ring*12;
  if(Game.previewVillage(state,'mapungubwe',x,z,payload,nav).valid)site={x,z};
  if(performance.now()>deadline){status.textContent=`Buscando poblado lejano · anillo ${ring}`;await yieldUI();deadline=performance.now()+8;}
 }
 assert(site,'No hay emplazamiento lejano legal');Game.foundVillage(state,'paid-far-village','mapungubwe',site.x,site.z,payload,nav);home=state.villages.at(-1);
 for(let radius=22;radius<=80&&!farm;radius+=6)for(let a=0;a<16&&!farm;a++){
  const p={x:home.x+Math.cos(a/16*Math.PI*2)*radius,z:home.z+Math.sin(a/16*Math.PI*2)*radius};
  if(Game.previewCenter(state,p,nav).valid){Game.placeStructure(state,'paid-far-center',p,nav);farm=state.structures.at(-1);}
  await yieldUI();
 }
 assert(farm&&farm.villageId===home.id,'Falta centro asociado al poblado lejano');
 for(let x=36;x<=84&&state.structures.length<26;x+=3)for(let z=-36;z<=36&&state.structures.length<26;z+=3){
  const p={kind:'wall',material:'adobe',x:farm.x+x,z:farm.z+z,yaw:0};
  if(nav.wallPlacement(p).valid)Game.placeStructure(state,'paid-wall-'+state.structures.length,p,nav);
 }
 assert(state.structures.length===26,'Faltan las 24 defensas legales');
 for(let radius=0;radius<=65&&state.plants.length<600;radius+=1.5)for(let a=0,count=radius?Math.ceil(2*Math.PI*radius/1.5):1;a<count&&state.plants.length<600;a++){
  const p={x:farm.x+Math.cos(a/count*Math.PI*2)*radius,z:farm.z+Math.sin(a/count*Math.PI*2)*radius};
  if(nav.placement(p.x,p.z,.4).valid&&!state.plants.some(c=>Math.hypot(c.x-p.x,c.z-p.z)<1.1))Game.plant(state,'paid-plant-'+state.plants.length,species[state.plants.length%8],p.x,p.z,nav);
  if(performance.now()>deadline){status.textContent=`Plantando ${state.plants.length}/600`;await yieldUI();deadline=performance.now()+8;}
 }
 assert(state.plants.length===600,'Faltan cultivos legales');
 // Botanical QA preparation, not worker production or accelerated economics.
 for(const [i,p] of state.plants.entries()){
  const goal=cropSpec(p.species).growth_seconds*[.2,.45,.7,1][i%4];waterPlant(p);
  while(p.growth<goal-1e-8){const next=p.water.find(w=>w.status==='future');advancePlant(p,Math.min(goal-p.growth,next?next.at-p.growth:Infinity));while(waterPlant(p)){};}
 }
 state.time=100;state.initialPreparation=false;state.tutorial.step='done';Game.pause(state,'qa-static');
 world=new WorldScene(document.querySelector('#world'),()=>{});world.onError=e=>{errors.push(String(e));publish();};world.qualitySetting('media');await world.load(state,nav,payload);camera();await settle();
 baseline=serialize(state);baselineRoute=JSON.stringify(route());homeChunks=new Set(world.chunks.keys());invariants();
 steps.push({stage:'Finca preparada',preparationMs:performance.now()-begin,farVillage:{x:home.x,z:home.z},farm:{x:farm.x,z:farm.z},plants:600,species:Object.fromEntries(species.map(id=>[id,state.plants.filter(p=>p.species===id).length])),structures:state.structures.length,balance:state.ledger.balance.n,...geometryReport()});publish();status.textContent='Lista: 600 cultivos';busy=false;for(const b of document.querySelectorAll('button'))b.disabled=false;
 document.querySelector('#measure').onclick=()=>run(()=>measure('Medición inicial'));
 document.querySelector('#compare').onclick=()=>run(async()=>{
  const reference=await import('./crop-batch-reference.js'),capacity=world.cropBatch.capacity;
  // All other world code, assets, paused state, camera and quality stay fixed.
  // Interleave both orders; each replacement warms shaders/buffers before sampling.
  try{for(const [label,factory] of [['Anterior A1',reference.createCropBatch],['Actual B1',createCropBatch],['Actual B2',createCropBatch],['Anterior A2',reference.createCropBatch]]){
   status.textContent='Midiendo '+label;world.cropBatch.dispose();world.cropBatch=factory(world.scene,world.renderer,world.cropGltf,world.cropBridgeData,capacity);await measure(label);
  }}finally{world.cropBatch.dispose();world.cropBatch=createCropBatch(world.scene,world.renderer,world.cropGltf,world.cropBridgeData,capacity);world.render(0);}
 });
 document.querySelector('#resolution').onclick=()=>run(async()=>{
  const previous=world.pixelRatioLimit,quality=world.quality,shadowMap=world.renderer.shadowMap,chunks=[...world.chunks.keys()].join('|');
  try{for(const [label,preset] of [['Perfil A1','profile'],['DPR 1 B1','economy'],['DPR 1 B2','economy'],['Perfil A2','profile']]){
   status.textContent='Midiendo '+label;applyWorldResolution(world,preset);await measure(label);
   assert(world.quality===quality&&world.renderer.shadowMap===shadowMap&&shadowMap.enabled,'Resolución cambia calidad o sombras');
   assert([...world.chunks.keys()].join('|')===chunks,'Resolución reconstruye terreno');
  }}finally{world.pixelRatioLimit=previous;world.resize();world.render(0);}
 });
 document.querySelector('#away').onclick=()=>run(async()=>{camera(true);await settle();invariants();assert([...world.chunks.keys()].every(k=>!homeChunks.has(k)),'Chunks de finca siguen residentes');steps.push({stage:'Finca descargada',...geometryReport()});publish();status.textContent='Chunks de finca descargados';});
 document.querySelector('#back').onclick=()=>run(async()=>{camera();await settle();assert([...world.chunks.keys()].every(k=>homeChunks.has(k)),'Chunks de regreso diferentes');await measure('Medición tras streaming');});
 document.querySelector('#reload').onclick=()=>run(async()=>{const before=serialize(state),start=performance.now();repo.save(state);const saved=localStorage.getItem(repo.key(state.slotId));state=repo.load(state.slotId);assert(saved===before&&serialize(state)===before,'Guardado no es exacto');const storageMs=performance.now()-start;
  world.dispose();nav=new Navigation(712,'sabana',pack.profile);nav.setState(state);farm=state.structures.find(s=>s.id===farm.id);home=state.villages.find(v=>v.id===home.id);
  const loadStart=performance.now();world=new WorldScene(document.querySelector('#world'),()=>{});world.qualitySetting('media');await world.load(state,nav,payload);camera();await settle();assert(serialize(state)===before,'Recarga cambia datos');steps.push({stage:'Recarga exacta',storageMs,worldLoadMs:performance.now()-loadStart,snapshotBytes:new TextEncoder().encode(saved).length});await measure('Medición tras recarga');});
}catch(e){errors.push(String(e));status.textContent='FAIL: '+e.message;console.error(e);if(state)publish();}
function frame(){if(disposed)return;if(world&&!busy)world.render(0);requestAnimationFrame(frame);}requestAnimationFrame(frame);
addEventListener('pagehide',()=>{disposed=true;world?.dispose();});
</script></html>

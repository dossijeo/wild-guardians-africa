<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Polvo de locomoción</title><style>body{margin:0;font:14px system-ui}header{position:absolute;z-index:2;padding:12px;background:#fff9ed;max-width:95vw}button{padding:8px;margin:4px}canvas{width:100vw;height:100vh;display:block}#status{display:block}</style><header>Terreno, centro, semilla y trabajador originales pagados. Sin partidas guardadas.<br><button disabled id="view">Acercar a los pies</button><button disabled id="next">Buscar siguiente pisada</button><button disabled id="walking">Buscar pisada hacia cultivo</button><button disabled id="step">Avanzar 0,05 s</button><button disabled id="carry">Buscar pisada con caja</button><button disabled id="day">Completar entrega real</button><button disabled id="reload">Guardar y recargar en memoria</button><span id="status">Cargando finca…</span></header><canvas id="world" aria-label="Pisadas originales en terreno de la finca"></canvas><script type="module">
import * as Game from '../../src/simulation/game.js';
import {isMature} from '../../src/simulation/crops.js';
import {Navigation} from '../../src/world/navigation.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {WorldScene} from '../../src/rendering/scene.js';
import {json} from '../../src/rendering/assets.js';
import {serialize,deserialize} from '../../src/persistence/snapshots.js';
const pack=await json('/content/biome-savanna.json'),villages=await json('/content/villages.json'),payload=villages.find(v=>v.id==='suajili');
let state=Game.newGame({culture:'suajili',seed:712});const nav=new Navigation(712,'sabana',pack.profile),location=await findInitialLocationAsync(nav,payload);
Object.assign(state.villages[0],location);state.suppressed.push(...location.suppress);nav.setState(state);Game.resume(state,'intro');Game.placeStructure(state,'qa-center',{x:location.center.x,z:location.center.z},nav);let center=state.structures[0],site;
for(let z=-6;z<=6&&!site;z+=1.5)for(let x=4.5;x<12&&!site;x+=1.5){const p={x:center.x+x,z:center.z+z};if(nav.placement(p.x,p.z,.4).valid)site=p;}
Game.plant(state,'qa-seed','mijo',site.x,site.z,nav);Game.openInitialHiring(state);Game.hire(state,'qa-contract',{olderMale:1});Game.pause(state,'qa');state.tutorial.step='done';
const world=new WorldScene(document.querySelector('#world'),()=>{});let error='',closeView=false;world.onError=e=>{error=e.message;status();};world.qualitySetting('media');await world.load(state,nav,payload);
world.focus(site);const ground=nav.field.surface(site.x,site.z);world.controls.target.set(site.x,ground+.8,site.z);world.camera.position.set(site.x+4,ground+3.5,site.z+5);world.controls.update();
function status(){const worker=state.workers[0],effects=[...(world.locomotionVfx?.effects.values()??[])];document.querySelector('#status').textContent=`Trabajador ${worker.status} · marcha ${(worker.walkPhase??0).toFixed(3)} · tiempo ${state.elapsed.toFixed(2)} s · saldo ${state.ledger.balance.n} · entregas ${state.crates.filter(c=>c.delivered).length} · VFX ${effects.map(e=>`${e.native.definition.id} ${e.native.time.toFixed(2)} s / ${e.sprites.geometry.instanceCount} sprites / ${[...e.rigids.values()].reduce((n,m)=>n+m.geometry.instanceCount,0)} sólidos`).join(', ')||'ninguno'}${error?' · '+error:''}`;}
function advance(dt){Game.resume(state,'qa');if(isMature(state.plants[0])&&!state.plants[0].harvestRequested)Game.harvest(state,'qa-harvest',state.plants[0].id);Game.tick(state,dt,nav);Game.pause(state,'qa');}
async function run(until){for(const button of document.querySelectorAll('button'))button.disabled=true;for(let i=0;i<4000&&!state.result;i++){advance(.05);world.sync(.05);world.locomotionVfx.update(state,world.objects);if(until())break;if(i%25===24){frame();await new Promise(resolve=>setTimeout(resolve,0));}}frame();for(const button of document.querySelectorAll('button'))button.disabled=false;}
document.querySelector('#carry').onclick=()=>run(()=>state.workers[0].status==='carrying'&&[...world.locomotionVfx.effects.keys()].some(key=>key.includes('/Carry_Crate/')));document.querySelector('#walking').onclick=()=>run(()=>state.workers[0].status==='walking'&&world.locomotionVfx.effects.size>0);document.querySelector('#next').onclick=()=>{const previous=new Set(world.locomotionVfx.effects.keys());run(()=>[...world.locomotionVfx.effects.keys()].some(key=>!previous.has(key)));};document.querySelector('#day').onclick=()=>run(()=>state.crates.some(c=>c.delivered));document.querySelector('#step').onclick=()=>{advance(.05);frame();};document.querySelector('#reload').onclick=()=>{state=deserialize(serialize(state));nav.setState(state);world.state=state;world.simElapsed=state.elapsed;center=state.structures[0];frame();};
document.querySelector('#view').onclick=()=>{closeView=!closeView;frame();};
function frame(){const worker=state.workers[0];if(worker){const y=nav.field.surface(worker.x,worker.z);world.controls.minDistance=closeView?1:8;world.controls.target.set(worker.x,y+(closeView?.15:.7),worker.z);world.camera.position.set(worker.x+(closeView?1:3),y+(closeView?.7:2.4),worker.z+(closeView?1.2:3.7));world.controls.update();}world.render(0);status();}for(const button of document.querySelectorAll('button'))button.disabled=false;frame();addEventListener('pagehide',()=>world.dispose());
</script></html>

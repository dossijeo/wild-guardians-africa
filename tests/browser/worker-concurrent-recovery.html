<!doctype html><meta charset="utf-8"><script type="module">
import {deserialize} from '../../src/persistence/snapshots.js';
import {createConfirmedStateReceiver} from '../../src/simulation/confirmed-state-receiver.js';
import {createWorkerHostedRuntime} from '../../src/simulation/worker-hosted-runtime.js';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
window.audit=async(mode='success')=>{
 const response=await fetch('/tests/fixtures/manglares-123-d10-raid-state.json.gz'),source=await response.text(),state=deserialize(source),chunks=[];for(let z=-1;z<=2;z++)for(let x=0;x<=5;x++)chunks.push(`${x},${z}`);
 const session='concurrent-host-qa',terrain=new MessageChannel(),presentation=new MessageChannel(),recovery=new MessageChannel(),newTerrain=new MessageChannel(),newPresentation=new MessageChannel();
 function terrainConsumer(port){port.onmessage=({data})=>{if(data.kind==='terrain')port.postMessage({kind:'terrainAck',session,id:data.id});};port.start();}
 function presentationConsumer(port){port.onmessage=({data})=>{if(data.kind==='publication')port.postMessage({kind:'publicationAck',session,sequence:data.publication.sequence});};port.start();}
 terrainConsumer(terrain.port1);terrainConsumer(newTerrain.port1);presentationConsumer(presentation.port1);presentationConsumer(newPresentation.port1);
 const recovered=[];recovery.port1.onmessage=({data})=>{recovered.push({kind:data.kind,sequence:data.sequence});if(mode!=='timeout')setTimeout(()=>recovery.port1.postMessage({kind:'recoveryAck',session:mode==='failure'?'wrong':session,id:data.id,sequence:data.sequence,phase:data.kind.slice(8).toLowerCase()}),mode==='cancelAfter'&&data.kind==='recoveryCheckpoint'?300:10);};recovery.port1.start();
 const runtime=createWorkerHostedRuntime({world:{createConfirmedReceiver:id=>createConfirmedStateReceiver(state,id)},session,clientOptions:{snapshot:source,chunkKeys:chunks},terrainPort:terrain.port2,presentationPort:presentation.port2,runtimeOptions:{stepSeconds:.05,maxBatchSteps:2,diagnostics:true,coalescePublications:true,qaVisualRecovery:true,qaVisualRecoveryConcurrent:true}});
 try{await runtime.start();await runtime.submit({kind:'snapshot',visualTerrain:true});await sleep(200);const prepared=await runtime.prepareVisualRecoveryForQa(),before=state.elapsed;if(mode==='cancel'||mode==='preFailure'){if(mode==='preFailure'){let rejected=false;try{await runtime.attachVisualRecoveryForQa({terrainPort:null,presentationPort:newPresentation.port2,recoveryPort:recovery.port2});}catch{rejected=true;}if(!rejected)throw Error('Invalid pre-transfer attachment accepted');}await runtime.cancelVisualRecoveryForQa();await sleep(100);const result=await runtime.submit({kind:'snapshot'});return {mode,continued:result.elapsed>=before,sequence:result.sequence};}await sleep(250);if(state.elapsed<=before)throw Error('Authority did not advance during preparation');let attached;try{const attaching=runtime.attachVisualRecoveryForQa({terrainPort:newTerrain.port2,presentationPort:newPresentation.port2,recoveryPort:recovery.port2});if(mode==='cancelAfter'){await sleep(100);let rejected=false;try{await runtime.cancelVisualRecoveryForQa();}catch{rejected=true;}if(!rejected)throw Error('Unsafe post-transfer cancellation accepted');}attached=await attaching;}catch(error){if(mode!=='failure'&&mode!=='timeout')throw error;const rejected=await Promise.race([runtime.submit({kind:'snapshot'}).then(()=>false,()=>true),sleep(1000).then(()=>false)]);return {mode,error:error.message,rejected,journal:runtime.status().recoveryJournal};}runtime.finishVisualRecoveryForQa();await sleep(200);const after=state.elapsed;if(after<=before)throw Error('Authority did not advance');return {base:prepared.checkpoint.sequence,attached:attached.sequence,before,after,recovered,scope:'Nested authority and host Workers, mock terrain/presentation ports, concurrent recovery; no WebGPU or rendered scene.'};}finally{runtime.dispose();for(const port of [terrain.port1,presentation.port1,recovery.port1,newTerrain.port1,newPresentation.port1])port.close();}
};window.ready=true;
</script>

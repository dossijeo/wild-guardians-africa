<!doctype html><meta charset="utf-8"><script type="module">
function connect(session,source=null,chunks=null){const worker=new Worker(new URL('./mobility-simulation-restart-worker.js',import.meta.url),{type:'module'}),signal=new SharedArrayBuffer(4),pending=new Map();let id=0;worker.onerror=e=>{for(const p of pending.values())p.reject(Error(e.message));pending.clear();};worker.onmessage=({data:d})=>{const p=pending.get(d.id);if(p&&d.kind!=='started'){pending.delete(d.id);d.kind==='error'?p.reject(Error(d.error)):p.resolve(d);}};const send=(kind,data={})=>new Promise((resolve,reject)=>{const request=++id;pending.set(request,{resolve,reject});worker.postMessage({kind,session,...data,id:request});});return {worker,session,signal,flag:new Int32Array(signal),send,ready:send('init',{signal,source,chunks})};}
function differences(a,b){const out=[];function walk(x,y,path){if(out.length>=12||Object.is(x,y))return;if(x===null||y===null||typeof x!=='object'||typeof y!=='object'){out.push({path,expected:x,actual:y});return;}const keys=new Set([...Object.keys(x),...Object.keys(y)]);for(const k of keys)walk(x[k],y[k],path+'/'+k);}walk(JSON.parse(a),JSON.parse(b),'');return out;}
window.audit=async()=>{if(!crossOriginIsolated||typeof SharedArrayBuffer==='undefined')throw Error('Isolation unavailable');const first=connect(crypto.randomUUID());let second;
try{await first.ready;const checkpoint=await first.send('advance',{steps:10}),expected=await first.send('advance',{steps:20});const parsed=JSON.parse(checkpoint.state.snapshot),v=parsed.villages[0],cx=Math.floor((v.x+24)/48),cz=Math.floor((v.z+24)/48),chunks=[];for(let z=cz-1;z<=cz+1;z++)for(let x=cx-1;x<=cx+1;x++)chunks.push(`${x},${z}`);first.worker.terminate();const started=performance.now();second=connect(crypto.randomUUID(),checkpoint.state.snapshot,chunks);const ready=await second.ready,initResponseMs=performance.now()-started;Atomics.store(first.flag,0,100);const stale=await second.send('pause',{session:first.session,token:100});if(stale.reason!=='session')throw Error('Stale session accepted');const resumed=await second.send('advance',{steps:20});if(resumed.performed!==20||resumed.interrupted)throw Error('Restored advance failed');const initialEqual=ready.state.snapshot===checkpoint.state.snapshot,finalEqual=resumed.state.snapshot===expected.state.snapshot;return {checkpointBytes:new TextEncoder().encode(checkpoint.state.snapshot).length,chunks:chunks.length,initialEqual,finalEqual,staleSessionRejected:true,oldSignalIgnored:true,initMs:ready.initMs,initResponseMs,initialDiff:initialEqual?[]:differences(checkpoint.state.snapshot,ready.state.snapshot),finalDiff:finalEqual?[]:differences(expected.state.snapshot,resumed.state.snapshot)};}finally{first.worker.terminate();second?.worker.terminate();}};window.ready=true;
</script>

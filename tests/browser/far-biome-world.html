<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Horizonte multibioma</title><style>body{margin:0;font:13px system-ui}canvas{width:100vw;height:100vh;display:block}header{position:fixed;z-index:2;left:0;top:0;background:#fff9de;padding:10px;max-width:340px;max-height:85vh;overflow:auto}pre{font-size:10px;white-space:pre-wrap}button,select{padding:7px}</style><header><strong>Horizonte multibioma nativo</strong><p>Sin guardados; mundo y modelos originales. Comparación de distancia 3D y horizonte 2D.</p><button id="benchmark" disabled>Medir ABBA</button><button id="toggle" disabled>Comparar horizonte</button><button id="move" disabled>Desplazar 96 m</button><button id="horizon" disabled>Mirar horizonte</button><button id="orbit" disabled>Orbitar 45°</button><button id="suppress" disabled>Retirar árbol</button><label>Fase <select id="phase"><option value="day">Día</option><option value="dusk">Transición</option><option value="night">Noche</option></select></label><pre id="report">Cargando…</pre></header><canvas></canvas><script type="module">
import {GpuTimer} from './gpu-timer.js';
import * as Game from '../../src/simulation/game.js';
import {Navigation,BIOME_IDS} from '../../src/world/navigation.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {WorldScene} from '../../src/rendering/scene.js';

import {attachBiomeFarVegetation} from '../../src/rendering/far-vegetation.js';
const params=new URLSearchParams(location.search),biome=params.get('biome')??'sabana',quality=params.get('quality')??'media',culture=params.get('culture')??'mapungubwe',errors=[];let world,adapter,dead=false,last=performance.now(),lastReport=0,removed=null,benchmark=null,profiling=false;
addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
try{
 if(!BIOME_IDS[biome])throw Error('Invalid QA biome');
 const pack=await json('/content/biome-'+BIOME_IDS[biome]+'.json'),payload=(await json('/content/villages.json')).find(v=>v.id===culture),state=Game.newGame({seed:712,biome,culture}),nav=new Navigation(712,biome,pack.profile),site=await findInitialLocationAsync(nav,payload);
 Object.assign(state.villages[0],site);state.suppressed.push(...site.suppress);nav.setState(state);Game.pause(state,'qa');state.tutorial.step='done';
 world=new WorldScene(document.querySelector('canvas'),()=>{});world.onError=e=>errors.push(String(e));world.qualitySetting(quality);await world.load(state,nav,payload);world.render(0);
 const compact=params.get('compact')==='1';adapter=await attachBiomeFarVegetation(world,compact?{start:40,end:60,groundStep:8}:{});const baselineRange=null,candidateRange=compact?(quality==='alta'?2:1):null;world.farResidentRange=candidateRange;for(const button of document.querySelectorAll('button'))button.disabled=false;
 document.querySelector('#benchmark').onclick=async()=>{
  if(profiling)return;profiling=true;world.controls.enabled=false;for(const button of document.querySelectorAll('button'))button.disabled=true;
  const previousAutoReset=world.renderer.info.autoReset;world.renderer.info.autoReset=false;const gpu=new GpuTimer(world.renderer.getContext()),tick=()=>new Promise(resolve=>requestAnimationFrame(resolve)),summary=values=>{const rows=[...values].sort((a,b)=>a-b);return rows.length?{count:rows.length,p50:rows[Math.ceil(rows.length*.5)-1],p95:rows[Math.ceil(rows.length*.95)-1],mean:rows.reduce((a,b)=>a+b,0)/rows.length}:null;},snapshot=JSON.stringify(state);benchmark={done:false,lots:[],camera:world.camera.position.toArray(),viewport:[innerWidth,innerHeight],framebuffer:[world.renderer.domElement.width,world.renderer.domElement.height],hidden:false};
  try{for(const [lot,enabled] of [false,true,true,false].entries()){adapter.enabled=enabled;world.farResidentRange=enabled?candidateRange:baselineRange;world.syncChunks();let residentReady=false;world.whenChunksReady().then(()=>residentReady=true);const residencyStart=performance.now();while(!residentReady){if(performance.now()-residencyStart>60000)throw Error('QA residency preparation timed out');await tick();world.render(0);}for(let i=0;i<45;i++){await tick();world.render(0);}const samples=[];let previous=null;for(let i=0;i<120;i++){await tick();benchmark.hidden||=document.hidden;world.renderer.info.reset();const timed=gpu.begin(lot*10000+i),start=performance.now();world.render(0);const cpu=performance.now()-start;if(timed)gpu.end();samples.push({cpu,interval:previous===null?null:start-previous,calls:world.renderer.info.render.calls,triangles:world.renderer.info.render.triangles});previous=start;}benchmark.lots.push({enabled,cpu:summary(samples.map(s=>s.cpu)),frame:summary(samples.flatMap(s=>s.interval===null?[]:[s.interval])),calls:summary(samples.map(s=>s.calls)),triangles:summary(samples.map(s=>s.triangles))});}for(let i=0;i<20&&gpu.pending.length;i++){await tick();world.render(0);gpu.poll();}benchmark.gpu=gpu.report();benchmark.unchanged=JSON.stringify(state)===snapshot;benchmark.done=true;}catch(error){errors.push(String(error));benchmark.failed=String(error);}finally{gpu.dispose();world.renderer.info.autoReset=previousAutoReset;profiling=false;world.controls.enabled=true;for(const button of document.querySelectorAll('button'))button.disabled=false;adapter.enabled=true;world.farResidentRange=candidateRange;}
 };
 document.querySelector('#toggle').onclick=()=>{adapter.enabled=!adapter.enabled;world.farResidentRange=adapter.enabled?candidateRange:baselineRange;};
 document.querySelector('#move').onclick=()=>{world.camera.position.x+=96;world.controls.target.x+=96;world.controls.update();};
 document.querySelector('#horizon').onclick=()=>{world.controls.target.set(world.camera.position.x-80,world.camera.position.y-5,world.camera.position.z-50);world.controls.update();};
 document.querySelector('#orbit').onclick=()=>{const offset=world.camera.position.clone().sub(world.controls.target).applyAxisAngle(world.camera.up,Math.PI/4);world.camera.position.copy(world.controls.target).add(offset);world.controls.update();};
 document.querySelector('#phase').onchange=e=>state.time=e.target.value==='day'?180:e.target.value==='dusk'?300+Math.log(2)/2.4:305;
 document.querySelector('#suppress').onclick=()=>{const tree=adapter.adapters.flatMap(a=>a.layer.current?.trees??[]).find(t=>!nav.suppressed.has(t.id));if(tree){removed=tree.id;state.suppressed.push(tree.id);nav.setState(state);}};
 function frame(now){if(dead)return;const dt=Math.min(.1,(now-last)/1000);last=now;if(!profiling){world.renderer.info.reset();world.render(dt);}
 if(now-lastReport>500){lastReport=now;document.querySelector('#report').textContent=JSON.stringify({loaded:true,benchmark,biome,quality,culture,enabled:adapter.enabled,camera:world.camera.position.toArray(),chunks:world.chunks.size,night:world.toon.uniforms.uNight.value,render:{calls:world.renderer.info.render.calls,triangles:world.renderer.info.render.triangles},gpuMemory:world.renderer.info.memory,programs:world.renderer.info.programs.length,resources:adapter.stats,residentRange:world.farResidentRange??null,removed,layers:adapter.adapters.map(a=>({slot:a.layer.options.slot,key:a.layer.current?.key,trees:a.layer.current?.trees.length,ready:(a.layer.current?.trees??[]).filter(t=>a.layer.current.prototype.treeState(t.id).ready===1).length,preparations:a.stats.nativePreparations,coverage:a.stats.coverage,prepared:a.stats.prepared,stale:a.stats.stalePreparations,errors:a.stats.errors})),errors,webglError:world.renderer.getContext().getError()},null,2);}
 requestAnimationFrame(frame);}
 requestAnimationFrame(frame);addEventListener('pagehide',()=>{dead=true;world.dispose();},{once:true});
}catch(error){errors.push(String(error.stack??error));document.querySelector('#report').textContent=JSON.stringify({errors});world?.dispose();}
</script></html>

<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · Amanecer musical en mundo nativo</title>
<style>body{margin:0;font:12px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:absolute;z-index:2;background:#fff9edee;padding:8px;max-width:420px}pre{max-height:35vh;overflow:auto}button{padding:10px}</style>
<header><p>Sabana/Mapungubwe, semilla 712. Centro, mijo y trabajadora pagados con las 1500 monedas iniciales. Día y primera incursión nativos; avance por pasos de 0,1 s real solicitados. Audio silenciado, sin escucha ni medida de FPS.</p><button id="run" disabled>Recorrer jornada y amanecer A → B</button><output id="status">Preparando…</output><pre id="report"></pre></header><canvas id="world"></canvas>
<script type="module">
import * as Game from '../../src/simulation/game.js';
import {Navigation} from '../../src/world/navigation.js';
import {centerServicePoint} from '../../src/world/centers.js';
import {findInitialLocationAsync} from '../../src/world/villages.js';
import {WorldScene} from '../../src/rendering/scene.js';
import {json} from '../../src/rendering/assets.js';
import {AudioSystem,SFX_LIMITS} from '../../src/audio/audio.js';
import {serialize} from '../../src/persistence/snapshots.js';
const status=document.querySelector('#status'),output=document.querySelector('#report');
const requestedDays=Number(new URLSearchParams(location.search).get('days')??1);
if(!Number.isSafeInteger(requestedDays)||requestedDays<1||requestedDays>4)throw Error('QA days must be 1–4');
document.querySelector('#run').textContent=requestedDays===1?'Recorrer jornada y amanecer A → B':`Recorrer ${requestedDays} jornadas y alternancia A ↔ B`;
document.querySelector('header p').textContent=`Sabana/Mapungubwe, semilla 712. Centro, un mijo por jornada y trabajadora pagados con las 1500 monedas iniciales. ${requestedDays} jornadas e incursiones nativas; pasos de 0,1 s real solicitados. Audio silenciado: no escucha ni medida de FPS.`;
const audio=new AudioSystem({sfx:0,music:0}),errors=[],history=[],seen=new Set();
const result={muted:true,predecodedSfx:false,world3D:true,seed:712,qaCredit:0,requestedDays,history,errors,events:{},steps:0,heldSteps:0,peakSfx:0,peakMusic:0,peakPoolPcmBytes:0};
let state,nav,world,lastTransport,lastPack,phase='setup';
const assert=(v,message)=>{if(!v)throw Error(message);},flush=()=>new Promise(done=>setTimeout(done,0));
const paint=()=>{output.textContent=JSON.stringify({...result,phase,day:state?.day,time:state?.time,elapsed:state?.elapsed,money:state?.ledger.balance,pauses:state?.pauses,raid:state?.raid?.animals.map(a=>({species:a.species,status:a.status}))??null},null,2);};
const fail=e=>{errors.push(String(e.message??e));phase='failed';status.textContent='FAIL: '+errors.join(' · ');audio.stop();paint();};
addEventListener('error',e=>fail(e.error??e.message));addEventListener('unhandledrejection',e=>fail(e.reason));
addEventListener('pagehide',()=>{audio.dispose();world?.dispose();});
function observe(){
 for(const e of state.events)if(!seen.has(e.id)){seen.add(e.id);result.events[e.type]=(result.events[e.type]??0)+1;}
 const before=serialize(state),listener=world.controls.target;
 audio.process(state.events,{state,listener});audio.updateMusic(state);audio.updateUnlocks(state);
 assert(!audio.musicError,audio.musicError?.message??'Music error');
 if(audio.transport){assert(lastPack!==audio.pack||!lastTransport||lastTransport===audio.transport,'Unexpected music transport restart');lastTransport=audio.transport;lastPack=audio.pack;}
 audio.updateAmbient(state,{listener,waterRevision:nav.version,waterAt:(x,z)=>({...nav.field.waterInfo(x,z),active:!!(nav.field.wetland||nav.field.riverActive)})});
 audio.updateWorkers(state,{listener});audio.updateWork(state,{listener});audio.updateFarm(state,{listener});audio.updateAnimals(state,{listener});audio.updateMovement(state,{listener,surfaceAt:world.movementSurfaceAt});
 assert(serialize(state)===before,'Presentation changes domain');
 const voices=[...audio.voices.values()],sfx=voices.filter(v=>!v.music),families=new Map(),emitters=new Map();
 for(const v of sfx){families.set(v.family,(families.get(v.family)??0)+1);if(v.emitter!=null)emitters.set(v.emitter,(emitters.get(v.emitter)??0)+1);}
 assert(sfx.length<=SFX_LIMITS.total,'Global voices');assert([...families.values()].every(n=>n<=SFX_LIMITS.perFamily),'Family voices');assert([...emitters.values()].every(n=>n<=SFX_LIMITS.perEmitter),'Emitter voices');
 assert(audio.active.every(source=>source.playbackRate.value===1),'Pitch changed');
 result.peakSfx=Math.max(result.peakSfx,sfx.length);result.peakMusic=Math.max(result.peakMusic,voices.length-sfx.length);
 result.peakPoolPcmBytes=Math.max(result.peakPoolPcmBytes,audio.musicWindowPool?.pcmBytes()??0);
}
async function loaded(pack){
 const start=performance.now();
 while(!audio.transport||audio.pack!==pack){if(audio.musicError)throw audio.musicError;if(performance.now()-start>60000)throw Error('Music loading deadline');await flush();}
}
function capture(){
 const pool=audio.musicWindowPool;
 return {day:state.day,pack:audio.pack,transport:audio.transport.constructor.name,contextRate:audio.context.sampleRate,
  stems:pool?[...pool.ready.values()].map(({id,window,buffer})=>({id,window,channels:buffer.numberOfChannels,sampleRate:buffer.sampleRate,frames:buffer.length})):audio.transport.loaded.map(({track,buffer})=>({id:track.id,channels:buffer.numberOfChannels,sampleRate:buffer.sampleRate,frames:buffer.length})),musicVoices:[...audio.voices.values()].filter(v=>v.music).length,cachedMusicUrls:[...audio.musicBuffers],scheduledStart:audio.transport.primary.start,rates:audio.active.filter(source=>audio.voices.get(source)?.music).map(source=>source.playbackRate.value)};
}
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;
 try{
  phase='music-a';status.textContent='Cargando ventanas A…';await audio.unlock();audio.remember(state.events);observe();await loaded('a');observe();history.push(capture());
  assert(history[0].transport==='MusicWindowTransport','A did not select validated windows');assert(new Set(history[0].stems.map(s=>s.id)).size===8,'A audible group absent');
  const start=performance.now();while(!audio.ambient.entries.get('wind')?.source){if(performance.now()-start>15000)throw Error('Native wind absent');await flush();observe();}
  const wind=audio.ambient.entries.get('wind').source;
  Game.resume(state,'qa');
  for(let day=1;day<=requestedDays;day++){
   const oldUrls=[...audio.musicBuffers],oldPool=audio.musicWindowPool;
   phase=`day-${day}`;status.textContent=`Jornada ${day}, cosecha e incursión nativas`;
   while(state.day===day&&!state.result){
    assert(!errors.length,'Prior browser error');assert(!state.pauses.length,'Unexpected gameplay pause');world.render(0);
    if(!world.actorsReady()){result.heldSteps++;await flush();continue;}
    Game.advanceReal(state,.1,nav);observe();world.render(.1);assert(world.renderer.getContext().getError()===0,'WebGL error');await flush();
    if(++result.steps%100===0)paint();if(result.steps>requestedDays*10000)throw Error('Native days did not finish');
   }
   assert(state.day===day+1&&!state.result&&state.completedNights===day&&!state.raid,'Native night did not resolve');assert(state.pauses.includes('hiring'),'Dawn hiring absent');
   assert(result.events.CrateDelivered>=day,'Paid crop delivery absent');assert(result.events.RaidSpawned===day&&result.events.RaidEnded===day,'Native incursion absent');
   const pack=state.day%2?'a':'b';phase='music-'+pack;status.textContent=`Amanecer ${state.day}: cargando ventanas ${pack.toUpperCase()}…`;const dawn=serialize(state);observe();await loaded(pack);observe();history.push(capture());
   assert(serialize(state)===dawn,'Music changes paused dawn');assert(history.at(-1).transport==='MusicWindowTransport','Dawn did not select validated windows');assert(new Set(history.at(-1).stems.map(s=>s.id)).size===8,'Dawn audible group absent');
   assert(audio.voices.has(wind)&&audio.ambient.entries.get('wind').source===wind,'Daily music replaced native wind');
   assert(oldUrls.every(url=>!audio.buffers.has(url))&&oldPool.disposed&&oldPool.pcmBytes()===0,'Old music pack retained');result.windPreserved=true;result.oldPackEvicted=true;
   if(day<requestedDays){Game.hire(state,'hire-day-'+state.day,{youngFemale:1});assert(plantReachableSeed('seed-day-'+state.day),'Reachable paid daily seed absent');}
   paint();
  }
  audio.stop();result.voicesAfterStop=audio.active.length;assert(!audio.active.length&&!audio.musicBuffers.size,'Audio resources retained');audio.dispose();await flush();result.context=audio.context.state;assert(result.context==='closed','Context not closed');
  phase='complete';status.textContent=`Completada · ${requestedDays} jornadas nativas y alternancia A ↔ B`;paint();
 }catch(e){fail(e);}
};
function plantReachableSeed(id){
 const center=state.structures[0],origin=centerServicePoint(center,state,.8);
 for(let dz=-6;dz<=6;dz+=1.5)for(let dx=5;dx<=12;dx+=1.5){
  const p={x:Math.round((center.x+dx)/1.5)*1.5,z:Math.round((center.z+dz)/1.5)*1.5};
  if(nav.placement(p.x,p.z,.4).valid&&!state.plants.some(q=>q.alive&&Math.hypot(q.x-p.x,q.z-p.z)<1.1)&&nav.path(origin,p,.28,null,true)&&nav.path(p,origin,.28,null,true)){Game.plant(state,id,'mijo',p.x,p.z,nav);return true;}
 }
 return false;
}
try{
 const profile=(await json('/content/biome-savanna.json')).profile,payload=(await json('/content/villages.json')).find(v=>v.id==='mapungubwe');
 state=Game.newGame({seed:712,slotId:'qa-music-world-dawn'});nav=new Navigation(712,'sabana',profile);const site=await findInitialLocationAsync(nav,payload);
 Object.assign(state.villages[0],site);state.suppressed.push(...site.suppress);nav.setState(state);Game.resume(state,'intro');Game.placeStructure(state,'center',site.center,nav);
 assert(plantReachableSeed('seed'),'Reachable native seed absent');Game.openInitialHiring(state);Game.hire(state,'hire',{youngFemale:1});state.tutorial.step='done';Game.pause(state,'qa');
 world=new WorldScene(document.querySelector('#world'),()=>{});world.onError=fail;world.qualitySetting('muy_baja');await world.load(state,nav,payload);world.focus(state.structures[0]);await world.whenChunksReady();world.render(0);
 phase='ready';status.textContent='Preparada · partida pagada';document.querySelector('#run').disabled=false;paint();
}catch(e){fail(e);}
</script></html>

<!doctype html><meta charset="utf-8"><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';
import {serialize} from '../../src/persistence/snapshots.js';
import {captureRaidWaitBindings} from '../../src/simulation/raid-wait-handoff.js';
import {createSimulationAuthorityClient} from '../../src/simulation/simulation-authority-client.js';
window.audit=async()=>{
 const chunks=[];for(let z=-1;z<=2;z++)for(let x=0;x<=5;x++)chunks.push(`${x},${z}`);
 const fixture=await createSimulation({mangrove:true,chunkKeys:chunks}),{game,nav}=fixture.diagnosticWorld(),actors=[...game.raid.animals,...game.workers],source=serialize(game),bindings=captureRaidWaitBindings(game,nav);fixture.dispose();
 const discovery=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,raidWaitBindings:bindings,session:'discover'});let actor;
 try{await discovery.ready;let last;for(let i=0;i<30;i++){const req=discovery.submit({kind:'advance',seconds:.05,steps:4,nightFastForward:true});last=await req.result;}const end=JSON.parse(last.snapshot),byId=new Map([...(end.raid?.animals??[]),...end.workers].map(a=>[a.id,a]));actor=actors.find(a=>{const b=byId.get(a.id);return b&&Math.hypot(a.x-b.x,a.z-b.z)>.1;});if(!actor)throw Error('No moving actor in fixture');}finally{discovery.dispose();}
 const a=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,raidWaitBindings:bindings,session:'baseline'}),b=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,raidWaitBindings:bindings,session:'observed'});
 const send=async(c,command)=>{const r=c.submit(command);if(!r.accepted)throw Error('Not admitted');return r.result;};
 try{await Promise.all([a.ready,b.ready]);await Promise.all([send(a,{kind:'snapshot'}),send(b,{kind:'trackPathMotion',actorId:actor.id})]);const [,missing]=await Promise.all([send(a,{kind:'snapshot'}),send(b,{kind:'trackPathMotion',actorId:'missing-actor'})]);if(missing.value!==false||!missing.rejection)throw Error('Missing actor was accepted');let segments=0,continuous=0,timed=0,barriers=0,lastState;
  for(let i=0;i<30;i++){const cmd={kind:'advance',seconds:.05,steps:4,nightFastForward:true},[left,right]=await Promise.all([send(a,cmd),send(b,cmd)]),trace=right.motionTrace,state=JSON.parse(right.snapshot),entity=[...(state.raid?.animals??[]),...state.workers].find(x=>x.id===actor.id);
   if(left.snapshot!==right.snapshot||JSON.stringify(left.events)!==JSON.stringify(right.events)||!trace||trace.actorId!==actor.id||trace.end.at!==right.elapsed||trace.end.x!==entity.x||trace.end.z!==entity.z)throw Error('Motion observation changed simulation at '+i);
   segments+=trace.segments.length;if(trace.continuous)continuous++;if(trace.timed)timed++;if(trace.segments.some(s=>s.t0===null||s.t1===null||s.t1<s.t0))throw Error('Missing segment timing at '+i);
   if(right.events.length||!trace.continuous||!trace.timed){const barrier=right.motionInvalidation;if(!barrier||barrier.at!==trace.start.at||barrier.x!==trace.start.x||barrier.z!==trace.start.z)throw Error('Missing batch boundary at '+i);barriers++;}
   lastState=state;
  }
  let quietTutorial=0;for(const cmd of [{kind:'tutorialStart',seen:[]},{kind:'tutorialCommand',action:'update',narrating:null},{kind:'tutorialCommand',action:'update',narrating:null}]){const [left,right]=await Promise.all([send(a,cmd),send(b,cmd)]),state=JSON.parse(right.snapshot),changed=!!(lastState.pauses.length||lastState.result)!==!!(state.pauses.length||state.result);if(left.snapshot!==right.snapshot||!!right.motionInvalidation!==changed)throw Error('Tutorial suspension invalidation mismatch');if(!changed)quietTutorial++;lastState=state;}if(!quietTutorial)throw Error('No quiet tutorial update');
 if(!segments){const s=JSON.parse((await send(b,{kind:'snapshot'})).snapshot);throw Error('Fixture did not produce path segments: '+JSON.stringify({pauses:s.pauses,animal:s.raid.animals.find(a=>a.id===actor.id),elapsed:s.elapsed}));}const [pa,pb]=await Promise.all([send(a,{kind:'pause',reason:'menu'}),send(b,{kind:'pause',reason:'menu'})]);if(pa.snapshot!==pb.snapshot||pb.motionInvalidation?.actorId!==actor.id||pb.motionInvalidation.at!==pb.elapsed||pb.motionInvalidation.reason!=='pause')throw Error('Pause did not invalidate observed motion');const stopped=await send(b,{kind:'trackPathMotion',actorId:null});if(stopped.motionInvalidation?.actorId!==actor.id)throw Error('Stopping observation did not invalidate it');const last=await send(b,{kind:'advance',seconds:.05,nightFastForward:true});if(last.motionTrace)throw Error('Observation continued after stop');
  if(!barriers)throw Error('Fixture did not exercise an event boundary');return {actorId:actor.id,commands:30,segments,continuous,timed,barriers,quietTutorial,scope:'Observed segments from one animal in a real mangrove Worker compared against an unobserved Worker; times assume the movement speed within each simulation step. No presentation, collision certificate, physical fall or GPU integration.'};
 }finally{a.dispose();b.dispose();}
};window.ready=true;
</script>

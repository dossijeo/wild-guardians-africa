<!doctype html><meta charset="utf-8"><title>Wild Guardians · Viewport QA</title>
<style>body{margin:0;background:#17231c;color:white;font:13px system-ui}header{padding:8px}button{padding:6px}iframe{display:block;border:0;margin:auto;width:390px;height:650px}</style>
<header>Juego real en un viewport acotado. Usa los mismos guardados del navegador. <button id="portrait">390 × 650</button> <button id="landscape">1000 × 600</button></header>
<iframe title="Wild Guardians real game" src="/"></iframe>
<script type="module">const frame=document.querySelector('iframe');document.querySelector('#portrait').onclick=()=>{frame.style.width='390px';frame.style.height='650px';};document.querySelector('#landscape').onclick=()=>{frame.style.width='1000px';frame.style.height='600px';};</script>

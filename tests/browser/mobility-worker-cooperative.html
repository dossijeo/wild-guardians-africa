<!doctype html><html lang="es"><meta charset="utf-8"><title>Cesión entre pasos</title><body><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';
window.audit=async(mode,interrupt)=>{
 const worker=new Worker(new URL('./mobility-worker-cooperative.js',import.meta.url),{type:'module'});let pauseSent,startedAt,completedAt,pauseAt,timeout;
 try{
  let readyResolve,startedResolve,advanceResolve,pauseResolve,rejectAll;const ready=new Promise(resolve=>readyResolve=resolve),started=new Promise(resolve=>startedResolve=resolve),advance=new Promise(resolve=>advanceResolve=resolve),paused=new Promise(resolve=>pauseResolve=resolve),failure=new Promise((_,reject)=>rejectAll=reject),wait=p=>Promise.race([p,failure]);
  timeout=setTimeout(()=>rejectAll(Error('Worker timeout')),120000);worker.onerror=e=>rejectAll(Error(e.message));worker.onmessage=e=>{const d=e.data;if(d.kind==='ready')readyResolve(d);else if(d.kind==='started'){startedAt=performance.now();startedResolve();if(interrupt){pauseSent=performance.now();worker.postMessage({session:'cooperative-test',sequence:2,request:2,action:'pause'});}}else if(d.kind==='advance-result'){completedAt=performance.now();advanceResolve(d);}else if(d.kind==='pause-result'){pauseAt=performance.now();pauseResolve(d);}else if(d.kind==='error')rejectAll(Error(d.error));};
  await wait(ready);const requestAt=performance.now();worker.postMessage({session:'cooperative-test',sequence:1,request:1,action:'advance',steps:40,mode});await wait(started);const result=await wait(advance),pause=interrupt?await wait(paused):null;
  const reference=await createSimulation({mangrove:true});let expected;try{for(let i=0;i<result.performed;i++)reference.advanceTick(.05);if(interrupt)reference.pause('diagnostic');expected=reference.state();}finally{reference.dispose();}
  const observed=interrupt?pause.state:result.state;if(observed.snapshot!==expected.snapshot)throw Error('State differs from ordered reference');
  if(!interrupt&&result.performed!==40)throw Error('Incomplete full batch');
  return {mode,interrupt,performed:result.performed,interrupted:result.interrupted,workerMs:result.workerMs,responseMs:completedAt-requestAt,firstTickMs:result.timings[0],pauseLatencyMs:interrupt?pauseAt-pauseSent:null,snapshotEqual:true};
 }finally{clearTimeout(timeout);worker.terminate();}
};window.ready=true;
</script></body></html>

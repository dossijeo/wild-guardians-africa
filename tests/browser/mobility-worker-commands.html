<!doctype html><html lang="es"><meta charset="utf-8"><title>Orden de comandos Worker</title><body><canvas id="view" width="320" height="180"></canvas><script type="module">
import {createSimulation} from './mobility-worker-simulation-core.js';
import {createPausePresentationGate} from '../../tools/trees/prototype_pause_presentation_gate.mjs';
window.audit=async()=>{
 const gl=document.querySelector('#view').getContext('webgl2'),worker=new Worker(new URL('./mobility-worker-commands.js',import.meta.url),{type:'module'}),pending=new Map();let ready,gate,request=0,pauseSent,startedAt,pauseReceived,firstDone;
 try{
  const initialized=new Promise((resolve,reject)=>{worker.onerror=e=>reject(Error(e.message));worker.onmessage=e=>{const d=e.data;if(d.kind==='ready'){ready=d;gate=createPausePresentationGate(d.session,d.initialElapsed);resolve();}else if(d.kind==='error'){const p=pending.get(d.request);if(p){pending.delete(d.request);p.reject(Error(d.error));}else reject(Error(d.error));}else if(d.kind==='started'){if(d.request===1){startedAt=performance.now();pauseSent=performance.now();if(!gate.requestPause(2))throw Error('Pause gate rejected');worker.postMessage({session:ready.session,sequence:2,request:2,action:'pause'});}}else{const p=pending.get(d.request);if(p){pending.delete(d.request);p.resolve(d);}}};});await initialized;
  const send=(sequence,action,extra={})=>new Promise((resolve,reject)=>{const id=++request;pending.set(id,{resolve,reject});worker.postMessage({session:ready.session,sequence,request:id,action,...extra});});
  const results=[],frames=[];request=1;const first=new Promise((resolve,reject)=>pending.set(1,{resolve,reject})),pauseAck=new Promise((resolve,reject)=>pending.set(2,{resolve,reject}));worker.postMessage({session:ready.session,sequence:1,request:1,action:'advance',steps:1});
  first.then(v=>{firstDone=performance.now();results[0]=v;});pauseAck.then(v=>{pauseReceived=performance.now();results[1]=v;if(!gate.confirmPause({session:ready.session,sequence:v.sequence,paused:v.state.pauses.includes('diagnostic'),time:v.state.elapsed}))throw Error('Pause confirmation rejected');});request=2;
  for(let i=0;i<100;i++){const t=await new Promise(requestAnimationFrame);frames.push(t);gl.clearColor(.1,.2,.3,1);gl.clear(gl.COLOR_BUFFER_BIT);}
  await Promise.all([first,pauseAck]);const paused=await send(3,'advance',{steps:1}),resumed=await send(4,'resume'),advanced=await send(5,'advance',{steps:1}),duplicate=await send(3,'read'),gap=await send(7,'read'),wrong=await send(6,'read',{session:'wrong'}),final=await send(6,'read');
  const reference=await createSimulation({mangrove:true});let expected;try{reference.run(1,.05,{full:false});reference.pause('diagnostic');reference.run(1,.05,{full:false});reference.resume('diagnostic');reference.run(1,.05,{full:false});expected=reference.state();}finally{reference.dispose();}
  const pauseState=gate.snapshot();if(!Number.isFinite(pauseSent)||pauseReceived<pauseSent||firstDone<startedAt||paused.state.elapsed!==results[1].state.elapsed||!results[1].state.pauses.includes('diagnostic')||resumed.state.pauses.includes('diagnostic')||advanced.state.elapsed<=paused.state.elapsed||duplicate.kind!=='rejected'||gap.kind!=='rejected'||wrong.kind!=='rejected'||final.state.snapshot!==expected.snapshot||pauseState.phase!=='paused'||!pauseState.needsReconciliation||gate.requestResume(7))throw Error('Command order, timing, pause gate or parity failed');
  const intervals=frames.slice(1).map((v,i)=>v-frames[i]),sorted=[...intervals].sort((a,b)=>a-b),p=q=>sorted[Math.floor((sorted.length-1)*q)];
  return {firstTickMs:results[0].timings[0],pauseLatencyMs:pauseReceived-pauseSent,firstCompletionAfterStartMs:firstDone-startedAt,pauseAppliedAfterFirst:pauseReceived>=firstDone,pausedElapsed:paused.state.elapsed,resumedElapsed:advanced.state.elapsed,pauseGate:pauseState,rejections:[duplicate.reason,gap.reason,wrong.reason],snapshotEqual:true,frames:{count:intervals.length,p95:p(.95),p99:p(.99),max:sorted.at(-1)}};
 }finally{worker.terminate();}
};window.ready=true;
</script></body></html>

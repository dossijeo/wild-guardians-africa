<!doctype html><meta charset="utf-8"><script type="module">

window.audit=async()=>{
 const chunks=[];for(let z=-1;z<=2;z++)for(let x=0;x<=5;x++)chunks.push(`${x},${z}`);
 const init=await createSimulation({mangrove:true,chunkKeys:chunks}),game=init.diagnosticWorld().game,animal=game.raid.animals.find(a=>a.species==='hyena');if(!animal)throw Error('No hyena');const source=serialize(game),id=animal.id,x=animal.x,z=animal.z;init.dispose();
 const response=await fetch('/src/world/wild-engine/spatial-savanna.wasm'),module=await WebAssembly.compile(await response.arrayBuffer()),reference=createSimulationAuthority(module,source,chunks),client=createSimulationAuthorityClient({snapshot:source,chunkKeys:chunks,physicsActorId:id,session:'physics-test'});let seq=0,active=0,saveBlocked=0,lastPhase=null,lastActive=false,phases=new Set(),events=[];
 try{await Promise.all([reference.enableBeastPhysics(id),client.ready]);const commands=[{kind:'castAttack',id:'worker-attack-test',targetId:id,x,z},...Array.from({length:400},()=>({kind:'advance',seconds:.05,nightFastForward:true}))];for(const command of commands){const req=client.submit(command);if(!req.accepted)throw Error('Rejected command');let local;try{local=reference.execute({...command,sequence:++seq});}catch(error){throw Error('Local physics failure at '+seq+': '+error.message);}const remote=await req.result;if(local.snapshot!==remote.snapshot||JSON.stringify(local.events)!==JSON.stringify(remote.events)||JSON.stringify(local.physicsPose)!==JSON.stringify(remote.physicsPose)||local.value!==remote.value)throw Error('Physics divergence at '+seq);if(remote.physicsPose?.active){active++;if(remote.saveAvailable)throw Error('Active physics advertised as restorable');}if(!remote.saveAvailable)saveBlocked++;const a=JSON.parse(remote.snapshot).raid?.animals.find(a=>a.id===id);lastPhase=a?.magicDown?.phase??'released';lastActive=!!remote.physicsPose?.active;phases.add(lastPhase);events.push(...remote.events.map(e=>e.type));}if(!active||!saveBlocked||!phases.has('falling')||!events.includes('GuardianMagicHit')||lastActive||lastPhase!=='released')throw Error('Physical attack did not complete');const near=JSON.parse(source),nearAnimal=near.raid.animals.find(a=>a.id===id),center=near.structures.find(s=>s.kind==='center'&&s.status==='intact');nearAnimal.x=center.x;nearAnimal.z=center.z;const blocked=createSimulationAuthorityClient({snapshot:JSON.stringify(near),chunkKeys:chunks,physicsActorId:id,session:'missing-building'});let missingBuildingRejected=false;try{await blocked.ready;const req=blocked.submit({kind:'castAttack',id:'blocked-attack',targetId:id,x:center.x,z:center.z});try{await req.result;}catch(error){missingBuildingRejected=String(error).includes('lacks nearby structure geometry');}}finally{blocked.dispose();}if(!missingBuildingRejected)throw Error('Missing building geometry was not rejected');return {missingBuildingRejected,actorId:id,compared:seq,activeSteps:active,saveBlocked,lastPhase,lastActive,phases:[...phases],events:[...new Set(events)],scope:'One real hyena rig and original clips with Rapier in a simulation Worker, compared to the same worker-physics driver on the main thread from the same restored island-mangrove snapshot; 400 intervals. No WorldScene reference, UI, multi-actor physics, buildings, render synchronization or active-physics save/restore.'};}finally{client.dispose();reference.dispose();}
};window.ready=true;
</script>

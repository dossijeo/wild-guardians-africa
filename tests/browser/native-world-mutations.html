<!doctype html>
<meta charset="utf-8">
<title>Native conditioned world mutations</title>
<style>body{font:14px system-ui;background:#172124;color:#e7ece5;margin:20px}pre{max-height:320px;overflow:auto;background:#223137;padding:12px}canvas{display:block}</style>
<h1>Conditioned native world mutations — f-R2</h1>
<p>Real WASM and WebGPU: polygon, residency, canonical props and terrain. One causal consumer; diagnostic triangle. Graphical replacement and recovery remain separate.</p>
<pre id="result">Ready</pre>
<script type="module">
import {auditNativeWorldMutations,auditNativeControlLifecycle,auditNativeWorldResources} from './native-world-mutations.js';
window.runNativeWorldResourcesAudit=async()=>{
 try{document.querySelector('#result').textContent='Running resource identity';const result=await auditNativeWorldResources();
  document.querySelector('#result').textContent=JSON.stringify(result,null,2);return result;
 }catch(error){document.querySelector('#result').textContent=String(error.stack??error);throw error;}
};
window.runNativeControlLifecycleAudit=async()=>{
 try{document.querySelector('#result').textContent='Running lifecycle';const result=await auditNativeControlLifecycle();
  document.querySelector('#result').textContent=JSON.stringify(result,null,2);return result;
 }catch(error){document.querySelector('#result').textContent=String(error.stack??error);throw error;}
};
window.runNativeWorldMutationsAudit=async()=>{
 try{document.querySelector('#result').textContent='Running';const result=await auditNativeWorldMutations();
  window.nativeWorldMutationsAudit=result;document.querySelector('#result').textContent=JSON.stringify(result,null,2);return result;
 }catch(error){document.querySelector('#result').textContent=String(error.stack??error);throw error;}
};
</script>

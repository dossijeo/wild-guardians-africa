<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native interactive loading compatibility matrix</title><style>body{margin:0;background:#172019;color:white;font:14px system-ui}header{padding:8px}button,select{padding:8px}iframe{border:0;width:100%;height:65vh}pre{white-space:pre-wrap;max-height:24vh;overflow:auto}</style><header><label>Coverage <select id="coverage"><option value="representative">Six biomes / all cultures represented</option><option value="full">All thirty biome / culture combinations</option></select></label><button id="run">Run native loading matrix</button><button id="cancel" disabled>Cancel matrix</button><pre id="report">Functional compatibility only. Child starts via QA controls; this is not real-app autoplay evidence or an isolated performance benchmark.</pre></header><main></main><script type="module">
import {BIOMES,CULTURES} from '/src/simulation/game.js';
const run=document.querySelector('#run'),cancel=document.querySelector('#cancel'),output=document.querySelector('#report'),main=document.querySelector('main');let active=null,stopped=false,report={};
const show=()=>output.textContent=JSON.stringify(report,null,2);
const wait=async(predicate,timeout=120000)=>{const started=performance.now();while(!predicate()){if(stopped)throw Error('Matrix cancelled');if(performance.now()-started>timeout)throw Error('Native case exceeded diagnostic timeout');await new Promise(resolve=>setTimeout(resolve,100));}};
const childReport=()=>{const text=active?.contentDocument?.querySelector('#report')?.textContent;try{return JSON.parse(text);}catch{return null;}};
const dispose=()=>{if(!active)return;const doc=active.contentDocument;doc?.querySelector('#cancel:not(:disabled)')?.click();doc?.querySelector('#dispose:not(:disabled)')?.click();active.remove();active=null;};
cancel.onclick=()=>{stopped=true;dispose();};
run.onclick=async()=>{run.disabled=true;cancel.disabled=false;stopped=false;report={scope:'Functional sequential native worlds; no audio autoplay or performance acceptance. Every completed child is explicitly disposed before the next context.',cases:[],done:false,errors:[]};show();const full=document.querySelector('#coverage').value==='full',cases=full?BIOMES.flatMap(biome=>CULTURES.map(culture=>({biome,culture}))):BIOMES.map((biome,i)=>({biome,culture:CULTURES[i%CULTURES.length]}));try{for(const item of cases){report.active=item;show();active=document.createElement('iframe');active.title='Current native loading case';active.src='interactive-loading-run.html?'+new URLSearchParams({...item,quality:'media',measurement:'1'});main.append(active);await wait(()=>active?.contentDocument?.querySelector('#run[data-ready=\"true\"]'));active.contentDocument.querySelector('#run').click();await wait(()=>childReport()?.done,180000);const raw=childReport();report.cases.push({biome:item.biome,culture:item.culture,ready:raw.progress?.ready,cameraPreserved:raw.cameraPreserved,logicalUnchanged:raw.logicalUnchanged,restoredLogicalUnchanged:raw.restoredLogicalUnchanged,errors:raw.errors,initializationMs:raw.initializationMs,resources:raw.stages?.at(-1)?.resources});active.contentDocument.querySelector('#dispose:not(:disabled)')?.click();const closed=childReport();report.cases.at(-1).disposed=closed?.disposed;report.cases.at(-1).contextLost=closed?.contextLost;dispose();show();if(raw.errors?.length||!raw.progress?.ready||!raw.cameraPreserved||!raw.logicalUnchanged||!raw.restoredLogicalUnchanged||!closed?.disposed||!closed?.contextLost)throw Error('Native case contract failed: '+item.biome+'/'+item.culture);}}catch(error){report.errors.push(error.message);dispose();}finally{report.done=true;report.cancelled=stopped;report.active=null;cancel.disabled=true;show();}};
addEventListener('pagehide',()=>{stopped=true;dispose();});
</script></html>

<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wild Guardians · Galería de capturas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121c19;color:#f6ebd9;font:16px system-ui,sans-serif}header{padding:36px 4vw 24px;position:sticky;top:0;background:#121c19f5;z-index:2;border-bottom:1px solid #435148}h1{margin:0 0 8px;font-size:28px}p{color:#c0cabc;margin:6px 0}main{padding:24px 4vw 48px}h2{margin:24px 0 16px;font-size:20px;color:#edd095}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px}article{background:#223129;border:2px solid transparent;border-radius:10px;overflow:hidden}article:has(input:checked){border-color:#f0c96f}img{width:100%;aspect-ratio:16/9;object-fit:contain;display:block;background:#0b100d}label{padding:13px;display:flex;gap:10px;align-items:center;cursor:pointer}input{accent-color:#c5983a;width:19px;height:19px}a{color:inherit}output{display:block;color:#f0c96f;margin-top:12px;font-weight:600}.hint{font-size:13px}
</style>
<header><h1>Wild Guardians Africa</h1><p>15 capturas · Full HD · Motor del juego · Calidad alta</p><p class="hint">Pulsa una imagen para abrir el PNG original. Marca las que prefieras para comparar tu selección.</p><output id="selection" aria-live="polite">Ninguna seleccionada</output></header><main id="gallery"></main>
<script>
const files=['01-sabana-gran-cosecha','02-desierto-asedio-nocturno','03-gran-rio-cosecha','04-volcanes-ataque-multiple','05-gran-canon-trabajadores','06-reserva-manglares','07-reserva-escudo-nocturno','08-reserva-bestias-primer-plano','09-reserva-cosecha-a-pie-de-campo','10-reserva-rio-entre-paredes','11-detalle-rinoceronte','12-detalle-leon','13-detalle-bufalo-hiena','14-detalle-amara-cosechando','15-detalle-kofi-regando'];
const names=['La gran cosecha','Asedio bajo las estrellas','Trabajo entre las hileras','La casa resiste','Cultivar el cañón','Manglares','Escudo nocturno','A las puertas','A pie de campo','Río entre paredes','Rinoceronte','León','Búfalo e hiena','Amara cosechando','Kofi regando'];
const sections=['Principales · 01–05','Reservas · 06–10','Primeros planos · 11–15'];
for(let g=0;g<3;g++){const section=document.createElement('section'),heading=document.createElement('h2'),grid=document.createElement('div');heading.textContent=sections[g];grid.className='grid';section.append(heading,grid);for(let i=g*5;i<g*5+5;i++){const card=document.createElement('article');card.innerHTML=`<a href="${files[i]}.png" target="_blank" rel="noopener"><img src="${files[i]}.png" alt="${names[i]}" loading="lazy" width="1920" height="1080"></a><label><input type="checkbox" value="${String(i+1).padStart(2,'0')}"><span>${String(i+1).padStart(2,'0')} · ${names[i]}</span></label>`;grid.append(card);}gallery.append(section);}
gallery.addEventListener('change',()=>{const selected=[...document.querySelectorAll('input:checked')].map(e=>e.value);document.querySelector('#selection').textContent=selected.length?`${selected.length} seleccionadas: ${selected.join(', ')}`:'Ninguna seleccionada';});
</script></html>
